@media (min-width: 480px) {

n":"adapt","ipa":"/əˈdæpt/","zh":"v. 适应；改编","ex":"She quickly adapted to life in the new city.","exZh":"她很快适应了新城市的生活。","memo":"「阿達劈」：阿达走到哪儿都能劈开局面，适应力强。"},{"en":"adequate","ipa":"/ˈædɪkwət/","zh":"adj. 足够的；尚可的","ex":"Make sure you get adequate sleep before the exam.","exZh":"考试前确保睡眠充足。","memo":"「矮的壳」：矮一截的壳，勉强够用但不豪华。"},{"en":"advocate","ipa":"/ˈædvəkeɪt/","zh":"v./n. 提倡（者）；拥护（者）","ex":"Many doctors advocate a balanced diet.","exZh":"许多医生提倡均衡饮食。","memo":"「阿弟喂K」：阿弟天天喊你补维K，纯纯健康倡导者。"},{"en":"aggregate","ipa":"/ˈæɡrɪɡət/","zh":"n./v. 总计；合计","ex":"The aggregate score of the two games was five to three.","exZh":"两场比赛的总比分是五比三。","memo":"「阿哥抬头」：算总账时阿哥一抬头，全记一起了。"},{"en":"alleviate","ipa":"/əˈliːvieɪt/","zh":"v. 减轻；缓解","ex":"The medicine alleviated his headache quickly.","exZh":"药很快缓解了他的头痛。","memo":"「额离我去它」：把痛苦从身上剥离出去，疼痛就缓解了。"},{"en":"allocate","ipa":"/ˈæləkeɪt/","zh":"v. 分配；拨给","ex":"The school allocated more funds to the science lab.","exZh":"学校给科学实验室拨了更多经费。","memo":"「阿拉给你」：上海阿拉分东西最公平，人人有份。"},{"en":"ambitious","ipa":"/æmˈbɪʃəs/","zh":"adj. 有雄心的；野心勃勃的","ex":"He is ambitious and wants to run his own company.","exZh":"他雄心勃勃，想经营自己的公司。","memo":"「俺必胜」：心里天天喊俺必胜的人，最有野心。"},{"en":"anticipate","ipa":"/ænˈtɪsɪpeɪt/","zh":"v. 预期；期望","ex":"We anticipate that sales will rise next year.","exZh":"我们预计明年销售额会上升。","memo":"「安提前配」：安总提前把对都配好，就等预期发生。"},{"en":"anonymous","ipa":"/əˈnɒnɪməs/","zh":"adj. 匿名的","ex":"The charity received an anonymous donation.","exZh":"慈善机构收到了一笔匿名捐款。","memo":"「阿侬你莫识」：你莫想认识我，我是匿名的。"},{"en":"appeal","ipa":"/əˈpiːl/","zh":"n./v. 吸引力；呼吁；上诉","ex":"The city has great appeal for young artists.","exZh":"这座城市对年轻艺术家很有吸引力。","memo":"「啊皮哦」：看到皮包就啊一声，钱包的吸引力太大。"},{"en":"appropriate","ipa":"/əˈprəʊpriət/","zh":"adj. 恰当的；合适的","ex":"Jeans are not appropriate for a formal interview.","exZh":"牛仔裤不适合正式面试。","memo":"「阿婆没瑞哦」：连挑剔的阿婆都点头，说明很恰当。"},{"en":"approximate","ipa":"/əˈprɒksɪmət/","zh":"adj./v. 大约的；接近","ex":"The approximate cost of the trip is two thousand yuan.","exZh":"这趟旅行大约要花两千元。","memo":"「阿婆只说么大概」：问阿婆花销，她只会说大概。"},{"en":"arbitrary","ipa":"/ˈɑːbɪtrəri/","zh":"adj. 任意的；武断的","ex":"The rules seemed completely arbitrary to us.","exZh":"在我们看来这些规则完全是武断的。","memo":"「阿比踹你」：没理由上来就踹你，这决定够武断。"},{"en":"articulate","ipa":"/ɑːˈtɪkjuleɪt/","zh":"adj. 口齿清晰的；v. 清楚表达","ex":"She is articulate and rarely at a loss for words.","exZh":"她口齿伶俐，几乎不会词穷。","memo":"「阿提Q问他」：再难的问题他都能讲清楚，口才绝佳。"},{"en":"artificial","ipa":"/ˌɑːtɪˈfɪʃl/","zh":"adj. 人造的；人工的","ex":"The lake is artificial but looks natural.","exZh":"这个湖是人工的，但看起来很自然。","memo":"「阿提飞秀」：提着道具飞上舞台的，全是人工特效。"},{"en":"assemble","ipa":"/əˈsembl/","zh":"v. 集合；装配","ex":"The workers assemble cars on the production line.","exZh":"工人们在生产线上装配汽车。","memo":"「额森宝」：森林宝贝全都集合开会。"},{"en":"assess","ipa":"/əˈses/","zh":"v. 评估；评定","ex":"Teachers assess students' progress each term.","exZh":"老师每学期评估学生的进步。","memo":"「额塞塞」：把分数塞来塞去，就是在做评估。"},{"en":"assign","ipa":"/əˈsaɪn/","zh":"v. 分派；指定","ex":"Each student was assigned a different task.","exZh":"每个学生被分配了不同的任务。","memo":"「额塞」：任务一股脑塞给你，就是指派。"},{"en":"assume","ipa":"/əˈsjuːm/","zh":"v. 假定；承担","ex":"I assumed the meeting was on Monday.","exZh":"我原以为会议是在周一。","memo":"「额想母」：想当然以为妈会同意，结果挨了一顿骂。"},{"en":"attain","ipa":"/əˈteɪn/","zh":"v. 达到；获得","ex":"He attained the highest score in the class.","exZh":"他获得了全班最高分。","memo":"「额谈」：谈到的目标都拿下，就是达到。"},{"en":"authentic","ipa":"/ɔːˈθentɪk/","zh":"adj. 真正的；正宗的","ex":"The restaurant serves authentic Sichuan food.","exZh":"这家餐厅供应正宗的四川菜。","memo":"「奥神提克」：鉴定师眼神如神，一眼辨真假。"},{"en":"authority","ipa":"/ɔːˈθɒrəti/","zh":"n. 权威；当局","ex":"The local authorities are repairing the road.","exZh":"地方当局正在修路。","memo":"「奥手瑞提」：手里拿着奥义书的人，说话就是权威。"},{"en":"autonomous","ipa":"/ɔːˈtɒnəməs/","zh":"adj. 自治的；自动的","ex":"The region became fully autonomous in 1990.","exZh":"该地区于1990年实现完全自治。","memo":"「奥拓那么快」：奥拓开车那么快还不用人管，全自动。"},{"en":"barrier","ipa":"/ˈbæriə/","zh":"n. 障碍；屏障","ex":"Language is the biggest barrier for new immigrants.","exZh":"语言是新移民最大的障碍。","memo":"「百利儿」：本来百利，就差一道障碍没跨过去。"},{"en":"benchmark","ipa":"/ˈbentʃmɑːk/","zh":"n. 基准；标杆","ex":"Her results set a benchmark for the whole team.","exZh":"她的成绩为全队树立了标杆。","memo":"板凳上的马克：坐上最高的板凳，就是全队标杆。"},{"en":"betray","ipa":"/bɪˈtreɪ/","zh":"v. 背叛；泄露","ex":"He would never betray his friends.","exZh":"他绝不会背叛朋友。","memo":"「比踹」：为了利益一脚把你踹开，就是背叛。"},{"en":"bias","ipa":"/ˈbaɪəs/","zh":"n. 偏见","ex":"The report was criticized for its political bias.","exZh":"该报道因政治偏见受到批评。","memo":"「拜厄斯」：庙都拜错了，看法自然歪。"},{"en":"blend","ipa":"/blend/","zh":"v./n. 混合；混合物","ex":"Blend the fruit with milk to make a smoothie.","exZh":"把水果和牛奶搅打成奶昔。","memo":"「不能得」：不把它们搅在一起，就得不到奶昔。"},{"en":"boost","ipa":"/buːst/","zh":"v./n. 促进；增强","ex":"The ad campaign boosted sales by thirty percent.","exZh":"广告活动使销售额增长了三成。","memo":"「布斯特」：穿上火箭靴（booster），业绩嗖嗖涨。"},{"en":"boundary","ipa":"/ˈbaʊndri/","zh":"n. 边界；分界线","ex":"The river forms the boundary between the two countries.","exZh":"这条河是两国的界河。","memo":"「包得里」：包得再严实的院子也有边界。"},{"en":"breakthrough","ipa":"/ˈbreɪkθruː/","zh":"n. 突破；重大进展","ex":"Scientists made a major breakthrough in cancer research.","exZh":"科学家在癌症研究上取得重大突破。","memo":"break+through：把墙打破冲过去，就是突破。"},{"en":"breed","ipa":"/briːd/","zh":"v. 繁殖；饲养；n. 品种","ex":"Mosquitoes breed in stagnant water.","exZh":"蚊子在死水里繁殖。","memo":"「补孬的」：营养补得太好，繁殖力惊人。"},{"en":"brisk","ipa":"/brɪsk/","zh":"adj. 轻快的；兴隆的","ex":"We took a brisk walk in the morning.","exZh":"我们早晨快步走了一段。","memo":"「不瑞斯克」：不带一丝迟疑，脚步轻快。"},{"en":"browse","ipa":"/braʊz/","zh":"v. 浏览；随意翻阅","ex":"I spent the afternoon browsing in the bookshop.","exZh":"我整个下午都在书店里随意翻书。","memo":"「不如刷」：不如现在就上网刷一刷，随便浏览。"},{"en":"campaign","ipa":"/kæmˈpeɪn/","zh":"n. 运动；宣传活动","ex":"The city launched a campaign to promote recycling.","exZh":"该市发起了一项促进回收的活动。","memo":"「看喷」：隔着屏幕看网友互喷，一场大活动。"},{"en":"candidate","ipa":"/ˈkændɪdət/","zh":"n. 候选人；应试者","ex":"There are three candidates for the position.","exZh":"这个职位有三名候选人。","memo":"「啃地豆」：候选人啃着地里的豆子到处拉票。"},{"en":"capacity","ipa":"/kəˈpæsəti/","zh":"n. 容量；能力","ex":"The stadium has a seating capacity of eighty thousand.","exZh":"这座体育场可容纳八万人。","memo":"「可派细提」：一口气派活细提一千件，能力容量双爆表。"},{"en":"cease","ipa":"/siːs/","zh":"v. 停止；终止","ex":"The factory ceased production last month.","exZh":"这家工厂上个月停产了。","memo":"「细丝」：细丝咔嚓一断，彻底停止。"},{"en":"chaos","ipa":"/ˈkeɪɒs/","zh":"n. 混乱；无序","ex":"The storm caused chaos across the city.","exZh":"暴风雨让全城陷入混乱。","memo":"「吵死」：吵死了！场面完全失控。"},{"en":"cherish","ipa":"/ˈtʃerɪʃ/","zh":"v. 珍惜；爱护","ex":"I cherish the memories of my college years.","exZh":"我珍惜大学时光的回忆。","memo":"「切肥食」：切开的肥美食物要慢慢珍惜地吃。"},{"en":"chronic","ipa":"/ˈkrɒnɪk/","zh":"adj. 慢性的；长期的","ex":"He suffers from chronic back pain.","exZh":"他长期背痛。","memo":"「克劳你」：老毛病克劳你一辈子，甩都甩不掉。"},{"en":"circulate","ipa":"/ˈsɜːkjəleɪt/","zh":"v. 循环；流传","ex":"Rumours circulated quickly on campus.","exZh":"谣言在校园里迅速传开。","memo":"circle 的兄弟：绕圈跑，血液谣言都在循环。"},{"en":"clarify","ipa":"/ˈklærɪfaɪ/","zh":"v. 澄清；阐明","ex":"Could you clarify what you meant by that comment?","exZh":"你能澄清一下那句话的意思吗？","memo":"「克拉了fair」：把疑团克拉一声扫光，才能公平评判。"},{"en":"coherent","ipa":"/kəʊˈhɪərənt/","zh":"adj. 连贯的；有条理的","ex":"She gave a coherent account of the accident.","exZh":"她对事故做了条理清晰的陈述。","memo":"「抠黑砖」：把黑砖按顺序码好，话才说得连贯。"},{"en":"collaborate","ipa":"/kəˈlæbəreɪt/","zh":"v. 合作；协作","ex":"The two universities collaborated on the project.","exZh":"两所大学在这个项目上开展了合作。","memo":"「抠拉不含」：抠出各自资源拉项目，合作绝不含糊。"},{"en":"collapse","ipa":"/kəˈlæps/","zh":"v./n. 倒塌；崩溃","ex":"The old bridge collapsed under the weight.","exZh":"旧桥在重压下坍塌了。","memo":"「抠拉铺」：施工太抠，一拉就塌。"},{"en":"commence","ipa":"/kəˈmens/","zh":"v. 开始","ex":"The ceremony will commence at noon.","exZh":"典礼将在中午开始。","memo":"「开门呐」：门铃一响开门迎客，仪式开始。"},{"en":"commodity","ipa":"/kəˈmɒdəti/","zh":"n. 商品","ex":"Oil is one of the most traded commodities.","exZh":"石油是交易量最大的商品之一。","memo":"「可摸地」：地上摆满可摸可买的，全是商品。"},{"en":"compatible","ipa":"/kəmˈpætəbl/","zh":"adj. 兼容的；合得来的","ex":"The software is compatible with most phones.","exZh":"该软件与大多数手机兼容。","memo":"「肯陪ta宝」：肯陪TA看宝宝的，俩人肯定合得来。"},{"en":"compel","ipa":"/kəmˈpel/","zh":"v. 强迫；迫使","ex":"The law compels companies to publish their data.","exZh":"法律强制公司公布数据。","memo":"「肯拍哦」：老板肯拍板？不，是不拍不行，纯强迫。"},{"en":"compensate","ipa":"/ˈkɒmpenseɪt/","zh":"v. 补偿；弥补","ex":"Nothing can compensate for the loss of time.","exZh":"什么都弥补不了失去的时间。","memo":"「康师傅赔特」：康师傅面饼碎了，赔你两包作补偿。"},{"en":"competent","ipa":"/ˈkɒmpɪtənt/","zh":"adj. 胜任的；有能力的","ex":"A competent driver knows the rules by heart.","exZh":"合格的司机对交规烂熟于心。","memo":"「肯配疼」：机器再疼也肯配件修好，真是称职。"},{"en":"compile","ipa":"/kəmˈpaɪl/","zh":"v. 编纂；汇编","ex":"It took years to compile this dictionary.","exZh":"编纂这部词典花了好几年。","memo":"「扛派哦」：资料一摞一摞扛回家，汇编成书。"},{"en":"complement","ipa":"/ˈkɒmplɪment/","zh":"n./v. 补足；与…相配","ex":"The wine complements the meal perfectly.","exZh":"这款酒和餐食相得益彰。","memo":"「康普利门特」：complete（完整）的表弟，专门补齐缺的那一块，两者互补。"},{"en":"comply","ipa":"/kəmˈplaɪ/","zh":"v. 遵从；服从","ex":"All products must comply with safety standards.","exZh":"所有产品都必须符合安全标准。","memo":"「肯普来」：肯照普世规矩来，就是遵从。"},{"en":"component","ipa":"/kəmˈpəʊnənt/","zh":"n. 部件；成分","ex":"Trust is a key component of friendship.","exZh":"信任是友谊的重要组成部分。","memo":"「肯剖那」：敢剖开给你看的，都是核心部件。"},{"en":"comprehensive","ipa":"/ˌkɒmprɪˈhensɪv/","zh":"adj. 全面的；综合的","ex":"The report gives a comprehensive review of the market.","exZh":"这份报告对市场做了全面回顾。","memo":"「扛普 hen 细」：扛着普通和高精两套仪器，检查超全面。"},{"en":"comprise","ipa":"/kəmˈpraɪz/","zh":"v. 包含；由…组成","ex":"The team comprises five engineers and two designers.","exZh":"团队由五名工程师和两名设计师组成。","memo":"「肯普raise」：全员普raise（举手）报到，一个都包含。"},{"en":"decline","ipa":"/dɪˈklaɪn/","zh":"v./n. 下降；婉拒","ex":"Birth rates have declined sharply in recent years.","exZh":"近年来出生率急剧下降。","memo":"「地刻来」：数据贴地刻度往下走，下降；别人请客你就说不用啦，婉拒。"},{"en":"dedicate","ipa":"/ˈdedɪkeɪt/","zh":"v. 奉献；专用于","ex":"She dedicated her life to medical research.","exZh":"她毕生致力于医学研究。","memo":"「淡定开特」：淡定开pecial（特别）专注，一生奉献一件事。"},{"en":"defect","ipa":"/ˈdiːfekt/","zh":"n. 缺点；瑕疵","ex":"The recall was caused by a defect in the engine.","exZh":"这次召回是发动机缺陷引起的。","memo":"「地肥壳」：地还没肥就裂了壳，天生带缺陷。"},{"en":"deficient","ipa":"/dɪˈfɪʃnt/","zh":"adj. 缺乏的；不足的","ex":"His diet is deficient in iron and vitamins.","exZh":"他的饮食缺乏铁和维生素。","memo":"「地肥 tents」：地肥全流走，庄稼营养不良。"},{"en":"deficit","ipa":"/ˈdefəsɪt/","zh":"n. 赤字；亏空","ex":"The country is trying to reduce its trade deficit.","exZh":"该国正努力减少贸易逆差。","memo":"「代发西特」：钱发出去收不回，账上全是赤字。"},{"en":"degrade","ipa":"/dɪˈɡreɪd/","zh":"v. 降低；使降级；使退化","ex":"Plastic waste degrades very slowly.","exZh":"塑料垃圾降解得非常慢。","memo":"「地跪的」：级别被压到跪地，一路降级。"},{"en":"deliberate","ipa":"/dɪˈlɪbərət/","zh":"adj. 故意的；v. 深思熟虑","ex":"It was a deliberate attempt to mislead voters.","exZh":"这是故意误导选民的行为。","memo":"「地里伯瑞特」：伯瑞特在地里想了一夜，全是深思熟虑。"},{"en":"demonstrate","ipa":"/ˈdemənstreɪt/","zh":"v. 证明；演示；示威","ex":"The study demonstrates the link between sleep and memory.","exZh":"这项研究证明了睡眠与记忆的联系。","memo":"「带萌斯醉」：带着萌娃演示到观众陶醉，证明力满分。"},{"en":"denote","ipa":"/dɪˈnəʊt/","zh":"v. 表示；指代","ex":"In this map, red dots denote hospitals.","exZh":"在这张地图上，红点表示医院。","memo":"「得note」：得到一个note（标记），就是它的含义。"},{"en":"dense","ipa":"/dens/","zh":"adj. 稠密的；密集的","ex":"The area is known for its dense forests.","exZh":"该地区以茂密的森林闻名。","memo":"「等死」：人多到只能原地等死，太挤太密了。"},{"en":"deprive","ipa":"/dɪˈpraɪv/","zh":"v. 剥夺；使丧失","ex":"No one should be deprived of education.","exZh":"任何人都不应被剥夺受教育的权利。","memo":"「地劈了」：土地被劈走，农民被剥夺生计。"},{"en":"derive","ipa":"/dɪˈraɪv/","zh":"v. 源自；获得","ex":"The word derives from ancient Greek.","exZh":"这个词源自古希腊语。","memo":"「地里有物」：宝贝从地里刨出来，源自大地。"},{"en":"designate","ipa":"/ˈdezɪɡneɪt/","zh":"v. 指定；命名","ex":"The room was designated for meetings.","exZh":"这个房间被指定用于开会。","memo":"「地腿捏」：地盘的腿往哪伸，由领导指定。"},{"en":"deteriorate","ipa":"/dɪˈtɪəriəreɪt/","zh":"v. 恶化；变坏","ex":"His health deteriorated rapidly after the accident.","exZh":"事故后他的健康状况迅速恶化。","memo":"「地踢烂」：地板被踢得越来越烂，状况持续恶化。"},{"en":"devastate","ipa":"/ˈdevəsteɪt/","zh":"v. 摧毁；使极度震惊","ex":"The earthquake devastated the entire region.","exZh":"地震摧毁了整个地区。","memo":"「带瓦死它」：连瓦都带走的灾害，摧毁一切。"},{"en":"deviate","ipa":"/ˈdiːvieɪt/","zh":"v. 偏离；背离","ex":"The plane deviated from its original route.","exZh":"飞机偏离了原定航线。","memo":"「得我外特」：我往外卖了个弯，偏离正道。"},{"en":"devise","ipa":"/dɪˈvaɪz/","zh":"v. 设计；想出","ex":"They devised a new method to save water.","exZh":"他们想出了一种新的节水方法。","memo":"「带我瑟」：带我一起瑟（玩），保证想出好点子。"},{"en":"diagnose","ipa":"/ˈdaɪəɡnəʊz/","zh":"v. 诊断；判断","ex":"The doctor diagnosed her with pneumonia.","exZh":"医生诊断她患了肺炎。","memo":"「戴额捏石头」：老中医戴上眼镜捏脉，像捏石头一样诊断。"},{"en":"dilemma","ipa":"/dɪˈlemə/","zh":"n. 困境；进退两难","ex":"She faced the dilemma of work or family.","exZh":"她面临工作与家庭的两难选择。","memo":"「地里没」：地里没水也没粮，怎么选都是困境。"},{"en":"diligent","ipa":"/ˈdɪlɪdʒənt/","zh":"adj. 勤奋的；尽职的","ex":"Diligent students review their notes every day.","exZh":"勤奋的学生每天复习笔记。","memo":"「地里真」：地里真下功夫的人，最勤奋。"},{"en":"diminish","ipa":"/dɪˈmɪnɪʃ/","zh":"v. 减少；缩小","ex":"The medicine gradually diminished the pain.","exZh":"药物逐渐减轻了疼痛。","memo":"「地迷你死了」：越缩越迷你，小到几乎消失。"},{"en":"discard","ipa":"/dɪˈskɑːd/","zh":"v. 丢弃；抛弃","ex":"She discarded the old drafts and started fresh.","exZh":"她丢弃了旧稿，重新开始。","memo":"「的士卡的」：的士卡过期了，赶紧丢弃。"},{"en":"discern","ipa":"/dɪˈsɜːn/","zh":"v. 辨别；察觉","ex":"I could barely discern the road in the fog.","exZh":"雾中我几乎辨认不出道路。","memo":"「地仙」：地仙的眼睛毒，一眼辨别真伪。"},{"en":"disclose","ipa":"/dɪsˈkləʊz/","zh":"v. 披露；透露","ex":"The company refused to disclose the details of the deal.","exZh":"该公司拒绝披露交易细节。","memo":"「地库楼撕」：地库的楼被撕开，秘密全暴露。"},{"en":"discrepancy","ipa":"/dɪsˈkrepənsi/","zh":"n. 差异；不符","ex":"There is a discrepancy between the two reports.","exZh":"两份报告之间存在出入。","memo":"「地壳破坏如此」：两块地壳拼不上，差异明显。"},{"en":"dismiss","ipa":"/dɪsˈmɪs/","zh":"v. 解雇；不予理会","ex":"The court dismissed the case for lack of evidence.","exZh":"法院因证据不足驳回此案。","memo":"「的士没了」：叫的士，司机不理你直接开走，不予理会。"},{"en":"disperse","ipa":"/dɪˈspɜːs/","zh":"v. 分散；驱散","ex":"The police dispersed the crowd quickly.","exZh":"警察迅速驱散了人群。","memo":"「地泼水」：一盆水泼地上，四处分散。"},{"en":"dispose","ipa":"/dɪˈspəʊz/","zh":"v. 处理；处置","ex":"Please dispose of rubbish properly.","exZh":"请妥善处理垃圾。","memo":"「地泼死」：垃圾乱泼是错误处置。"},{"en":"dispute","ipa":"/dɪˈspjuːt/","zh":"n./v. 争论；纠纷","ex":"The two countries settled their border dispute peacefully.","exZh":"两国和平解决了边界争端。","memo":"「地皮又踢」：为块地皮互相踢，争个没完。"},{"en":"disrupt","ipa":"/dɪsˈrʌpt/","zh":"v. 扰乱；打断","ex":"The storm disrupted flights across the region.","exZh":"暴风雨扰乱了整个地区的航班。","memo":"「地掉拉破它」：地一塌拉住不放，全被搅乱。"},{"en":"distinct","ipa":"/dɪˈstɪŋkt/","zh":"adj. 明显的；独特的","ex":"The two species are quite distinct from each other.","exZh":"这两个物种彼此差异明显。","memo":"「的地针灸」：穴位各不相同，特征鲜明。"},{"en":"distort","ipa":"/dɪˈstɔːt/","zh":"v. 扭曲；歪曲","ex":"Funhouse mirrors distort your reflection.","exZh":"哈哈镜会扭曲你的影像。","memo":"「的欧死套」：欧式套图被掰歪，画面全扭曲。"},{"en":"distribute","ipa":"/dɪˈstrɪbjuːt/","zh":"v. 分发；分布","ex":"Volunteers distributed food to the homeless.","exZh":"志愿者给无家可归的人分发食物。","memo":"「地死追不容他」：快递地死追着不放，分发到每家。"},{"en":"diverse","ipa":"/daɪˈvɜːs/","zh":"adj. 多样的；形形色色的","ex":"The city is famous for its diverse food culture.","exZh":"这座城市以其多元的饮食文化闻名。","memo":"「带窝死」：各国美食把窝塞满，选择多样到撑死。"},{"en":"dominate","ipa":"/ˈdɒmɪneɪt/","zh":"v. 支配；主宰","ex":"One company dominates the entire market.","exZh":"一家公司主导着整个市场。","memo":"「多您内听」：多个领域您说了算，纯属支配地位。"},{"en":"drastic","ipa":"/ˈdræstɪk/","zh":"adj. 激烈的；严厉的","ex":"The hospital took drastic measures to control the infection.","exZh":"医院采取了严厉措施控制感染。","memo":"「抓死踢」：抓死踢爆，动作够激烈。"},{"en":"dubious","ipa":"/ˈdjuːbiəs/","zh":"adj. 可疑的；半信半疑的","ex":"He made some dubious claims about the product.","exZh":"他对该产品做了一些可疑的宣传。","memo":"「丢比饿死」：钱丢了还比谁饿死得快，这事很可疑。"},{"en":"dwell","ipa":"/dwel/","zh":"v. 居住；老是想着","ex":"Don't dwell on past mistakes.","exZh":"别总是想着过去的错误。","memo":"「德味儿」：住老房子的人说话都带德味儿，老想着当年。"},{"en":"dwindle","ipa":"/ˈdwɪndl/","zh":"v. 逐渐减少；缩小","ex":"Their savings dwindled to almost nothing.","exZh":"他们的积蓄几乎花光了。","memo":"「地位都」：地位和存款都在往下掉，越缩越少。"},{"en":"elaborate","ipa":"/ɪˈlæbərət/","zh":"adj. 精心制作的；v. 详细阐述","ex":"Could you elaborate on your proposal?","exZh":"你能详细说明一下你的提案吗？","memo":"「一拉宝瑞」：一拉就出一堆宝贝细节，讲得特别细。"},{"en":"elicit","ipa":"/ɪˈlɪsɪt/","zh":"v. 引出；诱出","ex":"The survey elicited some surprising responses.","exZh":"这项调查引出了令人惊讶的回答。","memo":"「一离席」：一离席大家的真心话就出来了，套话全靠引。"},{"en":"eligible","ipa":"/ˈelɪdʒəbl/","zh":"adj. 有资格的","ex":"Students over eighteen are eligible for the grant.","exZh":"十八岁以上的学生有资格获得补助。","memo":"「饿了就暴了」：饿到18岁就爆发，终于够格领补助。"},{"en":"eliminate","ipa":"/ɪˈlɪmɪneɪt/","zh":"v. 消除；淘汰","ex":"The team was eliminated in the first round.","exZh":"该队在第一轮就被淘汰了。","memo":"「一离米那特」：一粒米都留不得，清除得干干净净。"},{"en":"eloquent","ipa":"/ˈeləkwənt/","zh":"adj. 雄辩的；有说服力的","ex":"She gave an eloquent speech on climate change.","exZh":"她发表了一场关于气候变化的精彩演讲。","memo":"「爱说困他」：爱说话不困的他，一张嘴就说服全场。"},{"en":"embark","ipa":"/ɪmˈbɑːk/","zh":"v. 上船；着手开始","ex":"He embarked on a new career in teaching.","exZh":"他开始了教学生涯的新征程。","memo":"「硬巴克」：硬着头皮上巴克的船，事业启航。"},{"en":"embed","ipa":"/ɪmˈbed/","zh":"v. 嵌入；扎根","ex":"The idea is deeply embedded in the culture.","exZh":"这一观念深深植根于文化之中。","memo":"「硬变的」：硬把东西变得长在墙里，嵌入成功。"},{"en":"emerge","ipa":"/ɪˈmɜːdʒ/","zh":"v. 出现；浮现","ex":"New evidence emerged during the trial.","exZh":"审判期间出现了新证据。","memo":"「一么之」：谜底一层层浮现，「一么」就知道了。"},{"en":"emit","ipa":"/iˈmɪt/","zh":"v. 发出；排放","ex":"The alarm emits a loud beeping sound.","exZh":"警报器发出刺耳的哔哔声。","memo":"E-me：E（电子设备）发信息给你，就是发射信号。"},{"en":"empirical","ipa":"/ɪmˈpɪrɪkl/","zh":"adj. 经验主义的；实证的","ex":"The theory lacks empirical support.","exZh":"该理论缺乏实证支持。","memo":"「硬批额咳」：硬要批我就拿数据来，实证说话。"},{"en":"endeavor","ipa":"/ɪnˈdevə/","zh":"n./v. 努力；尽力","ex":"Scientific endeavor requires patience and curiosity.","exZh":"科学探索需要耐心和好奇心。","memo":"「硬地我」：硬地（泥地）里我也要爬过去，够努力。"},{"en":"endorse","ipa":"/ɪnˈdɔːs/","zh":"v. 背书；赞同；代言","ex":"Several celebrities endorsed the campaign.","exZh":"几位名人代言了这项活动。","memo":"「按到死」：章按到死——全力支持，盖章背书。"},{"en":"endure","ipa":"/ɪnˈdjʊə/","zh":"v. 忍受；持续","ex":"They endured years of hardship.","exZh":"他们忍受了多年的艰辛。","memo":"「硬久」：硬扛很久，坚持到底。"},{"en":"enhance","ipa":"/ɪnˈhɑːns/","zh":"v. 提高；增强","ex":"The software enhances photo quality automatically.","exZh":"该软件能自动提升照片质量。","memo":"「硬汉死」：硬汉健身到死，肌肉不断增强。"},{"en":"enrich","ipa":"/ɪnˈrɪtʃ/","zh":"v. 充实；使丰富","ex":"Reading classic literature enriches the mind and sparks imagination.","exZh":"阅读经典文学充实心灵，激发想象力。","memo":"「硬瑞驰」：硬塞进瑞驰（奔驰）里的，全是精神财富。"},{"en":"epidemic","ipa":"/ˌepɪˈdemɪk/","zh":"n. 流行病；adj. 流行性的","ex":"The government took action to stop the epidemic.","exZh":"政府采取行动阻止疫情蔓延。","memo":"「一痞得明」：病毒一痞就得名四处传，流行病来了。"},{"en":"equivalent","ipa":"/ɪˈkwɪvələnt/","zh":"adj./n. 等价的；等价物","ex":"One mile is equivalent to about 1.6 kilometres.","exZh":"一英里约等于1.6公里。","memo":"「一克vi稳」：一克对一克，两边一样稳，等价交换。"},{"en":"erode","ipa":"/ɪˈrəʊd/","zh":"v. 侵蚀；腐蚀","ex":"Waves have eroded the cliffs over centuries.","exZh":"几个世纪以来海浪侵蚀着悬崖。","memo":"「一日啖」：一日啖一口，再硬的石头也被啃掉，纯侵蚀。"},{"en":"escalate","ipa":"/ˈeskəleɪt/","zh":"v. 升级；加剧","ex":"The argument quickly escalated into a fight.","exZh":"争吵迅速升级为打架。","memo":"「爱死咖类」：吵架爱加咖（料），一加料就升级。"},{"en":"evident","ipa":"/ˈevɪdənt/","zh":"adj. 明显的","ex":"It was evident that she had been crying.","exZh":"很明显她哭过。","memo":"「爱为你等」：明眼人一看就懂的感情，显而易见。"},{"en":"evoke","ipa":"/ɪˈvəʊk/","zh":"v. 唤起；引起","ex":"The song evoked memories of her childhood.","exZh":"这首歌唤起了她童年的回忆。","memo":"「一我克」：一听到就戳中我，勾起回忆。"},{"en":"evolve","ipa":"/iˈvɒlv/","zh":"v. 进化；演变","ex":"The company evolved from a small shop into a global brand.","exZh":"这家公司从小店发展为全球品牌。","memo":"「一我服」：我从毛毛虫熬成蝴蝶，自己都服自己的进化。"},{"en":"exaggerate","ipa":"/ɪɡˈzædʒəreɪt/","zh":"v. 夸张；夸大","ex":"Don't exaggerate the risks to scare people.","exZh":"别夸大风险吓唬人。","memo":"「个塞嘴」：一个嘴巴塞不下还硬说吞了一头牛，夸张到离谱。"},{"en":"exceed","ipa":"/ɪkˈsiːd/","zh":"v. 超过；超出","ex":"The results exceeded all expectations.","exZh":"结果超出了所有预期。","memo":"「一个细的」：一个细节都不放过，成绩自然超标。"},{"en":"excel","ipa":"/ɪkˈsel/","zh":"v. 擅长；胜过","ex":"She excels at solving difficult problems.","exZh":"她擅长解决难题。","memo":"「一颗赛乐」：一颗赛一颗，越赛越乐，实力超群。"},{"en":"exceptional","ipa":"/ɪkˈsepʃənl/","zh":"adj. 杰出的；异常的","ex":"The athlete showed exceptional talent at a young age.","exZh":"这位运动员年少时就展现出非凡天赋。","memo":"「一颗心手拿」：一颗心加两手拿捏，表现异常出色。"},{"en":"exclude","ipa":"/ɪkˈskluːd/","zh":"v. 排除；不包括","ex":"The ticket price excludes breakfast and transfers.","exZh":"票价不含早餐和接送。","memo":"「一把锁」：门一锁，把人排除在外。"},{"en":"execute","ipa":"/ˈeksɪkjuːt/","zh":"v. 执行；处决","ex":"The plan was executed perfectly.","exZh":"计划执行得非常完美。","memo":"「爱克C修他」：爱克（KPI）下来必须修完他，严格执行。"},{"en":"exempt","ipa":"/ɪɡˈzempt/","zh":"v./adj. 免除（的）","ex":"Students are exempt from the service fee.","exZh":"学生免收服务费。","memo":"「一个伤别逃」：一个伤情可以别逃兵役，获准免除。"},{"en":"exert","ipa":"/ɪɡˈzɜːt/","zh":"v. 施加；发挥","ex":"Parents exert a strong influence on children.","exZh":"父母对孩子有很大影响。","memo":"「一个坐」：领导一个坐姿都在施加压力。"},{"en":"exhaust","ipa":"/ɪɡˈzɔːst/","zh":"v. 耗尽；使精疲力竭；n. 排气","ex":"The long hike exhausted everyone.","exZh":"长途徒步让所有人都精疲力竭。","memo":"「一跑澡死」：跑完澡都懒得洗，累到瘫。"},{"en":"exhibit","ipa":"/ɪɡˈzɪbɪt/","zh":"v. 展出；表现出；n. 展品","ex":"The gallery exhibits modern paintings.","exZh":"美术馆展出现代绘画。","memo":"「一个个搬进它」：展品一个个搬进展馆。"},{"en":"explicit","ipa":"/ɪkˈsplɪsɪt/","zh":"adj. 明确的；直白的","ex":"The instructions were explicit and easy to follow.","exZh":"说明非常明确，容易照做。","memo":"「一把四离开了」：一把四（4）都写明道道，直白到没悬念。"},{"en":"exploit","ipa":"/ɪkˈsplɔɪt/","zh":"v. 利用；剥削；开发","ex":"The company exploited cheap labour to cut costs.","exZh":"该公司靠剥削廉价劳动力降低成本。","memo":"「一把斯剥贴」：一层层剥皮贴金，剥削得明明白白。"},{"en":"exquisite","ipa":"/ɪkˈskwɪzɪt/","zh":"adj. 精致的；精美的","ex":"The jewellery is exquisitely crafted.","exZh":"这些珠宝做工精致。","memo":"「一口吃最强」：一口吃出大师手艺，精致到极致。"},{"en":"extract","ipa":"/ˈekstrækt/","zh":"v. 提取；拔出；n. 摘录","ex":"They extract oil from olives.","exZh":"他们从橄榄中提取油。","memo":"「艾克斯抓」：拿X光一照精准抓取，提取到位。"},{"en":"extravagant","ipa":"/ɪkˈstrævəɡənt/","zh":"adj. 奢侈的；过度的","ex":"The wedding was too extravagant for a small town.","exZh":"这场婚礼对小镇来说太奢侈了。","memo":"「一个死追馆」：一个牌子追遍全馆买到底，奢侈无度。"},{"en":"facilitate","ipa":"/fəˈsɪlɪteɪt/","zh":"v. 促进；使便利","ex":"The new software facilitates online learning.","exZh":"新软件让在线学习更方便。","memo":"「法西里太特」：法门西里一通，事就顺了，纯便利。"},{"en":"feasible","ipa":"/ˈfiːzəbl/","zh":"adj. 可行的","ex":"The plan is technically feasible but expensive.","exZh":"这个计划技术上可行，但成本高。","memo":"「肥死宝」：方案肥得流油还不烧钱，可行性满分。"},{"en":"feat","ipa":"/fiːt/","zh":"n. 功绩；壮举","ex":"Climbing the mountain in winter was an amazing feat.","exZh":"冬季登顶这座山是一大壮举。","memo":"脚（foot）变体：用脚创下的功绩。"},{"en":"fertile","ipa":"/ˈfɜːtaɪl/","zh":"adj. 肥沃的；多产的","ex":"The fertile soil produces rich harvests.","exZh":"肥沃的土壤带来丰收。","memo":"「法梯哦」：法老家的梯田，年年丰收真肥沃。"},{"en":"fluctuate","ipa":"/ˈflʌktʃueɪt/","zh":"v. 波动；起伏","ex":"Vegetable prices fluctuate with the seasons.","exZh":"蔬菜价格随季节波动。","memo":"「弗拉克休为她」：她心情忽好忽坏，价格一样上蹿下跳。"},{"en":"formidable","ipa":"/ˈfɔːmɪdəbl/","zh":"adj. 强大的；令人敬畏的","ex":"They faced a formidable opponent in the final.","exZh":"决赛中他们遇到了强劲的对手。","memo":"「怕密大宝」：可怕又神秘的大家伙，气场吓人。"},{"en":"formulate","ipa":"/ˈfɔːmjuleɪt/","zh":"v. 制定；系统地阐述","ex":"The committee formulated a new safety policy.","exZh":"委员会制定了新的安全政策。","memo":"「佛妙雷特」：佛系妙招雷厉风行，配方制定一气呵成。"},{"en":"foster","ipa":"/ˈfɒstə/","zh":"v. 培养；促进；寄养","ex":"The teacher fostered a love of reading in her students.","exZh":"这位老师培养了学生的阅读兴趣。","memo":"「佛斯特」：佛系大师专治焦虑，专育心灵，培养新人。"},{"en":"fragile","ipa":"/ˈfrædʒaɪl/","zh":"adj. 易碎的；脆弱的","ex":"The parcel is marked fragile.","exZh":"包裹上标着易碎品。","memo":"「弗拉脚」：弗拉一踹就碎，娇贵得很。"},{"en":"fragment","ipa":"/ˈfræɡmənt/","zh":"n. 碎片；片段","ex":"Fragments of the vase were found on the floor.","exZh":"地板上发现了花瓶的碎片。","memo":"「弗拉哥」：弗拉哥摔了一跤，碎成八瓣。"},{"en":"framework","ipa":"/ˈfreɪmwɜːk/","zh":"n. 框架；体系","ex":"We need a framework for evaluating progress.","exZh":"我们需要一个评估进展的框架。","memo":"frame（框）+work（活）：搭好框再干活。"},{"en":"fraud","ipa":"/frɔːd/","zh":"n. 欺诈；骗子","ex":"He was arrested for tax fraud.","exZh":"他因税务欺诈被捕。","memo":"「福绕的」：绕着你的福转圈拿走，纯诈骗。"},{"en":"friction","ipa":"/ˈfrɪkʃn/","zh":"n. 摩擦；不和","ex":"There has been friction between the two departments.","exZh":"两个部门之间一直有摩擦。","memo":"「弗瑞克身」：俩人一碰就蹭出火星，摩擦不断。"},{"en":"fundamental","ipa":"/ˌfʌndəˈmentl/","zh":"adj. 基本的；根本的","ex":"Reading is a fundamental skill for learning.","exZh":"阅读是学习的基础技能。","memo":"「fund（基金）+mental」：脑子的本钱，最根本的东西。"},{"en":"furnish","ipa":"/ˈfɜːnɪʃ/","zh":"v. 布置家具；提供","ex":"The flat is fully furnished.","exZh":"这套公寓家具齐全。","memo":"「furn（炉子）+ish」：给房子装上炉子，配齐家当。"},{"en":"futile","ipa":"/ˈfjuːtaɪl/","zh":"adj. 徒劳的；无用的","ex":"Their efforts to revive the plan proved futile.","exZh":"他们挽救该计划的努力是徒劳的。","memo":"「福太漏」：福气太漏，怎么补都白搭。"},{"en":"generate","ipa":"/ˈdʒenəreɪt/","zh":"v. 产生；引起","ex":"Wind turbines generate clean electricity.","exZh":"风力涡轮机产生清洁电力。","memo":"「increase 的弟弟」：先「生」出来才有的涨，产生为本。"},{"en":"genuine","ipa":"/ˈdʒenjuɪn/","zh":"adj. 真诚的；真正的","ex":"She showed genuine concern for our welfare.","exZh":"她对我们表现出真诚的关心。","memo":"「健牛」：真牛不是吹的，健牛不掺假。"},{"en":"gloomy","ipa":"/ˈɡluːmi/","zh":"adj. 阴暗的；忧郁的","ex":"The weather has been gloomy all week.","exZh":"整个星期天气都很阴沉。","memo":"「孤楼的米」：孤楼里发霉的米，又阴又丧。"},{"en":"gorgeous","ipa":"/ˈɡɔːdʒəs/","zh":"adj. 华丽的；极好的","ex":"She looked gorgeous in the red dress.","exZh":"她穿红裙子美极了。","memo":"「gorge（峡谷）+ous」：美得像峡谷一样震撼。"},{"en":"grasp","ipa":"/ɡrɑːsp/","zh":"v./n. 抓住；理解","ex":"He quickly grasped the main idea of the article.","exZh":"他很快抓住了文章主旨。","memo":"「搁拉死扑」：搁哪都要拉住死扑上去，抓住不放。"},{"en":"guarantee","ipa":"/ˌɡærənˈtiː/","zh":"n./v. 保证；担保","ex":"We guarantee the quality of our products.","exZh":"我们保证产品质量。","memo":"「嘎人踢」：嘎嘣脆承诺踢实了，保证到位。"},{"en":"hamper","ipa":"/ˈhæmpə/","zh":"v. 妨碍；阻碍","ex":"Heavy snow hampered the rescue efforts.","exZh":"大雪阻碍了救援工作。","memo":"「憨盆儿」：憨憨抱着大盆走不快，全被拖累。"},{"en":"hazardous","ipa":"/ˈhæzədəs/","zh":"adj. 危险的；有害的","ex":"Hazardous chemicals must be stored carefully.","exZh":"危险化学品必须小心存放。","memo":"「哈砸得死」：哈一声就砸得稀碎，危险品离远点。"},{"en":"hinder","ipa":"/ˈhɪndə/","zh":"v. 阻碍；妨碍","ex":"Lack of sleep hinders your ability to concentrate.","exZh":"睡眠不足会妨碍注意力集中。","memo":"「后面的」：老在后面拽你后腿，纯阻碍。"},{"en":"hollow","ipa":"/ˈhɒləʊ/","zh":"adj. 空的；空洞的","ex":"The tree trunk was hollow inside.","exZh":"树干里面是空心的。","memo":"「好漏哦」：看着挺好，一敲全漏，空心的。"},{"en":"hostile","ipa":"/ˈhɒstaɪl/","zh":"adj. 敌对的；不友好的","ex":"The crowd became hostile to the visitors.","exZh":"人群对来访者变得充满敌意。","memo":"「host（主人）+ile」：主人脸一黑，待客全靠敌意。"},{"en":"humid","ipa":"/ˈhjuːmɪd/","zh":"adj. 潮湿的","ex":" Summers here are hot and humid.","exZh":"这里的夏天又热又潮湿。","memo":"「穿棉被」：湿度大到穿棉被也粘身上，黏糊糊。"},{"en":"hypothesis","ipa":"/haɪˈpɒθəsɪs/","zh":"n. 假设；假说","ex":"The experiment tested his hypothesis.","exZh":"实验验证了他的假设。","memo":"「海泡塞子」：先拿海泡石塞住猜想，等验证再说。"},{"en":"jeopardize","ipa":"/ˈdʒepədaɪz/","zh":"v. 危及；损害","ex":"Missing too many classes may jeopardize your graduation.","exZh":"缺课太多可能会危及你的毕业。","memo":"「劫匪逮着」：劫匪逮着你，人身安全危在旦夕。"},{"en":"justify","ipa":"/ˈdʒʌstɪfaɪ/","zh":"v. 证明…正当；为…辩护","ex":"The end doesn't justify the means.","exZh":"目的不能为手段辩护。","memo":"「just if i」：只要是对我有利就是合理？强行辩护。"},{"en":"launch","ipa":"/lɔːntʃ/","zh":"v. 发起；发射；推出","ex":"The company will launch a new phone next month.","exZh":"公司下个月将发布新手机。","memo":"「捞起」：火箭捞起来往上一抛，发射成功。"},{"en":"legitimate","ipa":"/lɪˈdʒɪtɪmət/","zh":"adj. 合法的；正当的","ex":"He has a legitimate reason for being late.","exZh":"他迟到有正当理由。","memo":"「理智提么它」：理智提起它都没毛病，合法合规。"},{"en":"liable","ipa":"/ˈlaɪəbl/","zh":"adj. 有责任的；易于…的","ex":"You are liable for any damage you cause.","exZh":"你对造成的任何损害负有责任。","memo":"「来哦抱」：账单来哦抱紧付款，责任跑不掉。"},{"en":"linger","ipa":"/ˈlɪŋɡə/","zh":"v. 徘徊；逗留","ex":"The smell of coffee lingered in the room.","exZh":"咖啡的香味在房间里久久不散。","memo":"「领个儿」：散场了还领个奖杯舍不得走，徘徊逗留。"},{"en":"literacy","ipa":"/ˈlɪtərəsi/","zh":"n. 读写能力；素养","ex":"The program aims to improve adult literacy.","exZh":"该项目旨在提高成人读写能力。","memo":"「literature 的地基」：能读会写才有文学，识字为本。"},{"en":"identical","ipa":"/aɪˈdentɪkl/","zh":"adj. 完全相同的","ex":"The twins wore identical outfits.","exZh":"双胞胎穿着一模一样的衣服。","memo":"「爱等提扣」：爱到连提扣都一样，双胞胎无疑。"},{"en":"ignite","ipa":"/ɪɡˈnaɪt/","zh":"v. 点燃；激起","ex":"A single spark can ignite a whole forest.","exZh":"一点火星可以点燃整片森林。","memo":"「一个耐它」：一个火星耐不住它，直接点燃。"},{"en":"illuminate","ipa":"/ɪˈluːmɪneɪt/","zh":"v. 照亮；阐明","ex":"The streetlights illuminate the whole avenue.","exZh":"街灯照亮了整条大街。","memo":"「一路明内特」：一路都明特别亮，照亮又解惑。"},{"en":"illustrate","ipa":"/ˈɪləstreɪt/","zh":"v. 说明；举例；插图","ex":"The teacher illustrated the theory with real examples.","exZh":"老师用实际例子讲解这个理论。","memo":"「一来死追特」：老师一来就死追着举例，讲到明白为止。"},{"en":"immerse","ipa":"/ɪˈmɜːs/","zh":"v. 沉浸；使陷入","ex":"She immersed herself in studying French.","exZh":"她全身心投入法语学习。","memo":"「一沫丝」：整个人泡进一沫泡沫里，沉浸到底。"},{"en":"immune","ipa":"/ɪˈmjuːn/","zh":"adj. 免疫的；不受影响的","ex":"He is immune to most common illnesses.","exZh":"他对大多数常见疾病免疫。","memo":"「一苗」：打过一苗（疫苗），百毒不侵。"},{"en":"impair","ipa":"/ɪmˈpeə/","zh":"v. 损害；削弱","ex":"Loud noise at work can impair your hearing over time.","exZh":"工作时的巨大噪音会长期损害听力。","memo":"「硬赔儿」：弄坏了得硬赔，损害实锤。"},{"en":"impartial","ipa":"/ɪmˈpɑːʃl/","zh":"adj. 公正的；不偏不倚的","ex":"Judges must remain impartial at all times.","exZh":"法官必须始终保持公正。","memo":"「im(不)+partial(偏的)」：不偏不倚，纯中立裁判。"},{"en":"impede","ipa":"/ɪmˈpiːd/","zh":"v. 阻碍；妨碍","ex":"The flood impeded traffic for days.","exZh":"洪水让交通中断了好几天。","memo":"「硬皮的」：硬皮挡路，谁也别想过，纯阻碍。"},{"en":"imperative","ipa":"/ɪmˈperətɪv/","zh":"adj. 紧迫的；必要的；n. 必要的事","ex":"It is imperative to act quickly.","exZh":"必须迅速采取行动。","memo":"「硬怕瑞体」：硬汉都怕瑞体的最后通牒，十万火急。"},{"en":"implement","ipa":"/ˈɪmplɪment/","zh":"v. 实施；n. 工具","ex":"The school implemented a new grading system.","exZh":"学校实施了新的评分制度。","memo":"「硬补门」：政策落地，硬补齐每道门，执行到位。"},{"en":"impose","ipa":"/ɪmˈpəʊz/","zh":"v. 强加；征收","ex":"The government imposed a tax on sugary drinks.","exZh":"政府对含糖饮料征税。","memo":"「硬泼子」：硬把一盆子规矩泼给你，不接受也得接受。"},{"en":"incentive","ipa":"/ɪnˈsentɪv/","zh":"n. 激励；动机","ex":"Bonuses are a strong incentive for employees.","exZh":"奖金是对员工的强大激励。","memo":"「硬塞钱」：硬塞钱进你口袋，这激励够实在。"},{"en":"incorporate","ipa":"/ɪnˈkɔːpəreɪt/","zh":"v. 合并；纳入","ex":"The design incorporates ideas from different teams.","exZh":"该设计融合了不同团队的想法。","memo":"「硬扣我bre」：硬把我想法扣进方案里，全纳进来。"},{"en":"indifferent","ipa":"/ɪnˈdɪfrənt/","zh":"adj. 冷漠的；漠不关心的","ex":"He seemed indifferent to the result of the game.","exZh":"他对比赛结果一副无所谓的样子。","memo":"「一滴不给」：表情硬是一滴不给，冷漠到极致。"},{"en":"induce","ipa":"/ɪnˈdjuːs/","zh":"v. 诱导；引起","ex":"High stress levels can induce headaches and sleep problems.","exZh":"高压状态会诱发头痛和睡眠问题。","memo":"「硬丢」：硬丢诱饵给你，勾你上钩。"},{"en":"indulge","ipa":"/ɪnˈdʌldʒ/","zh":"v. 放纵；沉溺","ex":"We indulged in cake at the party.","exZh":"派对上我们放开了吃蛋糕。","memo":"「硬打包」：甜品硬打包三份，放纵自己没商量。"},{"en":"inevitable","ipa":"/ɪnˈevɪtəbl/","zh":"adj. 不可避免的","ex":"Change is inevitable in a growing city.","exZh":"在城市发展中，变化是不可避免的。","memo":"「硬捏我抖」：命运硬捏在手抖不掉，躲也没用。"},{"en":"inferior","ipa":"/ɪnˈfɪəriə/","zh":"adj. 较差的；下级的","ex":"The copy is inferior to the original.","exZh":"复制品比原件差。","memo":"「硬肥哦」：肥肉比瘦肉差一档， inferior 实锤。"},{"en":"inflate","ipa":"/ɪnˈfleɪt/","zh":"v. 使膨胀；夸大；通货膨胀","ex":"Strong demand may inflate housing prices in big cities.","exZh":"强劲需求可能推高大城市房价。","memo":"「硬飞了」：一充气硬是飞起来，膨胀上天。"},{"en":"influential","ipa":"/ˌɪnfluˈenʃl/","zh":"adj. 有影响力的","ex":"She is one of the most influential writers today.","exZh":"她是当今最有影响力的作家之一。","memo":"「in流恩手」：潮流从他手心流过，说一不二。"},{"en":"ingenious","ipa":"/ɪnˈdʒiːniəs/","zh":"adj. 巧妙的；有独创性的","ex":"He came up with an ingenious solution.","exZh":"他想出了一个巧妙的解决办法。","memo":"「硬劲儿饿死」：脑子硬劲儿十足，点子巧到饿死对手。"},{"en":"inhibit","ipa":"/ɪnˈhɪbɪt/","zh":"v. 抑制；阻止","ex":"Fear of failure can inhibit creativity in children.","exZh":"对失败的恐惧会抑制孩子的创造力。","memo":"「硬黑避它」：心里发硬发黑，避着不动，全被抑制。"},{"en":"innovate","ipa":"/ˈɪnəveɪt/","zh":"v. 创新；革新","ex":"Companies must innovate to survive.","exZh":"企业必须创新才能生存。","memo":"「in 呦喂」：呦喂，整了个新花样，创新呐！"},{"en":"insight","ipa":"/ˈɪnsaɪt/","zh":"n. 洞察力；深刻见解","ex":"Her book offers insight into modern education.","exZh":"她的书对现代教育提出了深刻见解。","memo":"「in 赛」：in 人一开赛就预判全场，洞察超前。"},{"en":"integrate","ipa":"/ˈɪntɪɡreɪt/","zh":"v. 使融合；整合","ex":"The app integrates maps and payment in one place.","exZh":"这款应用把地图和支付整合在一起。","memo":"「硬踢鬼」：把杂七杂八的鬼点子硬踢成一个系统，整合。"},{"en":"intervene","ipa":"/ˌɪntəˈviːn/","zh":"v. 干预；介入","ex":"The teacher intervened before the fight started.","exZh":"老师在打架发生前介入了。","memo":"「in特文」：in 特工潜入文艺圈， intervention 介入。"},{"en":"intricate","ipa":"/ˈɪntrɪkət/","zh":"adj. 错综复杂的","ex":"The watch has an intricate design.","exZh":"这块手表设计精巧复杂。","memo":"「in 踢扣它」：里三层外三层踢不开扣不上，复杂到家。"},{"en":"intrinsic","ipa":"/ɪnˈtrɪnzɪk/","zh":"adj. 固有的；内在的","ex":"Curiosity is intrinsic to human nature.","exZh":"好奇心是人类的天性。","memo":"「in 真真」：in 到骨子里的真，内在属性。"},{"en":"intuition","ipa":"/ˌɪntjuˈɪʃn/","zh":"n. 直觉","ex":"Her intuition told her something was wrong.","exZh":"她的直觉告诉她出事了。","memo":"「in 图一伸」：图还没看先一伸手，全凭直觉。"},{"en":"invade","ipa":"/ɪnˈveɪd/","zh":"v. 侵略；涌入","ex":"Tourists invade the small town every summer.","exZh":"每年夏天游客涌入这座小镇。","memo":"「in 威的」：in 威武大军压境，说进就进。"},{"en":"invaluable","ipa":"/ɪnˈvæljuəbl/","zh":"adj. 极宝贵的；无价的","ex":"Her advice was invaluable to us.","exZh":"她的建议对我们极为宝贵。","memo":"「in value 不了」：价值大到无法标价，无价之宝。"},{"en":"isolate","ipa":"/ˈaɪsəleɪt/","zh":"v. 使隔离；孤立","ex":"The patient was isolated to stop the spread.","exZh":"病人被隔离以防传染扩散。","memo":"「爱索雷特」：拿爱把人锁起来隔离，越锁越孤。"},{"en":"mandatory","ipa":"/ˈmændətəri/","zh":"adj. 强制性的；义务的","ex":"Wearing a helmet is mandatory on site.","exZh":"工地上必须佩戴安全帽。","memo":"「慢得啄」：慢了就被啄，规定强制没商量。"},{"en":"manipulate","ipa":"/məˈnɪpjuleɪt/","zh":"v. 操纵；摆布","ex":"Ads often manipulate consumers' emotions.","exZh":"广告常常操纵消费者的情绪。","memo":"「么你普雷特」：把你当木偶么你普雷特一套，纯操纵。"},{"en":"marginal","ipa":"/ˈmɑːdʒɪnl/","zh":"adj. 边缘的；微小的","ex":"The change had only a marginal effect.","exZh":"这个改动效果微乎其微。","memo":"「马金拿」：写在页边的批注拿不掉，边缘小角色。"},{"en":"mediate","ipa":"/ˈmiːdieɪt/","zh":"v. 调解；斡旋","ex":"She mediated between the two sides.","exZh":"她在双方之间进行调解。","memo":"「media」：媒体最爱当和事佬，居中调解。"},{"en":"merge","ipa":"/mɜːdʒ/","zh":"v. 合并；融合","ex":"The two banks will merge next year.","exZh":"两家银行明年将合并。","memo":"「么之」：么（没）了之字界线，两家并一家。"},{"en":"minimize","ipa":"/ˈmɪnɪmaɪz/","zh":"v. 使减到最小；轻描淡写","ex":"We must minimize the risk of infection.","exZh":"我们必须把感染风险降到最低。","memo":"「迷你埋了」：埋成迷你号，最小号处理。"},{"en":"mobilize","ipa":"/ˈməʊbəlaɪz/","zh":"v. 动员；调动","ex":"The government mobilized troops to fight the flood.","exZh":"政府调动军队抗洪。","memo":"「眸不行了」：眸都熬不行了还在动员全员加班。"},{"en":"modify","ipa":"/ˈmɒdɪfaɪ/","zh":"v. 修改；改进","ex":"We modified the design after the feedback.","exZh":"收到反馈后我们修改了设计。","memo":"「摸的floor」：摸着地板改图纸，边改边干。"},{"en":"momentum","ipa":"/məˈmentəm/","zh":"n. 势头；动量","ex":"The project is gaining momentum.","exZh":"项目势头正猛。","memo":"「某门图」：冲进某门那一刻的推力，越冲越猛。"},{"en":"monotonous","ipa":"/məˈnɒtənəs/","zh":"adj. 单调乏味的","ex":"The work is monotonous but well paid.","exZh":"这工作单调但报酬不错。","memo":"「mono（一个）+tone（调）」：一个调子唱到底，太单调。"},{"en":"motivate","ipa":"/ˈməʊtɪveɪt/","zh":"v. 激励；激发","ex":"Good leaders motivate their teams.","exZh":"优秀的领导能激励团队。","memo":"「眸提喂它」：眼里提着鸡腿喂它，动力拉满。"},{"en":"multitude","ipa":"/ˈmʌltɪtjuːd/","zh":"n. 大量；群众","ex":"A multitude of options confused her.","exZh":"太多的选择让她不知所措。","memo":"「馒头替」：馒头多到一替一换，人山人海。"},{"en":"mutual","ipa":"/ˈmjuːtʃuəl/","zh":"adj. 相互的；共同的","ex":"Their mutual respect keeps the partnership strong.","exZh":"相互的尊重让他们的合作保持稳固。","memo":"「没趣味哦」：没趣才互相取暖，mutual 懂得都懂。"},{"en":"negligible","ipa":"/ˈneɡlɪdʒəbl/","zh":"adj. 微不足道的；可忽略的","ex":"The difference in taste is negligible.","exZh":"味道上的差别可以忽略不计。","memo":"「那个 gel 挤不多」：那点胶挤不出一滴，忽略不计。"},{"en":"negotiate","ipa":"/nɪˈɡəʊʃieɪt/","zh":"v. 谈判；协商","ex":"They negotiated a better price for the flat.","exZh":"他们为这套公寓谈到了更好的价格。","memo":"「你够谁」：你够格跟谁谈，谈资决定价格。"},{"en":"notable","ipa":"/ˈnəʊtəbl/","zh":"adj. 显著的；值得注意的","ex":"The city has made notable progress in transport.","exZh":"这座城市在交通方面取得了显著进步。","memo":"「no贪宝」：不贪财的宝，名声显著。"},{"en":"notify","ipa":"/ˈnəʊtɪfaɪ/","zh":"v. 通知；告知","ex":"Please notify us of any changes.","exZh":"如有变动请通知我们。","memo":"「no提faq」：别提 FAQ 了，直接通知本人。"},{"en":"nourish","ipa":"/ˈnʌrɪʃ/","zh":"v. 滋养；培养","ex":"Good books nourish the mind.","exZh":"好书滋养心灵。","memo":"「脑日常」：脑子的日常口粮，滋养大脑。"},{"en":"nurture","ipa":"/ˈnɜːtʃə/","zh":"v. 培养；养育","ex":"Parents nurture their children's talents.","exZh":"父母培养孩子的才能。","memo":"「恩缺」：恩情不缺，养你成才。"},{"en":"obscure","ipa":"/əbˈskjʊə/","zh":"adj. 晦涩的；不出名的；v. 遮掩","ex":"The meaning of the poem remains obscure.","exZh":"这首诗的含义仍然晦涩难懂。","memo":"「阿婆斯过」：阿婆都看不懂斯过的天书，太晦涩。"},{"en":"obsolete","ipa":"/ˈɒbsəliːt/","zh":"adj. 过时的；废弃的","ex":"Fax machines are almost obsolete now.","exZh":"传真机现在几乎被淘汰了。","memo":"「阿婆笑离他」：阿婆都笑它老掉牙，早过时了。"},{"en":"obstruct","ipa":"/əbˈstrʌkt/","zh":"v. 阻塞；妨碍","ex":"Fallen trees obstructed the road.","exZh":"倒下的树堵住了道路。","memo":"「阿婆是夸他」：阿婆嘴上夸他，实际在挡路使绊。"},{"en":"offset","ipa":"/ˈɒfset/","zh":"v. 抵消；补偿","ex":"Higher wages were offset by rising prices.","exZh":"上涨的物价抵消了加薪。","memo":"「我服 set」：我这边加一分，你那边减一分，正好抵消。"},{"en":"omit","ipa":"/əˈmɪt/","zh":"v. 省略；遗漏","ex":"Important details were omitted from the report.","exZh":"报告中遗漏了重要细节。","memo":"「偶没」：偶（我）没写，纯属遗漏。"},{"en":"optimum","ipa":"/ˈɒptɪməm/","zh":"n./adj. 最佳（的）；最优（的）","ex":"Store the wine at the optimum temperature.","exZh":"把葡萄酒存放在最佳温度。","memo":"「O品TM」：O级品相 TM 绝了，最优状态。"},{"en":"ordeal","ipa":"/ɔːˈdiːl/","zh":"n. 磨难；严峻考验","ex":"The hostage described her ordeal.","exZh":"人质讲述了她的磨难经历。","memo":"「熬滴哦」：熬到滴水成冰，太遭罪了。"},{"en":"originate","ipa":"/əˈrɪdʒɪneɪt/","zh":"v. 起源；发源","ex":"The fire originated in the kitchen.","exZh":"火灾起始于厨房。","memo":"「original 的动词」：origin（起源）动起来，就是发源。"},{"en":"outweigh","ipa":"/ˌaʊtˈweɪ/","zh":"v. 超过；比…更重要","ex":"The benefits outweigh the risks.","exZh":"好处大于风险。","memo":"「out 秤」：天平上直接 out 对面，分量更重。"},{"en":"overwhelm","ipa":"/ˌəʊvəˈwelm/","zh":"v. 压倒；使不知所措","ex":"She was overwhelmed by the amount of work.","exZh":"她被工作量大到不知所措。","memo":"「我ver喂了么」：我喂了么全点单，订单压到喘不过气。"},{"en":"paradox","ipa":"/ˈpærədɒks/","zh":"n. 悖论；矛盾的事","ex":"It's a paradox that the busiest people find the most time.","exZh":"最忙的人反而最有时间，真是个悖论。","memo":"「帕拉德」：一帕一拉德俩结论，自相矛盾。"},{"en":"peculiar","ipa":"/pɪˈkjuːliə/","zh":"adj. 奇怪的；特有的","ex":"The fruit has a peculiar smell.","exZh":"这水果有种奇怪的气味。","memo":"「劈Q丽儿」：劈叉的Q弹丽儿，画风清奇。"},{"en":"penetrate","ipa":"/ˈpenɪtreɪt/","zh":"v. 渗透；穿透","ex":"The needle penetrated the hard shell.","exZh":"针穿透了坚硬的外壳。","memo":"「喷你锤它」：喷一喷再锤一锤，彻底打穿。"},{"en":"perceive","ipa":"/pəˈsiːv/","zh":"v. 感知；察觉","ex":"Dogs perceive sounds that humans cannot hear.","exZh":"狗能感知人耳听不到的声音。","memo":"「破西屋」：破西屋里有动静，只有狗先察觉。"},{"en":"perpetual","ipa":"/pəˈpetʃuəl/","zh":"adj. 永久的；持续的","ex":"He lives in a state of perpetual worry.","exZh":"他长期生活在无休止的忧虑中。","memo":"「怕胖瘦哦」：怕胖的人永远在减肥， perpetual 循环。"},{"en":"perplex","ipa":"/pəˈpleks/","zh":"v. 使困惑","ex":"The question perplexed even the experts.","exZh":"这个问题连专家都感到困惑。","memo":"「怕怕莱克斯」：怕这怕那，越想越懵。"},{"en":"persevere","ipa":"/ˌpɜːsɪˈvɪə/","zh":"v. 坚持不懈","ex":"She persevered despite countless setbacks.","exZh":"尽管挫折无数，她仍坚持不懈。","memo":"「破三为爱」：破三配速全为爱，跑到死也不放弃。"},{"en":"persist","ipa":"/pəˈsɪst/","zh":"v. 坚持；持续存在","ex":"The problem persists despite our efforts.","exZh":"尽管我们努力了，问题依然存在。","memo":"「破赛」：比赛破了还接着赛，坚持就是 persist。"},{"en":"pertinent","ipa":"/ˈpɜːtɪnənt/","zh":"adj. 相关的；切题的","ex":"Please keep your questions pertinent to the topic.","exZh":"提问请紧扣主题。","memo":"「跑题呢」：跑题呢就罚站，回答必须切题。"},{"en":"phenomenon","ipa":"/fəˈnɒmɪnən/","zh":"n. 现象；非凡的人","ex":"Rainbows are a natural phenomenon.","exZh":"彩虹是一种自然现象。","memo":"「疯脑眯嫩」：脑袋疯转眼睛眯着研究的嫩玩意，全是现象。"},{"en":"ponder","ipa":"/ˈpɒndə/","zh":"v. 思考；沉思","ex":"He pondered the question for days.","exZh":"他把这个问题琢磨了好几天。","memo":"「捧的」：捧着下巴半天不动，深度思考中。"},{"en":"portray","ipa":"/pɔːˈtreɪ/","zh":"v. 描绘；扮演","ex":"The film portrays life in the 1980s.","exZh":"这部电影描绘了80年代的生活。","memo":"「跑锤」：跑龙套举锤的也能演得栩栩如生。"},{"en":"potent","ipa":"/ˈpəʊtnt/","zh":"adj. 强效的；有力的","ex":"This herb is a potent remedy for coughs.","exZh":"这种草药是强效的止咳药。","memo":"「泡疼死」：一泡药下去疼死都治好，药效强劲。"},{"en":"pragmatic","ipa":"/præɡˈmætɪk/","zh":"adj. 务实的；实用的","ex":"She takes a pragmatic approach to budgeting.","exZh":"她用务实的方法做预算。","memo":"「普来哥买ticket」：普通来哥买票只看性价比，务实得很。"},{"en":"precede","ipa":"/prɪˈsiːd/","zh":"v. 在…之前；先于","ex":"A short speech preceded the award ceremony.","exZh":"颁奖仪式前有一段简短致辞。","memo":"「普瑞吸的」：普瑞先吸了一口，抢在前面。"},{"en":"predominant","ipa":"/prɪˈdɒmɪnənt/","zh":"adj. 主要的；占优势的","ex":"Blue is the predominant colour in his paintings.","exZh":"蓝色是他画作中的主色调。","memo":"「铺罗明难」：铺满罗盘明晃晃压轴，主导全场。"},{"en":"preliminary","ipa":"/prɪˈlɪmɪnəri/","zh":"adj. 初步的；预备的","ex":"The preliminary results look promising.","exZh":"初步结果看起来很有希望。","memo":"「普瑞丽卖呢」：预售前先「丽卖」一波，全在预热阶段。"},{"en":"premise","ipa":"/ˈpremɪs/","zh":"n. 前提；假设","ex":"The argument rests on a false premise.","exZh":"这个论点建立在一个错误的前提上。","memo":"「普瑞没死」：前提没死，论证才站得住。"},{"en":"prescribe","ipa":"/prɪˈskraɪb/","zh":"v. 开处方；规定","ex":"The doctor prescribed antibiotics for the infection.","exZh":"医生为感染开了抗生素。","memo":"「普瑞scribe（写）」：提前写好的药单，照方抓药。"},{"en":"prevail","ipa":"/prɪˈveɪl/","zh":"v. 盛行；获胜","ex":"Justice will prevail in the end.","exZh":"正义终将获胜。","memo":"「普瑞喂哦」：普瑞天天喂哦，喂出个常胜将军。"},{"en":"prevalent","ipa":"/ˈprevələnt/","zh":"adj. 普遍的；流行的","ex":"Smartphones are prevalent among teenagers.","exZh":"智能手机在青少年中很普遍。","memo":"「普瑞喂了笨」：普瑞喂遍了笨小孩，人手一台手机。"},{"en":"privilege","ipa":"/ˈprɪvəlɪdʒ/","zh":"n. 特权；荣幸","ex":"Free parking is a privilege for staff.","exZh":"免费停车是员工的特权。","memo":"「个人玩」：私人才能玩的项目，纯特权。"},{"en":"proclaim","ipa":"/prəˈkleɪm/","zh":"v. 宣布；声明","ex":"The mayor proclaimed a day of celebration.","exZh":"市长宣布设立庆祝日。","memo":"「铺罗克莱」：铺天盖地罗里罗嗦地克莱明，官宣了。"},{"en":"profound","ipa":"/prəˈfaʊnd/","zh":"adj. 深刻的；深远的","ex":"The book had a profound effect on her.","exZh":"这本书对她影响深远。","memo":"「普罗found」：普罗大众挖到的 found 宝藏，深不见底。"},{"en":"prohibit","ipa":"/prəˈhɪbɪt/","zh":"v. 禁止","ex":"Smoking is prohibited in public places.","exZh":"公共场所禁止吸烟。","memo":"「怕黑比特」：怕黑连比特币都不让挖，全面禁止。"},{"en":"prolong","ipa":"/prəˈlɒŋ/","zh":"v. 延长","ex":"Try not to prolong the meeting.","exZh":"尽量不要拖延会议。","memo":"「普罗浪」：普罗众生一起浪，假期又延长了。"},{"en":"propel","ipa":"/prəˈpel/","zh":"v. 推进；驱动","ex":"The engine propels the ship forward.","exZh":"发动机推动轮船前进。","memo":"「普罗怕哦」：普罗都被推着怕哦怕哦往前跑。"},{"en":"proportion","ipa":"/prəˈpɔːʃn/","zh":"n. 比例；部分","ex":"A large proportion of students walk to school.","exZh":"很大比例的学生步行上学。","memo":"「普罗破身」：把普罗大众破成几身，按份分好。"},{"en":"prospect","ipa":"/ˈprɒspekt/","zh":"n. 前景；可能性","ex":"The job offers excellent career prospects.","exZh":"这份工作有很好的职业前景。","memo":"「普罗spect（看）」：大家都往前看，看的是前程。"},{"en":"prosper","ipa":"/ˈprɒspə/","zh":"v. 繁荣；兴旺","ex":"The town prospered after the railway arrived.","exZh":"铁路通车后小镇繁荣起来。","memo":"「普罗死扑」：普罗大众死扑商机，经济腾飞。"},{"en":"provoke","ipa":"/prəˈvəʊk/","zh":"v. 激怒；挑起","ex":"His rude remarks provoked a heated argument.","exZh":"他的粗鲁言论引发了一场激烈争吵。","memo":"「普罗我客」：普罗店里的我客被踩了脚，瞬间被激怒。"},{"en":"punctual","ipa":"/ˈpʌŋktʃuəl/","zh":"adj. 准时的","ex":"She is always punctual for meetings.","exZh":"她开会总是很准时。","memo":"「碰球」：碰球时间一到就到，分秒不差。"},{"en":"pursue","ipa":"/pəˈsjuː/","zh":"v. 追求；从事","ex":"He decided to pursue a career in music.","exZh":"他决定从事音乐事业。","memo":"「怕羞」：再怕羞也要追到底，脸皮厚是标配。"},{"en":"quota","ipa":"/ˈkwəʊtə/","zh":"n. 配额；限额","ex":"Each salesperson has a monthly quota.","exZh":"每个销售员都有月度指标。","memo":"「扣他」：指标没完成就扣他钱。"},{"en":"radical","ipa":"/ˈrædɪkl/","zh":"adj. 激进的；根本的","ex":"The plan requires radical changes.","exZh":"该计划需要彻底的变革。","memo":"「réti地抠」：连根（root）都抠起来改，够彻底。"},{"en":"rational","ipa":"/ˈræʃnəl/","zh":"adj. 理性的；合理的","ex":"Stay rational when making big decisions.","exZh":"做重大决定时要保持理性。","memo":"「rati论」：拿 ratio（比率）算账，理性派本派。"},{"en":"reap","ipa":"/riːp/","zh":"v. 收割；获得","ex":"You will reap the rewards of hard work.","exZh":"你会收获努力的回报。","memo":"「锐扑」：镰刀锐利往麦上一扑，收割喽。"},{"en":"reckon","ipa":"/ˈrekən/","zh":"v. 认为；估算","ex":"I reckon the trip will cost about 3,000 yuan.","exZh":"我估计这趟旅行要花三千元左右。","memo":"「re抠」：反复抠着算账，估算到小数点。"},{"en":"reconcile","ipa":"/ˈrekənsaɪl/","zh":"v. 调和；使和解","ex":"They finally reconciled after years of silence.","exZh":"沉默多年后他们终于和好了。","memo":"「re控赛」：re（再）控一场赛，把俩人对齐和解。"},{"en":"rectify","ipa":"/ˈrektɪfaɪ/","zh":"v. 纠正；改正","ex":"Steps were taken to rectify the error.","exZh":"已采取措施纠正错误。","memo":"「rect（直）+ify」：把弯的掰直，纠错完毕。"},{"en":"refine","ipa":"/rɪˈfaɪn/","zh":"v. 提炼；改进","ex":"The team refined the design over several months.","exZh":"团队花几个月打磨改进设计。","memo":"「re fine」：re（反复）调到 fine（好），越改越精。"},{"en":"refute","ipa":"/rɪˈfjuːt/","zh":"v. 驳斥；反驳","ex":"The data refutes his claim completely.","exZh":"数据彻底驳斥了他的说法。","memo":"「re f右」：re（再）把你怼回右边，反驳没商量。"},{"en":"regulate","ipa":"/ˈreɡjuleɪt/","zh":"v. 管理；调节","ex":"The agency regulates food safety.","exZh":"该机构负责监管食品安全。","memo":"「regular 的动词」：管到 regular（有规律）为止。"},{"en":"reinforce","ipa":"/ˌriːɪnˈfɔːs/","zh":"v. 加强；增援","ex":"The wall was reinforced with steel bars.","exZh":"墙用钢筋加固了。","memo":"「re in force」：force（兵力）再进场，增援加固。"},{"en":"render","ipa":"/ˈrendə/","zh":"v. 使成为；提供；渲染","ex":"The storm rendered the road impassable.","exZh":"暴风雨使道路无法通行。","memo":"「软的」：一场雨把硬路泡成软的，直接变废。"},{"en":"renovate","ipa":"/ˈrenəveɪt/","zh":"v. 翻新；修复","ex":"They renovated the old house into a café.","exZh":"他们把老房子翻新成咖啡馆。","memo":"「re no喂」：re（重新）no 旧喂新，翻新走起。"},{"en":"replicate","ipa":"/ˈreplɪkeɪt/","zh":"v. 复制；重现","ex":"Scientists failed to replicate the experiment.","exZh":"科学家们没能重现该实验。","memo":"「reply 开他」：回复式开他一台，复制粘贴同款。"},{"en":"resent","ipa":"/rɪˈzent/","zh":"v. 怨恨；愤恨","ex":"She resents being treated unfairly.","exZh":"她痛恨被不公平对待。","memo":"「re 送他」：re（再）送他一次黑脸，记仇了。"},{"en":"reside","ipa":"/rɪˈzaɪd/","zh":"v. 居住；存在于","ex":"The family resides in a small village.","exZh":"这家人住在小村庄里。","memo":"「re 赛的」：re（日日）赛的住处，常驻于此。"},{"en":"restore","ipa":"/rɪˈstɔː/","zh":"v. 恢复；修复","ex":"The museum restored the ancient painting.","exZh":"博物馆修复了这幅古画。","memo":"「re store」：re（重新）入库 store，恢复如初。"},{"en":"restrain","ipa":"/rɪˈstreɪn/","zh":"v. 克制；约束","ex":"He restrained himself from shouting.","exZh":"他克制住自己没有喊出来。","memo":"「re train」：re（再）train 一次，学会管住自己。"},{"en":"retain","ipa":"/rɪˈteɪn/","zh":"v. 保留；保持","ex":"The soil retains moisture well.","exZh":"这种土壤保水性好。","memo":"「re 拿」：re（反复）拿住不放，牢牢保留。"},{"en":"retrieve","ipa":"/rɪˈtriːv/","zh":"v. 取回；检索","ex":"I retrieved the file from the recycle bin.","exZh":"我从回收站找回了文件。","memo":"「re 剔」：re（再）剔一遍垃圾，把宝贝捞回来。"},{"en":"revenue","ipa":"/ˈrevənjuː/","zh":"n. 收入；税收","ex":"The company's revenue doubled last year.","exZh":"公司收入去年翻了一番。","memo":"「re 文牛」：靠 re（反复）写文牛起来，收入暴涨。"},{"en":"revise","ipa":"/rɪˈvaɪz/","zh":"v. 修改；复习","ex":"She revised her essay three times.","exZh":"她的文章改了三遍。","memo":"「re view」：re（再）view 一遍，改完再背。"},{"en":"rigid","ipa":"/ˈrɪdʒɪd/","zh":"adj. 僵硬的；死板的","ex":"The school has rigid rules about uniforms.","exZh":"这所学校校服规定很死板。","memo":"「锐剪的」：被锐器剪过的铁丝，又硬又僵。"},{"en":"rigorous","ipa":"/ˈrɪɡərəs/","zh":"adj. 严格的；缜密的","ex":"The drug passed rigorous testing.","exZh":"该药品通过了严格测试。","memo":"「锐割若死」：锐器割到若死，检验严格到肉疼。"},{"en":"robust","ipa":"/rəʊˈbʌst/","zh":"adj. 强健的；稳固的","ex":"The economy remains robust despite challenges.","exZh":"尽管有挑战，经济依然强劲。","memo":"「肉巴死」：一身腱子肉巴到死，壮得离谱。"},{"en":"safeguard","ipa":"/ˈseɪfɡɑːd/","zh":"v./n. 保护（措施）","ex":"New rules safeguard consumers' rights.","exZh":"新规保护消费者权益。","memo":"safe+guard：安全保镖，护你周全。"},{"en":"scarce","ipa":"/skeəs/","zh":"adj. 稀缺的；不足的","ex":"Clean water is scarce in the region.","exZh":"该地区清洁水源稀缺。","memo":"「死干死」：干得要死还缺水，稀缺到家。"},{"en":"scatter","ipa":"/ˈskætə/","zh":"v. 撒；散布","ex":"The wind scattered the leaves everywhere.","exZh":"风把树叶吹得到处都是。","memo":"「死盖塔」：死盖都盖不住塔顶的叶子，全吹散。"},{"en":"scope","ipa":"/skəʊp/","zh":"n. 范围；机会","ex":"The question is beyond the scope of this study.","exZh":"这个问题超出了本研究范围。","memo":"「死口普」：一口到底就普普通通这么大盘子，范围锁定。"},{"en":"scrutiny","ipa":"/ˈskruːtəni/","zh":"n. 仔细审查","ex":"The deal came under close scrutiny.","exZh":"这笔交易受到严格审查。","memo":"「死抠特你」：死抠到特写镜头怼你脸上，查得极细。"},{"en":"segment","ipa":"/ˈseɡmənt/","zh":"n. 部分；段；v. 分割","ex":"The market is divided into several segments.","exZh":"市场被划分为几个部分。","memo":"「赛格闷」：赛格广场一节一节闷头盖，段段分明。"},{"en":"shatter","ipa":"/ˈʃætə/","zh":"v. 打碎；使破灭","ex":"The news shattered her dreams.","exZh":"这个消息粉碎了她的梦想。","memo":"「夏特」：夏天特脆的玻璃杯，一碰就碎一地。"},{"en":"shrink","ipa":"/ʃrɪŋk/","zh":"v. 收缩；缩水","ex":"Wool sweaters shrink in hot water.","exZh":"毛衫遇热水会缩水。","memo":"「削弱刻」：刻一寸削一寸，越洗越小。"},{"en":"simulate","ipa":"/ˈsɪmjuleɪt/","zh":"v. 模拟；模仿","ex":"The software simulates real flight conditions.","exZh":"该软件模拟真实飞行状况。","memo":"「same 你累」：仿得跟你累得一模一样，模拟真像。"},{"en":"simultaneous","ipa":"/ˌsɪmlˈteɪniəs/","zh":"adj. 同时发生的","ex":"The bombs caused simultaneous explosions.","exZh":"炸弹同时爆炸。","memo":"「same 时间哦」：same 时间同时做，一步不差。"},{"en":"skeptical","ipa":"/ˈskeptɪkl/","zh":"adj. 怀疑的","ex":"I'm skeptical about miracle cures.","exZh":"我对神奇疗法持怀疑态度。","memo":"「死盖不贴」：拿盖子死死盖住不贴收据，先怀疑再说。"},{"en":"sluggish","ipa":"/ˈslʌɡɪʃ/","zh":"adj. 迟缓的；懒散的","ex":"The economy has been sluggish this year.","exZh":"今年经济一直低迷迟缓。","memo":"「slug（鼻涕虫）」：像鼻涕虫一样慢吞吞。"},{"en":"sober","ipa":"/ˈsəʊbə/","zh":"adj. 清醒的；朴素的","ex":"Stay sober and drive safely.","exZh":"保持清醒安全驾驶。","memo":"「搜吧」：搜遍全身没酒瓶，相当清醒。"},{"en":"sophisticated","ipa":"/səˈfɪstɪkeɪtɪd/","zh":"adj. 先进的；老练的；精密的","ex":"The lab uses sophisticated equipment.","exZh":"实验室使用精密设备。","memo":"「索菲死踢开的」：索菲亚死踢开杂念，一身高级感。"},{"en":"spark","ipa":"/spɑːk/","zh":"n. 火花；v. 引发","ex":"The speech sparked a heated debate.","exZh":"这场演讲引发了激烈争论。","memo":"「死扒课」：死扒着课间一点空闲，火花四溅。"},{"en":"speculate","ipa":"/ˈspekjuleɪt/","zh":"v. 推测；投机","ex":"We can only speculate about the future.","exZh":"我们只能对未来进行猜测。","memo":"「spec（看）+ul（咕噜）」：眼珠咕噜转着看，边看边猜。"},{"en":"spontaneous","ipa":"/spɒnˈteɪniəs/","zh":"adj. 自发的；即兴的","ex":"The crowd broke into spontaneous applause.","exZh":"人群自发地鼓起掌来。","memo":"「死蹦太捏死」：说蹦就蹦拦都拦不住，即兴表演。"},{"en":"stagnant","ipa":"/ˈstæɡnənt/","zh":"adj. 停滞的；不流动的","ex":"The market has been stagnant for months.","exZh":"市场已停滞数月。","memo":"「死太哥难」：死太哥都难救，一潭死水。"},{"en":"stationary","ipa":"/ˈsteɪʃənri/","zh":"adj. 静止的；固定的","ex":"A stationary car blocked the lane.","exZh":"一辆停着的车堵住了车道。","memo":"「station（车站）+ary」：钉在车站不动弹。"},{"en":"stereotype","ipa":"/ˈsteriətaɪp/","zh":"n. 刻板印象；v. 对…形成刻板印象","ex":"Avoid stereotyping people by their accent.","exZh":"避免以口音给人贴标签。","memo":"「死套型」：死套老模子，千人一面。"},{"en":"stimulate","ipa":"/ˈstɪmjuleɪt/","zh":"v. 刺激；激发","ex":"A short walk after lunch can stimulate your brain.","exZh":"午饭后短距离散步能提神醒脑。","memo":"「死踢没有」：死踢都没有反应？咖啡一下就来精神。"},{"en":"surpass","ipa":"/səˈpɑːs/","zh":"v. 超越；胜过","ex":"Her performance surpassed all expectations.","exZh":"她的表现超出所有预期。","memo":"「sur（超）+pass」：从别人头上 pass 过去，超越。"},{"en":"sustain","ipa":"/səˈsteɪn/","zh":"v. 维持；承受","ex":"The bridge can sustain heavy loads.","exZh":"这座桥能承受重载。","memo":"「so甜」：甜日子要一直 so 下去，可持续的甜。"},{"en":"tackle","ipa":"/ˈtækl/","zh":"v. 处理；对付","ex":"We must tackle the problem at its root.","exZh":"我们必须从根源上解决这个问题。","memo":"「太抠」：太抠的难题也要硬着头皮 tackle。"},{"en":"tedious","ipa":"/ˈtiːdiəs/","zh":"adj. 乏味的；冗长的","ex":"The lecture was long and tedious.","exZh":"这场讲座又长又乏味。","memo":"「踢地的」：踢着地皮走的课，无聊到想逃。"},{"en":"tentative","ipa":"/ˈtentətɪv/","zh":"adj. 试探性的；暂定的","ex":"We made a tentative plan for the weekend.","exZh":"我们周末先定了个暂定计划。","memo":"「tent（帐篷）先搭」：帐篷先搭着试试，随时能撤，暂定的。"},{"en":"terminate","ipa":"/ˈtɜːmɪneɪt/","zh":"v. 终止；结束","ex":"The company terminated his contract.","exZh":"公司终止了他的合同。","memo":"「term（期）+inate」：期满直接终了，辞职信都省了。"},{"en":"thrive","ipa":"/θraɪv/","zh":"v. 兴旺；茁壮成长","ex":"These plants thrive in warm climates.","exZh":"这些植物在温暖气候里长势旺盛。","memo":"「斯瑞爱夫」：死瑞也爱丈夫，越过越红火。"},{"en":"tolerate","ipa":"/ˈtɒləreɪt/","zh":"v. 容忍；忍受","ex":"I won't tolerate such behaviour.","exZh":"我不会容忍这种行为。","memo":"「偷了瑞特」：偷了瑞特的猫还能忍？底线！"},{"en":"toxic","ipa":"/ˈtɒksɪk/","zh":"adj. 有毒的","ex":"Toxic fumes filled the room.","exZh":"房间里弥漫着有毒气体。","memo":"「逃你可死」：见了快逃，你可小心，剧毒。"},{"en":"transmit","ipa":"/trænsˈmɪt/","zh":"v. 传输；传播","ex":"The virus transmits easily in crowds.","exZh":"病毒在人群中容易传播。","memo":"「trans（穿）+mit（送）」：穿过去送到位，信号直达。"},{"en":"transparent","ipa":"/trænsˈpærənt/","zh":"adj. 透明的；公开的","ex":"The company keeps its accounts transparent.","exZh":"公司账目保持公开透明。","memo":"「trans+parent」：在爸妈面前没法藏事，全透明。"},{"en":"trigger","ipa":"/ˈtrɪɡə/","zh":"n. 扳机；诱因；v. 触发","ex":"The news triggered panic buying.","exZh":"这则消息引发抢购潮。","memo":"「吹割」：一吹就开闸放水，扳机扣响。"},{"en":"turbulent","ipa":"/ˈtɜːbjələnt/","zh":"adj. 动荡的；湍急的","ex":"The plane hit turbulent air.","exZh":"飞机遇上气流颠簸。","memo":"「特不稳了特」：特别不稳的一路，颠到吐。"},{"en":"unanimous","ipa":"/juˈnænɪməs/","zh":"adj. 全体一致的","ex":"The jury reached a unanimous decision within one hour.","exZh":"陪审团一小时内做出一致裁决。","memo":"「you 娜 you 么死」：你娜你么死都同意，全票通过。"},{"en":"undermine","ipa":"/ˌʌndəˈmaɪn/","zh":"v. 逐渐削弱；暗中破坏","ex":"Constant criticism can undermine a child's confidence.","exZh":"不断的批评会削弱孩子的自信。","memo":"「under+mine」：在底下挖矿，慢慢掏空地基。"},{"en":"undergo","ipa":"/ˌʌndəˈɡəʊ/","zh":"v. 经历；承受","ex":"The building will undergo repairs next month.","exZh":"这栋楼下个月要进行维修。","memo":"「under 走」：从底下走过一遭，啥都经历了。"},{"en":"underlie","ipa":"/ˌʌndəˈlaɪ/","zh":"v. 构成…的基础","ex":"Trust underlies all lasting friendships.","exZh":"信任是一切长久友谊的基础。","memo":"「under 躺」：在底下躺平的，全是地基。"},{"en":"unify","ipa":"/ˈjuːnɪfaɪ/","zh":"v. 统一；使一致","ex":"The new policy unified the two systems.","exZh":"新政策统一了两套体系。","memo":"「uni（一）+fy」：拧成一股绳，统一行动。"},{"en":"unleash","ipa":"/ʌnˈliːʃ/","zh":"v. 释放；发泄","ex":"The storm unleashed its full power.","exZh":"风暴释放出全部威力。","memo":"「un leash（拴绳）」：解掉狗绳，撒欢狂奔。"},{"en":"unprecedented","ipa":"/ʌnˈpresɪdentɪd/","zh":"adj. 前所未有的","ex":"The flood caused unprecedented damage.","exZh":"洪水造成了前所未有的破坏。","memo":"「un+precedent（先例）」：翻遍史书没先例，头一回。"},{"en":"uphold","ipa":"/ʌpˈhəʊld/","zh":"v. 维护；支持","ex":"Courts must uphold the law.","exZh":"法院必须维护法律。","memo":"「up+hold」：高高举起护住，顶到底。"},{"en":"utilize","ipa":"/ˈjuːtəlaɪz/","zh":"v. 利用","ex":"The farm utilizes solar power for heating.","exZh":"农场利用太阳能供暖。","memo":"「you 用来了」：you 用起来才叫利用，别闲置。"},{"en":"vague","ipa":"/veɪɡ/","zh":"adj. 模糊的；含糊的","ex":"His memory of the event is vague.","exZh":"他对那件事的记忆很模糊。","memo":"「袜给」：袜子给丢了找不着，印象糊成一团。"},{"en":"venture","ipa":"/ˈventʃə/","zh":"n. 冒险事业；v. 敢于去","ex":"She ventured into the online business.","exZh":"她大胆进入了电商行业。","memo":"「稳车」：开稳车去创业？那叫 venture 不叫稳。"},{"en":"verify","ipa":"/ˈverɪfaɪ/","zh":"v. 核实；查证","ex":"Please verify your email address.","exZh":"请验证您的电子邮箱地址。","memo":"「very fine」：查到非常 fine 才放行，核实过关。"},{"en":"versatile","ipa":"/ˈvɜːsətaɪl/","zh":"adj. 多才多艺的；多用途的","ex":"Eggs are a versatile ingredient.","exZh":"鸡蛋是一种百搭食材。","memo":"「vers（转）+atile」：转到哪都行，十八般武艺。"},{"en":"viable","ipa":"/ˈvaɪəbl/","zh":"adj. 可行的；能存活的","ex":"Is the plan financially viable?","exZh":"这个计划在财务上可行吗？","memo":"「歪不错」：看着歪打正着，实际活得好好的。"},{"en":"vibrant","ipa":"/ˈvaɪbrənt/","zh":"adj. 充满活力的；鲜艳的","ex":"The city has a vibrant nightlife.","exZh":"这座城市的夜生活丰富多彩。","memo":"「歪不正」：歪着蹦迪不正站，活力四射。"},{"en":"vigorous","ipa":"/ˈvɪɡərəs/","zh":"adj. 有力的；精力充沛的","ex":"He gave a vigorous nod.","exZh":"他用力地点了点头。","memo":"「一级稿死」：一级运动员稿子背死，劲头十足。"},{"en":"virtually","ipa":"/ˈvɜːtʃuəli/","zh":"adv. 几乎；实际上","ex":"The two products are virtually identical.","exZh":"这两款产品几乎一模一样。","memo":"「virtual（虚拟）+ly」：虚拟到跟真的一样，几乎没差。"},{"en":"vivid","ipa":"/ˈvɪvɪd/","zh":"adj. 生动的；鲜艳的","ex":"She gave a vivid description of the scene.","exZh":"她把场景描述得栩栩如生。","memo":"「维Vの」：维他命V的颜色，鲜艳欲滴。"},{"en":"voluntary","ipa":"/ˈvɒləntri/","zh":"adj. 自愿的；志愿的","ex":"Attendance at the evening lecture is entirely voluntary.","exZh":"晚间讲座完全自愿参加。","memo":"「我栏台里」：我栏台里搭把手，自愿来帮忙。"},{"en":"vulnerable","ipa":"/ˈvʌlnərəbl/","zh":"adj. 脆弱的；易受伤害的","ex":"Elderly people are vulnerable to the virus.","exZh":"老年人容易受病毒侵害。","memo":"「我呢若薄」：我呢，薄得像冰面，一踩就碎，脆弱。"},{"en":"warrant","ipa":"/ˈwɒrənt/","zh":"n. 授权令；v. 保证；值得","ex":"The situation warrants a careful review.","exZh":"这种情况值得仔细审查。","memo":"「我认他」：我认他签的字，令出有名。"},{"en":"wary","ipa":"/ˈweəri/","zh":"adj. 谨慎的；提防的","ex":"Be wary of strangers offering free gifts.","exZh":"对主动送免费礼物的人要警惕。","memo":"「威尔」：威尔见到免费馅饼先躲，机警得很。"},{"en":"wither","ipa":"/ˈwɪðə/","zh":"v. 枯萎；凋谢","ex":"The flowers withered in the drought.","exZh":"花在干旱中枯萎了。","memo":"「威瑟」：威风全瑟缩，花都低头枯了。"},{"en":"withstand","ipa":"/wɪðˈstænd/","zh":"v. 承受；经受住","ex":"The tent can withstand strong winds.","exZh":"这顶帐篷能抗强风。","memo":"「with+stand」：跟风站在一起硬扛，纹丝不动。"},{"en":"yield","ipa":"/jiːld/","zh":"v. 屈服；产出；n. 产量","ex":"The field yields good crops every year.","exZh":"这块地每年都有好收成。","memo":"「一咬的」：咬一口就缴械投降，但地里产出管饱。"},{"en":"abrupt","ipa":"/əˈbrʌpt/","zh":"adj. 突然的；生硬的","ex":"The meeting came to an abrupt end when the fire alarm rang.","exZh":"火警响起时会议戛然而止。","memo":"ab（离开）+rupt（断裂）：突然断裂开来，来得又急又猛。"},{"en":"absurd","ipa":"/əbˈsɜːd/","zh":"adj. 荒谬的；荒唐的","ex":"It is absurd to spend three hours commuting every single day.","exZh":"每天花三个小时通勤实在荒唐。","memo":"ab（不）+surd（确定）：毫无道理可讲，荒谬离谱。"},{"en":"access","ipa":"/ˈækses/","zh":"n. 使用权；通道 v. 获取","ex":"Students have free access to the university library online.","exZh":"学生可免费使用大学的线上图书馆。","memo":"ac（去）+cess（行走）：能走进去就是通道与权限。"},{"en":"acclaim","ipa":"/əˈkleɪm/","zh":"n. 赞誉 v. 称赞","ex":"The young director won international acclaim for her first film.","exZh":"这位年轻导演凭处女作赢得国际赞誉。","memo":"ac（朝向）+claim（喊）：朝着她齐声叫好，赞誉一片。"},{"en":"accord","ipa":"/əˈkɔːd/","zh":"n. 协议；一致 v. 符合","ex":"The two sides finally signed a peace accord after long talks.","exZh":"经过长期谈判，双方终于签署了和平协议。","memo":"ac+cord（心）：心往一处想，谈成一致签协议。"},{"en":"accuse","ipa":"/əˈkjuːz/","zh":"v. 指控；指责","ex":"The report accused the factory of polluting the nearby river.","exZh":"报告指控这家工厂污染了附近的河流。","memo":"「额克油死」：一口咬死你油水多，指控跑不掉。"},{"en":"achieve","ipa":"/əˈtʃiːv/","zh":"v. 实现；达到","ex":"She achieved a band score of seven in the speaking test.","exZh":"她在口语考试中取得了七分的成绩。","memo":"「额骑屋」：骑着马跨上屋顶，目标够高也实现。"},{"en":"activate","ipa":"/ˈæktɪveɪt/","zh":"v. 激活；启动","ex":"Scan the code to activate your new membership card.","exZh":"扫码即可激活新的会员卡。","memo":"active（活跃）+ate：让活跃起来，激活启动。"},{"en":"acute","ipa":"/əˈkjuːt/","zh":"adj. 严重的；急性的；敏锐的","ex":"The city faces an acute shortage of affordable housing.","exZh":"这座城市面临严重的保障房短缺。","memo":"a+cute：小狗鼻子 acute 特敏锐；病来得急是急性。"},{"en":"adjust","ipa":"/əˈdʒʌst/","zh":"v. 调整；适应","ex":"It took her a month to adjust to the new working hours.","exZh":"她花了一个月才适应新的作息时间。","memo":"ad+just（正好）：调到正好合适为止，调整。"},{"en":"administer","ipa":"/ədˈmɪnɪstə/","zh":"v. 管理；执行","ex":"A special agency administers the funds for rural schools.","exZh":"一个专门机构负责管理农村学校经费。","memo":"ad+minister（大臣）：像大臣一样打理，行政管理。"},{"en":"admission","ipa":"/ədˈmɪʃn/","zh":"n. 准许进入；录取；承认","ex":"Admission to the museum is free on the first Sunday monthly.","exZh":"博物馆每月第一个周日免费入场。","memo":"admit 的名词：被准许进来，录取或入场。"},{"en":"adolescent","ipa":"/ˌædəˈlesnt/","zh":"n. 青少年 adj. 青春期的","ex":"Many adolescents spend over four hours a day on their phones.","exZh":"许多青少年每天玩手机超过四小时。","memo":"ad+olesc（成长）+ent：正在长身体的人，青少年。"},{"en":"adopt","ipa":"/əˈdɒpt/","zh":"v. 采纳；采用；收养","ex":"The school adopted a new method of teaching English writing.","exZh":"学校采用了新的英语写作教学法。","memo":"opt（选择）：选定就用，还把娃也选回家，收养。"},{"en":"aerial","ipa":"/ˈeəriəl/","zh":"adj. 空中的 n. 天线","ex":"An aerial photograph shows how fast the city is expanding.","exZh":"航拍照片显示这座城市扩张得有多快。","memo":"aer（空气）+ial：悬在空气里的，空中的。"},{"en":"aesthetic","ipa":"/iːsˈθetɪk/","zh":"adj. 美学的；审美的","ex":"The bridge was designed with both safety and aesthetic appeal in mind.","exZh":"这座桥的设计兼顾了安全与美感。","memo":"「一斯C提」：一细看就提气质，审美在线。"},{"en":"affect","ipa":"/əˈfekt/","zh":"v. 影响；感动","ex":"Rising fuel prices affect the cost of almost everything we buy.","exZh":"燃油价格上涨影响几乎所有商品的成本。","memo":"af+fect（做）：对事情起作用，就是影响。"},{"en":"affiliate","ipa":"/əˈfɪlieɪt/","zh":"v. 使隶属 n. 附属机构","ex":"The research centre is affiliated with a leading medical school.","exZh":"该研究中心隶属一所顶尖医学院。","memo":"af+fili（儿子）+ate：当儿子一样收编，成为附属。"},{"en":"affirm","ipa":"/əˈfɜːm/","zh":"v. 肯定；证实","ex":"The study affirms that regular exercise improves sleep quality.","exZh":"这项研究证实规律运动能改善睡眠质量。","memo":"af+firm（坚定）：坚定地再说一遍，肯定没错。"},{"en":"affluent","ipa":"/ˈæfluənt/","zh":"adj. 富裕的","ex":"Affluent families often send their children to expensive private schools.","exZh":"富裕家庭常把孩子送进昂贵的私立学校。","memo":"af+flu（流）+ent：钱哗哗流进来，富裕。"},{"en":"agenda","ipa":"/əˈdʒendə/","zh":"n. 议程；议事日程","ex":"Climate change is at the top of the conference agenda.","exZh":"气候变化是本次会议的首要议程。","memo":"ag（做）+enda：今天要做的事列成单，议程。"},{"en":"aggravate","ipa":"/ˈæɡrəveɪt/","zh":"v. 加重；使恶化","ex":"Scratching will only aggravate the rash on your arm.","exZh":"抓挠只会让手臂上的皮疹更严重。","memo":"ag+grav（重）+ate：越弄越重，恶化加重。"},{"en":"agile","ipa":"/ˈædʒaɪl/","zh":"adj. 敏捷的；灵活的","ex":"Agile companies respond quickly to changes in the market.","exZh":"灵活的公司能迅速应对市场变化。","memo":"「艾姐哦」：艾姐练瑜伽，身手敏捷顶呱呱。"},{"en":"agitate","ipa":"/ˈædʒɪteɪt/","zh":"v. 搅动；煽动；使不安","ex":"The unions agitated for higher wages throughout the summer.","exZh":"整个夏天工会都在为涨薪奔走鼓动。","memo":"ag+it（走）+ate：上蹿下跳地走，搅动人心。"},{"en":"alert","ipa":"/əˈlɜːt/","zh":"adj. 警觉的 n. 警报 v. 警告","ex":"Stay alert when crossing busy streets at night.","exZh":"夜间过繁忙马路时要保持警觉。","memo":"「额乐」：别顾着乐，警报一响就得警觉。"},{"en":"alliance","ipa":"/əˈlaɪəns/","zh":"n. 联盟；结盟","ex":"The two airlines formed an alliance to share routes and costs.","exZh":"两家航空公司结盟共享航线与成本。","memo":"alli（绑一起）+ance：绑成一个阵营，联盟。"},{"en":"alter","ipa":"/ˈɔːltə/","zh":"v. 改变；更改","ex":"Little has altered in the village over the past century.","exZh":"过去一个世纪这个村庄几乎没有变化。","memo":"「奥拓」：老款奥拓改改装，里外全变，改变。"},{"en":"alternative","ipa":"/ɔːlˈtɜːnətɪv/","zh":"n. 替代选择 adj. 可替代的","ex":"Solar power is a cleaner alternative to coal.","exZh":"太阳能是比煤炭更清洁的替代能源。","memo":"alter（变）+ative：换个变法，替代方案。"},{"en":"ambiguous","ipa":"/æmˈbɪɡjuəs/","zh":"adj. 模棱两可的；含糊的","ex":"His ambiguous reply left everyone guessing his true opinion.","exZh":"他模棱两可的回答让所有人猜测其真实想法。","memo":"amb（两边）+igu：两边都说得通，模棱两可。"},{"en":"amend","ipa":"/əˈmend/","zh":"v. 修改；修订","ex":"The law was amended to better protect online consumers.","exZh":"该法律经过修订以更好地保护网购消费者。","memo":"a+mend（缝补）：把漏洞缝上，修订完善。"},{"en":"amid","ipa":"/əˈmɪd/","zh":"prep. 在…中间；在…当中","ex":"The company stayed calm amid growing doubts about its future.","exZh":"在对前景疑虑渐增之际，公司保持镇定。","memo":"a+mid（中间）：mid 正是中间， amid 就在其间。"},{"en":"ample","ipa":"/ˈæmpl/","zh":"adj. 充足的；宽敞的","ex":"The report provides ample evidence to support the new policy.","exZh":"报告提供了充足的证据支持新政策。","memo":"「安宝」：安宝家粮仓满满，物资充足不愁用。"},{"en":"amplify","ipa":"/ˈæmplɪfaɪ/","zh":"v. 放大；增强","ex":"Social media can amplify both praise and criticism overnight.","exZh":"社交媒体能在一夜之间放大赞扬与批评。","memo":"ampl（大）+ify：越弄越大，音量放大。"},{"en":"analogy","ipa":"/əˈnælədʒi/","zh":"n. 类比；类推","ex":"The teacher drew an analogy between the heart and a pump.","exZh":"老师把心脏类比为水泵。","memo":"ana（按比例）+logy（说）：按同样理路说，类比。"},{"en":"ancestor","ipa":"/ˈænsestə/","zh":"n. 祖先；先驱","ex":"This festival honours the ancestors of the local community.","exZh":"这个节日用于纪念当地社群的祖先。","memo":"an+ces+tor：祖辈一串人排队走来，祖先。"},{"en":"anecdote","ipa":"/ˈænɪkdəʊt/","zh":"n. 趣闻；轶事","ex":"She opened her lecture with a funny anecdote about student life.","exZh":"她以一则学生生活的趣闻开场。","memo":"an+ec+dote（给予）：讲个小故事给大家，轶事。"},{"en":"annual","ipa":"/ˈænjuəl/","zh":"adj. 每年的；年度的","ex":"The annual report shows a steady rise in company profits.","exZh":"年度报告显示公司利润稳步上升。","memo":"ann（年）+ual：一年一轮，每年的。"},{"en":"applaud","ipa":"/əˈplɔːd/","zh":"v. 鼓掌；称赞","ex":"The audience applauded loudly at the end of the performance.","exZh":"演出结束时观众热烈鼓掌。","memo":"ap+plaud（拍）：拍手叫好，鼓掌称赞。"},{"en":"appoint","ipa":"/əˈpɔɪnt/","zh":"v. 任命；指定","ex":"She was appointed head of the new research team.","exZh":"她被任命为新研究团队的负责人。","memo":"ap+point（点）：点名定岗，任命指派。"},{"en":"appraisal","ipa":"/əˈpreɪzl/","zh":"n. 评估；评价","ex":"Employees receive an annual appraisal from their managers.","exZh":"员工每年会接受经理的绩效评估。","memo":"ap+prais（价值）+al：给价值定个价，评估。"},{"en":"approach","ipa":"/əˈprəʊtʃ/","zh":"n. 方法；途径 v. 接近","ex":"We need a fresh approach to reduce traffic congestion.","exZh":"我们需要新方法来缓解交通拥堵。","memo":"ap+proach（靠近）：靠近问题的路子，方法途径。"},{"en":"approval","ipa":"/əˈpruːvl/","zh":"n. 批准；赞成","ex":"The project cannot start without the manager's approval.","exZh":"没有经理的批准，项目无法启动。","memo":"approve 的名词：点头通过，批准赞成。"},{"en":"apt","ipa":"/æpt/","zh":"adj. 易于…的；恰当的；聪明的","ex":"New drivers are apt to make small mistakes in heavy traffic.","exZh":"新司机在拥堵路况下容易犯小错误。","memo":"「阿普特」：阿普特别机灵，学啥都快，易于上手。"},{"en":"arduous","ipa":"/ˈɑːdjuəs/","zh":"adj. 艰巨的；费力的","ex":"Rebuilding the ancient temple was an arduous task.","exZh":"重建古寺是一项艰巨的任务。","memo":"「阿弟饿死」：阿弟干活累到饿死，艰巨费力。"},{"en":"arena","ipa":"/əˈriːnə/","zh":"n. 竞技场；舞台；领域","ex":"The general election is the main arena for political debate.","exZh":"大选是政治辩论的主要舞台。","memo":"「额瑞纳」：场地宽敞能容纳千军，竞技舞台。"},{"en":"array","ipa":"/əˈreɪ/","zh":"n. 大量；一系列；排列","ex":"The shop offers a wide array of handmade chocolates.","exZh":"这家店提供种类繁多的手工巧克力。","memo":"ar+ray（光线）：商品像光线般排开，一大阵列。"},{"en":"arrogant","ipa":"/ˈærəɡənt/","zh":"adj. 傲慢的；自大的","ex":"His arrogant manner cost him many friends at work.","exZh":"他傲慢的做派让他在单位失去了许多朋友。","memo":"ar+rog（要求）+ant：要求人人听他的，傲慢自大。"},{"en":"ascend","ipa":"/əˈsend/","zh":"v. 上升；攀登","ex":"The hikers ascended the steep mountain before sunrise to catch the view.","exZh":"徒步者日出前登上陡峭的高山，想赶上看景色。","memo":"a+scend（爬）：拾级往上爬，上升攀登。"},{"en":"aspiration","ipa":"/ˌæspəˈreɪʃn/","zh":"n. 渴望；抱负","ex":"Her aspiration is to become a wildlife photographer.","exZh":"她的抱负是成为野生动物摄影师。","memo":"a+spir（呼吸）+ation：心气儿提起来，抱负志向。"},{"en":"assert","ipa":"/əˈsɜːt/","zh":"v. 断言；坚称；维护","ex":"He asserted that the new drug was completely safe.","exZh":"他坚称这种新药完全安全。","memo":"as+sert（插入）：把观点插进讨论，坚决主张。"},{"en":"asset","ipa":"/ˈæset/","zh":"n. 资产；有价值的人或物","ex":"Fluency in two languages is a real asset in the job market.","exZh":"精通两种语言在就业市场上是真正的优势。","memo":"as+set（一套）：名下一整套家当，资产优势。"},{"en":"assimilate","ipa":"/əˈsɪməleɪt/","zh":"v. 吸收；使同化","ex":"Migrants gradually assimilate into the local culture after a few years.","exZh":"移民几年后逐渐融入当地文化。","memo":"as+simil（相同）+ate：变得相同，同化吸收。"},{"en":"astonishing","ipa":"/əˈstɒnɪʃɪŋ/","zh":"adj. 令人惊讶的","ex":"The bridge was completed in two years, an astonishing achievement.","exZh":"大桥两年建成，成就令人惊叹。","memo":"a+stonish（击晕）：惊得人发晕，令人惊讶。"},{"en":"audit","ipa":"/ˈɔːdɪt/","zh":"n. 审计 v. 审查","ex":"An independent audit found no errors in the accounts.","exZh":"独立审计发现账目没有差错。","memo":"aud（听）+it：古罗马人边听边查账，审计。"},{"en":"authorize","ipa":"/ˈɔːθəraɪz/","zh":"v. 授权；批准","ex":"Only the director can authorize payments above ten thousand.","exZh":"只有主任有权批准一万元以上的支出。","memo":"author（权威）+ize：权威点头，授权生效。"},{"en":"automatic","ipa":"/ˌɔːtəˈmætɪk/","zh":"adj. 自动的；无意识的","ex":"The doors are automatic and open as you approach.","exZh":"门是自动的，走近就会打开。","memo":"auto（自己）+matic：自己会动，全自动。"},{"en":"auxiliary","ipa":"/ɔːɡˈzɪliəri/","zh":"adj. 辅助的；备用的","ex":"The hospital has an auxiliary generator for emergencies.","exZh":"医院配有应急备用发电机。","memo":"aux（增大）+iliary：帮忙加大力量，辅助备用。"},{"en":"avenue","ipa":"/ˈævənjuː/","zh":"n. 大街；途径","ex":"Online courses open a new avenue for adult education.","exZh":"网络课程为成人教育开辟了新途径。","memo":"a+venue（来）：人来人往的大道，也是门路。"},{"en":"awe","ipa":"/ɔː/","zh":"n. 敬畏 v. 使敬畏","ex":"Visitors stared at the vast canyon in silent awe.","exZh":"游客们默然敬畏地凝视着巨大的峡谷。","memo":"「奥——」：惊叹一声奥，敬畏之情油然而生。"},{"en":"alien","ipa":"/ˈeɪliən/","zh":"adj. 陌生的；外国的 n. 外侨","ex":"The concept of private space travel is alien to most of us.","exZh":"私人太空旅行的概念对我们大多数人很陌生。","memo":"ali（别处）+en：来自别处的人，陌生的外乡人。"},{"en":"adept","ipa":"/əˈdept/","zh":"adj. 熟练的；擅长的","ex":"She is adept at explaining complex ideas in simple words.","exZh":"她擅长用简单的语言解释复杂的概念。","memo":"ad+ept（适合）：干啥都合适熟练，真是个老手。"},{"en":"adhere","ipa":"/ədˈhɪə/","zh":"v. 粘附；遵守","ex":"All staff must adhere to the safety regulations.","exZh":"所有员工都必须遵守安全条例。","memo":"ad+here（粘贴）：紧紧贴住规则不放，遵守。"},{"en":"adjacent","ipa":"/əˈdʒeɪsnt/","zh":"adj. 邻近的；毗连的","ex":"The hotel is adjacent to the main railway station.","exZh":"这家酒店紧邻火车站。","memo":"ad+jacent（躺）：躺在一起，紧紧相邻。"},{"en":"admirable","ipa":"/ˈædmərəbl/","zh":"adj. 令人钦佩的","ex":"Her admirable patience helped the shy students open up.","exZh":"她令人钦佩的耐心让害羞的学生敞开心扉。","memo":"admire（钦佩）+able：值得钦佩的。"},{"en":"advent","ipa":"/ˈædvent/","zh":"n. 出现；到来","ex":"The advent of smartphones has changed how students study.","exZh":"智能手机的出现改变了学生的学习方式。","memo":"ad+vent（来）：大事翩然来临，新时代到来。"},{"en":"affection","ipa":"/əˈfekʃn/","zh":"n. 喜爱；感情","ex":"The old teacher felt deep affection for his former students.","exZh":"这位老教师对往届学生怀有深厚感情。","memo":"affect（感动）+ion：被感动留下的情，喜爱。"},{"en":"afflict","ipa":"/əˈflɪkt/","zh":"v. 折磨；使苦恼","ex":"Persistent drought continues to afflict the western provinces and their farmers.","exZh":"持续干旱继续折磨着西部各省及其农民。","memo":"af+flict（打击）：一记记打击不停，饱受折磨。"},{"en":"align","ipa":"/əˈlaɪn/","zh":"v. 使一致；对齐","ex":"The report aligns its findings with earlier research.","exZh":"该报告的结论与早期研究保持一致。","memo":"a+lign（直线）：排成一条直线，对齐一致。"},{"en":"allowance","ipa":"/əˈlaʊəns/","zh":"n. 津贴；限额","ex":"Students receive a monthly allowance for living expenses.","exZh":"学生每月领取生活费津贴。","memo":"allow（准许给）+ance：被允许按月发的钱，津贴。"},{"en":"amateur","ipa":"/ˈæmətə/","zh":"n. 业余爱好者 adj. 业余的","ex":"The race is open to both professionals and amateurs.","exZh":"这场比赛对职业选手和业余爱好者都开放。","memo":"am+ateur（爱）：因为热爱而参赛，业余爱好者。"},{"en":"analyst","ipa":"/ˈænəlɪst/","zh":"n. 分析员；化验员","ex":"The financial analyst predicted steady growth next year.","exZh":"这位金融分析师预测明年会稳步增长。","memo":"ana+lyst（分解）：专门拆解数据的人，分析员。"},{"en":"appalling","ipa":"/əˈpɔːlɪŋ/","zh":"adj. 骇人的；极差的","ex":"The refugees were living in appalling conditions with little food or clean water.","exZh":"难民生活在恶劣环境中，食物和净水都很少。","memo":"ap+pall（苍白）+ing：吓得脸色发白，骇人听闻。"},{"en":"arid","ipa":"/ˈærɪd/","zh":"adj. 干旱的；贫瘠的","ex":"Very little vegetation grows in the arid desert region of the north.","exZh":"北部干旱的沙漠地区几乎寸草不生。","memo":"「爱日的」：太爱晒太阳，土地都晒干了，干旱。"},{"en":"arouse","ipa":"/əˈraʊz/","zh":"v. 唤起；激起","ex":"The new policy aroused widespread public concern about food safety standards.","exZh":"新政策引发了公众对食品安全标准的普遍担忧。","memo":"a+rouse（唤醒）：把情绪叫醒，激起唤起。"},{"en":"ascertain","ipa":"/ˌæsəˈteɪn/","zh":"v. 查明；弄清","ex":"Police are trying to ascertain the cause of the fire.","exZh":"警方正在努力查明起火原因。","memo":"as+certain（确定）：弄到确定为止，查明。"},{"en":"assurance","ipa":"/əˈʃʊərəns/","zh":"n. 保证；把握","ex":"The manager gave us his assurance that delivery would be on time.","exZh":"经理向我们保证交货准时。","memo":"assure（保证）+ance：拍胸脯的承诺，保证。"},{"en":"augment","ipa":"/ɔːɡˈment/","zh":"v. 增加；增大","ex":"She augments her income by teaching piano at weekends.","exZh":"她周末教钢琴来增加收入。","memo":"aug（增大）+ment：一再加大，增加。"},{"en":"automation","ipa":"/ˌɔːtəˈmeɪʃn/","zh":"n. 自动化","ex":"Automation has replaced many routine factory jobs in recent decades.","exZh":"近几十年自动化取代了许多工厂的常规岗位。","memo":"auto（自动）+mation：机器自己转，自动化。"},{"en":"aviation","ipa":"/ˌeɪviˈeɪʃn/","zh":"n. 航空；飞行","ex":"The country has invested heavily in civil aviation.","exZh":"该国在民用航空上投入巨大。","memo":"avi（鸟）+ation：像鸟一样飞的行业，航空。"},{"en":"bachelor","ipa":"/ˈbætʃələ/","zh":"n. 学士；单身汉","ex":"She holds a bachelor degree in environmental science.","exZh":"她拥有环境科学学士学位。","memo":"bach+elor：读完书还单身的学士，单身汉。"},{"en":"ban","ipa":"/bæn/","zh":"v./n. 禁止；禁令","ex":"The city has banned smoking in all public parks.","exZh":"该市已禁止在所有公园吸烟。","memo":"「绊」：一道禁令把你绊住，别想过。"},{"en":"barren","ipa":"/ˈbærən/","zh":"adj. 贫瘠的；不结果实的","ex":"Nothing but rocks and dry sand covers the barren hillside.","exZh":"光秃的山坡上只有石头和干沙。","memo":"「白认」：种啥都不长，白干一场，贫瘠。"},{"en":"batch","ipa":"/bætʃ/","zh":"n. 一批；一组","ex":"The lab tests each new batch of samples carefully.","exZh":"实验室仔细检测每一批新样本。","memo":"「巴适」：一批货齐了才巴适，成批处理。"},{"en":"beam","ipa":"/biːm/","zh":"n. 横梁；光束 v. 微笑","ex":"Sunlight streamed through a narrow beam in the roof.","exZh":"阳光从屋顶一道窄窄的光束中洒进来。","memo":"「必目」：必目（非看不可）那道光束，横梁上笑开颜。"},{"en":"behalf","ipa":"/bɪˈhɑːf/","zh":"n. 代表；利益","ex":"The lawyer spoke on behalf of the local residents.","exZh":"律师代表当地居民发言。","memo":"be+half：替另一半出头，代表利益。"},{"en":"beneficial","ipa":"/ˌbenɪˈfɪʃl/","zh":"adj. 有益的；有好处的","ex":"Regular walking is beneficial to both body and mind.","exZh":"经常散步对身心都有益。","memo":"bene（好）+fic（做）+ial：做出好处，有益。"},{"en":"bewilder","ipa":"/bɪˈwɪldə/","zh":"v. 使迷惑；使不知所措","ex":"The complicated application form bewildered many first-time applicants last year.","exZh":"去年复杂的申请表让许多初次申请者一头雾水。","memo":"be+wilder（荒野）：丢进荒野找不着北，使迷惑。"},{"en":"bid","ipa":"/bɪd/","zh":"v./n. 出价；投标；争取","ex":"Several companies bid for the lucrative construction contract last month.","exZh":"上个月几家公司竞标这份利润丰厚的建筑合同。","memo":"「必得」：出价时心里默念必得，志在必得。"},{"en":"bind","ipa":"/baɪnd/","zh":"v. 捆绑；约束","ex":"The contract binds both parties for three years.","exZh":"该合同对双方有三年的约束力。","memo":"「绑的」：绑在一起的约定，有约束。"},{"en":"blank","ipa":"/blæŋk/","zh":"adj. 空白的；茫然的 n. 空格","ex":"Write your answers in the blanks provided on the form.","exZh":"把答案写在表格给出的空格里。","memo":"「不蓝可」：脑子一片空白，想蓝也蓝不起来。"},{"en":"blast","ipa":"/blɑːst/","zh":"n. 爆炸；一阵强风 v. 爆破","ex":"The blast shattered windows across the street and shook nearby buildings.","exZh":"爆炸震碎了街对面的窗户，附近楼房也为之震动。","memo":"「不拉死他」：不拉警戒线就炸死他，爆破现场。"},{"en":"blaze","ipa":"/bleɪz/","zh":"n. 烈火；光辉 v. 燃烧","ex":"Firefighters battled the blaze for five hours before bringing it under control.","exZh":"消防员与大火搏斗五小时才将其控制。","memo":"「不累的」：火苗蹿得欢，烧得不累，烈火熊熊。"},{"en":"bloom","ipa":"/bluːm/","zh":"n. 花；开花 v. 开花；繁荣","ex":"Cherry trees bloom in early April in this region.","exZh":"这个地区的樱花树在四月初开花。","memo":"b+loom（织机）：织出满树繁花，开花。"},{"en":"boast","ipa":"/bəʊst/","zh":"v. 自夸；以拥有…为荣","ex":"The coastal city boasts three world class museums and a famous aquarium.","exZh":"这座海滨城市拥有三座世界级博物馆和一座著名水族馆，引以为豪。","memo":"「播斯特」：四处播撒自己的好，自夸不停。"},{"en":"bold","ipa":"/bəʊld/","zh":"adj. 大胆的；粗体的","ex":"It was a bold decision to move the factory overseas.","exZh":"把工厂迁往海外是个大胆的决定。","memo":"「薄了的」：脸皮磨薄了的才敢大胆。"},{"en":"bolster","ipa":"/ˈbəʊlstə/","zh":"v. 增强；支撑 n. 长枕","ex":"The new survey data bolstered the team's confidence in the project.","exZh":"新的调查数据增强了团队对项目的信心。","memo":"「保直」：长枕垫着保你挺直，支撑增强。"},{"en":"boom","ipa":"/buːm/","zh":"n. 繁荣；激增 v. 迅速发展","ex":"Online shopping boomed during the past decade, especially after the pandemic.","exZh":"过去十年网购迅速发展，疫情后尤为明显。","memo":"「轰——」：boom 一声爆响，经济轰隆隆繁荣。"},{"en":"bore","ipa":"/bɔː/","zh":"v. 使厌烦 n. 令人厌烦的人","ex":"Long meetings with no clear agenda bore everyone.","exZh":"没有明确议程的冗长会议让所有人都感到厌烦。","memo":"「爆」：无聊到想爆炸，真烦人。"},{"en":"bottleneck","ipa":"/ˈbɒtlnek/","zh":"n. 瓶颈；阻碍","ex":"Poor transport links are the main bottleneck for regional growth.","exZh":"交通不便制约着地区发展的主要瓶颈。","memo":"bottle+neck：瓶口最窄，卡住流量，瓶颈。"},{"en":"bounce","ipa":"/baʊns/","zh":"v. 弹跳；反弹","ex":"The ball bounced twice before hitting the line.","exZh":"球弹跳两次后压在了线上。","memo":"「绑死」：绑在弹簧上，弹个不停。"},{"en":"breach","ipa":"/briːtʃ/","zh":"n./v. 违反；破裂","ex":"Sharing the data was a clear breach of the agreement.","exZh":"分享这些数据明显违反了协议。","memo":"break 的兄弟：把约定破开，违反。"},{"en":"breakdown","ipa":"/ˈbreɪkdaʊn/","zh":"n. 故障；崩溃；细目","ex":"The report gives a breakdown of spending by department.","exZh":"报告按部门细列了开支。","memo":"break+down：一坏就瘫，还能把账拆细。"},{"en":"breathtaking","ipa":"/ˈbreθteɪkɪŋ/","zh":"adj. 惊人的；美得令人屏息的","ex":"The balcony offers a breathtaking view of the valley.","exZh":"从阳台俯瞰山谷，景色美得令人屏息。","memo":"breath（呼吸）+taking：美得把呼吸都拿走。"},{"en":"brief","ipa":"/briːf/","zh":"adj. 简短的 n. 摘要","ex":"The manager gave a brief summary of the quarterly results.","exZh":"经理简要总结了本季度业绩。","memo":"「不宜多」：话不宜多，简短扼要。"},{"en":"broaden","ipa":"/ˈbrɔːdn/","zh":"v. 拓宽；扩大","ex":"Studying abroad can broaden your horizons and improve your language skills.","exZh":"留学能开阔眼界并提升语言能力。","memo":"broad（宽）+en：越弄越宽，拓宽。"},{"en":"bubble","ipa":"/ˈbʌbl/","zh":"n. 泡沫 v. 起泡","ex":"The housing bubble burst and prices fell sharply.","exZh":"房地产泡沫破裂，房价大跌。","memo":"「巴宝」：巴宝一吹全是泡，泡沫易破。"},{"en":"budget","ipa":"/ˈbʌdʒɪt/","zh":"n. 预算 v. 编制预算","ex":"The university cut its travel budget this year.","exZh":"大学今年削减了差旅预算。","memo":"「巴结它」：花钱得巴结着算计它，预算。"},{"en":"bulk","ipa":"/bʌlk/","zh":"n. 体积；大部分","ex":"The bulk of the budget goes to staff salaries.","exZh":"预算的大部分用于员工工资。","memo":"「巴克」：巴克犬块头大，占了大头。"},{"en":"burden","ipa":"/ˈbɜːdn/","zh":"n. 负担 v. 使负重","ex":"High tuition fees place a heavy burden on families.","exZh":"高昂的学费给家庭带来沉重负担。","memo":"「不担」：不想担也得担，重担压肩头。"},{"en":"bureau","ipa":"/ˈbjʊərəʊ/","zh":"n. 局；处；办事处","ex":"The weather bureau issued a storm warning for the entire eastern coast.","exZh":"气象局对整个东海岸发布了风暴警报。","memo":"「不漏」：局里办事滴水不漏，官家衙门。"},{"en":"bypass","ipa":"/ˈbaɪpɑːs/","zh":"v./n. 绕过；旁路","ex":"The new motorway bypasses the crowded town centre.","exZh":"新建高速公路绕开了拥挤的市中心。","memo":"by（旁）+pass（过）：从旁边过，绕行。"},{"en":"backbone","ipa":"/ˈbækbəʊn/","zh":"n. 脊柱；支柱；骨干","ex":"Small businesses are the backbone of the local economy.","exZh":"小微企业是当地经济的支柱。","memo":"back+bone：背上的骨头，顶梁的脊梁。"},{"en":"banner","ipa":"/ˈbænə/","zh":"n. 横幅；旗帜","ex":"Protesters gathered under a huge green banner outside the city hall.","exZh":"抗议者在市政厅外聚集在一面巨大的绿色横幅下。","memo":"「班呢」：全班呢都举着横幅，声势浩大。"},{"en":"bare","ipa":"/beə/","zh":"adj. 赤裸的；光秃的","ex":"The walls were bare except for one old map.","exZh":"墙上光秃秃的，只有一张旧地图。","memo":"「白儿」：白花花啥都没挂，光秃秃。"},{"en":"bargain","ipa":"/ˈbɑːɡən/","zh":"n. 便宜货；交易 v. 讨价还价","ex":"Shoppers hunted for bargains in the January sales.","exZh":"购物者在一月大减价中淘便宜货。","memo":"「八根」：八根萝卜一块钱，砍价砍来的便宜。"},{"en":"benevolent","ipa":"/bəˈnevələnt/","zh":"adj. 仁慈的；善心的","ex":"A benevolent stranger paid for the family's train tickets.","exZh":"一位好心陌生人替这家人付了火车票钱。","memo":"bene（好）+vol（意愿）+ent：存好心，仁慈。"},{"en":"bizarre","ipa":"/bɪˈzɑː/","zh":"adj. 奇异的；怪诞的","ex":"The museum displays bizarre sculptures from around the world.","exZh":"博物馆展出来自世界各地的奇异雕塑。","memo":"「必咋」：看一眼必问咋回事，怪异离奇。"},{"en":"bleak","ipa":"/bliːk/","zh":"adj. 荒凉的；黯淡的","ex":"The forecast offers a bleak outlook for farmers this year.","exZh":"今年的预测让农民前景黯淡。","memo":"「不力克」：寒风吹不克，越吹心越凉，荒凉。"},{"en":"blur","ipa":"/blɜː/","zh":"v. 使模糊 n. 模糊","ex":"Tears blurred her vision as she read the letter.","exZh":"读信时泪水模糊了她的视线。","memo":"「不了」：看不了，眼前一片模糊。"},{"en":"bonus","ipa":"/ˈbəʊnəs/","zh":"n. 奖金；额外的好处","ex":"Employees receive a bonus at the end of the year.","exZh":"员工在年底获得奖金。","memo":"「不留私」：公司赚钱不留私，分红发奖金。"},{"en":"brink","ipa":"/brɪŋk/","zh":"n. 边缘","ex":"The company was on the brink of bankruptcy last year.","exZh":"这家公司去年濒临破产边缘。","memo":"「不饮渴」：渴到不饮水就到极限，崩溃边缘。"},{"en":"brittle","ipa":"/ˈbrɪtl/","zh":"adj. 易碎的；脆弱的","ex":"Old paper becomes brittle over time and cracks very easily.","exZh":"旧纸久而久之变得脆硬，极易开裂。","memo":"「布里头」：掉进布里都硌碎，脆得很。"},{"en":"brutal","ipa":"/ˈbruːtl/","zh":"adj. 残酷的；野蛮的","ex":"The critics gave a brutal review of the play.","exZh":"评论家对这出戏给出了毫不留情的差评。","memo":"bruise（淤青）亲戚：打得青一块紫一块，残酷。"},{"en":"bunch","ipa":"/bʌntʃ/","zh":"n. 束；串；一群","ex":"He handed her a bunch of fresh flowers.","exZh":"他递给她一束鲜花。","memo":"「帮去」：帮人带去一串，成捆成群。"},{"en":"burst","ipa":"/bɜːst/","zh":"v. 爆裂；突然发作 n. 爆发","ex":"W

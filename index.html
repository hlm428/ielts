:"outbreak","ipa":"/ˈaʊtbreɪk/","zh":"n. 爆发；突发","ex":"The outbreak of flu forced several schools to close.","exZh":"流感爆发迫使几所学校停课。","memo":"out+break破口：病破壳而出，爆发。"},{"en":"overcrowded","ipa":"/ˌəʊvəˈkraʊdɪd/","zh":"adj. 过度拥挤的","ex":"The rush hour train was hopelessly overcrowded again today.","exZh":"今天高峰时段的火车又拥挤不堪。","memo":"over超+crowded挤：挤到超标，人满为患。"},{"en":"overcome","ipa":"/ˌəʊvəˈkʌm/","zh":"v. 克服；战胜","ex":"She overcame her fear of public speaking through practice.","exZh":"她通过练习克服了公开演讲的恐惧。","memo":"over翻过+come来：翻山越岭过来，克服。"},{"en":"overdue","ipa":"/ˌəʊvəˈdjuː/","zh":"adj. 逾期的；迟到的","ex":"The library book is already two weeks overdue.","exZh":"这本图书馆的书已经逾期两周了。","memo":"over超+due到期：过了期，逾期。"},{"en":"overflow","ipa":"/ˌəʊvəˈfləʊ/","zh":"v. 溢出；挤满","ex":"The river overflowed after three days of rain.","exZh":"连下三天雨后河水溢出。","memo":"over超+flow流：流冒了头，溢出。"},{"en":"overhaul","ipa":"/ˈəʊvəhɔːl/","zh":"n./v. 彻底检修；全面改革","ex":"The outdated tax system needs a complete overhaul.","exZh":"过时的税收制度需要彻底改革。","memo":"over全+haul拉：全拆开拉出来修，大修。"},{"en":"overlap","ipa":"/ˌəʊvəˈlæp/","zh":"v./n. 重叠；交叠","ex":"The two training schedules overlap on Friday afternoon.","exZh":"两份培训日程在周五下午重叠。","memo":"over搭上+lap叠：搭上去叠一起，重叠。"},{"en":"overlook","ipa":"/ˌəʊvəˈlʊk/","zh":"v. 忽视；俯瞰","ex":"Do not overlook the small print in the contract.","exZh":"不要忽视合同里的小字条款。","memo":"over+look从上看：站太高看漏了，忽视。"},{"en":"overseas","ipa":"/ˌəʊvəˈsiːz/","zh":"adj./adv. 海外的；在海外","ex":"The company exports over half its goods overseas.","exZh":"该公司一半以上的货物出口海外。","memo":"over越过+seas海：漂洋过海，海外。"},{"en":"oversee","ipa":"/ˌəʊvəˈsiː/","zh":"v. 监督；监管","ex":"A special government team oversees the construction quality.","exZh":"一个政府专门团队监督施工质量。","memo":"over在上+see看：在上面盯着，监督。"},{"en":"oversight","ipa":"/ˈəʊvəsaɪt/","zh":"n. 监督；疏忽","ex":"The error was a simple oversight, not a crime.","exZh":"这个错误只是疏忽，并非故意。","memo":"oversee的名词：上头看着，监督；看漏了，疏忽。"},{"en":"overweight","ipa":"/ˌəʊvəˈweɪt/","zh":"adj. 超重的 n. 超重","ex":"Overweight luggage always costs extra at the airport.","exZh":"超重行李在机场总要额外收费。","memo":"over超+weight重：超载的分量，超重。"},{"en":"overtake","ipa":"/ˌəʊvəˈteɪk/","zh":"v. 超过；超越","ex":"Electric cars may overtake petrol cars within a decade.","exZh":"电动汽车可能在十年内超过燃油车。","memo":"over+take抓过头：一把抓过前车，超车。"},{"en":"overtime","ipa":"/ˈəʊvətaɪm/","zh":"n. 加班 adv. 加班地","ex":"The workers claimed extra pay for weekend overtime.","exZh":"工人们为周末加班索要额外报酬。","memo":"over超+time工时：超出工时，加班。"},{"en":"owe","ipa":"/əʊ/","zh":"v. 欠；归功于","ex":"She owes her success to years of hard training.","exZh":"她的成功归功于多年的刻苦训练。","memo":"哦欠：哦一声想起还欠着账，欠。"},{"en":"oxygen","ipa":"/ˈɒksɪdʒən/","zh":"n. 氧气","ex":"Green plants release oxygen during the process of photosynthesis.","exZh":"绿色植物在光合作用过程中释放氧气。","memo":"偶克身：离不开它养身体，氧气。"},{"en":"ozone","ipa":"/ˈəʊzəʊn/","zh":"n. 臭氧","ex":"The ozone layer protects us from harmful radiation.","exZh":"臭氧层保护我们免受有害辐射。","memo":"偶贼呢：天上的防盗贼卫士，臭氧层。"},{"en":"obsession","ipa":"/əbˈseʃn/","zh":"n. 痴迷；念念不忘的事","ex":"His obsession with computer games affected his grades.","exZh":"他对电脑游戏的痴迷影响了成绩。","memo":"ob+sess坐：屁股坐死在一件事上，痴迷。"},{"en":"offend","ipa":"/əˈfend/","zh":"v. 冒犯；得罪","ex":"His thoughtless joke unintentionally offended several guests at dinner.","exZh":"他欠考虑的玩笑无意中冒犯了晚餐上的几位客人。","memo":"off飞+end：话说飞了戳到痛处，冒犯。"},{"en":"offspring","ipa":"/ˈɒfsprɪŋ/","zh":"n. 后代；子女","ex":"Bird pairs often raise several offspring in a single summer.","exZh":"鸟类配偶常在同一个夏季养育数只雏鸟。","memo":"off出来+spring蹦：从窝里蹦出来的小家伙，后代。"},{"en":"outdated","ipa":"/ˌaʊtˈdeɪtɪd/","zh":"adj. 过时的；陈旧的","ex":"The textbook contains outdated statistics from ten years ago.","exZh":"这本教科书收录了十年前的过时数据。","memo":"out+date日期：日子翻篇了，过时。"},{"en":"ownership","ipa":"/ˈəʊnəʃɪp/","zh":"n. 所有权；所有制","ex":"Home ownership remains a dream for many young people.","exZh":"住房所有权仍是许多年轻人的梦想。","memo":"owner主人+ship：当上主人的名分，所有权。"},{"en":"obesity","ipa":"/əʊˈbiːsəti/","zh":"n. 肥胖；肥胖症","ex":"Schools are fighting child obesity with healthier menus.","exZh":"学校用更健康的菜单对抗儿童肥胖。","memo":"obese的名词：胖到登峰造极，肥胖症。"},{"en":"occurrence","ipa":"/əˈkʌrəns/","zh":"n. 发生；出现的事件","ex":"Power cuts are a frequent occurrence in the village.","exZh":"停电在村里是常有的事。","memo":"occur发生+rence：发生了的事，事件。"},{"en":"pace","ipa":"/peɪs/","zh":"n. 速度；步伐 v. 踱步","ex":"The pace of technological change has accelerated in recent decades.","exZh":"近几十年来技术变革的速度不断加快。","memo":"「陪死」：陪你跑到死也追不上，这就是步伐与速度。"},{"en":"panel","ipa":"/ˈpænl/","zh":"n. 专家小组；镶板","ex":"A panel of independent experts will review the research findings.","exZh":"一个独立专家小组将评审这项研究成果。","memo":"「陪愣」：一排人陪坐打分，就是评审专家小组。"},{"en":"partial","ipa":"/ˈpɑːʃl/","zh":"adj. 部分的；偏袒的","ex":"The report offered only a partial explanation for the delay.","exZh":"这份报告只对延误作了部分解释。","memo":"part+ial：只讲一部分，还偏心不全说。"},{"en":"participate","ipa":"/pɑːˈtɪsɪpeɪt/","zh":"v. 参加；参与","ex":"All employees are encouraged to participate in the training programme.","exZh":"鼓励全体员工参加培训项目。","memo":"「怕踢死陪他」：怕输也陪他踢到底，参与精神满分。"},{"en":"particle","ipa":"/ˈpɑːtɪkl/","zh":"n. 粒子；微粒","ex":"Tiny particles of dust can seriously damage delicate electronic equipment.","exZh":"微小的尘埃颗粒会严重损坏精密电子设备。","memo":"part+icle 小东西：整体里的一小粒，微粒。"},{"en":"partner","ipa":"/ˈpɑːtnə/","zh":"n. 伙伴；合伙人；舞伴","ex":"She is my business partner as well as my closest friend.","exZh":"她既是我的生意伙伴，也是我最好的朋友。","memo":"part+ner：分一部分活给你的人，就是搭档。"},{"en":"passage","ipa":"/ˈpæsɪdʒ/","zh":"n. 段落；通道；通过","ex":"Read the passage carefully before you answer the questions below.","exZh":"回答下面的问题前，请仔细阅读这段文章。","memo":"pass+age：走过一段路，就成一节段落。"},{"en":"passive","ipa":"/ˈpæsɪv/","zh":"adj. 被动的；消极的","ex":"Doctors warn that passive smoking also harms people's health.","exZh":"医生警告说被动吸烟同样危害健康。","memo":"「怕媳妇」：怕媳妇的人只能被动挨训，消极挨着。"},{"en":"patent","ipa":"/ˈpeɪtnt/","zh":"n. 专利 adj. 明显的","ex":"The company patented its new battery technology last year.","exZh":"这家公司去年为新电池技术申请了专利。","memo":"「拍疼他」：偷抄专利，拍到你手疼也是白搭。"},{"en":"patience","ipa":"/ˈpeɪʃns/","zh":"n. 耐心；忍耐","ex":"Teaching young children requires patience, energy and a sense of humour.","exZh":"教小孩子需要耐心、精力还有幽默感。","memo":"「陪心死」：陪到心累还得撑住，全靠耐心。"},{"en":"pattern","ipa":"/ˈpætn/","zh":"n. 模式；图案；规律","ex":"Scientists have noticed a clear change in global weather patterns.","exZh":"科学家注意到全球天气模式有明显变化。","memo":"「怕疼」：怕疼就按老规律办事，模式一成不变。"},{"en":"pave","ipa":"/peɪv/","zh":"v. 铺（路）；为…创造条件","ex":"The scholarship paved the way for her career in medicine.","exZh":"奖学金为她从医之路铺平了道路。","memo":"「配物」：路上提前配好物，铺平道路好前进。"},{"en":"payment","ipa":"/ˈpeɪmənt/","zh":"n. 付款；支付额","ex":"Monthly payments can now be made by credit card or app.","exZh":"现在可以按月用信用卡或手机应用付款。","memo":"pay 的名词：付钱这一下，就叫付款。"},{"en":"peak","ipa":"/piːk/","zh":"n. 山峰；顶峰 adj. 高峰的","ex":"Traffic reaches its peak between eight and nine every morning.","exZh":"每天早上八点到九点交通达到高峰。","memo":"「皮克」：皮克爬山爬到最高峰，一览众山小。"},{"en":"peer","ipa":"/pɪə/","zh":"n. 同龄人；同辈 v. 凝视","ex":"Teenagers are strongly influenced by the opinions of their peer group.","exZh":"青少年极易受到同龄人看法的影响。","memo":"「皮儿」：一群皮儿的同龄人凑一块，互相较劲。"},{"en":"penalty","ipa":"/ˈpenəlti/","zh":"n. 处罚；罚款；点球","ex":"The penalty for late submission is a lower final mark.","exZh":"迟交的处罚是最终成绩被扣分。","memo":"「赔那里」：罚的钱都从那里赔，处罚跑不了。"},{"en":"pension","ipa":"/ˈpenʃn/","zh":"n. 养老金；抚恤金","ex":"Many retired people rely mainly on a state pension.","exZh":"许多退休老人主要靠国家养老金生活。","memo":"「盼薪」：老了就盼这份薪，养老金按时到账。"},{"en":"perception","ipa":"/pəˈsepʃn/","zh":"n. 感知；看法；认识","ex":"Public perception of genetically modified food has changed over time.","exZh":"公众对转基因食品的看法随时间发生了变化。","memo":"perceive 的名词：感知到的东西，慢慢成了看法。"},{"en":"permanent","ipa":"/ˈpɜːmənənt/","zh":"adj. 永久的；固定的","ex":"After two years of contracts, she finally found a permanent job.","exZh":"做了两年合同工后，她终于找到一份固定工作。","memo":"「婆婆能的」：婆婆能一直住下的，才是永久户口。"},{"en":"permit","ipa":"/pəˈmɪt/","zh":"v. 允许 n. 许可证","ex":"Photography is not permitted inside the museum galleries.","exZh":"博物馆展厅内不允许拍照。","memo":"「怕没它」：没许可证就发怵，进门全靠它。"},{"en":"perspective","ipa":"/pəˈspektɪv/","zh":"n. 视角；观点；透视","ex":"Studying abroad gave her a completely new perspective on education.","exZh":"留学让她对教育有了全新的视角。","memo":"per（每）+spect（看）：每人看的角度不同，观点各异。"},{"en":"persuade","ipa":"/pəˈsweɪd/","zh":"v. 说服；使相信","ex":"She persuaded her parents to let her study overseas.","exZh":"她说服父母同意她出国留学。","memo":"「破水的」：嘴皮磨破如水滴石穿，才能说服人。"},{"en":"phase","ipa":"/feɪz/","zh":"n. 阶段；时期","ex":"The construction project will enter its final phase next month.","exZh":"该建设项目下个月将进入最后阶段。","memo":"「费时」：每个阶段都费时费力，一步步来。"},{"en":"philosophy","ipa":"/fəˈlɒsəfi/","zh":"n. 哲学；理念；人生观","ex":"Her teaching philosophy puts students' needs at the centre.","exZh":"她的教学理念以学生需求为核心。","memo":"「飞楼烧费」：哲学家飞楼上烧脑费神，琢磨人生。"},{"en":"pioneer","ipa":"/ˌpaɪəˈnɪə/","zh":"n. 先驱；开拓者 v. 开创","ex":"She was a pioneer of renewable energy research in the region.","exZh":"她是该地区可再生能源研究的先驱。","memo":"「派俺呢」：派俺去开荒，俺就是先锋。"},{"en":"plague","ipa":"/pleɪɡ/","zh":"n. 瘟疫；灾害 v. 困扰","ex":"The coastal town has been plagued by flooding for decades.","exZh":"几十年来这座海滨小镇一直受洪灾困扰。","memo":"「扑累过」：瘟疫扑来，日子苦累难过，困扰不断。"},{"en":"plateau","ipa":"/ˈplætəʊ/","zh":"n. 高原；停滞期","ex":"House prices reached a plateau after two years of rapid growth.","exZh":"房价在快速上涨两年后进入停滞期。","memo":"「普拉托」：高原平得像托盘，业绩也躺平不动。"},{"en":"plausible","ipa":"/ˈplɔːzəbl/","zh":"adj. 貌似有理的；可信的","ex":"His explanation sounded plausible, but the evidence did not support it.","exZh":"他的解释听起来有理，但证据并不支持。","memo":"「不老实宝」：话说得圆，人却不老实，将信将疑。"},{"en":"pledge","ipa":"/pledʒ/","zh":"n./v. 保证；誓言；承诺","ex":"The government pledged to cut carbon emissions by forty percent.","exZh":"政府承诺将碳排放削减四成。","memo":"「泼来巨」：泼出去的话像巨石，承诺收不回。"},{"en":"plot","ipa":"/plɒt/","zh":"n. 情节；阴谋；地块 v. 密谋","ex":"The plot of the novel centres on a family secret.","exZh":"这部小说的情节围绕一个家族秘密展开。","memo":"「泼了它」：墨一泼情节全乱，还藏着阴谋。"},{"en":"plunge","ipa":"/plʌndʒ/","zh":"v. （价格）暴跌；跳入 n. 猛跌","ex":"Share prices plunged sharply after the disappointing financial results.","exZh":"令人失望的财报公布后，股价大幅暴跌。","memo":"「扑烂机」：一头扑进水里机器摔烂，暴跌跳水。"},{"en":"poll","ipa":"/pəʊl/","zh":"n. 民意测验；投票 v. 做民调","ex":"The latest opinion poll shows growing support for the new policy.","exZh":"最新民意调查显示对新政策的支持度上升。","memo":"「泼哦」：上街泼问卷收意见，就是做民调。"},{"en":"pollute","ipa":"/pəˈluːt/","zh":"v. 污染","ex":"Factories that pollute the river face heavy fines under the new law.","exZh":"根据新法律，污染河流的工厂将面临巨额罚款。","memo":"「泼漏他」：脏水泼得满河漏，污染没跑了。"},{"en":"portion","ipa":"/ˈpɔːʃn/","zh":"n. 一部分；（食物）一份","ex":"A large portion of the city budget goes to public transport.","exZh":"城市预算的很大一部分用于公共交通。","memo":"proportion 的兄弟：切好分出的一份，部分。"},{"en":"pose","ipa":"/pəʊz/","zh":"v. 造成；提出 n. 姿势","ex":"Rising sea levels pose a serious threat to coastal communities.","exZh":"海平面上升对沿海社区构成严重威胁。","memo":"「剖自」：剖开问题自己摆姿势，造成威胁。"},{"en":"positive","ipa":"/ˈpɒzətɪv/","zh":"adj. 积极的；确定的；正的","ex":"Regular exercise has a positive effect on both body and mind.","exZh":"经常锻炼对身心都有积极作用。","memo":"「泡在她」：天天泡在爱里，心态积极向上。"},{"en":"possess","ipa":"/pəˈzes/","zh":"v. 拥有；具有","ex":"Successful managers possess strong communication and problem-solving skills.","exZh":"成功的管理者拥有出色的沟通和解决问题的能力。","memo":"「跑这四」：跑遍这四洲都算我的，拥有无数。"},{"en":"poverty","ipa":"/ˈpɒvəti/","zh":"n. 贫穷；贫困","ex":"Millions of children around the world still live in extreme poverty.","exZh":"全世界仍有数百万儿童生活在极度贫困中。","memo":"「泼屋贴」：屋漏又逢雨，穷得连瓦都贴不上。"},{"en":"practical","ipa":"/ˈpræktɪkl/","zh":"adj. 实际的；实用的","ex":"The course gives students practical experience before they graduate.","exZh":"这门课程让学生在毕业前获得实践经验。","memo":"practice 的形容词：能上手练的，实用。"},{"en":"praise","ipa":"/preɪz/","zh":"n./v. 赞扬；表扬","ex":"The new library won high praise from local residents.","exZh":"新图书馆赢得当地居民的高度赞扬。","memo":"「扑锐子」：夸奖扑面而来，锐子乐开花。"},{"en":"precious","ipa":"/ˈpreʃəs/","zh":"adj. 珍贵的；宝贵的","ex":"Clean water is a precious resource in many desert regions.","exZh":"在许多沙漠地区，清洁的水是珍贵资源。","memo":"「扑热心」：珍贵的东西，值得扑上热心守护。"},{"en":"precise","ipa":"/prɪˈsaɪs/","zh":"adj. 精确的；确切的","ex":"Engineers need precise measurements before cutting any materials.","exZh":"工程师在切割材料前需要精确的测量。","memo":"「普锐四」：误差小到小数点后四位，真精确。"},{"en":"predict","ipa":"/prɪˈdɪkt/","zh":"v. 预言；预测","ex":"It is difficult to predict how consumers will react to the price rise.","exZh":"很难预测消费者对涨价会有什么反应。","memo":"pre（提前）+dict（说）：提前说出结果，预测。"},{"en":"pregnant","ipa":"/ˈpreɡnənt/","zh":"adj. 怀孕的；充满的","ex":"Pregnant women are advised to avoid certain types of cheese.","exZh":"建议孕妇避免食用某些种类的奶酪。","memo":"「扑瑞哥难的」：怀上孩子跑不动，好难的幸福。"},{"en":"prejudice","ipa":"/ˈpredʒudɪs/","zh":"n. 偏见；歧视","ex":"The law aims to protect workers from discrimination and prejudice.","exZh":"该法律旨在保护工人免受歧视和偏见。","memo":"pre（预先）+judice（判断）：没了解先下判断，偏见。"},{"en":"preserve","ipa":"/prɪˈzɜːv/","zh":"v. 保护；保存；保鲜","ex":"The society raises money to preserve historic buildings downtown.","exZh":"该协会筹款保护市中心的古老建筑。","memo":"pre（提前）+serve（保存）：提前存好，保护起来。"},{"en":"prestige","ipa":"/preˈstiːʒ/","zh":"n. 声望；威信","ex":"The university enjoys great prestige in the field of medicine.","exZh":"这所大学在医学领域享有盛誉。","memo":"「普锐斯提职」：开普锐斯又提职，声望倍增有面子。"},{"en":"presume","ipa":"/prɪˈzjuːm/","zh":"v. 推测；假定","ex":"I presume you have already read the consultant's report.","exZh":"我想你大概已经读过顾问的报告了。","memo":"「扑一句目」：只瞄一眼目录就下推测，纯属假定。"},{"en":"prevent","ipa":"/prɪˈvent/","zh":"v. 阻止；预防","ex":"Regular exercise and a good diet can help prevent heart disease.","exZh":"经常锻炼和良好饮食有助于预防心脏病。","memo":"pre（提前）+vent（来）：提前拦住别过来，预防。"},{"en":"previous","ipa":"/ˈpriːviəs/","zh":"adj. 以前的；先前的","ex":"Applicants should list all their previous work experience on the form.","exZh":"申请者应在表格上列出以往的全部工作经历。","memo":"pre（前）+vi（路）：走在前面的路，以前的。"},{"en":"prey","ipa":"/preɪ/","zh":"n. 猎物；受害者 v. 捕食","ex":"Owls hunt small prey such as mice and insects at night.","exZh":"猫头鹰夜间捕食老鼠、昆虫等小猎物。","memo":"「扑累」：猎物被扑个正着，累到没命跑。"},{"en":"prime","ipa":"/praɪm/","zh":"adj. 首要的；最好的 n. 全盛时期","ex":"She retired at the prime of her professional career.","exZh":"她在职业生涯的巅峰期退休了。","memo":"「扑来无」：机会扑来无穷尽，正是全盛期。"},{"en":"primitive","ipa":"/ˈprɪmətɪv/","zh":"adj. 原始的；简陋的","ex":"Primitive humans made simple tools from stone and animal bones.","exZh":"原始人类用石头和兽骨制作简单工具。","memo":"prime 的老祖宗：最早期最原始的样子。"},{"en":"principal","ipa":"/ˈprɪnsəpl/","zh":"adj. 主要的 n. 校长；本金","ex":"The principal reason for the delay was the unusually heavy rain.","exZh":"延误的主要原因是罕见的暴雨。","memo":"princi（首要）+pal：学校一把手，就是校长。"},{"en":"principle","ipa":"/ˈprɪnsəpl/","zh":"n. 原则；原理","ex":"He refuses to accept bribes as a matter of personal principle.","exZh":"出于个人原则，他拒绝收受贿赂。","memo":"principal 兄弟：le 管原则，pal 当校长。"},{"en":"prior","ipa":"/ˈpraɪə/","zh":"adj. 先前的；优先的","ex":"No prior experience is required for this training course.","exZh":"这门培训课程不要求有先前经验。","memo":"「扑来呀」：排前面的先扑过来，优先处理。"},{"en":"priority","ipa":"/praɪˈɒrəti/","zh":"n. 优先事项；优先权","ex":"Reducing traffic congestion is a top priority for the city council.","exZh":"缓解交通拥堵是市议会的头等大事。","memo":"prior 的名词：排在最前面的，优先事项。"},{"en":"privacy","ipa":"/ˈprɪvəsi/","zh":"n. 隐私；私事","ex":"Many employees worry about privacy when companies monitor emails.","exZh":"公司监控电子邮件时，许多员工担心隐私问题。","memo":"private 的名词：私有的小地盘，隐私。"},{"en":"procedure","ipa":"/prəˈsiːdʒə/","zh":"n. 程序；手续；步骤","ex":"Please follow the standard procedure before operating the machinery.","exZh":"操作机器前请遵循标准流程。","memo":"pro+ceed（走）：按步子走流程，手续齐备。"},{"en":"process","ipa":"/ˈprəʊses/","zh":"n. 过程；流程 v. 加工；处理","ex":"Learning a foreign language is a slow and gradual process.","exZh":"学外语是一个缓慢渐进的过程。","memo":"pro+cess（走）：一步一步走完的，过程。"},{"en":"profile","ipa":"/ˈprəʊfaɪl/","zh":"n. 简介；侧面；轮廓","ex":"Update your online profile before applying for the internship.","exZh":"申请实习前请先更新你的网络个人简介。","memo":"pro+file（文件）：亮出文件，个人简介登场。"},{"en":"profit","ipa":"/ˈprɒfɪt/","zh":"n. 利润；收益 v. 获利","ex":"The company donated half of its annual profits to charity.","exZh":"这家公司把年度利润的一半捐给了慈善机构。","memo":"「扑捞否」：捞了一票，问否赚钱，利润到手。"},{"en":"prominent","ipa":"/ˈprɒmɪnənt/","zh":"adj. 突出的；显要的；著名的","ex":"She is a prominent researcher in the field of climate science.","exZh":"她是气候科学领域一位杰出的研究者。","memo":"「扑罗明嫩」：罗列分明亮眼夺目，突出显要。"},{"en":"promote","ipa":"/prəˈməʊt/","zh":"v. 促进；推销；晋升","ex":"The government launched a campaign to promote healthy eating habits.","exZh":"政府发起了一场推广健康饮食习惯的运动。","memo":"pro（向前）+mote（动）：往前推动，促进提拔。"},{"en":"prompt","ipa":"/prɒmpt/","zh":"v. 促使；提示 adj. 迅速的","ex":"The oil spill prompted an urgent review of safety regulations.","exZh":"漏油事故促使人们紧急审视安全法规。","memo":"「扑罗铺」：铺好路催你走，促使又及时。"},{"en":"pronounce","ipa":"/prəˈnaʊns/","zh":"v. 发音；宣布","ex":"Many learners find long English words hard to pronounce correctly.","exZh":"许多学习者觉得长英语单词很难正确发音。","memo":"pro（公开）+nounce（说）：公开说出来，发音宣布。"},{"en":"proof","ipa":"/pruːf/","zh":"n. 证据；证明","ex":"Do you have any proof of purchase for the refund?","exZh":"你有购买凭证可以退款吗？","memo":"prove 的名词：能证明的东西，证据。"},{"en":"proper","ipa":"/ˈprɒpə/","zh":"adj. 恰当的；正确的","ex":"Visitors must wear proper footwear on the construction site.","exZh":"参观者在工地上必须穿合适的鞋。","memo":"property 的亲戚：属于自己的那份，得体合适。"},{"en":"property","ipa":"/ˈprɒpəti/","zh":"n. 财产；房产；性质","ex":"Rising prices have made property unaffordable for many young families.","exZh":"不断上涨的房价让许多年轻家庭买不起房产。","memo":"proper（自己的）+ty：自己名下的，财产。"},{"en":"propose","ipa":"/prəˈpəʊz/","zh":"v. 提议；打算；求婚","ex":"The committee proposed several changes to the original plan.","exZh":"委员会对原方案提出了几处修改建议。","memo":"pro（向前）+pose（放）：把方案放到台前，提议。"},{"en":"protest","ipa":"/ˈprəʊtest/","zh":"n./v. 抗议；反对","ex":"Students held a protest against the increase in tuition fees.","exZh":"学生举行抗议，反对学费上涨。","memo":"pro（向前）+test（证）：站出来表态作证，抗议。"},{"en":"protocol","ipa":"/ˈprəʊtəkɒl/","zh":"n. 规程；协议；礼仪","ex":"The laboratory follows a strict protocol when handling blood samples.","exZh":"实验室在处理血样时遵循严格的规程。","memo":"「普罗透口」：透过规程开口办事，一切按协议来。"},{"en":"provide","ipa":"/prəˈvaɪd/","zh":"v. 提供；供给","ex":"The hotel provides free breakfast for all its guests.","exZh":"酒店为所有客人提供免费早餐。","memo":"pro（预先）+vide（看）：提前看你要啥，提供。"},{"en":"publish","ipa":"/ˈpʌblɪʃ/","zh":"v. 出版；发表；公布","ex":"The findings were published in a leading international science journal.","exZh":"研究结果发表在一家国际顶级科学期刊上。","memo":"public 的动词：面向公众发布，出版发表。"},{"en":"purchase","ipa":"/ˈpɜːtʃəs/","zh":"v./n. 购买；采购","ex":"Tickets can be purchased online or at the station office.","exZh":"车票可以在网上或车站售票处购买。","memo":"「珀恰似」：花钱恰似流水，购买要理性。"},{"en":"pitch","ipa":"/pɪtʃ/","zh":"n. 球场；推销话术；音高 v. 投掷","ex":"He gave a short pitch to attract investors to the startup.","exZh":"他做了一个简短的推介以吸引投资人关注这家初创公司。","memo":"「批扯」：上台批扯一番，pitch 就是推销话术。"},{"en":"platform","ipa":"/ˈplætfɔːm/","zh":"n. 站台；平台；政纲","ex":"The online platform allows students to submit homework digitally.","exZh":"这个在线平台允许学生以电子方式提交作业。","memo":"plat（平）+form（形）：平平一块，站台又当平台。"},{"en":"polish","ipa":"/ˈpɒlɪʃ/","zh":"v. 擦亮；润色 n. 上光剂","ex":"Spend a few minutes polishing your essay before you submit it.","exZh":"提交作文前花几分钟润色一下。","memo":"「泼利益」：擦亮皮鞋泼点油，文章润色更亮眼。"},{"en":"portable","ipa":"/ˈpɔːtəbl/","zh":"adj. 便携的；手提式的","ex":"Portable devices such as tablets are popular among commuters.","exZh":"平板电脑等便携设备深受通勤族欢迎。","memo":"port（携带）+able：能带着走的，便携。"},{"en":"plentiful","ipa":"/ˈplentɪfl/","zh":"adj. 丰富的；充足的","ex":"Fresh seafood is plentiful and cheap in this coastal town.","exZh":"在这座海滨小镇，新鲜海产丰富又便宜。","memo":"plenty 的形容词：多到用不完，丰富充足。"},{"en":"qualify","ipa":"/ˈkwɒlɪfaɪ/","zh":"v. 使合格；取得资格","ex":"She qualified as a nurse after three years of intensive training.","exZh":"经过三年高强度训练，她取得了护士资格。","memo":"quality 的动词：够质量才够格。"},{"en":"qualitative","ipa":"/ˈkwɒlɪtətɪv/","zh":"adj. 质性的；定性的","ex":"The study combines qualitative interviews with quantitative survey data.","exZh":"该研究将定性访谈与定量调查数据相结合。","memo":"quality 家族：讲质量的叫定性研究。"},{"en":"quantity","ipa":"/ˈkwɒntəti/","zh":"n. 数量；量","ex":"The factory produces large quantities of packaging every month.","exZh":"这家工厂每月生产大量包装材料。","memo":"quality 双胞胎：管质，管量。"},{"en":"queue","ipa":"/kjuː/","zh":"n. 队列 v. 排队","ex":"We had to queue for over an hour outside the museum.","exZh":"我们在博物馆外排了一个多小时的队。","memo":"字母 Q 自己就排着队，读音「卡油」加塞可不行。"},{"en":"quote","ipa":"/kwəʊt/","zh":"v. 引用；报价 n. 引文","ex":"He quoted a famous scientist to support his argument.","exZh":"他引用了一位著名科学家的话来支持自己的论点。","memo":"「阔特」：阔气的特别引用，报价也要引用单据。"},{"en":"quit","ipa":"/kwɪt/","zh":"v. 放弃；辞职；戒掉","ex":"He quit smoking last year and now feels much healthier.","exZh":"他去年戒了烟，现在感觉健康多了。","memo":"「亏的」：亏的买卖，干脆辞职退出不干。"},{"en":"quiver","ipa":"/ˈkwɪvə/","zh":"v./n. 颤抖；发抖","ex":"Her voice quivered slightly as she began her farewell speech.","exZh":"开始告别演讲时，她的声音微微颤抖。","memo":"「亏我」：吓得亏我腿直打颤，声音发抖。"},{"en":"query","ipa":"/ˈkwɪəri/","zh":"n. 疑问；查询 v. 质疑","ex":"If you have any queries about the form, contact the office.","exZh":"如果对表格有任何疑问，请联系办公室。","memo":"question 的弟弟：短小疑问，随口查询。"},{"en":"quest","ipa":"/kwest/","zh":"n. 探索；追求","ex":"The documentary follows her quest to find a rare orchid.","exZh":"这部纪录片记录了她寻找稀有兰花的探索之旅。","memo":"question 掐头去尾：一路追问，探索不止。"},{"en":"race","ipa":"/reɪs/","zh":"n. 比赛；种族 v. 竞速","ex":"She won the race and broke the national record.","exZh":"她赢得了比赛并打破了全国纪录。","memo":"「锐死」：锐气死磕到底，比赛冲第一。"},{"en":"random","ipa":"/ˈrændəm/","zh":"adj. 随机的；任意的","ex":"The researchers selected participants at random from the electoral register.","exZh":"研究人员从选民登记册中随机抽取参与者。","memo":"「难的」：随机抽到难的题，全凭运气。"},{"en":"range","ipa":"/reɪndʒ/","zh":"n. 范围；一系列；山脉","ex":"The supermarket stocks a wide range of organic products.","exZh":"这家超市备有种类繁多的有机产品。","memo":"「软句」：软文句子从短到长都有，范围好宽。"},{"en":"rank","ipa":"/ræŋk/","zh":"n. 等级；排名 v. 位列","ex":"The university ranks among the top ten in the world.","exZh":"这所大学位列世界前十。","memo":"「软刻」：名次刻在软榜上，排名一目了然。"},{"en":"rapid","ipa":"/ˈræpɪd/","zh":"adj. 快速的；迅猛的","ex":"The city experienced rapid growth in population after 1990.","exZh":"1990年后这座城市人口快速增长。","memo":"「若劈的」：快得像被闪电劈了一样，飞快。"},{"en":"rare","ipa":"/reə/","zh":"adj. 稀有的；罕见的","ex":"It is extremely rare to see snow in this southern region.","exZh":"在这个南方地区，下雪是极其罕见的。","memo":"「瑞儿」：瑞雪都稀罕，少见才显珍贵。"},{"en":"ratify","ipa":"/ˈrætɪfaɪ/","zh":"v. 正式批准；签署认可","ex":"Parliament voted to ratify the international trade agreement.","exZh":"议会投票正式批准了国际贸易协定。","memo":"rat（盖章按鼠印）+ify：白纸黑字，正式批准。"},{"en":"ratio","ipa":"/ˈreɪʃiəʊ/","zh":"n. 比率；比例","ex":"The ratio of students to teachers has improved significantly.","exZh":"师生比例已显著改善。","memo":"rational 的根：先有比率，才好理性计算。"},{"en":"raw","ipa":"/rɔː/","zh":"adj. 生的；未加工的；原始的","ex":"Raw vegetables often retain more vitamins than cooked ones.","exZh":"生蔬菜往往比煮熟的保留更多维生素。","memo":"「柔啊」：生肉没煮，摸上去柔啊——raw meat 生肉，raw data 原始数据，都是没加工的。"},{"en":"react","ipa":"/riˈækt/","zh":"v. 反应；回应","ex":"The audience reacted warmly to the young pianist's performance.","exZh":"观众对年轻钢琴家的演奏反应热烈。","memo":"re（回）+act（动）：给个动作回应，反应。"},{"en":"readily","ipa":"/ˈredɪli/","zh":"adv. 容易地；乐意地","ex":"Detailed information about the course is readily available online.","exZh":"课程的详细信息很容易在网上查到。","memo":"ready 的副词：随时备好，乐意又轻松。"},{"en":"realistic","ipa":"/ˌrɪəˈlɪstɪk/","zh":"adj. 现实的；逼真的","ex":"We need a realistic budget before the project can start.","exZh":"项目启动前，我们需要一个切合实际的预算。","memo":"real+istic：像真的一样，现实派。"},{"en":"reality","ipa":"/riˈæləti/","zh":"n. 现实；实际","ex":"The harsh reality is that most new businesses fail quickly.","exZh":"残酷的现实是大多数新企业很快倒闭。","memo":"real 的名词：真实存在，即现实。"},{"en":"realize","ipa":"/ˈriːəlaɪz/","zh":"v. 意识到；实现","ex":"She did not realize the deadline had been brought forward.","exZh":"她没有意识到截止日期已经提前了。","memo":"real+ize：把梦变成真的，实现。"},{"en":"realm","ipa":"/relm/","zh":"n. 领域；王国","ex":"The discovery opened up a whole new realm of medical research.","exZh":"这一发现开辟了医学研究的全新领域。","memo":"real+m：真实的地盘，专属领域。"},{"en":"recall","ipa":"/rɪˈkɔːl/","zh":"v. 回想起；召回","ex":"I cannot recall where I left my keys yesterday.","exZh":"我想不起昨天把钥匙落在哪里了。","memo":"re（回）+call（唤）：把记忆唤回来，回忆。"},{"en":"receipt","ipa":"/rɪˈsiːt/","zh":"n. 收据；收到","ex":"Please keep the receipt in case you need a refund later.","exZh":"请保留收据，以备日后需要退款。","memo":"receive 的表亲：收到货，拿收据。"},{"en":"recover","ipa":"/rɪˈkʌvə/","zh":"v. 恢复；康复；找回","ex":"It took several weeks for the economy to recover from the crisis.","exZh":"经济用了好几周才从危机中恢复过来。","memo":"re（再）+cover（盖）：重新盖好，恢复如初。"},{"en":"recruit","ipa":"/rɪˈkruːt/","zh":"v. 招聘；招募 n. 新成员","ex":"The firm plans to recruit fifty new graduates this autumn.","exZh":"公司计划今年秋天招聘五十名新毕业生。","memo":"re（再）+cruit（生长）：再长新人，招募新兵。"},{"en":"recycle","ipa":"/ˌriːˈsaɪkl/","zh":"v. 回收；再利用","ex":"Household waste should be sorted carefully for recycling.","exZh":"家庭垃圾应仔细分类以便回收利用。","memo":"re（再）+cycle（循环）：绕一圈再用，回收。"},{"en":"reduce","ipa":"/rɪˈdjuːs/","zh":"v. 减少；降低","ex":"Cycling to work can reduce your carbon footprint considerably.","exZh":"骑车上班能大幅减少你的碳足迹。","memo":"re（往回）+duce（引）：往回引，减少。"},{"en":"redundant","ipa":"/rɪˈdʌndənt/","zh":"adj. 被裁员的；多余的","ex":"The new software made hundreds of office workers redundant.","exZh":"新软件使数百名办公室职员被裁员。","memo":"「锐当等」：本事锐不上了，只当等通知被裁。"},{"en":"refer","ipa":"/rɪˈfɜː/","zh":"v. 提到；查阅；转介","ex":"Please refer to chapter five for a full explanation.","exZh":"完整解释请参阅第五章。","memo":"re（回）+fer（带）：带着问题回去查，参考。"},{"en":"reflect","ipa":"/rɪˈflekt/","zh":"v. 反射；反映；反思","ex":"The survey results reflect the views of ordinary consumers.","exZh":"调查结果反映了普通消费者的看法。","memo":"re（回）+flect（弯）：光弯回来，反射又反思。"},{"en":"reform","ipa":"/rɪˈfɔːm/","zh":"n./v. 改革；改良","ex":"The government promised to carry out far-reaching education reform.","exZh":"政府承诺推行影响深远的教育改革。","memo":"re（再）+form（形）：重新塑形，改革。"},{"en":"refrain","ipa":"/rɪˈfreɪn/","zh":"v. 克制；避免","ex":"Passengers are asked to refrain from smoking throughout the flight.","exZh":"请乘客在全程飞行中不要吸烟。","memo":"re（回）+rein（缰绳）：勒回缰绳，忍住别做。"},{"en":"refuge","ipa":"/ˈrefjuːdʒ/","zh":"n. 避难所；庇护","ex":"Villagers took refuge in the school during the severe storm.","exZh":"暴风雨期间，村民们在学堂里避难。","memo":"「瑞福居」：有福可居的地方，避难之家。"},{"en":"refund","ipa":"/ˈriːfʌnd/","zh":"n. 退款 v. 退还","ex":"The airline offered a full refund for all cancelled flights.","exZh":"航空公司为所有取消的航班全额退款。","memo":"re（回）+fund（资金）：钱原路回来，退款。"},{"en":"regime","ipa":"/reɪˈʒiːm/","zh":"n. 政权；制度","ex":"The old regime collapsed after months of street protests.","exZh":"街头抗议数月后，旧政权垮台了。","memo":"「锐政目」：锐意统治的政权，盯着目标不放。"},{"en":"register","ipa":"/ˈredʒɪstə/","zh":"v. 登记；注册 n. 登记簿","ex":"New students must register for courses before Friday afternoon.","exZh":"新生必须在周五下午前完成选课注册。","memo":"re+gist（记）：记上一笔，注册登记。"},{"en":"regret","ipa":"/rɪˈɡret/","zh":"n./v. 后悔；遗憾","ex":"She expressed deep regret over the missed opportunity.","exZh":"她对错失的机会深表遗憾。","memo":"re（回）+gret（哭）：回想起来想哭，后悔。"},{"en":"reject","ipa":"/rɪˈdʒekt/","zh":"v. 拒绝；否决","ex":"The journal rejected the article without sending it for review.","exZh":"期刊直接拒绝了这篇文章，未送外审。","memo":"re（回）+ject（扔）：把稿扔回来，拒稿。"},{"en":"relate","ipa":"/rɪˈleɪt/","zh":"v. 有关；叙述；认同","ex":"The lecture relates climate change directly to everyday life.","exZh":"这场讲座把气候变化与日常生活直接联系起来。","memo":"re（回）+late（带）：把话带回关联处，相关。"},{"en":"release","ipa":"/rɪˈliːs/","zh":"v. 释放；发布 n. 发布","ex":"The company will release its financial results next Tuesday.","exZh":"公司将于下周二发布财务业绩。","memo":"re（松）+lease（租约）：松开手，释放发布。"},{"en":"relevant","ipa":"/ˈreləvənt/","zh":"adj. 相关的；切题的","ex":"Include only relevant information in your introduction paragraph.","exZh":"引言段落中只写相关的内容。","memo":"「瑞来稳的」：稳稳对题的资料，相关性拉满。"},{"en":"reliable","ipa":"/rɪˈlaɪəbl/","zh":"adj. 可靠的；可信的","ex":"Scientists need reliable data before they can draw conclusions.","exZh":"科学家需要可靠的数据才能下结论。","memo":"rely 的形容词：可依靠的，靠得住。"},{"en":"relief","ipa":"/rɪˈliːf/","zh":"n. 减轻；宽慰；救济","ex":"The medicine brought immediate relief from the constant pain.","exZh":"药物立刻缓解了持续的疼痛。","memo":"relieve 的名词：痛一松，如释重负。"},{"en":"relieve","ipa":"/rɪˈliːv/","zh":"v. 缓解；解除；换班","ex":"A warm bath can effectively relieve tired muscles after exercise.","exZh":"运动后泡个热水澡能有效缓解肌肉疲劳。","memo":"re（离开）+lieve（重）：把重担卸下，缓解。"},{"en":"reluctant","ipa":"/rɪˈlʌktənt/","zh":"adj. 不情愿的；勉强的","ex":"He was reluctant to admit that he had made a mistake.","exZh":"他很不情愿承认自己犯了错。","memo":"「锐拉克疼」：拉又拉不动，纯属不情愿。"},{"en":"rely","ipa":"/rɪˈlaɪ/","zh":"v. 依赖；信赖","ex":"Many small farmers rely heavily on the summer rains.","exZh":"许多小农户非常依赖夏季降雨。","memo":"re（反复）+lie（躺）：反复躺在人家身上，依赖。"},{"en":"remark","ipa":"/rɪˈmɑːk/","zh":"n. 言论 v. 评论；注意到","ex":"She made a sharp remark about the government's new policy.","exZh":"她对政府的新政策发表了尖锐的评论。","memo":"re（再）+mark（标记）：划重点的话，评论。"},{"en":"remedy","ipa":"/ˈremədi/","zh":"n. 补救办法；药物 v. 补救","ex":"There is no simple remedy for this deep-rooted problem.","exZh":"对这个根深蒂固的问题，没有简单的补救办法。","memo":"「瑞买地」：生病去买地黄，药到病除。"},{"en":"remote","ipa":"/rɪˈməʊt/","zh":"adj. 遥远的；偏远的；远程的","ex":"The village is so remote that supplies arrive only monthly.","exZh":"这个村子太偏远了，物资每月才到一次。","memo":"re（离）+mote（动）：挪得远远的，偏远。"},{"en":"renew","ipa":"/rɪˈnjuː/","zh":"v. 更新；续订；续期","ex":"You can renew your library books online or by phone.","exZh":"你可以在网上或电话续借图书馆的书。","memo":"re（再）+new（新）：再变新，更新续期。"},{"en":"renowned","ipa":"/rɪˈnaʊnd/","zh":"adj. 著名的；有声望的","ex":"The region is renowned for its vineyards and fine wines.","exZh":"该地区以葡萄园和上等葡萄酒闻名。","memo":"re（一再）+nown（名）：名声一再被提起，著名。"},{"en":"replace","ipa":"/rɪˈpleɪs/","zh":"v. 替换；取代","ex":"The council plans to replace all the old streetlights next year.","exZh":"委员会计划明年更换所有旧路灯。","memo":"re（回）+place（位子）：回到位子上顶替，取代。"},{"en":"represent","ipa":"/ˌreprɪˈzent/","zh":"v. 代表；表现；描绘","ex":"Each colour on the chart represents a different age group.","exZh":"图表上每种颜色代表一个不同的年龄组。","memo":"re+present（呈上）：呈上去替大家说话，代表。"},{"en":"reproduce","ipa":"/ˌriːprəˈdjuːs/","zh":"v. 繁殖；复制；重现","ex":"Other teams failed to reproduce the results of the study.","exZh":"其他团队未能重现该研究的结果。","memo":"re（再）+produce（生产）：再生产一遍，复制繁殖。"},{"en":"reputation","ipa":"/ˌrepjuˈteɪʃn/","zh":"n. 名声；声誉","ex":"The scandal seriously damaged the company's hard-won reputation.","exZh":"丑闻严重损害了该公司辛苦建立的名声。","memo":"re（反复）+pute（想）：大家反复议论的，名声。"},{"en":"request","ipa":"/rɪˈkwest/","zh":"n./v. 请求；要求","ex":"Guests are requested to leave their room keys at reception.","exZh":"请客人把房间钥匙留在前台。","memo":"re（再）+quest（求）：再求一遍，请求。"},{"en":"require","ipa":"/rɪˈkwaɪə/","zh":"v. 需要；要求","ex":"The position requires at least two years of relevant experience.","exZh":"该职位要求至少两年相关经验。","memo":"re+quire（求）：开口求规格，要求必备。"},{"en":"rescue","ipa":"/ˈreskjuː/","zh":"v./n. 营救；救援","ex":"Firefighters rescued three people from the burning building.","exZh":"消防员从着火的大楼里救出三人。","memo":"「锐死救」：冲得锐利拼死相救。"},{"en":"reserve","ipa":"/rɪˈzɜːv/","zh":"v. 预订；保留 n. 储备；保护区","ex":"A table can be reserved by phone up to a week ahead.","exZh":"可提前一周电话预订餐桌。","memo":"re（回）+serve（保留）：留一手，预订储备。"},{"en":"resign","ipa":"/rɪˈzaɪn/","zh":"v. 辞职；放弃","ex":"The minister resigned after the financial scandal became public.","exZh":"金融丑闻曝光后，这位部长辞职了。","memo":"re（回）+sign（签名）：签名回辞职信，走人。"},{"en":"resist","ipa":"/rɪˈzɪst/","zh":"v. 抵抗；抵制；忍住","ex":"I could not resist the temptation of the chocolate cake.","exZh":"我没能抵挡住巧克力蛋糕的诱惑。","memo":"re（反）+sist（站）：反着站对抗，抵制。"},{"en":"resolve","ipa":"/rɪˈzɒlv/","zh":"v. 解决；下决心 n. 决心","ex":"Negotiations were held to resolve the long-running border dispute.","exZh":"双方举行谈判以解决长期存在的边界争端。","memo":"re（回）+solve（解）：回头把题解开，解决。"},{"en":"resort","ipa":"/rɪˈzɔːt/","zh":"v. 诉诸；求助于 n. 度假村","ex":"They had to resort to borrowing money from close friends.","exZh":"他们不得不求助于向好友借钱。","memo":"re（回）+sort（类）：退回老办法，求助于它。"},{"en":"resource","ipa":"/rɪˈsɔːs/","zh":"n. 资源；财力","ex":"Natural resources such as clean water should be managed wisely.","exZh":"清洁水源等自然资源应合理管理。","memo":"re（再）+source（源）：能源源再生的，资源。"},{"en":"respond","ipa":"/rɪˈspɒnd/","zh":"v. 回答；回应","ex":"The airline responded quickly to the passengers' complaints.","exZh":"航空公司迅速回应了乘客的投诉。","memo":"re（回）+spond（承诺）：回个准话，回应。"},{"en":"restrict","ipa":"/rɪˈstrɪkt/","zh":"v. 限制；约束","ex":"The new law restricts smoking in all enclosed public spaces.","exZh":"新法律限制在所有封闭的公共场所吸烟。","memo":"re（拉回）+strict（紧的）：拉紧缰绳，限制。"},{"en":"retire","ipa":"/rɪˈtaɪə/","zh":"v. 退休；退出","ex":"My father retired from teaching after thirty years of service.","exZh":"我父亲执教三十年后退休了。","memo":"re（回）+tire（累）：累了拉回家，退休。"},{"en":"retreat","ipa":"/rɪˈtriːt/","zh":"v./n. 撤退；退却","ex":"The army retreated across the river under cover of darkness.","exZh":"军队趁夜色掩护撤过了河。","memo":"re（回）+treat（处理）：回撤处理，撤退。"},{"en":"reveal","ipa":"/rɪˈviːl/","zh":"v. 揭示；透露","ex":"The report reveals a sharp rise in household energy costs.","exZh":"报告显示家庭能源成本急剧上升。","memo":"re（揭）+veil（面纱）：掀开面纱，真相大白。"},{"en":"reverse","ipa":"/rɪˈvɜːs/","zh":"v. 逆转；撤销 adj. 相反的","ex":"The appeal court reversed the original decision last month.","exZh":"上诉法院上个月推翻了原判。","memo":"re（回）+verse（转）：倒转回来，逆转。"},{"en":"review","ipa":"/rɪˈvjuː/","zh":"n./v. 审查；评论；复习","ex":"The film received glowing reviews from most of the critics.","exZh":"这部电影获得了大多数影评人的好评。","memo":"re（再）+view（看）：再看一遍，复查复习。"},{"en":"revive","ipa":"/rɪˈvaɪv/","zh":"v. 复活；复兴；重启","ex":"The town revived its old market to attract more tourists.","exZh":"小镇重启了老集市以吸引更多游客。","memo":"re（再）+vive（活）：再活过来，复兴。"},{"en":"reward","ipa":"/rɪˈwɔːd/","zh":"n. 报酬；奖励 v. 奖赏","ex":"Years of hard work and patience finally brought their reward.","exZh":"多年的努力和耐心终于有了回报。","memo":"re（回）+ward（守护）：守得回报，奖励。"},{"en":"rhythm","ipa":"/ˈrɪðm/","zh":"n. 节奏；韵律","ex":"Playing drums helps children develop a strong sense of rhythm.","exZh":"打鼓有助于培养孩子良好的节奏感。","memo":"「锐准没」：鼓点准得没话说，节奏感强。"},{"en":"rival","ipa":"/ˈraɪvl/","zh":"n. 对手；竞争者 adj. 竞争的","ex":"The two rival companies are competing for the same customers.","exZh":"两家竞争对手正在争夺同样的客户。","memo":"「入爱窝」：争同一个爱窝，对手相斗。"},{"en":"rough","ipa":"/rʌf/","zh":"adj. 粗糙的；粗略的；艰难的","ex":"The track was rough and covered with loose stones.","exZh":"小路崎岖不平，满是松动的碎石。","memo":"「拉夫」：拉夫干活的手，粗糙有力。"},{"en":"route","ipa":"/ruːt/","zh":"n. 路线；航线","ex":"We changed our route to avoid the morning traffic jam.","exZh":"我们改了路线以避开早高峰拥堵。","memo":"「肉的」：运肉的车走的固定路线。"},{"en":"routine","ipa":"/ruːˈtiːn/","zh":"n. 常规；惯例 adj. 例行的","ex":"A short evening walk has become part of my daily routine.","exZh":"傍晚散步已成为我日常惯例的一部分。","memo":"route 亲戚：天天走的路线，例行常规。"},{"en":"rural","ipa":"/ˈrʊərəl/","zh":"adj. 农村的；乡下的","ex":"Rural communities often lack access to good public transport.","exZh":"农村社区往往缺乏良好的公共交通。","memo":"「乳儿」：乡下奶多草肥，乳儿长得壮。"},{"en":"rebel","ipa":"/rɪˈbel/","zh":"n. 叛逆者 v. 反抗；反叛","ex":"The teenager rebelled against her strict boarding school rules.","exZh":"这个女孩反抗寄宿学校严格的校规。","memo":"re（反）+bel（战）：反着打仗，造反叛逆。"},{"en":"rehearse","ipa":"/rɪˈhɜːs/","zh":"v. 排练；预演","ex":"The orchestra will rehearse the symphony again before the concert.","exZh":"音乐会前，管弦乐团将再次排练这部交响曲。","memo":"re（再）+hear（听）：再听再练，反复排练。"},{"en":"sacrifice","ipa":"/ˈsækrɪfaɪs/","zh":"n./v. 牺牲；献出","ex":"Many parents sacrifice their own comfort for their children's education.","exZh":"许多父母为了孩子的教育牺牲自己的舒适。","memo":"sacri（神圣）+fice：为神圣之事付出，牺牲。"},{"en":"salary","ipa":"/ˈsæləri/","zh":"n. 薪水；工资","ex":"His starting salary barely covers the rent in central London.","exZh":"他的起薪几乎不够支付伦敦市中心的房租。","memo":"「晒了瑞」：晒晒工资条，瑞银打钱薪水到账。"},{"en":"sample","ipa":"/ˈsɑːmpl/","zh":"n. 样品；样本 v. 抽样","ex":"Researchers collected blood samples from over a hundred volunteers.","exZh":"研究人员收集了一百多名志愿者的血样。","memo":"「山宝」：山上采的宝，样本一份。"},{"en":"sanction","ipa":"/ˈsæŋkʃn/","zh":"n. 制裁；批准 v. 制裁","ex":"Economic sanctions were imposed on the country last year.","exZh":"去年该国受到了经济制裁。","memo":"「善克慎」：批准时善，制裁时克，须谨慎。"},{"en":"satisfy","ipa":"/ˈsætɪsfaɪ/","zh":"v. 使满意；满足","ex":"The report failed to satisfy the independent safety inspectors.","exZh":"这份报告未能让独立安全检查员满意。","memo":"satis（饱）+fy：吃饱了心满意足。"},{"en":"scale","ipa":"/skeɪl/","zh":"n. 规模；等级；天平 v. 攀登","ex":"The charity now operates on a truly global scale.","exZh":"这家慈善机构的运作现已达到真正的全球规模。","memo":"「斯盖哦」：刻度一格格盖上去，规模等级。"},{"en":"scan","ipa":"/skæn/","zh":"v. 扫描；浏览；细看","ex":"I scanned the article quickly, looking for the main argument.","exZh":"我快速浏览了这篇文章，寻找主要论点。","memo":"「死砍」：目光像刀死砍一遍，快速扫描。"},{"en":"scenario","ipa":"/səˈnɑːriəʊ/","zh":"n. 情景；设想；方案","ex":"In the worst-case scenario, the project loses all its funding.","exZh":"在最坏的情况下，该项目失去全部资金。","memo":"「是你爱哦」：剧本是你爱的哦，情景设想。"},{"en":"scheme","ipa":"/skiːm/","zh":"n. 计划；方案 v. 密谋","ex":"The government launched a scheme to help young first-time buyers.","exZh":"政府推出了一项帮助年轻人首次购房的计划。","memo":"ski（滑雪）+me：滑好每一步的计划，方案。"},{"en":"secure","ipa":"/sɪˈkjʊə/","zh":"adj. 安全的；牢固的 v. 获得；保护","ex":"The team finally secured funding for the two-year study.","exZh":"团队终于为这项为期两年的研究争取到了资金。","memo":"se（离）+cure（担忧）：离开担忧，安全。"},{"en":"seek","ipa":"/siːk/","zh":"v. 寻找；寻求","ex":"Many graduates seek employment in the capital after university.","exZh":"许多毕业生大学毕业后到首都找工作。","memo":"「细抠」：细抠每个机会，认真寻找。"},{"en":"seize","ipa":"/siːz/","zh":"v. 抓住；夺取；没收","ex":"Customs officers seized a large shipment of illegal wildlife products.","exZh":"海关人员查获了一大批非法野生动物制品。","memo":"「细子」：细子不放过，抓个正着。"},{"en":"select","ipa":"/sɪˈlekt/","zh":"v. 挑选；选拔","ex":"Only shortlisted candidates will be selected for a second interview.","exZh":"只有进入短名单的候选人才能进入第二轮面试。","memo":"se（分开）+lect（选）：分开挑出，选拔。"},{"en":"semester","ipa":"/sɪˈmestə/","zh":"n. 学期","ex":"The autumn semester begins in the last week of September.","exZh":"秋季学期于九月最后一周开始。","memo":"「是没死他」：期末熬到没死他，学期结束。"},{"en":"seminar","ipa":"/ˈsemɪnɑː/","zh":"n. 研讨会；研讨课","ex":"The department holds a weekly seminar on environmental economics.","exZh":"系里每周举行一次环境经济学研讨会。","memo":"「色米纳」：一色米全纳进来讨论，研讨课。"},{"en":"sensible","ipa":"/ˈsensəbl/","zh":"adj. 明智的；合理的","ex":"Wearing sensible shoes is essential for the mountain hike.","exZh":"穿合适的鞋对山地徒步必不可少。","memo":"sense 的形容词：有感觉有分寸，明智。"},{"en":"sensation","ipa":"/senˈseɪʃn/","zh":"n. 感觉；轰动","ex":"The charity single caused a sensation across the whole country.","exZh":"这首公益歌曲在全国引起轰动。","memo":"sense 家族：感觉传开，轰动一时。"},{"en":"sensitive","ipa":"/ˈsensətɪv/","zh":"adj. 敏感的；灵敏的","ex":"Her skin is extremely sensitive to strong summer sunlight.","exZh":"她的皮肤对强烈的夏日阳光非常敏感。","memo":"sense 家族：感觉多一根弦，敏感。"},{"en":"sequence","ipa":"/ˈsiːkwəns/","zh":"n. 顺序；序列","ex":"Complete the steps in the correct sequence to avoid errors.","exZh":"按正确的顺序完成步骤以避免出错。","memo":"sequ（跟随）+ence：一个跟一个，顺序。"},{"en":"series","ipa":"/ˈsɪəriːz/","zh":"n. 系列；连续","ex":"The museum is hosting a series of lectures on modern art.","exZh":"博物馆正在举办一系列现代艺术讲座。","memo":"「希尔瑞斯」：一集接一集，连成系列。"},{"en":"serve","ipa":"/sɜːv/","zh":"v. 服务；供应；任职","ex":"The restaurant serves traditional local dishes to every table.","exZh":"这家餐厅为每桌客人供应地方特色菜。","memo":"「社服」：社区服务热心干，服务供应。"},{"en":"session","ipa":"/ˈseʃn/","zh":"n. 一场；会议；课时","ex":"Each training session lasts about two hours in the evening.","exZh":"每次培训课大约持续两个小时，在晚上进行。","memo":"sess（坐）+ion：坐下来开会，一场。"},{"en":"settle","ipa":"/ˈsetl/","zh":"v. 解决；定居；安顿","ex":"The two firms settled the dispute out of court last week.","exZh":"两家公司上周庭外解决了纠纷。","memo":"settle down：坐定了，安顿解决。"},{"en":"severe","ipa":"/sɪˈvɪə/","zh":"adj. 严重的；严厉的","ex":"The region suffered severe damage during last winter's floods.","exZh":"该地区在去年冬天的洪灾中损失惨重。","memo":"「四味儿」：苦辣四味儿都尝过，严重的滋味。"},{"en":"shallow","ipa":"/ˈʃæləʊ/","zh":"adj. 浅的；肤浅的","ex":"The river is too shallow for large cargo boats.","exZh":"这条河太浅，大型货船无法通行。","memo":"「傻漏」：学问傻漏见底，肤浅。"},{"en":"shelter","ipa":"/ˈʃeltə/","zh":"n. 避难所；住所 v. 掩蔽","ex":"The hikers took shelter under a rocky ledge until the storm passed.","exZh":"徒步者在岩檐下躲避，直到暴风雨过去。","memo":"「谢了它」：暴雨天谢了它给个屋檐，庇护。"},{"en":"shield","ipa":"/ʃiːld/","zh":"n. 盾；防护物 v. 保护","ex":"Thick clouds shielded the valley from the midday sun.","exZh":"厚厚的云层为山谷遮挡了正午的烈日。","memo":"「鞋儿的」：鞋儿当盾牌，护住脚。"},{"en":"shift","ipa":"/ʃɪft/","zh":"v. 转变；移动 n. 轮班","ex":"Public attitudes towards remote working have shifted dramatically.","exZh":"公众对远程办公的态度已发生巨大转变。","memo":"「歇服他」：换班歇了服他顶上，轮换。"},{"en":"shortage","ipa":"/ˈʃɔːtɪdʒ/","zh":"n. 短缺；不足","ex":"The drought caused a serious shortage of clean drinking water.","exZh":"干旱造成了清洁饮用水的严重短缺。","memo":"short（短）+age：存量变短，短缺。"},{"en":"sibling","ipa":"/ˈsɪblɪŋ/","zh":"n. 兄弟姐妹","ex":"She has two siblings: an older brother and a younger sister.","exZh":"她有两个兄弟姐妹：一个哥哥和一个妹妹。","memo":"sib（血脉）+ling：同一血脉的小灵，手足。"},{"en":"signal","ipa":"/ˈsɪɡnl/","zh":"n. 信号；标志 v. 发信号","ex":"The flashing red light is a clear signal to stop.","exZh":"闪烁的红灯是明确的停止信号。","memo":"「信高」：站得高发信号，一看就懂。"},{"en":"significant","ipa":"/sɪɡˈnɪfɪkənt/","zh":"adj. 重要的；显著的","ex":"The study found a significant difference between the two groups.","exZh":"研究发现两组之间存在显著差异。","memo":"sign（标记）+ificant：值得立牌标记，意义重大。"},{"en":"sincere","ipa":"/sɪnˈsɪə/","zh":"adj. 真诚的；诚挚的","ex":"Please accept my sincere apologies for the delay in replying.","exZh":"请接受我因未能及时回复而致以的诚挚歉意。","memo":"「心细儿」：心细儿又实诚，真挚待人。"},{"en":"site","ipa":"/saɪt/","zh":"n. 地点；场所；网站","ex":"Engineers finally chose a safe site for the new bridge.","exZh":"工程师最终为新桥选定了一个安全的地点。","memo":"sit（坐落）+e：坐落之处，地点。"},{"en":"sketch","ipa":"/sketʃ/","zh":"n. 素描；草图 v. 画草图","ex":"She sketched a rough plan of the garden on a napkin.","exZh":"她在餐巾纸上画出了花园的草图。","memo":"「斯该奇」：寥寥几笔奇快，草图完工。"},{"en":"slack","ipa":"/slæk/","zh":"adj. 松弛的；萧条的 v. 懈怠","ex":"Business is usually slack during the cold winter months.","exZh":"寒冬月份生意通常很冷清。","memo":"「死懒」：死懒的人绳都拉松，懈怠。"},{"en":"slash","ipa":"/slæʃ/","zh":"v. 大幅削减；砍 n. 斜杠","ex":"The supermarket slashed prices on fresh food before the holiday.","exZh":"节前超市大幅下调了生鲜食品的价格。","memo":"「死拉削」：死拉一削，价格砍半。"},{"en":"slight","ipa":"/slaɪt/","zh":"adj. 轻微的；纤细的","ex":"There was a slight delay in the morning train schedule.","exZh":"上午的列车时刻表有轻微延误。","memo":"「死来疼」：轻轻一碰死来疼，纤细娇气。"},{"en":"solar","ipa":"/ˈsəʊlə/","zh":"adj. 太阳的；太阳能的","ex":"Solar panels on the roof convert sunlight into clean electricity.","exZh":"屋顶的太阳能板把阳光转化为清洁电力。","memo":"sol（太阳）+ar：太阳家的，太阳能。"},{"en":"sole","ipa":"/səʊl/","zh":"adj. 唯一的；独占的 n. 鞋底","ex":"She is the sole owner of the little bookshop downtown.","exZh":"她是市区那家小书店的唯一所有者。","memo":"鞋底 sole 独一块：唯一专属。"},{"en":"solid","ipa":"/ˈsɒlɪd/","zh":"adj. 固体的；扎实的；可靠的","ex":"The team built a solid reputation for reliable, high-quality work.","exZh":"团队以可靠的高质量工作赢得了扎实的口碑。","memo":"「扫了的」：扫了的地基实打实，牢靠。"},{"en":"solitary","ipa":"/ˈsɒlɪtri/","zh":"adj. 独处的；孤独的","ex":"He enjoys long solitary walks along the beach at dawn.","exZh":"他喜欢黎明时分独自在海滩上长时间散步。","memo":"sole 亲戚：孤零零一人，独处。"},{"en":"span","ipa":"/spæn/","zh":"n. 跨度；一段时间 v. 横跨","ex":"The new bridge spans the river for nearly two kilometres.","exZh":"新桥横跨河流近两公里。","memo":"「思班」：想算跨度，思量几班岗。"},{"en":"specify","ipa":"/ˈspesɪfaɪ/","zh":"v. 明确说明；具体指定","ex":"The contract clearly specifies the date of final delivery.","exZh":"合同明确规定了最终交付日期。","memo":"spec（看）+ify：看清楚写明白，指定。"},{"en":"specimen","ipa":"/ˈspesɪmən/","zh":"n. 标本；样本","ex":"The laboratory keeps carefully labelled specimens of rare insects.","exZh":"实验室保存着贴有细致标签的稀有昆虫标本。","memo":"spec（看）+imen：供人细看的，标本。"},{"en":"spectacle","ipa":"/ˈspektəkl/","zh":"n. 景象；奇观","ex":"The sunrise over the canyon was a truly spectacular spectacle.","exZh":"峡谷上空的日出真是蔚为壮观的景象。","memo":"spect（看）+acle：让人看的，大场面。"},{"en":"sphere","ipa":"/sfɪə/","zh":"n. 球体；领域","ex":"The Earth is not a perfect sphere but slightly flattened.","exZh":"地球并不是完美的球体，而是略微扁平。","memo":"「斯菲儿」：菲儿玩球，球体领域。"},{"en":"spill","ipa":"/spɪl/","zh":"v. 溢出；洒出 n. 泄漏","ex":"Be careful not to spill coffee on the laptop keyboard.","exZh":"小心别把咖啡洒到笔记本电脑键盘上。","memo":"「死拼哦」：杯子死拼往外倒，洒了一桌。"},{"en":"spiral","ipa":"/ˈspaɪrəl/","zh":"n. 螺旋 v. 螺旋式上升（下降）","ex":"House prices continued to spiral upwards throughout last year.","exZh":"去年房价持续螺旋式上涨。","memo":"spi（转）+ral：绕着转，螺旋。"},{"en":"splendid","ipa":"/ˈsplendɪd/","zh":"adj. 壮丽的；极好的","ex":"From the tower we had a splendid view of the old city.","exZh":"从塔顶我们把古城美景尽收眼底，壮观极了。","memo":"「死绷立的」：绷住一口气立得漂亮，绝佳。"},{"en":"split","ipa":"/splɪt/","zh":"v. 分裂；分开；分担","ex":"The class was split into four groups for the group project.","exZh":"全班被分成四个小组做小组项目。","memo":"「死不裂它」：死说它没裂，其实已分裂。"},{"en":"spoil","ipa":"/spɔɪl/","zh":"v. 宠坏；破坏；变质","ex":"Grandparents tend to spoil their grandchildren with too many sweets.","exZh":"祖父母往往用太多糖果宠坏孙辈。","memo":"「斯泡哦」：整天泡着哄，宠坏啦。"},{"en":"sponsor","ipa":"/ˈspɒnsə/","zh":"n. 赞助商；担保人 v. 赞助","ex":"A local bank has sponsored the school football team for years.","exZh":"一家本地银行多年来一直赞助学校足球队。","memo":"spond（承诺）亲戚：承诺掏钱的，赞助商。"},{"en":"spouse","ipa":"/spaʊs/","zh":"n. 配偶","ex":"Employees may add their spouse to the company health plan.","exZh":"员工可以把配偶纳入公司健康保险计划。","memo":"「死抱死」：生死相抱的，是配偶。"},{"en":"squeeze","ipa":"/skwiːz/","zh":"v. 挤；榨；紧握","ex":"She squeezed the wet sponge to remove most of the water.","exZh":"她把湿海绵挤了挤，去掉大部分水分。","memo":"「死规子」：死命规整一挤，水都出来。"},{"en":"stability","ipa":"/stəˈbɪləti/","zh":"n. 稳定性；稳固","ex":"Political stability in the region attracts steady foreign investment.","exZh":"该地区的政治稳定吸引了持续的外国投资。","memo":"stable 的名词：站得稳的，稳定性。"},{"en":"staff","ipa":"/stɑːf/","zh":"n. 全体员工；杖","ex":"The hospital staff worked extra shifts during the busy season.","exZh":"旺季期间医院员工加班轮班。","memo":"「四大夫」：四大夫全员上岗，全体员工。"},{"en":"stake","ipa":"/steɪk/","zh":"n. 股份；赌注；桩","ex":"He holds a major stake in the family shipping business.","exZh":"他在家族航运生意中持有大量股份。","memo":"「四台课」：股份赌桌押上四台，全靠股份撑场。"},{"en":"staple","ipa":"/ˈsteɪpl/","zh":"n. 订书钉；主食 adj. 主要的","ex":"Rice is the staple food for more than half the world's population.","exZh":"大米是世界上过半人口的主食。","memo":"订书钉一钉定三餐：主食，主打。"},{"en":"stark","ipa":"/stɑːk/","zh":"adj. 鲜明的；赤裸裸的","ex":"The report shows a stark contrast between urban and rural incomes.","exZh":"报告显示城乡收入对比悬殊。","memo":"「死达克」：死板 stark 对比，反差鲜明。"},{"en":"startle","ipa":"/ˈstɑːtl/","zh":"v. 使惊吓；使吓一跳","ex":"The sudden ringing of the fire alarm startled everyone downstairs.","exZh":"火警突然响起，吓了楼下所有人一跳。","memo":"start+le：突然 start，吓人一跳。"},{"en":"statistics","ipa":"/stəˈtɪstɪks/","zh":"n. 统计；统计学","ex":"Recent statistics show a steady rise in online grocery shopping.","exZh":"最新统计显示网上食品采购稳步增长。","memo":"stat（立得住的数）+istics：站得住的数据，统计。"},{"en":"status","ipa":"/ˈsteɪtəs/","zh":"n. 地位；身份；状况","ex":"The report examines the social status of teachers in rural areas.","exZh":"报告探讨了农村教师的社会地位。","memo":"stat（站）+us：我们站的位置，地位。"},{"en":"steady","ipa":"/ˈstedi/","zh":"adj. 稳定的；持续的 v. 稳住","ex":"The tourism industry has enjoyed steady growth over the past decade.","exZh":"过去十年旅游业保持稳定增长。","memo":"「斯特迪」：斯特迪稳稳走路，稳定。"},{"en":"steep","ipa":"/stiːp/","zh":"adj. 陡峭的；（价格）过高的","ex":"The path becomes too steep for small children after the bridge.","exZh":"过了桥之后，这条路对小孩子们来说太陡了。","memo":"「斯地扑」：地太陡，走路得扑着爬。"},{"en":"steer","ipa":"/stɪə/","zh":"v. 驾驶；引导","ex":"She carefully steered the van into the narrow country lane.","exZh":"她小心地把面包车开进狭窄的乡间小道。","memo":"「斯提尔」：手把方向盘，稳稳驾驶。"},{"en":"stem","ipa":"/stem/","zh":"n. 茎；词干 v. 源于；阻止","ex":"Many of these complaints stem from poor communication between departments.","exZh":"许多投诉源于部门之间沟通不畅。","memo":"茎从根长出：问题 stem 自源头。"},{"en":"stir","ipa":"/stɜː/","zh":"v. 搅动；激起","ex":"The young singer's debut stirred great excitement among fans.","exZh":"年轻歌手的出道在歌迷中激起巨大热情。","memo":"「斯特」：勺子斯特一搅，情绪被激起。"},{"en":"stock","ipa":"/stɒk/","zh":"n. 库存；股票；血统","ex":"The shop keeps a large stock of warm winter coats.","exZh":"这家商店囤有大量保暖冬衣库存。","memo":"「四多库」：仓库四多库存，股票也囤。"},{"en":"strain","ipa":"/streɪn/","zh":"n. 压力；拉伤 v. 拉紧","ex":"Long working hours have put a real strain on family life.","exZh":"长时间工作给家庭生活带来了实实在在的压力。","memo":"「死拽」：死拽绳子，拉伤又心累。"},{"en":"strategic","ipa":"/strəˈtiːdʒɪk/","zh":"adj. 战略的；关键的","ex":"The port is a strategic location for international trade routes.","exZh":"该港口是国际贸易航线上的战略要地。","memo":"strategy 的形容词：讲战略的。"},{"en":"strategy","ipa":"/ˈstrætədʒi/","zh":"n. 战略；策略","ex":"The company adopted a new marketing strategy for younger customers.","exZh":"公司针对年轻客户采用了新的营销策略。","memo":"「死抓的局」：死抓全局的打法，战略。"},{"en":"stretch","ipa":"/stretʃ/","zh":"v. 伸展；延伸 n. 一段","ex":"Remember to stretch your muscles properly before going for a run.","exZh":"跑步前记得充分伸展肌肉。","memo":"「死拽去」：死拽开手脚，伸展到位。"},{"en":"strike","ipa":"/straɪk/","zh":"v. 罢工；击打；袭击 n. 罢工","ex":"Thousands of rail workers joined the strike last Thursday.","exZh":"上周四数千名铁路工人参加了罢工。","memo":"「死拽客」：罢工死拽住客流，一击即停。"},{"en":"strive","ipa":"/straɪv/","zh":"v. 努力；奋斗","ex":"The school strives to provide equal opportunities for all pupils.","exZh":"学校努力为所有学生提供平等的机会。","memo":"「死拽夫」：死拽着目标像牛夫，奋斗不止。"},{"en":"stroke","ipa":"/strəʊk/","zh":"n. 中风；击球；一笔","ex":"Regular gentle exercise reduces the risk of a second stroke.","exZh":"定期适度锻炼可降低二次中风的风险。","memo":"「死奏叩」：一击叩响，笔画轻描。"},{"en":"struggle","ipa":"/ˈstrʌɡl/","zh":"v./n. 奋斗；挣扎","ex":"Many low-income families struggle to pay their winter heating bills.","exZh":"许多低收入家庭难以支付冬季取暖费。","memo":"「死抓够」：死抓着够不着的目标，挣扎奋斗。"},{"en":"stumble","ipa":"/ˈstʌmbl/","zh":"v. 绊倒；偶然发现","ex":"While clearing the attic, she stumbled upon a box of old letters.","exZh":"整理阁楼时，她偶然发现了一盒旧信件。","memo":"stump（树桩）：绊上树桩，踉跄一步。"},{"en":"stun","ipa":"/stʌn/","zh":"v. 使震惊；使昏迷","ex":"The final-minute goal stunned the entire home crowd.","exZh":"最后一分钟的进球让主场观众全都惊呆了。","memo":"「死蛋」：一个死蛋砸头，当场震懵。"},{"en":"subjective","ipa":"/səbˈdʒektɪv/","zh":"adj. 主观的","ex":"Judgements about modern art are often highly subjective.","exZh":"对现代艺术的评价往往带有很强的主观性。","memo":"subject（主体）+ive：站在主体角度，主观。"},{"en":"submit","ipa":"/səbˈmɪt/","zh":"v. 提交；服从","ex":"Please submit your application before the end of this month.","exZh":"请在本月底前提交申请。","memo":"sub（下）+mit（送）：送到下面审，提交。"},{"en":"subordinate","ipa":"/səˈbɔːdɪnət/","zh":"n. 下级 adj. 从属的","ex":"A good manager listens carefully to the ideas of subordinates.","exZh":"优秀的管理者会认真听取下属的想法。","memo":"sub（下）+ordin（顺序）：排下面的，下级。"},{"en":"subsequent","ipa":"/ˈsʌbsɪkwənt/","zh":"adj. 随后的；接着的","ex":"The theory was tested again in subsequent experiments last year.","exZh":"该理论在去年随后的实验中再次得到检验。","memo":"sub（后面）+sequ（跟随）：跟着来的，随后的。"},{"en":"subsidy","ipa":"/ˈsʌbsədi/","zh":"n. 补贴；津贴","ex":"Farmers receive a generous government subsidy for growing wheat.","exZh":"种植小麦的农民获得丰厚的政府补贴。","memo":"sub（下面）+sid（坐）：底下垫钱坐稳，补贴。"},{"en":"substance","ipa":"/ˈsʌbstəns/","zh":"n. 物质；实质","ex":"The soil contains natural substances that help young plants grow.","exZh":"土壤中含有帮助幼苗生长的天然物质。","memo":"sub（下）+stance（站）：站在底下的料，实质。"},{"en":"substantial","ipa":"/səbˈstænʃl/","zh":"adj. 大量的；实质的","ex":"Renovating the old theatre will require a substantial investment.","exZh":"翻新这座老剧院需要一大笔投资。","memo":"substance 家族：量足料实，可观的。"},{"en":"substitute","ipa":"/ˈsʌbstɪtjuːt/","zh":"n. 替代品 v. 代替","ex":"Honey is a healthy substitute for sugar in most baking recipes.","exZh":"在大多数烘焙配方中，蜂蜜是健康的糖替代品。","memo":"sub（候补）+stitute（站）：站到替补位，代替。"},{"en":"subtle","ipa":"/ˈsʌtl/","zh":"adj. 微妙的；细微的","ex":"There is a subtle but important difference between the two terms.","exZh":"这两个词之间有细微却重要的区别。","memo":"「洒透」：差别细得像酒香渗透，微妙。"},{"en":"suburb","ipa":"/ˈsʌbɜːb/","zh":"n. 郊区","ex":"They moved to a quiet suburb with better schools last spring.","exZh":"去年春天他们搬到了学校更好的安静郊区。","memo":"sub（近）+urb（城市）：城市边上，郊区。"},{"en":"sufficient","ipa":"/səˈfɪʃnt/","zh":"adj. 足够的；充足的","ex":"Make sure you leave sufficient time to check your answers.","exZh":"确保留出足够的时间检查答案。","memo":"suf（下满）+fic（做）：做到满，充足。"},{"en":"summary","ipa":"/ˈsʌməri/","zh":"n. 摘要；概要","ex":"Each chapter ends with a short summary of the key points.","exZh":"每章结尾都有要点小结。","memo":"sum（总和）：把总和讲出来，摘要。"},{"en":"summon","ipa":"/ˈsʌmən/","zh":"v. 召集；传唤；鼓起","ex":"The head teacher summoned an emergency meeting about the floods.","exZh":"校长就洪灾问题召集了紧急会议。","memo":"「傻门」：傻门一开，全员被召集。"},{"en":"superb","ipa":"/suːˈpɜːb/","zh":"adj. 极好的；华丽的","ex":"The hilltop restaurant offers superb views over the whole valley.","exZh":"山顶餐厅可以俯瞰整个山谷，景色绝佳。","memo":"super 加大码：超级好，顶级棒。"},{"en":"superficial","ipa":"/ˌsuːpəˈfɪʃl/","zh":"adj. 肤浅的；表面的","ex":"The article gives only a superficial analysis of a complex issue.","exZh":"这篇文章对一个复杂问题只作了肤浅的分析。","memo":"super（上）+fic（面）：只在面上，肤浅。"},{"en":"superior","ipa":"/suːˈpɪəriə/","zh":"adj. 更好的；上级的 n. 上司","ex":"This new model is clearly superior to the previous version.","exZh":"这款新机型明显优于上一版。","memo":"super 亲戚：站在更高层，上级更优。"},{"en":"supervise","ipa":"/ˈsuːpəvaɪz/","zh":"v. 监督；指导","ex":"A senior engineer will supervise all the construction work on site.","exZh":"一名资深工程师将监督现场所有施工工作。","memo":"super（上）+vise（看）：在上头看着，监督。"},{"en":"supplement","ipa":"/ˈsʌplɪmənt/","zh":"n. 补充（剂）；增刊 v. 补充","ex":"She takes a daily vitamin supplement during the long winter.","exZh":"漫长冬季里她每天服用维生素补充剂。","memo":"sup（下）+ple（满）：从下补满，补充。"},{"en":"supply","ipa":"/səˈplaɪ/","zh":"v. 供应 n. 供应量","ex":"The farm supplies fresh vegetables to schools across the county.","exZh":"这家农场向全县学校供应新鲜蔬菜。","memo":"sup（下）+ply（填）：从下填足，供应。"},{"en":"support","ipa":"/səˈpɔːt/","zh":"v./n. 支持；支撑","ex":"The charity supports families affected by last month's severe floods.","exZh":"该慈善机构为上个月严重洪灾的受灾家庭提供支持。","memo":"sup（下）+port（扛）：在下扛住，支持。"},{"en":"suppose","ipa":"/səˈpəʊz/","zh":"v. 假设；认为","ex":"Suppose the flight is cancelled, how will we get home?","exZh":"假设航班取消了，我们怎么回家？","memo":"sup（下）+pose（放）：放个假设在下面，假定。"},{"en":"suppress","ipa":"/səˈpres/","zh":"v. 压制；抑制；封锁","ex":"She suppressed a smile during the headmaster's serious speech.","exZh":"校长严肃讲话时，她忍住了笑。","memo":"sup（下）+press（压）：往下压住，镇压。"},{"en":"surge","ipa":"/sɜːdʒ/","zh":"n. 激增；浪涌 v. 激增","ex":"There was a sudden surge in demand for masks last winter.","exZh":"去年冬天口罩需求突然激增。","memo":"「色镜」：浪头像色镜一样翻涌，激增。"},{"en":"surplus","ipa":"/ˈsɜːpləs/","zh":"n. 过剩；盈余 adj. 多余的","ex":"The region exports its surplus grain to neighbouring countries.","exZh":"该地区把过剩的粮食出口到邻国。","memo":"sur（超）+plus（加）：加过头了，盈余。"},{"en":"survey","ipa":"/ˈsɜːveɪ/","zh":"n./v. 调查；测量","ex":"The national survey covered more than five thousand households.","exZh":"这项全国调查覆盖了五千多户家庭。","memo":"sur（上）+vey（看）：在高处看全貌，调查。"},{"en":"survive","ipa":"/səˈvaɪv/","zh":"v. 幸存；存活","ex":"Only a few desert plants can survive long periods without rain.","exZh":"只有少数沙漠植物能在长期无雨的条件下存活。","memo":"sur（超）+vive（活）：活得超过别人，幸存。"},{"en":"suspect","ipa":"/səˈspekt/","zh":"v. 怀疑 n. 嫌疑人","ex":"Police suspect that the fire was started deliberately.","exZh":"警方怀疑这场火灾是故意纵火所致。","memo":"sus（下）+spect（看）：在暗处看人，怀疑。"},{"en":"suspend","ipa":"/səˈspend/","zh":"v. 暂停；悬挂；停学","ex":"All ferry services were suspended because of the thick fog.","exZh":"由于大雾，所有轮渡服务都暂停了。","memo":"sus（下）+pend（挂）：挂起来暂缓，停摆。"},{"en":"swallow","ipa":"/ˈswɒləʊ/","zh":"v. 吞下；忍受 n. 燕子","ex":"He swallowed the bitter medicine quickly and asked for water.","exZh":"他迅速吞下苦药，然后要了杯水。","memo":"「死挖漏」：一口死挖下咽，堵漏般吞。"},{"en":"swap","ipa":"/swɒp/","zh":"v./n. 交换；调换","ex":"Let's swap seats so that you can see the stage better.","exZh":"我们换换座位吧，这样你看舞台更清楚。","memo":"「斯沃普」：斯沃普交换舞伴，互换。"},{"en":"sway","ipa":"/sweɪ/","zh":"v. 摇摆；影响 n. 支配","ex":"The tall pines swayed gently in the cool evening breeze.","exZh":"高大的松树在凉爽的晚风中轻轻摇摆。","memo":"「斯维」：风一来树枝斯维摇摆。"},{"en":"sweat","ipa":"/swet/","zh":"n. 汗 v. 出汗","ex":"She sweated through the long interview and the presentation.","exZh":"她汗流浃背地熬过了漫长的面试和展示。","memo":"「斯歪的」：热得身子歪的，汗直流。"},{"en":"swift","ipa":"/swɪft/","zh":"adj. 迅速的；敏捷的","ex":"The government promised swift action on the housing shortage.","exZh":"政府承诺迅速采取行动解决住房短缺问题。","memo":"swift 雨燕：飞得最快的鸟，迅速。"},{"en":"tailor","ipa":"/ˈteɪlə/","zh":"v. 定制；调整适应 n. 裁缝","ex":"The course can be tailored to suit the needs of individuals.","exZh":"这门课程可以量身定制，满足个人需求。","memo":"tailor 裁缝：量体裁衣，定制。"},{"en":"talent","ipa":"/ˈtælənt/","zh":"n. 天赋；人才","ex":"The talent show gives young performers a chance to shine.","exZh":"才艺表演给年轻演员提供了闪耀的机会。","memo":"「太能的」：太能干的人，就是人才。"},{"en":"tame","ipa":"/teɪm/","zh":"v. 驯化 adj. 驯服的；平淡的","ex":"Wild horses were first tamed thousands of years ago.","exZh":"野马最早在数千年前被驯化。","memo":"「帖目」：野马帖目听话，驯服。"},{"en":"target","ipa":"/ˈtɑːɡɪt/","zh":"n. 目标；靶子 v. 瞄准","ex":"The advertising campaign targets young professionals in major cities.","exZh":"这轮广告宣传瞄准了大城市的年轻专业人士。","memo":"「他盖它」：他盖靶它瞄准，目标锁定。"},{"en":"tariff","ipa":"/ˈtærɪf/","zh":"n. 关税；价目表","ex":"The government raised import tariffs on steel and aluminium.","exZh":"政府提高了钢铁和铝的进口关税。","memo":"「他理发」：进口货他理个发，收费是关税。"},{"en":"temper","ipa":"/ˈtempə/","zh":"n. 脾气 v. 缓和","ex":"Losing the final match put the coach in a bad temper.","exZh":"输掉决赛让教练脾气很坏。","memo":"temperature 家族：温度一高，脾气上头。"},{"en":"temporary","ipa":"/ˈtemprəri/","zh":"adj. 暂时的；临时的","ex":"She took a temporary job while searching for a permanent position.","exZh":"她在寻找正式职位期间做了一份临时工作。","memo":"tempor（时间）+ary：只占一时，临时。"},{"en":"tempt","ipa":"/tempt/","zh":"v. 诱惑；吸引","ex":"The smell of fresh bread tempted us into the little bakery.","exZh":"新鲜面包的香味吸引我们走进了那家小面包店。","memo":"「太渴不」：太渴也忍住不来吃，纯属诱惑。"},{"en":"tenant","ipa":"/ˈtenənt/","zh":"n. 房客；租户","ex":"The tenant is responsible for small repairs inside the flat.","exZh":"租户负责公寓内的小型维修。","memo":"「疼耐他」：房东疼耐他，房客好相处。"},{"en":"tend","ipa":"/tend/","zh":"v. 倾向；照料","ex":"Older people tend to prefer quieter holiday destinations.","exZh":"上了年纪的人往往更喜欢安静的度假地。","memo":"「疼的」：心疼的活倾向自己干，还爱照料。"},{"en":"tendency","ipa":"/ˈtendənsi/","zh":"n. 倾向；趋势","ex":"There is a growing tendency among students to study abroad.","exZh":"学生出国留学的趋势日益明显。","memo":"tend 的名词：总往一边偏，趋势。"},{"en":"tension","ipa":"/ˈtenʃn/","zh":"n. 紧张；张力；矛盾","ex":"There was obvious tension between the two teams before kickoff.","exZh":"开球前两队之间气氛明显紧张。","memo":"tense 的名词：绷紧的状态，紧张。"},{"en":"terrain","ipa":"/təˈreɪn/","zh":"n. 地形；地势","ex":"The four-wheel drive handled the rough mountain terrain easily.","exZh":"四驱车轻松应对了崎岖的山地地形。","memo":"terr（地）+ain：特殊的地理，地形。"},{"en":"territory","ipa":"/ˈterətri/","zh":"n. 领土；领域；地盘","ex":"The wild dogs defend their territory against all intruders.","exZh":"野狗保卫自己的地盘，抵御一切入侵者。","memo":"terr（地）+itory：占下的地盘，领土。"},{"en":"terror","ipa":"/ˈterə/","zh":"n. 恐怖；惊骇","ex":"The villagers fled in terror as the volcano began to rumble.","exZh":"火山开始轰鸣时，村民们惊恐地逃走了。","memo":"terrible 的根：可怕到极致，恐怖。"},{"en":"testify","ipa":"/ˈtestɪfaɪ/","zh":"v. 作证；证明","ex":"Several key witnesses testified at the public inquiry yesterday.","exZh":"昨天几位关键证人在公开调查中作证。","memo":"test（验证）+ify：拿验证说话，作证。"},{"en":"textile","ipa":"/ˈtekstaɪl/","zh":"n. 纺织品；织物","ex":"The museum displays traditional textiles from many different cultures.","exZh":"博物馆展出来自多种文化的传统纺织品。","memo":"tex（编）+tile：编织出来的，织物。"},{"en":"texture","ipa":"/ˈtekstʃə/","zh":"n. 质地；纹理；口感","ex":"This cream has a light texture and absorbs very quickly.","exZh":"这款面霜质地轻盈，吸收非常快。","memo":"textile 亲戚：织出来的手感，质地。"},{"en":"theme","ipa":"/θiːm/","zh":"n. 主题；题目","ex":"The theme of this year's book festival is friendship.","exZh":"今年图书节的主题是友谊。","memo":"「岁目」：岁岁年年的题目，主题。"},{"en":"theoretical","ipa":"/ˌθɪəˈretɪkl/","zh":"adj. 理论上的","ex":"The plan sounds good in theoretical terms but fails in practice.","exZh":"这个计划理论上听起来不错，但实践中行不通。","memo":"theory 家族：讲理论的，纸上谈兵。"},{"en":"therapy","ipa":"/ˈθerəpi/","zh":"n. 治疗；疗法","ex":"Physical therapy helped her walk again within six months.","exZh":"物理治疗帮助她在六个月内重新行走。","memo":"「谢拉皮」：谢谢拉皮医生，理疗见效。"},{"en":"thereby","ipa":"/ˌðeəˈbaɪ/","zh":"adv. 因此；从而","ex":"Fuel prices rose sharply, thereby reducing demand for large cars.","exZh":"燃油价格大幅上涨，从而降低了大排量汽车的需求。","memo":"there+by：借那道桥，因此这样。"},{"en":"thorough","ipa":"/ˈθʌrə/","zh":"adj. 彻底的；仔细的","ex":"The customs officers carried out a thorough search of the van.","exZh":"海关人员对面包车进行了彻底搜查。","memo":"「撒揉」：反复撒开揉碎查，彻底仔细。"},{"en":"threat","ipa":"/θret/","zh":"n. 威胁；恐吓","ex":"Plastic waste poses a serious threat to marine animals.","exZh":"塑料垃圾对海洋动物构成严重威胁。","memo":"treat（对待）亲戚：不好好待你，威胁你。"},{"en":"threshold","ipa":"/ˈθreʃhəʊld/","zh":"n. 门槛；临界点","ex":"The noise in the street has passed an acceptable threshold.","exZh":"街上的噪音已经超过了可接受的临界值。","memo":"thresh（踩）+hold：踩住的门口，门槛。"},{"en":"tidy","ipa":"/ˈtaɪdi/","zh":"adj. 整洁的 v. 收拾","ex":"Please keep your workspace tidy during the busy exam period.","exZh":"繁忙的考试期间请保持工作区整洁。","memo":"「太弟」：太弟爱干净，屋内整洁。"},{"en":"timid","ipa":"/ˈtɪmɪd/","zh":"adj. 胆怯的；羞怯的","ex":"The timid puppy hid behind the sofa whenever visitors arrived.","exZh":"每当有客人来，胆小的小狗就躲到沙发后面。","memo":"「替咪的」：像小猫替咪一样，胆小怯生。"},{"en":"toll","ipa":"/təʊl/","zh":"n. 通行费；伤亡人数","ex":"The flood took a heavy toll on the small fishing village.","exZh":"洪水给这个小渔村造成了惨重损失。","memo":"「掏了」：过路掏了费；伤亡掏了命。"},{"en":"ultimate","ipa":"/ˈʌltɪmət/","zh":"adj. 最终的；根本的","ex":"Their ultimate goal is to open a chain of organic restaurants.","exZh":"他们的最终目标是开一家有机餐厅连锁。","memo":"ultim（最后）+ate：排到最后，最终。"},{"en":"uncertain","ipa":"/ʌnˈsɜːtn/","zh":"adj. 不确定的；无常的","ex":"The future of the old factory still remains uncertain.","exZh":"这家老工厂的未来仍不明朗。","memo":"un（不）+certain（确定）：拿不准，不确定。"},{"en":"uncover","ipa":"/ʌnˈkʌvə/","zh":"v. 揭露；发现","ex":"Journalists uncovered serious corruption within the city council.","exZh":"记者揭露了市议会内部的严重腐败。","memo":"un（脱）+cover（盖）：揭开盖子，揭露。"},{"en":"undergraduate","ipa":"/ˌʌndəˈɡrædʒuət/","zh":"n. 本科生","ex":"Undergraduates can apply for the summer research programme in March.","exZh":"本科生可在三月申请暑期研究项目。","memo":"under（还没到）+graduate：还没毕业，本科生。"},{"en":"underlying","ipa":"/ˌʌndəˈlaɪɪŋ/","zh":"adj. 潜在的；根本的","ex":"We must address the underlying causes of the conflict, not just symptoms.","exZh":"我们必须解决冲突的根本原因，而不只是表象。","memo":"under+lying：躺在底下不露面的，潜在根本。"},{"en":"undertake","ipa":"/ˌʌndəˈteɪk/","zh":"v. 承担；从事","ex":"The laboratory undertook a major study of urban air quality.","exZh":"实验室承担了一项城市空气质量的大型研究。","memo":"under（底下）+take（拿）：把活儿接下扛，承担。"},{"en":"unemployment","ipa":"/ˌʌnɪmˈplɔɪmənt/","zh":"n. 失业；失业率","ex":"Unemployment among young people has risen sharply since the crisis.","exZh":"危机以来青年失业率大幅上升。","memo":"un（无）+employment（工作）：没工作，失业。"},{"en":"uneven","ipa":"/ʌnˈiːvn/","zh":"adj. 不平坦的；不均衡的","ex":"The old road surface was cracked and dangerously uneven.","exZh":"旧路面开裂，坑洼不平，十分危险。","memo":"un（不）+even（平）：不平整，不均匀。"},{"en":"unexpected","ipa":"/ˌʌnɪkˈspektɪd/","zh":"adj. 意外的；想不到的","ex":"The sudden summer storm was completely unexpected and caught everyone off guard.","exZh":"这场突如其来的夏季暴风雨完全出乎意料。","memo":"un（不）+expected（料到）：没料到，意外。"},{"en":"unfold","ipa":"/ʌnˈfəʊld/","zh":"v. 展开；展现","ex":"The full story unfolded slowly over the following weeks.","exZh":"在接下来的几周里，事情的全貌慢慢展开。","memo":"un（开）+fold（折）：折页打开，展开。"},{"en":"uniform","ipa":"/ˈjuːnɪfɔːm/","zh":"n. 制服 adj. 一致的","ex":"All students must wear the official school uniform every day.","exZh":"所有学生每天必须穿规定的校服。","memo":"uni（一）+form（形）：一个样子，制服统一。"},{"en":"union","ipa":"/ˈjuːniən/","zh":"n. 联盟；工会；结合","ex":"The workers formed a union to protect their basic rights.","exZh":"工人们成立了工会来保护基本权利。","memo":"uni（一）+on：拧成一体，联盟工会。"},{"en":"unique","ipa":"/juˈniːk/","zh":"adj. 独特的；唯一的","ex":"Every snowflake has a unique and beautiful crystal pattern.","exZh":"每片雪花都有独特而美丽的晶体图案。","memo":"uni（一）+que：天下独一份，独特。"},{"en":"unite","ipa":"/juˈnaɪt/","zh":"v. 联合；团结","ex":"The two small clubs united to organize a larger charity event.","exZh":"两家小俱乐部联合举办了一场更大型的慈善活动。","memo":"uni（一）+te：合为一体，联合。"},{"en":"urban","ipa":"/ˈɜːbən/","zh":"adj. 城市的；城镇的","ex":"Urban populations continue to grow faster than rural ones.","exZh":"城市人口增长继续快于农村。","memo":"「饿本」：城里机会多，饿不着，本是urban。"},{"en":"vain","ipa":"/veɪn/","zh":"adj. 徒劳的；自负的","ex":"All their attempts to save the old ship were in vain.","exZh":"他们拯救旧船的所有努力都是徒劳。","memo":"「为恩」：白白为恩情奔忙，徒劳。"},{"en":"valid","ipa":"/ˈvælɪd/","zh":"adj. 有效的；有根据的","ex":"Your passport must remain valid for at least six months.","exZh":"你的护照必须至少还有六个月有效期。","memo":"「外来的」：外来证件验真，有效才算数。"},{"en":"valley","ipa":"/ˈvæli/","zh":"n. 山谷；流域","ex":"The village lies in a green valley surrounded by pine forests.","exZh":"这个村庄坐落在松林环绕的绿色山谷中。","memo":"「外里」：群山外里一凹，山谷成村。"},{"en":"valuable","ipa":"/ˈvæljuəbl/","zh":"adj. 宝贵的；有价值的","ex":"The internship provided her with valuable practical experience.","exZh":"这份实习为她提供了宝贵的实践经验。","memo":"value 的形容词：有价值，贵重。"},{"en":"vanish","ipa":"/ˈvænɪʃ/","zh":"v. 消失；突然不见","ex":"The ancient species vanished from the region millions of years ago.","exZh":"这个古老物种在数百万年前就从该地区消失了。","memo":"「万宁」：万兽奔去宁地，消失无踪。"},{"en":"variable","ipa":"/ˈveəriəbl/","zh":"adj. 多变的 n. 变量","ex":"Weather conditions in the mountains are highly variable in spring.","exZh":"春季山区的天气状况变化极大。","memo":"vary 的形容词：会变的，变量。"},{"en":"variation","ipa":"/ˌveəriˈeɪʃn/","zh":"n. 变化；差异；变奏","ex":"There is little regional variation in the price of basic foods.","exZh":"基础食品价格的地区差异很小。","memo":"vary 的名词：变出来的花样，差异。"},{"en":"variety","ipa":"/vəˈraɪəti/","zh":"n. 多样；种类","ex":"The market sells a wide variety of fresh local vegetables.","exZh":"市场出售种类繁多的新鲜本地产蔬菜。","memo":"vary 家族：花样百出，品种多。"},{"en":"various","ipa":"/ˈveəriəs/","zh":"adj. 各种各样的","ex":"The charity provides support for various community projects nearby.","exZh":"该慈善机构为附近多个社区项目提供支持。","memo":"vary 家族：各种各样，五花八门。"},{"en":"vary","ipa":"/ˈveəri/","zh":"v. 变化；不同","ex":"Course fees vary considerably from one university to another.","exZh":"各大学的课程费用差别很大。","memo":"「歪瑞」：价格歪来瑞去，变化不断。"},{"en":"vast","ipa":"/vɑːst/","zh":"adj. 巨大的；辽阔的","ex":"The Sahara is a vast desert of sand, rock and extreme heat.","exZh":"撒哈拉是一片由沙石和酷热构成的浩瀚沙漠。","memo":"「瓦斯特」：瓦上望不到边，浩瀚辽阔。"},{"en":"verbal","ipa":"/ˈvɜːbl/","zh":"adj. 口头的；言语的","ex":"They reached a verbal agreement before signing the formal contract.","exZh":"在签署正式合同之前，他们达成了口头协议。","memo":"verb（词）家族：靠动词说话，口头的。"},{"en":"verdict","ipa":"/ˈvɜːdɪkt/","zh":"n. 裁决；结论","ex":"After three days, the jury finally reached a unanimous verdict.","exZh":"三天后，陪审团终于作出了一致裁决。","memo":"ver（真）+dict（说）：说真话定案，裁决。"},{"en":"version","ipa":"/ˈvɜːʃn/","zh":"n. 版本；说法","ex":"Each witness gave a slightly different version of the accident.","exZh":"每位目击者对事故的说法略有不同。","memo":"verse（转）+ion：转个说法，版本。"},{"en":"vertical","ipa":"/ˈvɜːtɪkl/","zh":"adj. 垂直的；纵向的","ex":"The cliff face is almost vertical in several dangerous places.","exZh":"这处崖壁在几个危险地段近乎垂直。","memo":"vertex（顶点）：从顶点直落，垂直。"},{"en":"vessel","ipa":"/ˈvesl/","zh":"n. 船只；容器；血管","ex":"Divers discovered ancient clay vessels near the sunken harbour.","exZh":"潜水员在沉没的港口附近发现了古代陶制器皿。","memo":"「外搜」：出海搜寻 vessel，大船装器皿。"},{"en":"veteran","ipa":"/ˈvetərən/","zh":"n. 老兵；老手","ex":"He is a veteran teacher with over twenty years of experience.","exZh":"他是一位有二十多年教龄的资深教师。","memo":"「韦特润」：老兵韦特，岁月磨得圆润。"},{"en":"via","ipa":"/ˈvaɪə/","zh":"prep. 经由；通过","ex":"We flew to Rome via Paris and stayed there two nights.","exZh":"我们经巴黎飞往罗马，并在那里住了两晚。","memo":"「外啊」：从外面啊绕一圈，经由。"},{"en":"venue","ipa":"/ˈvenjuː/","zh":"n. 场地；场馆","ex":"The concert venue can hold up to five thousand people.","exZh":"这个演出场馆最多可容纳五千人。","memo":"「问油」：问哪有油水场地，场馆踩点。"},{"en":"vehicle","ipa":"/ˈviːəkl/","zh":"n. 车辆；交通工具；手段","ex":"Electric vehicle sales have doubled in the past three years.","exZh":"电动汽车销量在过去三年翻了一番。","memo":"vehi（运）+cle：运人载物的，车辆。"},{"en":"victim","ipa":"/ˈvɪktɪm/","zh":"n. 受害者；牺牲品","ex":"The charity provides shelter and support for victims of flooding.","exZh":"该慈善机构为洪灾受害者提供住所和援助。","memo":"「维克替母」：维克替母挡灾，成了受害者。"},{"en":"violence","ipa":"/ˈvaɪələns/","zh":"n. 暴力；暴行","ex":"The film contains several scenes of violence and urban crime.","exZh":"这部电影包含多个暴力和城市犯罪场景。","memo":"「外哦乐恩死」：闹到外面乐极生悲，暴力。"},{"en":"virtual","ipa":"/ˈvɜːtʃuəl/","zh":"adj. 虚拟的；实际上的","ex":"The museum now offers virtual tours of its ancient galleries.","exZh":"博物馆现在提供古展厅的虚拟游览。","memo":"virtue（力）亲戚：借力造出假象，虚拟。"},{"en":"virus","ipa":"/ˈvaɪərəs/","zh":"n. 病毒","ex":"The virus spreads rapidly in crowded and poorly ventilated spaces.","exZh":"病毒在拥挤且通风不良的空间里迅速传播。","memo":"「歪若死」：病毒歪缠若死，防不胜防。"},{"en":"visible","ipa":"/ˈvɪzəbl/","zh":"adj. 看得见的；明显的","ex":"On clear days the distant island is visible from the coast.","exZh":"晴天时，从海岸可以望见远处的岛屿。","memo":"vis（看）+ible：能被看见，可见。"},{"en":"vision","ipa":"/ˈvɪʒn/","zh":"n. 视力；愿景；眼光","ex":"The new director has a clear vision for the company's future.","exZh":"新任主管对公司未来有清晰的愿景。","memo":"vis（看）+ion：看得远，愿景。"},{"en":"visual","ipa":"/ˈvɪʒuəl/","zh":"adj. 视觉的 n. 图像","ex":"The presentation includes colourful charts and other striking visual aids.","exZh":"演示文稿包含彩色图表和其他醒目的视觉辅助材料。","memo":"vis（看）+ual：用眼睛看的，视觉。"},{"en":"vital","ipa":"/ˈvaɪtl/","zh":"adj. 至关重要的；生命的","ex":"Regular sleep is vital for concentration and good mental health.","exZh":"规律睡眠对注意力和心理健康至关重要。","memo":"vit（生命）+al：关乎生命，至关重要。"},{"en":"vocal","ipa":"/ˈvəʊkl/","zh":"adj. 直言不讳的；嗓音的","ex":"She has been vocal about the need for better cycling lanes.","exZh":"她一直大声呼吁修建更好的自行车道。","memo":"voc（喊）+al：喊出来的，敢言。"},{"en":"void","ipa":"/vɔɪd/","zh":"n. 空白；空虚 adj. 无效的","ex":"The court declared the housing contract void last Friday.","exZh":"法院上周五宣布该住房合同无效。","memo":"avoid 去 a：避开后剩空白，无效。"},{"en":"volatile","ipa":"/ˈvɒlətaɪl/","zh":"adj. 动荡的；易挥发的","ex":"Oil prices remain highly volatile because of political tensions.","exZh":"由于政治紧张局势，油价仍然剧烈波动。","memo":"vol（飞）+atile：价格飞来飞去，动荡。"},{"en":"volume","ipa":"/ˈvɒljuːm/","zh":"n. 体积；音量；量","ex":"Could you turn down the volume of the television, please?","exZh":"请你把电视音量调低一点好吗？","memo":"「我溜木」：木箱体积大，音量溜出去。"},{"en":"volunteer","ipa":"/ˌvɒlənˈtɪə/","zh":"n. 志愿者 v. 自愿做","ex":"She volunteers at the animal shelter every weekend morning.","exZh":"她每个周末上午都在动物收容所做志愿者。","memo":"volunt（意愿）+eer：凭意愿来，自愿。"},{"en":"vote","ipa":"/vəʊt/","zh":"v./n. 投票；表决","ex":"Citizens over eighteen have the right to vote in elections.","exZh":"十八岁以上公民有权在选举中投票。","memo":"「我投」：我投我一票，投票表决。"},{"en":"wage","ipa":"/weɪdʒ/","zh":"n. 工资；工钱 v. 发动（战争）","ex":"The national minimum wage rose by nearly five percent this year.","exZh":"今年全国最低工资上涨了近百分之五。","memo":"「喂吃」：工资拿来喂吃喂穿。"},{"en":"wander","ipa":"/ˈwɒndə/","zh":"v. 漫游；走神；徘徊","ex":"We wandered around the old town for hours after dinner.","exZh":"晚饭后我们在老城区逛了好几个小时。","memo":"wonder（好奇）：好奇到处走，漫游。"},{"en":"warehouse","ipa":"/ˈweəhaʊs/","zh":"n. 仓库；货栈","ex":"The imported goods are stored in a warehouse outside the port.","exZh":"进口货物存放在港口外的一座仓库里。","memo":"ware（货）+house（屋）：放货的屋，仓库。"},{"en":"weaken","ipa":"/ˈwiːkən/","zh":"v. 削弱；使变弱","ex":"The long crisis has seriously weakened the country's economy.","exZh":"长期危机严重削弱了该国经济。","memo":"weak（弱）+en：变弱，削弱。"},{"en":"wealth","ipa":"/welθ/","zh":"n. 财富；大量","ex":"The nation's wealth depends heavily on oil and gas exports.","exZh":"该国财富严重依赖石油和天然气出口。","memo":"weal（福利）+th：福利堆成山，财富。"},{"en":"welfare","ipa":"/ˈwelfeə/","zh":"n. 福利；幸福","ex":"The government has increased spending on child welfare programmes.","exZh":"政府增加了儿童福利项目的支出。","memo":"wel（好）+fare（过活）：过得好，福利。"},{"en":"weird","ipa":"/wɪəd/","zh":"adj. 奇怪的；怪异的","ex":"The abandoned house had a weird smell and flickering lights.","exZh":"那座废弃的房子有一股怪味，灯光忽明忽暗。","memo":"「外儿的」：外儿来的怪东西，诡异。"},{"en":"weary","ipa":"/ˈwɪəri/","zh":"adj. 疲惫的；厌倦的","ex":"The weary travellers finally reached the mountain hotel after midnight.","exZh":"疲惫的旅人们午夜后终于到达了山间旅馆。","memo":"wear（穿旧）+y：穿到旧了，疲惫。"},{"en":"whereas","ipa":"/ˌweərˈæz/","zh":"conj. 然而；鉴于","ex":"The north is mountainous, whereas the south is mostly flat farmland.","exZh":"北部多山，而南部主要是平坦的农田。","memo":"where+as：两头一比，然而。"},{"en":"widespread","ipa":"/ˈwaɪdspred/","zh":"adj. 广泛的；普遍的","ex":"The use of mobile payment is now widespread across the country.","exZh":"如今移动支付已在全国普及。","memo":"wide（宽）+spread（铺开）：铺得宽，普遍。"},{"en":"width","ipa":"/wɪdθ/","zh":"n. 宽度；广度","ex":"The river reaches a maximum width of two hundred metres.","exZh":"这条河最宽处达两百米。","memo":"wide 的名词：宽的量度，宽度。"},{"en":"willing","ipa":"/ˈwɪlɪŋ/","zh":"adj. 乐意的；自愿的","ex":"She is willing to work extra hours during the busy season.","exZh":"旺季时她愿意加班工作。","memo":"will（愿意）+ing：乐意干的。"},{"en":"wisdom","ipa":"/ˈwɪzdəm/","zh":"n. 智慧；才智","ex":"Many proverbs contain the practical wisdom of earlier generations.","exZh":"许多谚语蕴含着前人的实用智慧。","memo":"wise 的名词：聪明的结晶，智慧。"},{"en":"withdraw","ipa":"/wɪðˈdrɔː/","zh":"v. 撤回；取款；退出","ex":"He withdrew some cash from the machine before the concert.","exZh":"音乐会前他从取款机取了一些现金。","memo":"with（往回）+draw（拉）：拉回取走，撤回。"},{"en":"witness","ipa":"/ˈwɪtnəs/","zh":"n. 目击者；证人 v. 目睹","ex":"Police interviewed several witnesses to the early morning accident.","exZh":"警方询问了凌晨事故的几名目击者。","memo":"wit（见识）+ness：有见识在场，目击者。"},{"en":"wipe","ipa":"/waɪp/","zh":"v. 擦；抹去","ex":"Wipe the kitchen table with a damp cloth after dinner.","exZh":"晚饭后用湿抹布擦擦厨房的桌子。","memo":"「外铺」：抹布外铺一擦，干净。"},{"en":"workshop","ipa":"/ˈwɜːkʃɒp/","zh":"n. 车间；研讨会","ex":"The university runs a free workshop on academic writing skills.","exZh":"大学开办了免费学术写作技能研讨会。","memo":"work（活）+shop（坊）：干活的坊，车间研讨。"},{"en":"worthwhile","ipa":"/ˌwɜːθˈwaɪl/","zh":"adj. 值得做的","ex":"Volunteering abroad proved a worthwhile experience for the whole group.","exZh":"事实证明，海外志愿服务对全组人来说都是值得的。","memo":"worth（值）+while（时光）：时光花得值，值得。"},{"en":"worship","ipa":"/ˈwɜːʃɪp/","zh":"v./n. 崇拜；敬仰","ex":"In ancient times, people worshipped the sun and the moon.","exZh":"古时候，人们崇拜太阳和月亮。","memo":"worth+ship：值得上船追随，崇拜。"},{"en":"wrap","ipa":"/ræp/","zh":"v. 包；裹 n. 包装材料","ex":"She wrapped the birthday gift in brightly coloured paper.","exZh":"她用色彩鲜艳的纸把生日礼物包了起来。","memo":"「锐铺」：彩纸锐铺一圈，包起来。"},{"en":"xenophobia","ipa":"/ˌzenəˈfəʊbiə/","zh":"n. 仇外；排外","ex":"The report examines growing xenophobia in several European countries.","exZh":"报告探讨了欧洲几个国家日益严重的排外情绪。","memo":"xeno（外）+phobia（恐惧）：怕外来者，排外。"},{"en":"yacht","ipa":"/jɒt/","zh":"n. 游艇；快艇","ex":"They spent the summer weekend sailing on a friend's yacht.","exZh":"他们周末乘朋友的游艇出海航行。","memo":"「哟特」：哟，特别豪的游艇。"},{"en":"yawn","ipa":"/jɔːn/","zh":"v./n. 打哈欠","ex":"The long afternoon lecture made more than one student yawn.","exZh":"下午冗长的讲座让不止一个学生打起了哈欠。","memo":"「牙恩」：牙一恩张开，哈欠来了。"},{"en":"yearly","ipa":"/ˈjɪəli/","zh":"adj./adv. 每年（的）","ex":"The flower show is a popular yearly event in the town.","exZh":"花展是镇上一项颇受欢迎的年度活动。","memo":"year 的加版：年年都来，每年。"},{"en":"yearn","ipa":"/jɜːn/","zh":"v. 渴望；向往","ex":"After years abroad, she yearned for the tastes of home.","exZh":"旅居海外多年后，她渴望尝到家乡的味道。","memo":"「厌嗯」：厌了城市嗯要回乡，满心渴望。"},{"en":"youngster","ipa":"/ˈjʌŋstə/","zh":"n. 年轻人；少年","ex":"The club offers free swimming lessons for local youngsters.","exZh":"俱乐部为当地青少年提供免费游泳课。","memo":"young 的加版：小年轻一枚。"},{"en":"zeal","ipa":"/ziːl/","zh":"n. 热情；热忱","ex":"She approached her studies with impressive zeal and energy.","exZh":"她以令人赞叹的热情和精力投入学习。","memo":"「热儿」：干劲十足往前走，热忱满满。"},{"en":"zealous","ipa":"/ˈzeləs/","zh":"adj. 热情的；积极的","ex":"Zealous volunteers cleaned the whole beach before sunrise.","exZh":"热心的志愿者们在日出前清理了整个海滩。","memo":"zeal 的形容词：热情满满，干劲十足。"},{"en":"zigzag","ipa":"/ˈzɪɡzæɡ/","zh":"n./adj. 之字形；曲折","ex":"The narrow path zigzags steeply up the mountainside.","exZh":"狭窄的小路呈之字形陡峭地盘上山坡。","memo":"zig 一折 zag 一折，之字形。"},{"en":"zone","ipa":"/zəʊn/","zh":"n. 区域；地带","ex":"The city centre has become a low-emission traffic zone.","exZh":"市中心已成为低排放交通区。","memo":"「粥恩」：粥摊恩准摆在这片区域。"},{"en":"zoom","ipa":"/zuːm/","zh":"v. 急速移动；猛涨 n. 嗡嗡声","ex":"Online orders zoomed during the holiday shopping season.","exZh":"假日购物季期间网上订单激增。","memo":"嗡——一下蹿出去，急速猛涨。"}];window.IELTS_DATA=window.IELTS_DATA||{};window.IELTS_DATA.VOCAB=W;})();

<script>
/* 口语题库：任务16《雅思口语写作》原题库（Part1×30、Part2×10）+ 本项目补写 Part3×30 */
(function(){"use strict";var S=[{"part":1,"topic":"Hometown","q":"Where is your hometown?","qZh":"你的家乡在哪里？","ans6":"I come from Chengdu, a big city in the southwest of China. It is famous for spicy food and lovely pandas, so many tourists visit every year. I have lived there since I was born, and my parents still live there. In my heart, it is always a warm and comfortable place.","upgrades":["a sprawling metropolis（一座庞大的都市）","it has a laid-back vibe（生活节奏很悠闲）","renowned for its spicy cuisine（以辣味菜肴闻名）","it holds a special place in my heart（在我心中地位特殊）"]},{"part":1,"topic":"Hometown","q":"What do you like most about your hometown?","qZh":"你最喜欢家乡的什么？","ans6":"What I like most is the food. There are countless small restaurants on every street, and the dishes are tasty but not expensive. Also, people in my hometown are friendly and easygoing, so life feels relaxing. Whenever I walk around at night, the streets are lively and full of energy.","upgrades":["a foodie paradise（美食天堂）","the locals are incredibly welcoming（当地人非常热情）","it buzzes with life（充满活力、生机勃勃）","affordable yet delicious（物美价廉）"]},{"part":1,"topic":"Work or Study","q":"Do you work or are you a student?","qZh":"你是在工作还是学生？","ans6":"I am currently a student at university. I major in business management, and I am in my third year. I have classes most weekdays, and in my free time I do part-time work in a coffee shop. It keeps me busy, but I enjoy both sides of my life.","upgrades":["pursuing a degree in...（攻读……学位）","juggle study and part-time work（兼顾学业与兼职）","in my junior year（读大三）","it keeps me on my toes（让我一直忙碌充实）"]},{"part":1,"topic":"Work or Study","q":"Why did you choose your major?","qZh":"你为什么选择这个专业？","ans6":"Honestly, I chose it for two main reasons. First, I have always been interested in how companies operate, and my father runs a small business, so I grew up around it. Second, I believed this major would offer good job opportunities in the future. So far, I think I made a sensible choice.","upgrades":["it was a pragmatic choice（是个务实的选择）","I was drawn to...（我被……吸引）","career prospects（职业前景）","in hindsight（事后看来）"]},{"part":1,"topic":"Accommodation","q":"Do you live in a house or an apartment?","qZh":"你住独栋房子还是公寓？","ans6":"I live in an apartment with my family. It is on the twelfth floor of a high-rise building, so the view from the window is quite nice. We have three bedrooms and a small balcony where my mother grows flowers. The flat is not huge, but it is cozy and convenient.","upgrades":["a high-rise flat（高层公寓）","breathtaking views（迷人的景色）","compact but cozy（小而温馨）","within walking distance of...（步行可达……）"]},{"part":1,"topic":"Accommodation","q":"What is your favourite room in your home?","qZh":"你最喜欢家里的哪个房间？","ans6":"My favourite room is definitely my bedroom, because it is my own private space. I decorated the walls with photos and posters, and there is a comfortable chair by the window where I read. Whenever I feel tired or stressed, I just stay there and relax. It really helps me recharge.","upgrades":["my own sanctuary（我的私密小天地）","I can totally unwind there（我能在那儿彻底放松）","it doubles as my study（它还兼作我的书房）","recharge my batteries（恢复精力）"]},{"part":1,"topic":"Weather","q":"What is the weather like in your city?","qZh":"你所在城市的天气怎么样？","ans6":"The weather in my city changes a lot across the year. Summers are hot and humid, sometimes above thirty-five degrees, while winters are quite cold and dry. My favourite season is autumn, because the sky is clear and the temperature is just right. Unfortunately, spring is often windy and dusty.","upgrades":["scorching hot（酷热难耐）","freezing cold（严寒刺骨）","mild and pleasant（温和宜人）","unpredictable weather（变幻莫测的天气）"]},{"part":1,"topic":"Weather","q":"Do you prefer hot weather or cold weather?","qZh":"你更喜欢热天气还是冷天气？","ans6":"I prefer cold weather, to be honest. When it is cold, I can simply put on more clothes and feel comfortable, but in hot weather I sweat a lot and lose energy quickly. Also, I sleep much better in winter because of the cool air. That is why I like cold days more.","upgrades":["I can't stand the heat（我受不了热）","bundle up in layers（一层层裹上衣服）","sweltering summer（酷暑）","crisp winter air（清爽的冬日空气）"]},{"part":1,"topic":"Food","q":"What is your favourite food?","qZh":"你最喜欢的食物是什么？","ans6":"My favourite food is hotpot, a traditional dish from southwest China. You cook raw meat and vegetables in a pot of spicy soup at the table. I love it because it is tasty and social at the same time. My friends and I usually gather for hotpot once or twice a month.","upgrades":["mouth-watering（令人垂涎的）","a social dining experience（社交性的用餐体验）","I have a sweet tooth（我爱吃甜食）","irresistible（让人无法抗拒的）"]},{"part":1,"topic":"Food and Cooking","q":"Do you like cooking?","qZh":"你喜欢做饭吗？","ans6":"I can cook some simple dishes, but I would not call myself a good cook. On weekdays I usually just make noodles or fried rice because I am short on time. However, at weekends I sometimes follow online recipes and try something new. Even when the dish fails, the process is fun.","upgrades":["whip up a quick meal（麻利地做顿便饭）","follow recipes step by step（照着菜谱一步步做）","a novice in the kitchen（厨房新手）","experiment with new dishes（尝试新菜式）"]},{"part":1,"topic":"Hobbies","q":"What do you usually do in your free time?","qZh":"你空闲时间通常做什么？","ans6":"In my free time, I mostly do sports and watch films. I play badminton with my classmates twice a week, which keeps me fit. When I stay at home, I enjoy watching documentaries because they are entertaining and educational. On sunny afternoons, I also like cycling around the nearby park.","upgrades":["stay in shape（保持身材）","a film buff（资深影迷）","kill time（消磨时间）","unwind after a long day（漫长一天后放松）"]},{"part":1,"topic":"Hobbies","q":"Did you have any hobbies when you were a child?","qZh":"你小时候有什么爱好吗？","ans6":"Yes, I had several hobbies when I was little. My favourite one was collecting stamps, and I kept a thick album full of stamps from different countries. I also loved drawing cartoons on the walls of my home, although m

y mother was not happy about it. Those memories are still very sweet.","upgrades":["take up a hobby（开始一项爱好）","I was obsessed with...（我痴迷于……）","fond childhood memories（美好的童年回忆）","keep me entertained for hours（让我玩上好几个小时）"]},{"part":1,"topic":"Mobile Phone","q":"How often do you use your mobile phone?","qZh":"你多久用一次手机？","ans6":"To be honest, I use it too much, maybe five or six hours a day. I check messages, browse short videos, and use maps when I go out. It is also my alarm clock and my wallet, since I pay for almost everything with my phone. I guess I cannot live without it now.","upgrades":["glued to my phone（机不离手）","scroll through short videos（刷短视频）","an indispensable tool（不可或缺的工具）","screen time（屏幕使用时间）"]},{"part":1,"topic":"Social Media","q":"Which social media apps do you use most often?","qZh":"你最常用哪些社交媒体应用？","ans6":"Yes, I use social media every day, mainly WeChat and a short-video app called Douyin. I use WeChat to chat with friends and family, and Douyin mostly for fun after dinner. Sometimes I post photos of my meals or trips. Honestly, I spend more time on it than I should.","upgrades":["keep in touch with...（与……保持联系）","post updates（发布动态）","I am a bit addicted to it（我有点上瘾）","mindlessly scrolling（无意识地刷屏）"]},{"part":1,"topic":"Transport","q":"How do you usually travel around your city?","qZh":"你通常怎么在城市里出行？","ans6":"I usually travel by subway, because it is fast and never gets stuck in traffic. My home is ten minutes' walk from the nearest station, so it is very convenient. If the weather is nice and the distance is short, I prefer riding a shared bike. Taxis are my last choice because they cost too much.","upgrades":["beat the traffic（避开拥堵）","a cost-effective way of getting around（划算的出行方式）","hail a cab（打车）","my daily commute（我每天的通勤）"]},{"part":1,"topic":"Pets","q":"Do you like pets? Do you have any pets?","qZh":"你喜欢宠物吗？你养宠物吗？","ans6":"I do not have a pet at the moment, because my flat is small and my parents are quite busy. But I really love dogs, especially golden retrievers, as they are gentle and clever. My cousin has a lovely dog, so I often play with it when I visit. Maybe I will adopt one in the future.","upgrades":["a dog person（喜欢狗的人）","loyal companions（忠实的伙伴）","adopt a pet（领养宠物）","they are low-maintenance（它们好养活、省心）"]},{"part":1,"topic":"Sleep","q":"How many hours do you sleep every day?","qZh":"你每天睡几个小时？","ans6":"I usually sleep about seven hours on weekdays, from midnight to seven in the morning. During exams, it often drops to five or six hours, which makes me sleepy in class. At weekends I stay up later and get up later too. I know I should keep a more regular schedule.","upgrades":["stay up late（熬夜）","a night owl（夜猫子）","catch up on sleep（补觉）","sleep like a log（睡得很沉）"]},{"part":1,"topic":"Sports","q":"Do you like doing sports?","qZh":"你喜欢做运动吗？","ans6":"Yes, I am quite into sports, especially ball games. I play badminton and basketball with my friends at the university gym every week. Watching sports is also fun for me, and I never miss important football matches. Sports not only keep me healthy but also help me make new friends.","upgrades":["be keen on...（热衷于……）","work out（健身锻炼）","a great stress reliever（很好的减压方式）","team spirit（团队精神）"]},{"part":1,"topic":"Reading","q":"Do you enjoy reading?","qZh":"你喜欢阅读吗？","ans6":"Yes, I enjoy reading, though I do not have as much time for it as before. These days I read mostly on my phone, usually news and short articles. Before bed, I sometimes read novels because they help me relax. My favourite type is detective stories, since the plots are exciting.","upgrades":["an avid reader（热衷阅读的人）","a page-turner（让人爱不释手的书）","curl up with a book（舒舒服服地窝着看书）","broaden my horizons（开阔眼界）"]},{"part":1,"topic":"Music","q":"Do you like music? What kind of music do you like?","qZh":"你喜欢音乐吗？喜欢什么类型的音乐？","ans6":"Yes, music is a big part of my daily life. I listen to pop songs and light music on my way to school, and sometimes soft piano music when I study. It helps me relax and lifts my mood when I feel down. I used to play the guitar, but I gave it up due to exams.","upgrades":["uplifting tunes（振奋人心的曲子）","a soothing melody（舒缓的旋律）","it strikes a chord with me（深深打动我）","sing along（跟着哼唱）"]},{"part":1,"topic":"Shopping","q":"Do you prefer shopping online or in physical stores?","qZh":"你更喜欢网购还是实体店购物？","ans6":"I like shopping, but I do most of it online now because it saves time and money. I usually buy clothes, books and snacks on shopping apps, and the parcels arrive within two or three days. However, for shoes I still prefer physical stores, since I need to try them on first.","upgrades":["shop around（货比三家）","a bargain hunter（爱淘便宜货的人）","try before you buy（先试后买）","door-to-door delivery（送货上门）"]},{"part":1,"topic":"Holidays","q":"How do you usually spend your holidays?","qZh":"你通常怎么度过假期？","ans6":"It depends on the length of the holiday. For short breaks, I just stay at home, sleep late and meet friends. For longer holidays like National Day, I usually travel to another city with my family or classmates. Last year we went to Yunnan, and the trip was really unforgettable.","upgrades":["get away from it all（远离尘嚣）","a short getaway（短途小旅行）","recharge myself（给自己充电）","make the most of...（充分利用……）"]},{"part":1,"topic":"Colours","q":"What is your favourite colour?","qZh":"你最喜欢的颜色是什么？","ans6":"My favourite colour is blue, especially the dark blue of the night sky. I find it calm and peaceful, so many things I own are blue, like my bag and my bedsheets. Also, blue clothes look good on me, I think. Maybe that is the main reason I like it.","upgrades":["it really suits me（它很适合我）","a soothing colour（让人安心的颜色）","vibrant（鲜艳明快的）","it lifts my spirits（让我心情变好）"]},{"part":1,"topic":"Taking Photos","q":"Do you like taking photos?","qZh":"你喜欢拍照吗？","ans6":"Yes, I take photos almost every day with my phone. I mostly photograph food, sunsets and my friends when we hang out. For me, photos are like a diary, because looking at them brings back good memories. I am not good at professional photography, but I enjoy it anyway.","upgrades":["capture the moment（捕捉瞬间）","picture-perfect（完美如画的）","it brings back memories（唤起回忆）","a quick snapshot（随手一拍）"]},{"part":1,"topic":"Daily Routine","q":"Can you describe your daily routine?","qZh":"你能描述一下你的日常安排吗？","ans6":"On weekdays, I get up at seven, wash up quickly and grab breakfast on the way to class. I usually have lessons until four in the afternoon, then I go to the gym or do homework. After dinner, I study for a couple of hours and watch videos to relax. I go to bed around midnight.","upgrades":["a creature of habit（生活非常规律的人）","stick to a routine（坚持规律作息）","grab a bite（随便吃点东西）","wind down（放松下来）"]},{"part":1,"topic":"Friends","q":"Do you have many friends?","qZh":"你有很多朋友吗？","ans6":"I have quite a few friends, but only a few close ones. Most of them are my classmates or people I met through sports. We chat online every day and meet at weekends for meals or badminton. For me, quality matters more than quantity when it comes to friendship.","upgrades":["a close-knit circle of friends（关系紧密的朋友圈）","get along well with...（与……相处融洽）","we really click（我们很投缘）","quality over quantity（重质不重量）"]},{"part":1,"topic":"Family","q":"Do you spend a lot of time with your family?","qZh":"你和家人相处的时间多吗？","ans6":"Not really, because I study in another city and only go home during long holidays. But we talk on the phone almost every day, usually for a few minutes after dinner. During Spring Festival, we spend two whole weeks together, which I always look forward to.","upgrades":["family bonds（亲情纽带）","catch up with...（与……叙旧聊天）","a family reunion（家庭团聚）","it means a lot to me（对我意义重大）"]},{"part":1,"topic":"Birthdays","q":"How do you usually celebrate your birthday?","qZh":"你通常怎么庆祝生日？","ans6":"I usually celebrate my birthday with my close friends. We go to a restaurant for dinner, and then they give me small gifts and a cake. In recent years, my family also video-calls me if I am away at university. It is a simple celebration, but it always makes me happy.","upgrades":["throw a party（办派对）","a low-key celebration（低调的庆祝）","make a wish and blow out the candles（许愿吹蜡烛）","a memorable occasion（难忘的时刻）"]},{"part":1,"topic":"Concentration","q":"Is it easy for you to concentrate?","qZh":"你容易集中注意力吗？","ans6":"It depends on the environment. In a quiet library, I can focus for two or three hours without a problem. But at home, I get distracted by my phone every few minutes, which is a bad habit. So when I really need to study, I leave my phone in another room.","upgrades":["zone out（走神）","stay focused（保持专注）","a major distraction（一大干扰源）","be in the zone（进入专注状态）"]},{"part":1,"topic":"Public Transport","q":"How often do you use public transport?","qZh":"你多久坐一次公共交通？","ans6":"Yes, almost every day. The subway is my main transport, and I sometimes take the bus when the subway is too crowded. It is cheap, fast and environmentally friendly. The only problem is rush hour, when the carriages are so packed that you can hardly move.","upgrades":["rush hour（高峰时段）","packed like sardines（挤得像沙丁鱼一样）","eco-friendly（环保的）","a smooth ride（顺畅的旅程）"]},{"part":2,"topic":"Describe a person","q":"Describe a person who has helped you a lot. You should say: who this person is; how you know them; how they helped you; and explain how you felt after receiving their help.","qZh":"描述一个帮助过你很多的人。你需要说：这个人是谁；你如何认识他/她；他/她如何帮助你；并说明你得到帮助后的感受。","ans6":"The person I want to talk about is my high school English teacher, Ms. Wang. She taught me for three years, so we knew each other very well. When I was in my final year, my English was quite weak, and I failed an important exam, which made me really upset. Ms. Wang noticed my problem and offered to help me after class. Every Friday afternoon, she spent one hour explaining grammar and correcting my essays, and she never charged me anything. She also checked my progress after every test, which made me feel that someone truly cared about my future. She also taught me simple ways to remember new words, like making word cards. She also taught me simple ways to remember new words, like making word cards, and she reminded me to review them at fixed times instead of cramming before exams. Little by little, my English improved, Little by little, my English improved, and I even started to enjoy the subject instead of fearing it, and in the final exam I got a much higher score than before. I felt really grateful to her, because she did not have to spend her own free time on me. Her help changed my future, and I still visit her every Teachers' Day to say thank you. I still visit her every Teachers' Day to say thank you. When I passed the exam that mattered most, the first person I wanted to tell was her, and she smiled as if the success were her own.","upgrades":["go the extra mile（格外尽心尽力）","out of the goodness of her heart（纯粹出于善意）","I can't thank her enough（对她感激不尽）","a turning point in my life（我人生的转折点）"]},{"part":2,"topic":"Describe a person","q":"Describe an old friend you have known for a long time. You should say: who this friend is; how you met; what you do together; and explain why your friendship has lasted so long.","qZh":"描述一位认识很久的老朋友。你需要说：这位朋友是谁；你们如何认识的；你们一起做什么；并说明你们的友谊为何能长久。","ans6":"My oldest friend is called Li Ming, and we have known each other for about twelve years now. We first met in primary school, where we sat at the same desk for two years. Although we went to different high schools and universities, we never lost touch. Even when one of us failed an exam or lost a job, the other was always the first phone call. These days we meet once or twice a month, usually for hotpot or a basketball game. usually for hotpot or a basketball game. Every year we also take a short trip together, and those weekends recharge both of us. Sometimes we just walk along the river and talk about our plans and problems. What I like most about him is that he is a really good listener, and he always tells me the truth even when it is hard to hear. he always tells me the truth even when it is hard to hear. For example, when I was about to make a bad decision about my major, he questioned me seriously, and looking back, he was right. I think our friendship has lasted because we trust each other completely and because we make time for each other no matter how busy we are. He is like a brother to me, and I hope we will still be close when we are old. I hope we will still be close when we are old, and our children, if we have any, should know each other too.","upgrades":["we go way back（我们是多年的老友）","lose touch（失去联系）","a friend in need is a friend indeed（患难见真情）","kindred spirits（志趣相投的知己）"]},{"part":2,"topic":"Describe a person","q":"Describe a famous person you admire. You should say: who this person is; how you know about them; what they have done; and explain why you admire them.","qZh":"描述一位你敬佩的名人。你需要说：这个人是谁；你是如何知道他/她的；他/她做过什么；并说明你为什么敬佩他/她。","ans6":"A famous person I really admire is Yuan Longping, the father of hybrid rice. I first learned about him in a biology textbook at school, and later I watched several documentaries about his life. He spent over fifty years working in rice fields, trying to develop rice that could produce much more grain. Thanks to his research, millions of people in China and other countries have enough food to eat. millions of people in China and other countries have enough food to eat. It is said that his hybrid rice still feeds a large share of the world's population today, which is a rare achievement for any scientist. What moved me most was that even in his eighties, he still went to the fields every day and kept doing experiments. he still went to the fields every day and kept doing experiments. His team worked in hot summers and cold winters, measuring plants one by one, because they believed success in the field matters more than papers on a wall. He lived a simple life and never showed off his achievements. He lived a simple life and never showed off his achievements. He wore simple shirts and spoke in plain language, and he called himself a farmer rather than a genius. I admire him because he used his knowledge to solve a real problem for ordinary people, instead of working only for money or fame. Whenever I meet difficulties in my studies, I think about his patience and hard work, and they give me strength to carry on.","upgrades":["a household name（家喻户晓的人物）","dedicate one's life to...（毕生致力于……）","humble beginnings（出身平凡）","a true role model（真正的榜样）"]},{"part":2,"topic":"Describe a person","q":"Describe a family member you spend a lot of time with. You should say: who this person is; what he or she is like; what you do together; and explain why you enjoy spending time with this person.","qZh":"描述一位你经常相处的家人。你需要说：这个人是谁；他/她是个怎样的人；你们一起做什么；并说明你为什么喜欢和这个人相处。","ans6":"The family member I spend the most time with is my mother. She is around fifty years old and works as a nurse in a local hospital. She is patient, hard-working and a little talkative, especially when it comes to my daily life. especially when it comes to my daily life. Sometimes her calls last longer than my lessons, and she still asks whether I have eaten properly. We usually cook dinner together in the evening: she does the main dishes, and I wash the vegetables and set the table. she does the main dishes, and I wash the vegetables and set the table. Cooking together is our way of talking: stories come out naturally while our hands are busy, and dinner always tastes better for it. At weekends, we often go shopping at the market and then watch a TV series together. She likes to share what happened at work, and I tell her about my school life, so we never run out of things to say. I enjoy her company because she never judges me and always supports my decisions, even when she disagrees. even when she disagrees. When I once wanted to change my study plan, she listened carefully, asked gentle questions and finally trusted my judgement. Honestly, she is not just my mother but also my closest friend, and I feel relaxed and safe whenever she is around. I feel relaxed and safe whenever she is around. Nurses like her are busy and tired, yet she never brings that stress home, which I deeply admire.","upgrades":["we are on the same wavelength（我们很合拍）","unconditional support（无条件的支持）","a strong bond（深厚的感情纽带）","see eye to eye（看法一致）"]},{"part":2,"topic":"Describe a person","q":"Describe a teacher you liked when you were a student. You should say: who this teacher was; what subject he or she taught; what was special about his or her classes; and explain why you liked this teacher.","qZh":"描述一位你学生时代喜欢的老师。你需要说：这位老师是谁；教什么科目；他/她的课有什么特别之处；并说明你为什么喜欢这位老师。","ans6":"I would like to talk about Mr. Chen, my physics teacher in senior high school. He was in his forties and wore glasses, and he always had a friendly smile on his face. he always had a friendly smile on his face. He also told jokes about famous scientists, which made the classroom feel like a place for stories rather than formulas. His classes were special because he never just read from the textbook. Instead, he brought small experiments to class, like using a bottle and water to explain air pressure, so everyone could see how physics worked in real life. He was also very patient: if a student did not understand, he explained it again in a simpler way without any anger. he explained it again in a simpler way without any anger. He often drew little diagrams on the blackboard until the whole class nodded, and those pictures stayed in my mind for years. Once, I got a very low score, and instead of criticizing me, he helped me find my weak points and made a study plan for me. he helped me find my weak points and made a study plan for me. We reviewed the plan every two weeks, and he adjusted it whenever I improved faster than expected. I liked him because he made a difficult subject interesting and made me believe I could do well. Many of my classmates chose science majors later, partly because of him.","upgrades":["make learning fun（让学习变得有趣）","bring the subject to life（让这门学科生动起来）","hands-on experiments（动手实验）","a positive influence on...（对……产生积极影响）"]},{"part":2,"topic":"Describe a place","q":"Describe a city you have visited that you would recommend to others. You should say: where the city is; when you went there; what you did there; and explain why you would recommend it.","qZh":"描述一座你去过并愿意推荐的城市。你需要说：这座城市在哪里；你什么时候去的；你在那里做了什么；并说明你为什么推荐它。","ans6":"The city I want to recommend is Xi'an, which is in the northwest of China. I went there with two classmates during the summer holiday after my first year at university. Xi'an used to be the capital of several ancient dynasties, so it is full of history. We visited the Terracotta Warriors, which was truly amazing, and we also cycled on the ancient city wall in the evening when the weather was cool. we also cycled on the ancient city wall in the evening when the weather was cool. From the top of the wall we could see the whole city, and the sunset made the grey bricks turn gold. The food there was another highlight: we tried lamb noodles and a local kind of burger called roujiamo, and everything was cheap and delicious. everything was cheap and delicious. A full dinner for three students cost less than one fancy coffee back home, which still surprises my friends. What surprised me most was that the modern part of the city is lively too, with light shows and street music at night. with light shows and street music at night. We joined a night tour of a museum, where actors in ancient costumes told stories about the dynasties. I would recommend Xi'an because it has something for everyone: history for people who love culture, and great food and nightlife for young travellers. I am already planning to go back.","upgrades":["steeped in history（历史悠久）","a treasure trove of culture（文化宝库）","bustling nightlife（热闹的夜生活）","a must-visit destination（必游之地）"]},{"part":2,"topic":"Describe a place","q":"Describe a quiet place you like to spend time in. You should say: where it is; how often you go there; what you do there; and explain why you like it.","qZh":"描述一个你喜欢待的安静地方。你需要说：它在哪里；你多久去一次；你在那里做什么；并说明你为什么喜欢它。","ans6":"My favourite quiet place is a small library near my university. It is only ten minutes from my dormitory, hidden behind some old trees, so many students do not even know it exists. hidden behind some old trees, so many students do not even know it exists. To find it, you walk past a small garden gate, and the noise of the campus simply disappears. I go there two or three times a week, especially before exams. The library has wide wooden desks and soft lights, and everyone there speaks in whispers, so the atmosphere is perfect for study. I usually do my homework there, or read novels that I cannot finish at home. I usually do my homework there, or read novels that I cannot finish at home. The librarians know regular readers by face, and they sometimes leave new books on our desks that match what we borrow. Sometimes I just sit by the window and watch the rain outside, which makes me feel calm. I like this place because my dorm is always noisy, with roommates playing games or chatting. with roommates playing games or chatting, and the beds are so close together that even a phone call becomes public. In the library, nobody disturbs me, and time seems to slow down. time seems to slow down. Even the sound of pages turning feels friendly in that quiet room. After two hours there, my mind is clear again, and all my stress disappears. It is like my secret base in the city.","upgrades":["an oasis of calm（宁静的绿洲）","get away from the hustle and bustle（远离喧嚣）","recharge my batteries（恢复精力）","a haven for bookworms（读书人的天堂）"]},{"part":2,"topic":"Describe a place","q":"Describe a place you like to go to relax. You should say: where this place is; how you found it; what you do there; and explain why it helps you relax.","qZh":"描述一个你喜欢去放松的地方。你需要说：这个地方在哪里；你是怎么发现它的；你在那里做什么；并说明它为什么能让你放松。","ans6":"The place where I relax best is a small coffee shop called Slow Time, on a street near my home. I discovered it by accident two years ago when I got lost on my way to a friend's house. It is not big, only six tables, and it plays soft jazz music all day. it plays soft jazz music all day. The tables are old wooden ones, covered with small drawings from customers, and the coffee cups are mismatched on purpose. I go there once or twice a week, usually on Saturday afternoon. I order a cup of latte, find a seat by the window, and read a book or just watch people passing by. Sometimes I bring my diary and write about my week. Sometimes I bring my diary and write about my week. The other regulars are quiet too, so we nod hello but never disturb each other, which is a rare kind of friendship. The owner never rushes the customers, and the smell of coffee makes everything feel slow and peaceful. the smell of coffee makes everything feel slow and peaceful. Rainy days are the best there, because the sound outside makes the shop feel even cozier. This place helps me relax because there are no screens, no deadlines and no noise there. After an hour or two, my worries seem smaller, and I always leave with more energy. It has become part of my weekly routine.","upgrades":["unwind and de-stress（放松减压）","a home away from home（像家一样自在的地方）","slow down the pace（放慢节奏）","a breath of fresh air（令人耳目一新）"]},{"part":2,"topic":"Describe a place","q":"Describe a historical building you have visited. You should say: what and where it is; when you visited it; what you saw or did there; and explain how you felt about it.","qZh":"描述一座你去过的历史建筑。你需要说：它是什么、在哪里；你什么时候去的；你在那里看到或做了什么；并说明你的感受。","ans6":"I would like to describe the Forbidden City in Beijing, which I visited two years ago during the National Day holiday. It used to be the palace for emperors in the Ming and Qing dynasties, and it is now one of the largest wooden building complexes in the world. I went there with my parents on a sunny morning, and we spent the whole day walking through the huge gates and halls. we spent the whole day walking through the huge gates and halls. Every courtyard seemed bigger than the last one, and our guide explained how each hall had a different purpose in the palace. What impressed me most were the details: the golden roofs, the stone lions, and the paintings on the ceilings, which are still bright after hundreds of years. the paintings on the ceilings, which are still bright after hundreds of years. The guides told us that ancient craftsmen painted them by hand, some patterns using real gold. We also saw a special exhibition of old clocks from the palace museum. We also saw a special exhibition of old clocks from the palace museum. Some of those clocks could perform little mechanical shows, and they were gifts from European royal families. Standing in the middle of such a grand place, I felt small but excited, and I could almost imagine life there centuries ago. The visit made me proud of our history and more interested in traditional culture, so I started reading history books after that trip.","upgrades":["a glimpse into the past（一窥历史）","an architectural marvel（建筑奇迹）","well-preserved（保存完好的）","it stands the test of time（经受住了时间的考验）"]},{"part":2,"topic":"Describe an object","q":"Describe a useful object you own. You should say: what it is; when and where you got it; how you use it; and explain why it is useful to you.","qZh":"描述一样你拥有的实用物品。你需要说：它是什么；你何时何地得到它的；你怎么使用它；并说明它为什么对你有用。","ans6":"A useful object I own is my e-reader, which my parents bought me as a birthday present two years ago. It is a small black device, about the size of a paperback book, and very light to carry. I use it almost every day, mostly on the subway and before bed. I use it almost every day, mostly on the subway and before bed, and it has become part of my bedtime routine instead of endless short videos. It can store thousands of books, so I never worry about what to read next, and I can download new books online in one minute. I can download new books online in one minute. It works offline too, so flights and long train rides no longer mean boredom. The screen is different from a phone screen, so my eyes do not hurt even after a long time of reading. my eyes do not hurt even after a long time of reading. The battery lasts for weeks, so one charge covers most of a month of reading. Another useful feature is the built-in dictionary: when I meet a new English word, I just touch it and see the meaning. This little device has changed my reading habits completely. Before I had it, I read maybe two books a year, but last year I finished more than twenty. I finished more than twenty. I even read classics I had avoided for years, because their size no longer scares me. It is probably the most practical gift I have ever received.","upgrades":["a game-changer（改变局面的好东西）","compact and lightweight（小巧轻便）","at my fingertips（触手可及）","cost-effective in the long run（长远来看很划算）"]},{"part":2,"topic":"Describe an object","q":"Describe a gift you received that you liked. You should say: what the gift was; who gave it to you; when you received it; and explain why you liked it.","qZh":"描述一份你收到的喜欢的礼物。你需要说：礼物是什么；谁送给你的；你什么时候收到的；并说明你为什么喜欢它。","ans6":"The best gift I have ever received is a blue bicycle from my father. He gave it to me on my fifteenth birthday, after I passed an important exam. I remember I was doing homework in my room when he asked me to go downstairs, and there it was, with a red bow on the seat. with a red bow on the seat. I ran downstairs in my slippers, and my father pretended to be calm, but his smile gave him away. From then on, I rode that bike to school every day, which took only fifteen minutes instead of forty by bus. At weekends, my friends and I cycled around the lake near our home, and those rides are some of my happiest teenage memories. some of my happiest teenage memories. Once we rode twenty kilometres to see a sunset over the hills, and we were exhausted but proud on the way back. I liked the gift not because of its price but because of what it meant: my father had noticed that I complained about the crowded bus, and he secretly saved money for months to buy it. he secretly saved money for months to buy it. That bike also taught me responsibility, because I cleaned and oiled it every weekend to keep it perfect. I used that bike until university, and even now it stands in our hallway. It always reminds me of my father's quiet love.","upgrades":["a thoughtful gift（一份贴心的礼物）","it is the thought that counts（心意最重要）","cherished memories（珍藏的回忆）","it means the world to me（对我意义非凡）"]},{"part":2,"topic":"Describe media","q":"Describe a book you have read that you enjoyed. You should say: what the book is; when you read it; what it is about; and explain why you enjoyed it.","qZh":"描述一本你读过并喜欢的书。你需要说：这本书是什么；你什么时候读的；它讲了什么；并说明你为什么喜欢它。","ans6":"A book I really enjoyed is The Little Prince, which I first read in junior high school and read again last summer. It is a short novel about a pilot whose plane breaks down in the desert, where he meets a little prince from a tiny planet. where he meets a little prince from a tiny planet. The planet is so small that the prince can watch many sunsets in one evening simply by moving his chair. The prince tells him about his journey to different planets and the strange adults he met on each one. On the surface it looks like a children's story, but it is actually about love, friendship and how adults forget what truly matters. how adults forget what truly matters. Each planet holds a different adult: a king with no real subjects, a businessman counting stars he will never own. My favourite part is the fox's line about how the heart sees what is invisible to the eyes. I enjoyed the book because every time I read it, I understand something new depending on my age. The first time, I liked the adventures; the second time, I felt the loneliness of the characters. I felt the loneliness of the characters. The pilot's sadness about growing up felt very real this time, and I understood why the book is loved worldwide. It is simple, warm and touching, and I believe I will read it again. I believe I will read it again. Maybe at forty I will discover yet another meaning hidden inside those short chapters.","upgrades":["a real page-turner（让人爱不释手的书）","it resonated with me（引起我的共鸣）","read between the lines（读出言外之意）","thought-provoking（发人深省的）"]},{"part":2,"topic":"Describe media","q":"Describe a photo you like. You should say: where and when it was taken; what is in the photo; who took it; and explain why you like it.","qZh":"描述一张你喜欢的照片。你需要说：它是在何时何地拍的；照片里有什么；谁拍的；并说明你为什么喜欢它。","ans6":"The photo I like most was taken by my mother at my grandfather's seventieth birthday dinner. It is a simple family photo, but for me it is very precious. In the picture, the whole family is sitting around a big round table in my grandparents' small flat: my grandparents in the middle, my parents and my uncle's family on both sides, and me as a little boy making a funny face at the camera. me as a little boy making a funny face at the camera. My cousin had just been born, so she appears in the photo sleeping in my uncle's arms. Everyone is laughing, and the warm yellow light makes the room look cozy. the warm yellow light makes the room look cozy. The table is crowded with dishes, and the edges of the photo are slightly blurred, which somehow makes it feel even more alive. My grandfather passed away three years ago, so this photo has become one of the few records of the whole family being together. the whole family being together. It was one of the last dinners before my grandfather became ill, though none of us knew that then. Whenever I miss him, I look at it and remember how he told jokes and cooked dumplings for us. I like this photo because it freezes a happy moment that can never happen again. It teaches me to value family time while we still have it.","upgrades":["a treasured memory（珍藏的记忆）","freeze a moment in time（定格某个瞬间）","priceless（无价的）","it holds sentimental value（承载着情感价值）"]},{"part":2,"topic":"Describe an object","q":"Describe an app on your phone or computer that you find useful. You should say: what the app is; when you started using it; what you use it for; and explain why you find it useful.","qZh":"描述一个你觉得有用的手机或电脑应用。你需要说：这个应用是什么；你什么时候开始用的；你用它做什么；并说明你为什么觉得它有用。","ans6":"An app I find very useful is called Keep, which is a fitness app on my phone. I started using it about two years ago, when I realized I was getting unfit from sitting all day. I realized I was getting unfit from sitting all day. My classmate showed me his training record, and I was surprised that an app could be so motivating. The app offers exercise videos of different lengths, from five-minute stretching to full hour-long workouts, and most of them need no equipment. I usually follow a twenty-minute video after dinner, three or four times a week. I usually follow a twenty-minute video after dinner, three or four times a week. The coach in the video counts out loud, so even lazy people like me keep the rhythm instead of quitting halfway. My favourite features are the training plans and the reminders, because they push me to keep going even when I feel lazy. The app also records my history, so I can see how much exercise I did each month, which gives me a real sense of achievement. which gives me a real sense of achievement. There are also badges for weekly goals, and yes, I am slightly proud of my streak. It is useful because it turns my phone, which usually wastes my time, into a personal trainer that costs almost nothing. Thanks to it, I have more energy now and I sleep better at night.","upgrades":["user-friendly（操作简便的）","keep track of my progress（记录我的进度）","work out from home（居家健身）","a personal trainer in your pocket（口袋里的私人教练）"]},{"part":2,"topic":"Describe an object","q":"Describe a piece of clothing you like wearing. You should say: what it is; what it looks like; when and where you bought it; and explain why you like wearing it.","qZh":"描述一件你喜欢穿的衣服。你需要说：它是什么；它什么样；你何时何地买的；并说明你为什么喜欢穿它。","ans6":"My favourite piece of clothing is a grey hooded jacket that I bought two years ago at a shopping mall near my university. It was in the winter sale, so I got it at half price, which made me even happier. The jacket is not fancy: it is simple, with a big front pocket and a soft lining inside. I wear it in spring and autumn, almost every day, because it matches any trousers and is comfortable for both class and sports. it matches any trousers and is comfortable for both class and sports. It has survived rain, sudden cold winds and even one careless paint accident at a volunteer event. What I like most is the feeling of it: the material is thick but light, and the hood keeps my head warm on windy days. the hood keeps my head warm on windy days. The big front pocket is perfect for keys, earphones and the snacks I pretend I never eat. Over time, it has become more than just a jacket. I wore it on my first trip with my university friends and in many photos, so it carries a lot of memories. so it carries a lot of memories. Whenever I see old pictures from that trip, the same jacket appears in all of them. My mother says I should buy a new one, but I always answer that old friends are the best. old friends are the best. Maybe one day the zipper will break and I will finally let go, but not yet.","upgrades":["it goes with everything（百搭）","comfort over fashion（舒适优先于时尚）","worn but well-loved（虽旧但珍爱）","durable and practical（耐穿又实用）"]},{"part":2,"topic":"Describe an event","q":"Describe a time when you helped someone. You should say: who you helped; what the situation was; how you helped; and explain how you felt after helping this person.","qZh":"描述一次你帮助别人的经历。你需要说：你帮助了谁；当时的情况是什么；你是怎么帮助的；并说明帮助之后你的感受。","ans6":"I remember a time when I helped an old lady in my neighbourhood, about two years ago. She lived alone on the fifth floor of a building with no lift, and one day she fell and hurt her knee while shopping. I met her at the entrance, carrying heavy bags and walking with difficulty. I offered to carry her bags and slowly walked her upstairs. I offered to carry her bags and slowly walked her upstairs. She apologised the whole way, which made me feel even more determined to help. After that, I visited her once a week for a whole month, helping her buy vegetables and medicine until her knee got better. helping her buy vegetables and medicine until her knee got better. Her children lived in another city, so those small visits meant more to her than I expected. Sometimes I just sat with her and listened to her stories about the old days, which she clearly enjoyed. listened to her stories about the old days, which she clearly enjoyed. She showed me black-and-white photos of her youth, and her eyes lit up while telling them. When she recovered, her family invited me to dinner and thanked me warmly, which was embarrassing but sweet. I felt genuinely happy, not because of the thanks, but because I could see that a small effort from me really mattered to someone. It also pushed me to care more about elderly neighbours.","upgrades":["lend a helping hand（伸出援手）","go out of one's way to help（特意帮忙）","a sense of fulfilment（一种满足感）","make someone's day（让某人一天心情大好）"]},{"part":2,"topic":"Describe an event","q":"Describe a happy event you celebrated. You should say: what the event was; when and where it happened; who was with you; and explain why it was a happy time for you.","qZh":"描述一次你庆祝过的快乐事件。你需要说：是什么事件；何时何地发生的；谁和你在一起；并说明为什么那对你是一段快乐的时光。","ans6":"A happy event I will never forget is my university graduation ceremony last June. It took place in the main stadium of our campus on a sunny morning. All the graduates wore black gowns and square hats, and my parents came to the city specially to watch me. The ceremony lasted about two hours, with speeches from the president and some professors. with speeches from the president and some professors. The best speech was short: a professor simply said, remember the people beside you, not just the certificate. After receiving my certificate on the stage, I threw my hat into the air with hundreds of classmates, and everyone was cheering and taking photos. In the afternoon, my roommates and I walked around the campus for the last time, visiting the library and the small shop where we used to buy breakfast. visiting the library and the small shop where we used to buy breakfast. We took funny photos in front of the dormitory and signed each other's shirts like children. In the evening, we had dinner together and many of us cried, even the tough guys. It was a happy day because four years of hard work finally paid off, and because I felt proud to make my parents happy. At the same time, it was a sad goodbye to my student life. it was a sad goodbye to my student life. Some classmates flew to other cities the next week, so that evening was truly the last time all of us were together.","upgrades":["a milestone in my life（人生的一个里程碑）","my hard work paid off（我的努力得到了回报）","a bittersweet moment（苦乐参半的时刻）","make memories that last a lifetime（留下终生难忘的回忆）"]},{"part":2,"topic":"Describe an event","q":"Describe a skill you learned that took a long time. You should say: what the skill is; when you learned it; how you learned it; and explain how you felt after mastering it.","qZh":"描述一项你花了很长时间学习的技能。你需要说：这项技能是什么；你什么时候学的；你是怎么学的；并说明掌握它之后的感受。","ans6":"The skill I want to talk about is swimming, which took me two full summers to learn. I started at the age of twelve, when my father signed me up for a class at a local pool. At first, it was a disaster: I was scared of the water, and I drank pool water many times. I drank pool water many times. The other children were already swimming, and I stood in the shallow end holding the edge, too embarrassed to let go. My coach was strict but patient, and he taught me step by step, starting with floating and breathing. starting with floating and breathing. He used a small board to support my arms, and slowly the board became unnecessary. After the class ended, I still could not swim well, so my father took me to the pool every weekend to practise. Little by little, my movements became smooth, and one day I suddenly swam a full length without stopping. one day I suddenly swam a full length without stopping. My father was watching from the stands, and he stood up and clapped like I had won an Olympic gold. That moment was unforgettable. Now swimming is my favourite sport, and I go once a week to keep fit. Learning it slowly also taught me that patience and practice matter more than talent. patience and practice matter more than talent. I later applied the same idea to English and cycling, and it worked again. After mastering it, I felt proud and much more confident about myself.","upgrades":["practice makes perfect（熟能生巧）","get the hang of it（掌握窍门）","a steep learning curve（陡峭的学习曲线）","learn it from scratch（从零学起）"]},{"part":2,"topic":"Describe an event","q":"Describe a difficult challenge you completed. You should say: what the challenge was; when and why you faced it; how you dealt with it; and explain what you learned from it.","qZh":"描述一次你完成的困难挑战。你需要说：挑战是什么；你何时以及为何面对它；你是如何应对的；并说明你从中学到了什么。","ans6":"A difficult challenge I faced was running a half marathon in my second year at university. My roommate invited me to join, and I agreed without thinking, although at that time I could hardly run three kilometres. I could hardly run three kilometres. My legs hurt for days after the first training, which was a shock. The race was eight months away, so I made a training plan and stuck to it. Every Tuesday and Thursday evening, I ran around the campus lake, starting from three kilometres and slowly increasing the distance. starting from three kilometres and slowly increasing the distance. By the final month, I was running twelve kilometres comfortably and dreaming about the real race. Winter was the hardest part, because the cold wind made me want to stay in bed. the cold wind made me want to stay in bed. My roommate pushed me out of the door many times, and I thank him for that now. On the day of the race, I finished in just over two hours, and my legs were shaking, but I was smiling. my legs were shaking, but I was smiling. My roommate waited at the finish line with water and loud applause. This experience taught me that big goals become possible if you break them into small daily steps. It also built my confidence: whenever I face a hard task now, I remember that finish line, and I stop doubting myself so much. That is why I consider it my proudest achievement so far.","upgrades":["push my limits（挑战自我极限）","persevere through hardship（坚持克服困难）","out of my comfort zone（走出舒适区）","a huge sense of achievement（巨大的成就感）"]},{"part":2,"topic":"Describe an event","q":"Describe a long journey or trip you took. You should say: where you went; who you went with; what you did during the journey; and explain why you remember this trip.","qZh":"描述一次你经历过的长途旅行。你需要说：你去了哪里；和谁一起去的；旅途中做了什么；并说明你为什么记得这次旅行。","ans6":"I would like to talk about a train trip to Yunnan Province in southwest China, which I took with two university friends two summers ago. The journey took about thirty hours because we chose the slow train to save money we chose the slow train to save money, and we deliberately picked the oldest green train instead of the high-speed one, and it turned out to be the best decision. During the day, we played cards, shared snacks and watched the view change from flat farmland to green mountains. watched the view change from flat farmland to green mountains. We also wrote a small travel diary, and each of us drew the strangest thing we saw that day. At night, we lay in the hard sleeper beds and talked about our future until late. We met a kind grandfather in the next bed who told us stories about the places we passed and even shared his fruit. even shared his fruit. He was a retired teacher returning to his hometown, and he pointed out tiny villages that never appear on any travel website. When we finally arrived in Kunming, tired but excited, the sky was amazingly blue. the sky was amazingly blue. The slow train made the arrival feel earned, like finishing a long book. I remember this trip not because of the destination, but because of the journey itself. It taught me that travelling slowly with good friends can be more fun than any famous sight, and I still smile when I think of it.","upgrades":["off the beaten track（远离常规路线）","breathtaking scenery（令人惊叹的风景）","an unforgettable experience（一次难忘的经历）","bonding time（增进感情的时间）"]},{"part":2,"topic":"Describe an event","q":"Describe a festival you celebrate in your country. You should say: what the festival is; when it happens; what people do during the festival; and explain why you enjoy it.","qZh":"描述你们国家的一个节日。你需要说：这个节日是什么；它在什么时候举行；节日期间人们做什么；并说明你为什么喜欢它。","ans6":"The festival I want to describe is the Spring Festival, which is the most important holiday in China. It usually falls in late January or February, and the celebration lasts about two weeks. Before the festival, every family cleans the house and buys food and new clothes. buys food and new clothes. The streets turn red with lanterns, and shopping centres play festival songs on repeat. On New Year's Eve, all my family members travel home, and we make dumplings together in the kitchen while watching the big TV gala. we make dumplings together in the kitchen while watching the big TV gala. Everyone argues about the filling, usually pork versus vegetables, and the losers do the washing up. At midnight we set off fireworks, and the whole city becomes noisy and bright. In the following days, we visit relatives, and children receive red envelopes with lucky money inside. children receive red envelopes with lucky money inside. Now that we are older, the red envelopes have become video messages from relatives abroad. For me, the best part is not the food or the gifts but the atmosphere: everyone puts work aside, and the family sits together, eats and talks until late. Since I study in another city, this festival is often the only time in the year when my whole family is together, which makes it really special. my whole family is together, which makes it really special. The train ticket home is the hardest thing to get, and that difficulty itself shows how much this day means.","upgrades":["a family reunion（家庭团聚）","a festive atmosphere（浓浓的节日气氛）","a time-honoured tradition（历史悠久的传统）","pass down customs（传承习俗）"]},{"part":2,"topic":"Describe media","q":"Describe a TV program or film you enjoyed watching. You should say: what it was; when and where you watched it; what it was about; and explain why you enjoyed it.","qZh":"描述一部你喜欢看的电视节目或电影。你需要说：它是什么；你何时何地看的；它讲了什么；并说明你为什么喜欢它。","ans6":"A film I really enjoyed is The Wandering Earth, a Chinese science fiction movie. I watched it in a cinema with my father during the Spring Festival holiday two years ago. The story is set in the future, when the sun is dying, and people build huge engines to push the Earth out of the solar system to find a new home. push the Earth out of the solar system to find a new home. The journey will take two thousand five hundred years, so generations not yet born must continue the mission. The special effects were amazing, but what impressed me more was the idea itself: instead of leaving the Earth and escaping on spaceships, the characters choose to take their home planet with them. There is also a strong feeling of family in the film, which made several people around me cry. which made several people around me cry. The father-son storyline is the heart of the movie: two stubborn people who love each other but never say it aloud. I enjoyed it because it was exciting from beginning to end, and because it showed a different kind of science fiction full of love for our planet. After watching it, I even read the original novel I even read the original novel, and discovered that the film changed many details but kept the spirit of the book., and I would happily see it again.","upgrades":["edge-of-your-seat exciting（紧张刺激、扣人心弦）","visually stunning（视觉效果震撼）","a thought-provoking plot（发人深省的情节）","a box-office hit（票房大片）"]},{"part":2,"topic":"Describe media","q":"Describe a song or piece of music you like. You should say: what it is; when you first heard it; what it is about; and explain why you like it.","qZh":"描述一首你喜欢的歌曲或乐曲。你需要说：它是什么；你第一次听到它是什么时候；它讲了什么；并说明你为什么喜欢它。","ans6":"A song I love is called Chengdu, written and sung by Zhao Lei, a Chinese folk singer. I first heard it three years ago in a friend's car on a late-night drive home. The song is slow and simple, mainly guitar and a soft voice, mainly guitar and a soft voice, with a harmonica entering quietly in the second half, and the lyrics describe the streets, rain and small bars of the city of Chengdu, mixed with the feeling of leaving someone you love. mixed with the feeling of leaving someone you love. The chorus repeats the name of the city like a sigh, which is why everyone who has lived there finds it moving. What I like about it is the mood: it is calm and a little sad, calm and a little sad, yet somehow warm at the same time, which fits perfectly when you look out of the window at night. After hearing it, I learned to play it on the guitar, and it became the first song I could perform completely. it became the first song I could perform completely. I played it at a class meeting, and to my surprise several classmates sang along. Whenever I feel stressed or homesick, I play it quietly, and it slows my heart down. To me, a good song is not about difficult words but about real feelings, and this song has that. It always brings back that first late-night drive.","upgrades":["a catchy melody（朗朗上口的旋律）","touching lyrics（动人的歌词）","it soothes my nerves（抚慰我的情绪）","it strikes a chord with me（深深打动我）"]},{"part":2,"topic":"Describe an event","q":"Describe a special meal you had. You should say: what the meal was; where and when you had it; who you were with; and explain why it was special.","qZh":"描述一顿你吃过的特别的饭。你需要说：这顿饭是什么；你何时何地吃的；你和谁一起吃的；并说明它为什么特别。","ans6":"A special meal I remember well was the dumpling dinner my family made on New Year's Eve three years ago. Unlike usual years, that time my grandmother decided that everyone should join the cooking, including the men and the children. So on that snowy evening, all nine of us stood around the kitchen table with flour on our hands. all nine of us stood around the kitchen table with flour on our hands. The kitchen felt too small for nine people, which was exactly what made it fun. My grandmother taught us her secret way of folding dumplings, and my little cousin made some strange shapes that made everyone laugh. my little cousin made some strange shapes that made everyone laugh. He proudly insisted they were dumplings too, and grandmother put them in the pot anyway. We cooked them in a big pot and ate them with vinegar and hot sauce while the TV played in the background. while the TV played in the background. The New Year show was competing with our laughter, and honestly our kitchen was funnier. The dumplings were not perfect: some broke, and one was too salty. some broke, and one was too salty. Nobody complained, though; we were too busy competing over who ate the lucky coin dumpling. However, it was the tastiest meal I can remember, because we made it together with our own hands. My grandmother passed away last year, so that evening has become a precious memory for all of us. Now we continue her tradition every year.","upgrades":["homemade dishes（家常菜）","a real feast（丰盛的一餐）","a labour of love（出自爱的用心付出）","food brings people together（美食让人们相聚）"]},{"part":2,"topic":"Describe media","q":"Describe a website you often visit. You should say: what the website is; how you found it; what you use it for; and explain why you find it useful or interesting.","qZh":"描述一个你经常访问的网站。你需要说：这个网站是什么；你是怎么发现它的；你用它做什么；并说明你为什么觉得它有用或有趣。","ans6":"The website I visit most often is Bilibili, a Chinese video platform similar to YouTube. I discovered it in high school when a classmate shared a funny video with me. a classmate shared a funny video with me. I stayed for the joke but returned the next day for something else. Although it started as an entertainment site, it is now full of educational content, which is why I like it. I mainly use it to study: there are free courses on English, programming and physics, made by teachers and students in a friendly style. made by teachers and students in a friendly style. Some videos use animations to explain difficult ideas, which textbooks rarely manage. When I prepared for exams, I watched history summaries and math problem explanations there, and they helped me a lot. they helped me a lot. The comment section works like a study group, because people share notes and correct each other's mistakes. I also follow a few creators who share cooking videos and travel diaries, which I watch to relax after studying. which I watch to relax after studying. During exam weeks I switch to purely educational content, and my self-control is better than before. The site is useful because learning there does not feel like studying; the videos are short, clear and sometimes funny. Of course, it can waste my time too, so I try to control myself. Overall, it has become my free online classroom.","upgrades":["a wealth of resources（丰富的资源）","self-paced learning（按自己节奏学习）","informative content（干货满满的内容）","digital platforms（数字平台）"]},{"part":2,"topic":"Describe a subject","q":"Describe a subject you enjoyed studying at school. You should say: what the subject was; when you studied it; what you learned in it; and explain why you enjoyed it.","qZh":"描述一门你在学校喜欢学习的科目。你需要说：这门科目是什么；你什么时候学的；你学了哪些内容；并说明你为什么喜欢它。","ans6":"The subject I enjoyed most at school was geography, which I studied from junior high to senior high. I liked it from the first lesson, when the teacher showed us photos of volcanoes and deserts from around the world. photos of volcanoes and deserts from around the world. She said every photo was a place we could read about, and I immediately wanted to find them on the map. In geography classes, I learned how mountains and rivers form, why different places have different climates, and how people live in those environments. how people live in those environments. We even studied why ancient cities grew near rivers, which connected history and geography beautifully. Unlike other subjects, geography was closely connected to real life: it explained why my city is hot in summer, and why we eat different food from people in the north. why we eat different food from people in the north. Simple questions like these made the subject feel personal rather than academic. I also loved reading maps; for me, finding a route on a big paper map was like solving a puzzle. This subject opened my eyes to the world outside my city and gave me the dream of travelling to those faraway places. gave me the dream of travelling to those faraway places. That dream still sits on my list, right above learning to swim. Partly because of geography, I now watch travel documentaries all the time, and I still remember most of what I learned, which is rare for me.","upgrades":["broaden my horizons（开阔视野）","sparked my interest in...（激发了我对……的兴趣）","relevant to real life（贴近现实生活）","a lifelong passion（一生的热爱）"]},{"part":2,"topic":"Describe an event","q":"Describe a time when you were late for something important. You should say: when it happened; why you were late; what happened as a result; and explain how you felt about it.","qZh":"描述一次你迟到的经历。你需要说：这是什么时候发生的；你为什么迟到；结果怎么样；并说明你对这件事的感受。","ans6":"I remember clearly the time I was late for a final exam in my first year at university. The exam started at nine in the morning, and I set my alarm as usual. I set my alarm as usual. It was the night before the exam, and I even reviewed notes until midnight, feeling fully prepared. Unfortunately, my phone died during the night because I forgot to charge it, so nobody woke me up. so nobody woke me up. My roommates assumed I had already left, because I was always the early one. I woke up naturally at eight forty, which was a horrible moment. I jumped out of bed, brushed my teeth in thirty seconds and ran all the way to the exam building. ran all the way to the exam building. My hair was a disaster, and I was still holding a toothbrush when I reached the gate. Luckily, the school rule allows students to enter up to thirty minutes late, so I arrived at nine twenty-five and was still allowed in. I finished the paper in a hurry, and my score was lower than normal, but at least I passed. my score was lower than normal, but at least I passed. The teacher raised an eyebrow when I arrived, which was somehow more painful than the running. I felt ashamed and angry with myself for days. Since then, I have always kept a backup alarm clock, and I never sleep without charging my phone. It was a small disaster that taught me a big lesson.","upgrades":["in a mad rush（手忙脚乱地赶）","oversleep（睡过头）","learn it the hard way（吃一堑长一智）","double-check everything（凡事再三确认）"]},{"part":2,"topic":"Describe a small business","q":"Describe a small business you would like to start or own. You should say: what the business would be; where it would be; what you would need to start it; and explain why you would like to have this business.","qZh":"描述一个你想创办或拥有的小生意。你需要说：这会是一门什么生意；它会开在哪里；启动它需要什么；并说明你为什么想拥有这门生意。","ans6":"If I could start a small business, I would open a tiny bookstore with a coffee corner in my hometown. The shop would be on a quiet street near a school, with two floors: the ground floor for coffee and new books, and the second floor for old second-hand books, where people could sit and read for free. where people could sit and read for free. There would be a small corner selling second-hand textbooks, so students could trade books instead of throwing them away. To start it, I would need a small loan from the bank, some bookshelves and a coffee machine, and most importantly, a good understanding of books, which I hope to build over the years. a good understanding of books, which I hope to build over the years. I would also ask retired teachers to host free reading clubs on weekends. I imagine it as a warm place with soft music, where students do homework and old people read newspapers. where students do homework and old people read newspapers. Cats would be welcome, because a bookstore without a cat is just a library with coffee. I would like this business not because it would make me rich, honestly it probably would not, but because it would let me do what I love every day. A shop like that could become a small cultural corner of the neighbourhood, and that idea makes me really excited about the future.","upgrades":["a labour of love（出于热爱的事业）","turn my passion into a career（把热爱变成事业）","a niche market（小众市场）","a steady income（稳定的收入）"]},{"part":2,"topic":"Describe a place","q":"Describe a park or garden you like to visit. You should say: where it is; what it looks like; what people do there; and explain why you like to visit it.","qZh":"描述一个你喜欢去的公园或花园。你需要说：它在哪里；它是什么样子；人们在那里做什么；并说明你为什么喜欢去那里。","ans6":"My favourite park is People's Park, which sits in the centre of my hometown. It is not very large, but it is green and lively all year round. In the middle there is a small lake with willow trees around it, and on the west side there is a bamboo garden with narrow paths. on the west side there is a bamboo garden with narrow paths. The paths are quiet enough that you can hear birds even in the middle of the city. I usually go there on Sunday mornings with my father, and we walk twice around the lake before breakfast. The park is full of life: old people practise tai chi and dance in groups old people practise tai chi and dance in groups, and on weekends a small choir sings old songs near the fountain, children feed the fish, and some people play chess under the trees. There is also a famous tea house in the park where you can sit for hours with a cup of green tea for just a few coins. with a cup of green tea for just a few coins. The tea house has no walls, just open pavilions, so you watch the park while drinking. I like this park because it shows the real life of my city. it shows the real life of my city. Every generation appears there daily, from babies in prams to grandfathers flying kites. Unlike shopping malls, it is free and full of ordinary happy people, and walking there always puts me in a good mood.","upgrades":["a breath of fresh air（呼吸新鲜空气）","lush greenery（葱郁的绿植）","people-watch（观察来来往往的人）","escape the urban jungle（逃离钢筋水泥的城市）"]},{"part":2,"topic":"Describe a future plan","q":"Describe a goal you would like to achieve in the future. You should say: what the goal is; when you would like to achieve it; what you need to do to reach it; and explain why this goal is important to you.","qZh":"描述一个你想在未来实现的目标。你需要说：这个目标是什么；你想什么时候实现它；你需要做什么来达成它；并说明这个目标为什么对你很重要。","ans6":"One goal I really want to achieve in the future is to speak English fluently within three years. I am a university student now, and although I have studied English for many years, I still freeze when I talk with foreigners, and my listening is slow. I still freeze when I talk with foreigners, and my listening is slow. Last month, a tourist asked me for directions, and I understood the question but answered with single words, which was embarrassing. To reach this goal, I have made a clear plan. First, I will practise speaking for thirty minutes every day, using language apps or talking to myself about daily topics. using language apps or talking to myself about daily topics. Talking to myself sounds strange, but describing my dinner aloud has already helped. Second, I will find a language partner online and have two conversations a week. Third, I plan to watch English series without subtitles, starting with simple ones. watch English series without subtitles, starting with simple ones. I finished one season with English subtitles only, and I understood maybe sixty percent, which felt like progress. I want to achieve this goal before I graduate and start job hunting, because English skills would open more doors in my career. More importantly, I love the idea of travelling the world and making friends from different countries without a language wall. This goal is important to me because it would prove that I can change myself through daily effort, not just talent.","upgrades":["set a clear goal（设定明确目标）","open more doors（带来更多机会）","steady progress（稳步前进）","step out of my comfort zone（走出舒适区）"]},{"part":3,"topic":"Helping Others","q":"Why do you think some people are more willing to help others than others?","qZh":"你认为为什么有些人比其他人更愿意帮助别人？","ans6":"I think it mainly depends on personality and life experience. Some people grow up in families where helping is normal, so they naturally do the same. Also, people who have received help themselves often want to give it back. For example, my teacher helped me for free at school, and now I help younger students without asking for anything. On the other hand, people who have been cheated before may become more careful. In big cities, life is fast and people do not know their neighbours, which also makes helping less common. So I believe both character and environment play a part.","upgrades":["on a societal level（从社会层面）","reciprocity（互惠）","empathy（同理心）","it takes all sorts to make a world（世界之大、人各不同）"]},{"part":3,"topic":"Friendship","q":"Do you think it is easier to make friends now than in the past?","qZh":"你认为现在交朋友比过去更容易吗？","ans6":"In some ways yes, but in other ways no. Technology has made it much easier to meet new people: we can join online groups about any hobby and chat with strangers instantly. However, I feel real friendships are not easier at all. In the past, people stayed in one town for years and built deep relationships slowly. Now everyone moves around for work and study, and online friends often stay online forever. For example, I have hundreds of contacts but only a few I could call at midnight. So I would say we have more connections now, but fewer deep friendships.","upgrades":["click with someone（与某人一拍即合）","surface-level connections（浅层的社交关系）","in the digital age（在数字时代）","quality over quantity（重质不重量）"]},{"part":3,"topic":"Fame","q":"Why do many young people want to become famous?","qZh":"为什么很多年轻人想出名？","ans6":"I think social media is the biggest reason. Today, fame seems easy and profitable: ordinary people become rich simply by posting videos, and young people see this every day. Fame also means attention and likes, which feel good, especially for teenagers. Besides, many dream jobs now, like singing or gaming, only pay off if you are well known. However, I believe most young people only see the bright side. They do not notice that famous people lose privacy and face huge pressure. For example, some internet stars disappear quickly when trends change. So in my view, the dream of fame is understandable, but it is not as easy as it looks.","upgrades":["the allure of fame（名利的诱惑）","in the limelight（处于聚光灯下）","15 minutes of fame（转瞬即逝的名气）","a double-edged sword（双刃剑）"]},{"part":3,"topic":"Family","q":"How have family relationships changed compared with the past?","qZh":"与过去相比，家庭关系发生了哪些变化？","ans6":"Families in my country have changed a lot. In the past, three generations often lived under one roof, and family members depended on each other for daily life. Now most young people move to big cities for work, so they see their parents only a few times a year. On the positive side, technology helps a lot: we video-call our parents weekly, and distance feels shorter. But I think the emotional distance is real. For example, my father talks to his parents more on the phone than face to face, and sometimes conversations become short and formal. Also, families are smaller now, with only one or two children, so each member gets more attention but also more loneliness.","upgrades":["under one roof（同住一个屋檐下）","the generation gap（代沟）","nuclear families（核心小家庭）","emotional distance（情感上的疏离）"]},{"part":3,"topic":"Education","q":"What qualities make a good teacher?","qZh":"什么样的品质能造就一名好老师？","ans6":"In my opinion, the most important quality is patience, because every class has slow learners, and a good teacher never gives up on them. Knowledge itself is also basic, of course, but knowing a subject and explaining it clearly are two different things. A good teacher knows how to make difficult ideas simple and interesting. Passion matters too: students can easily tell whether a teacher loves the subject or is just doing a job. For example, my physics teacher did small experiments in every class, and even lazy students became interested. Finally, a good teacher should respect students, because teenagers work harder for teachers they like and trust. So patience, clear teaching and real passion are the key qualities in my view.","upgrades":["the ability to inspire（激励他人的能力）","tailor lessons to students（因材施教）","a fountain of knowledge（知识的宝库）","command respect（赢得尊重）"]},{"part":3,"topic":"Travel","q":"What are the benefits of travelling to other places?","qZh":"去别的地方旅行有什么好处？","ans6":"I believe travelling benefits people in several ways. The most obvious one is relaxation: leaving your daily routine and seeing new places reduces stress. But for me, the deeper benefit is understanding the world. When you travel, you see how other people live, eat and think, and your own views become wider. For example, after visiting a village in Yunnan, I stopped complaining about small problems in my life, because I saw how hard some people work. Travelling also teaches practical skills, like planning, budgeting and dealing with surprises. On a societal level, tourism brings money to local communities and helps protect local culture. Of course, travelling is not always comfortable, but the growth it brings is worth it.","upgrades":["broaden one's horizons（开阔眼界）","first-hand experience（亲身体验）","step out of one's comfort zone（走出舒适区）","cultural exchange（文化交流）"]},{"part":3,"topic":"Cities","q":"Do you think life in big cities is better than life in small towns?","qZh":"你认为大城市的生活比小城镇好吗？","ans6":"Both have clear advantages, so it depends on what you value. Big cities offer better jobs, hospitals, schools and entertainment, and it is easier to meet people with similar interests. That is why young people keep moving there. However, city life has a high price: expensive housing, long commutes and constant noise and pressure. Small towns are quieter and cheaper, and neighbours know each other, which makes life warmer. For example, my uncle moved back to our hometown last year, and he says he sleeps better and spends more time with his kids. Personally, I would choose a big city while I am young, to build my career, but I might settle in a smaller, quieter place later in life.","upgrades":["career opportunities（职业发展机会）","the hustle and bustle（喧嚣与忙碌）","a slower pace of life（更慢的生活节奏）","the cost of living（生活成本）"]},{"part":3,"topic":"Quiet Spaces","q":"Why is it important to have quiet places in cities?","qZh":"为什么城市里拥有安静的地方很重要？","ans6":"I think quiet places are necessary for mental health. City life is full of noise: traffic, construction, phones and crowds. Our brains need silence to rest and think clearly, but many people, especially students, have nowhere to find it. Quiet places like libraries and parks give people space to read, study or simply calm down. For example, before every exam, I study in a small library, and I always feel my stress drop after two quiet hours there. On a societal level, quiet public spaces also bring people of different ages together and slow down the crazy pace of urban life. Without them, a city is just a machine, and people living in it get tired quickly. So I believe governments should protect and build more of these spaces.","upgrades":["mental well-being（心理健康）","oases of calm（一片片宁静绿洲）","the frenetic pace of city life（城市生活的快节奏）","urban planning（城市规划）"]},{"part":3,"topic":"Historical Buildings","q":"Should old buildings be protected even when new development is needed?","qZh":"即使需要新的开发，老建筑也应该被保护吗？","ans6":"Yes, I strongly believe old buildings deserve protection, even if it slows down development. First, they are records of our history: once a building is destroyed, that part of the past disappears forever, and photos cannot replace it. Second, old buildings attract tourists and create jobs, so protecting them often brings economic value instead of blocking it. My hometown's old street is a good example: after restoration, it became the most popular place for visitors. Of course, I understand that cities need new roads and housing, so the solution is balance. We can develop the areas around historical sites and reuse old buildings as museums, shops or schools. In this way, a city keeps its memory while still moving forward.","upgrades":["cultural heritage（文化遗产）","irreplaceable（不可替代的）","urban development（城市发展）","strike a balance（取得平衡）"]},{"part":3,"topic":"Technology","q":"Do you think technology makes people lazy?","qZh":"你认为科技让人变懒吗？","ans6":"In some ways, yes, but I prefer to say it changes how we spend effort. Technology removes physical work: we order food instead of cooking, take lifts instead of stairs, and ask machines for answers instead of thinking hard. In that sense, many people have become physically lazier, and health problems are rising. However, technology also frees time and energy for other things. For example, a washing machine saves two hours a day, and people can use that time to study or exercise. My fitness app pushes me to move, not to sit. So the problem is not technology itself but how we use it. If we use saved time wisely, technology makes life better; if we only scroll short videos, it makes us lazy.","upgrades":["a double-edged sword（双刃剑）","rely heavily on...（严重依赖……）","at the touch of a button（一键即可完成）","self-discipline（自律）"]},{"part":3,"topic":"Gifts","q":"Is it better to give practical gifts or symbolic gifts?","qZh":"送实用的礼物好，还是送有象征意义的礼物好？","ans6":"I lean towards practical gifts, especially for people I know well. A useful gift, like a warm jacket or a good book, gets used every day, and each time the person uses it, they remember you. Symbolic gifts, like flowers or hand-made cards, are touching, but they usually end up on a shelf and lose meaning after a few days. Of course, the best gifts combine both. My favourite example is a notebook my friend gave me: it was cheap but had my name on the cover, so it was both useful and personal. In the end, the value of a gift comes from the thought, not the price, but practicality makes that thought last longer.","upgrades":["it is the thought that counts（心意最重要）","sentimental value（情感价值）","a lasting reminder（长久的纪念）","a personalized gift（个性化的礼物）"]},{"part":3,"topic":"Reading","q":"Do you think paper books will disappear in the future?","qZh":"你认为纸质书在未来会消失吗？","ans6":"I do not think paper books will disappear, although e-books are clearly winning in numbers. Reading on screens is cheaper and more convenient, and it saves space, so most people, including me, now read news and novels digitally. However, paper books offer something screens cannot. Many readers love the feeling of paper, the smell of a new book, and the joy of putting them on a shelf. Paper is also easier on the eyes and free from messages that interrupt you. For example, although I own an e-reader, I still buy paper copies of books I truly love. I believe paper books will become fewer, more expensive, and more like a hobby or a gift, but they will survive, just like vinyl records did.","upgrades":["digital reading（数字阅读）","a tactile experience（触觉上的体验）","become obsolete（被淘汰）","stand the test of time（经得起时间考验）"]},{"part":3,"topic":"Photography","q":"Why do so many people love taking photos nowadays?","qZh":"为什么现在这么多人喜欢拍照？","ans6":"I think the main reason is that phones made photography free and instant. Twenty years ago, taking photos cost money and effort, but now everyone carries a good camera all day. Second, photos have become a social language: people share meals, trips and daily moments online, and likes and comments make them feel connected. Photos also work as memory storage. Life moves fast, and a picture can freeze a moment that our brains would forget. For example, when I look at my old photos, details like the weather and my friends' expressions come back clearly. Of course, some people take photos for showing off rather than memory, but overall, I see photo-taking as a positive habit that helps people notice and keep the good parts of life.","upgrades":["capture the moment（捕捉瞬间）","a visual diary（视觉日记）","social currency（社交货币）","in the blink of an eye（转瞬之间）"]},{"part":3,"topic":"Smartphones","q":"How have smartphones changed the way people live?","qZh":"智能手机如何改变了人们的生活？","ans6":"Smartphones have changed almost every part of daily life. The biggest change is convenience: one small device is now our wallet, map, library, cinema and office. Paying by phone, ordering food and working from anywhere were impossible twenty years ago. Communication has also changed: we video-call family in other cities and make friends online. However, there are downsides. Many people, including me, check the phone hundreds of times a day, which breaks concentration and reduces face-to-face talk. For example, at family dinners, everyone sometimes sits quietly looking at screens. So in my view, smartphones are powerful tools that make life easier but also more distracting. The key is whether we control the phone or let it control us.","upgrades":["at our fingertips（触手可及）","revolutionize the way we...（彻底改变我们……的方式）","screen addiction（屏幕成瘾）","strike a balance（取得平衡）"]},{"part":3,"topic":"Fashion","q":"Why do some people care so much about brand-name clothes?","qZh":"为什么有些人如此在意名牌衣服？","ans6":"I think there are two main reasons: social signals and self-confidence. Clothes are a quick way to show status, and famous brands act like labels that tell others you have money or taste. In schools and workplaces, wearing big brands can bring respect or a sense of belonging, which young people especially want. Second, brands make some people feel confident. My classmate once said that in his new shoes, he walks with his head up. Advertising also plays a huge role: famous people wear these brands, so fans copy them. Personally, I care more about comfort and price than labels, and I think judging a person by their clothes is shallow. But I understand why the market works this way.","upgrades":["a status symbol（身份地位的象征）","peer pressure（同辈压力）","keep up with the Joneses（与别人攀比）","brand-conscious（看重品牌的）"]},{"part":3,"topic":"Charity","q":"Do you think rich people have a duty to help the poor?","qZh":"你认为富人有责任帮助穷人吗？","ans6":"I believe rich people have a responsibility, though maybe not a legal duty. Nobody becomes rich completely alone: society, workers and public systems all contribute, so giving some of it back is fair. Also, rich people usually have more than they can ever spend, while many families struggle with basic needs like school fees and medicine. On a societal level, helping the poor is also good for the rich themselves, because a society with fewer desperate people is safer and more stable. However, charity should be smart, not just giving money. For example, supporting education helps poor families change their future by themselves. In the end, I think helping is a moral choice that shows the quality of a person, and I respect those who do it quietly.","upgrades":["give back to society（回馈社会）","philanthropy（慈善事业）","on a societal level（从社会层面）","lift people out of poverty（帮助人们脱贫）"]},{"part":3,"topic":"Festivals","q":"Why do you think traditional festivals are becoming less popular among young people?","qZh":"你认为为什么传统节日对年轻人越来越没有吸引力？","ans6":"There are several reasons. First, young people today grow up with global culture, so Western festivals like Christmas feel fresh and fun, while traditional festivals feel old and repeated. Second, many festival activities are hard to enjoy in cities: you cannot set off fireworks freely, and relatives may live far away, so the festival becomes just a long holiday for sleeping and travelling. Third, for young workers, festivals sometimes mean pressure, like endless questions about marriage and salary from relatives. For example, some of my friends prefer staying home alone during Spring Festival to avoid such questions. However, I do not think traditions are dying; they are changing. Many young people still love traditional food and clothes when these are presented in modern ways, like popular TV shows about old customs.","upgrades":["lose their appeal（失去吸引力）","keep traditions alive（让传统延续下去）","cultural identity（文化认同感）","revive old customs（复兴旧习俗）"]},{"part":3,"topic":"Learning Skills","q":"Is it better to learn skills at school or from real-life experience?","qZh":"在学校学技能好，还是从实际生活经验中学好？","ans6":"I think the two methods work for different things. School is better for knowledge with systems and theories: math, science and languages need teachers, books and tests, and learning them alone takes much longer. Real-life experience, however, teaches what classrooms cannot: dealing with people, handling pressure and learning from mistakes. For example, I learned grammar at school, but I only became confident in English after talking with foreigners, where mistakes were allowed and real. My ideal answer is that school gives you the base, and real life turns the base into ability. A person with only school knowledge struggles at work, and a person without basic knowledge struggles even more. So both are necessary, and the smartest learners combine them from an early age.","upgrades":["hands-on experience（动手实践经验）","book knowledge（书本知识）","trial and error（反复试错）","a solid foundation（扎实的基础）"]},{"part":3,"topic":"Challenges","q":"Why do some people enjoy taking risks and challenges while others avoid them?","qZh":"为什么有些人喜欢冒险和挑战，而有些人则回避它们？","

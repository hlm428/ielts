ans6":"I think it comes from personality and past experience. Some people are naturally more curious and confident; they feel bored without new things, and risks excite them. Others value safety and prefer plans, which is also a reasonable way to live. Experience plays a big role too: if your first challenge succeeded, you want more; if it ended in painful failure, you may avoid trying again. Family matters as well. Children whose parents support trying new things usually become braver than those who are always warned to be careful. For example, my roommate grew up hiking with his father, so difficult tasks feel normal to him, while I need more time to prepare. Neither way is wrong, but a bit of challenge helps everyone grow.","upgrades":["thrive on challenges（在挑战中如鱼得水）","risk-averse（规避风险的）","a stepping stone（垫脚石）","self-confidence（自信心）"]},{"part":3,"topic":"Punctuality","q":"Why is being on time important in modern society?","qZh":"为什么在现代社会守时很重要？","ans6":"Being on time matters because modern society is built on cooperation between strangers. When you arrive late, you are not just wasting your own time, you are wasting everyone else's, and you show that you think your time is more important. In business, lateness breaks trust, and trust is the base of all cooperation. It also affects real results: one late person in a team can delay a whole project. Of course, culture and situations differ. In casual meetings with friends, a few minutes are not a big deal, and in some countries lateness is more normal. But as a basic rule, being on time is a cheap way to show respect and reliability. For example, my most trusted friend is also the one who has never made me wait.","upgrades":["punctuality（守时）","show respect for other people's time（尊重他人的时间）","reliability（可靠性）","first impressions（第一印象）"]},{"part":3,"topic":"TV and Media","q":"Do you think watching TV is a waste of time?","qZh":"你认为看电视是浪费时间吗？","ans6":"It depends completely on what and how much you watch. TV itself is just a tool. Good programs teach us things: documentaries show nature and history, and news keeps us informed, and these clearly are not a waste. The problem is endless watching. Many people turn on the TV not to watch something specific but to fill time, and hours disappear into shows they do not even enjoy. I was like that during one holiday, and I felt worse instead of relaxed afterwards. So my rule is simple: choose before you watch, and stop after one or two episodes. Used this way, TV is entertainment and education at the same time. Used badly, it is a time machine that only goes one way.","upgrades":["a couch potato（爱窝在沙发看电视的人）","binge-watching（一口气刷剧）","mindless entertainment（无脑娱乐）","in moderation（适度）"]},{"part":3,"topic":"Music Education","q":"Do you think music education should be compulsory in schools?","qZh":"你认为音乐教育应该成为学校的必修课吗？","ans6":"Yes, I support basic music education for all students, though not everyone needs professional training. Music trains the brain in a different way from math or language: it improves memory, listening and coordination. More importantly, music gives students a healthy way to express feelings and reduce stress, which is a serious need for teenagers today. Many students also find their real talent in music classes, since normal exams never show it. For example, a classmate of mine discovered singing at school and now studies music at university. Of course, schools should keep it simple: basic singing, rhythm and music appreciation, not heavy theory or forced instruments. As long as the goal is enjoyment and general development, music deserves its place in the timetable next to science and math.","upgrades":["well-rounded development（全面发展）","a creative outlet（表达创意的出口）","spark creativity（激发创造力）","core subjects（核心主科）"]},{"part":3,"topic":"Sports and Health","q":"Why are fewer young people doing sports nowadays, and how can this be changed?","qZh":"为什么现在做运动的年轻人变少了？如何改变这种状况？","ans6":"I think screens are the biggest reason. Phones and games are designed to be attractive, and sitting with them is much easier than going outside to sweat. Study pressure is another cause: many parents prefer their children to do extra homework rather than play football. Also, public sports facilities are not always close or free, which makes sports a trouble. To change this, schools and families should work together. Schools can make PE classes fun instead of just testing, and parents can exercise with children at weekends as a family habit. Governments can build free courts and running paths near homes. For example, when a small basketball court opened near my home, more kids appeared outside within weeks. People do not hate sports; they just need easy chances to start.","upgrades":["a sedentary lifestyle（久坐不动的生活方式）","public sports facilities（公共体育设施）","instill healthy habits（培养健康习惯）","physical education（体育课）"]},{"part":3,"topic":"Food Culture","q":"Do you think traditional food is important to a culture?","qZh":"你认为传统食物对一种文化重要吗？","ans6":"Yes, traditional food is one of the most important parts of any culture. Food carries history: recipes pass down from grandparents, and every dish tells a story about the land and the people. It also holds families and festivals together. In my country, we cannot imagine Spring Festival without dumplings, and mooncakes define the autumn festival. When people move abroad, food is often the first culture they keep and the first thing they share with neighbours. For example, my city's noodle shops are full of tourists who learn about our lifestyle just by eating breakfast there. Of course, food culture also changes with time, and that is normal. But as long as families keep cooking and teaching the old dishes, traditional food will stay alive and keep connecting people to their roots.","upgrades":["cultural identity（文化认同）","culinary heritage（饮食文化遗产）","passed down through generations（代代相传）","a melting pot（大熔炉）"]},{"part":3,"topic":"Internet and Learning","q":"How has the internet changed the way people learn?","qZh":"互联网如何改变了人们的学习方式？","ans6":"The internet has made learning cheaper, faster and more personal. In the past, knowledge lived in schools and libraries, and a good teacher was a lucky accident. Now anyone with a phone can watch free courses from top universities, and people learn skills like cooking or coding from short videos at home. Learning is also more personal: you choose what, when and how fast to study, and you can pause and repeat a hard part. This helped me a lot before exams, when I watched history summaries online. However, there are two problems: information overload, because it is hard to know what is true, and distraction, because fun videos sit next to serious lessons. So the internet gives everyone a classroom, but self-discipline has become the new key skill for learners.","upgrades":["access to knowledge（获取知识的途径）","self-paced learning（自主节奏的学习）","information overload（信息过载）","a double-edged sword（双刃剑）"]},{"part":3,"topic":"Business","q":"What are the advantages and disadvantages of running your own business instead of working for a company?","qZh":"自己创业而不是在公司工作有什么优点和缺点？","ans6":"Running your own business has clear attractions. You are your own boss: you decide what to do, keep most of the profit, and the business can grow much bigger than any salary. Work also feels more meaningful when it is your own dream. But the risks are real. A business owner carries all the pressure: money can be lost, income is unstable, and there are no paid holidays or insurance in the early years. My father ran a small shop for years, and I watched him worry about rent every month. Working for a company gives a steady salary, training and free time, but less freedom and a lower ceiling. In my view, young people should first work in companies to learn the rules, then start a business only when they truly understand the market.","upgrades":["job security（工作保障）","take the plunge（毅然尝试）","financial risk（财务风险）","be your own boss（自己当老板）"]},{"part":3,"topic":"Goals","q":"Is it important for young people to set long-term goals?","qZh":"对年轻人来说，设定长期目标重要吗？","ans6":"I think some kind of long-term direction is important, but detailed long-term plans are often useless. A clear direction, like the field you want to work in or the life you want, helps you make daily choices and stops you from drifting. People without any goal often waste years jumping between random things. However, life changes fast, and a rigid ten-year plan usually breaks. For example, I planned to study finance, but after one internship I realized it did not suit me at all. So my advice is: set a general long-term goal, but check it every year and stay open to change. What matters most is not the exact plan but the habit of thinking about where you are going, and taking small steps that keep you moving.","upgrades":["a sense of direction（方向感）","a long-term vision（长期眼光）","drift through life（随波逐流地生活）","adjust course along the way（途中不断调整方向）"]},{"part":3,"topic":"Older Generations","q":"What can young people learn from older generations?","qZh":"年轻人能从老一辈身上学到什么？","ans6":"There is a lot young people can learn from the older generation. The first is patience. Old people grew up in times without shortcuts, so they understand that good things take time, whether it is a meal, a skill or a relationship. The second is managing money and life practically. My grandmother can fix clothes, save resources and cook from simple ingredients, which young people like me never learned. Third, older people know history from real experience, not from books, so their stories make the past real. For example, my grandfather's stories about his poor childhood changed how I see food waste. Of course, older generations also need to learn from the young about technology and new ideas, because learning goes both ways between generations.","upgrades":["the older generation（老一辈人）","life lessons（人生经验教训）","a frugal lifestyle（节俭的生活方式）","mutual learning（互相学习）"]},{"part":3,"topic":"Urban Planning","q":"Should cities spend money on parks or on roads and housing?","qZh":"城市应该把钱花在公园上，还是花在道路和住房上？","ans6":"Roads and housing are basic needs, so they usually come first; people must have somewhere to live and a way to get to work. But I do not see it as either-or. Parks are also a form of public health. Green spaces clean the air, cool the city in summer and give people places to exercise and meet, which reduces medical costs in the long run. A city with only concrete blocks is efficient but depressing, and people who feel bad work worse too. My city added a long riverside park last year, and the flats around it became more expensive, so parks even pay for themselves in some ways. The smart answer is to plan both together: build housing with green spaces inside it, instead of treating them as enemies.","upgrades":["public health（公共健康）","quality of life（生活质量）","the concrete jungle（钢筋水泥的丛林）","long-term returns（长期回报）"]},{"part":3,"topic":"News Media","q":"Do you think news on the internet is reliable?","qZh":"你认为互联网上的新闻可靠吗？","ans6":"Not always, and I think people should be careful. The internet allows anyone to publish anything instantly, and speed often beats accuracy, because fake or exaggerated stories attract more clicks. During big events, I often see completely different versions of the same story on different sites, and sometimes the truth comes out days later. Big traditional media still check facts, but even they make mistakes under pressure. So my personal habit is simple: I never trust one source. I compare two or three serious news sites before believing something, and I stay extra careful with emotional headlines and strange photos. The internet gives everyone information, but it also gives everyone a voice, so checking sources has become a basic life skill that schools should teach.","upgrades":["verify information（核实信息）","misinformation（虚假信息）","credible sources（可信的消息来源）","critical thinking（批判性思维）"]},{"part":3,"topic":"Education","q":"Do you think teachers will be replaced by computers in the future?","qZh":"你觉得将来老师会被电脑取代吗？","ans6":"I don't think so. Computers can give students information quickly, but teachers can understand feelings and answer questions in different ways. Also, young students need a real person to keep them interested in class.","qZh_note":"","upgrades":["personal touch（人情味）","adapt the lesson to each student（因材施教）","keep students motivated（让学生保持动力）"]},{"part":3,"topic":"Education","q":"Should students learn practical skills at school, like cooking or managing money?","qZh":"学生应该在学校学习做饭、理财这类实用技能吗？","ans6":"Yes, I think schools should teach some practical skills. Many young people leave school without knowing how to cook a simple meal or manage money. Academic subjects are important, but life skills are useful every day.","upgrades":["hands-on skills（动手技能）","day-to-day life（日常生活）","financial literacy（理财能力）"]},{"part":3,"topic":"Education","q":"What are the benefits of studying abroad?","qZh":"出国留学有什么好处？","ans6":"Studying abroad helps students improve their language skills and see the world from a different angle. They also learn to be independent because they have to cook, clean and solve problems alone. Of course, it can be expensive, so families need to plan carefully.","upgrades":["broaden one's horizons（开阔眼界）","become self-reliant（学会自立）","a life-changing experience（改变人生的经历）"]},{"part":3,"topic":"Technology","q":"How has technology changed the way people study?","qZh":"科技如何改变了人们学习的方式？","ans6":"In the past, students could only learn from books and teachers. Now they can watch videos, use apps and take online classes anywhere. This makes learning cheaper and more flexible, but some students find it harder to focus without a real classroom.","upgrades":["at one's own pace（按自己的节奏）","a wealth of resources（大量资源）","get distracted easily（容易分心）"]},{"part":3,"topic":"Technology","q":"Do people spend too much time on their phones nowadays?","qZh":"现在人们花在手机上的时间是不是太多了？","ans6":"Yes, many people do. On buses and even at dinner tables, almost everyone is looking at a screen. Phones are useful, but too much screen time can hurt sleep and make face-to-face talk less common.","upgrades":["glued to their screens（盯着屏幕不放）","face-to-face communication（面对面交流）","cut down screen time（减少屏幕时间）"]},{"part":3,"topic":"Technology","q":"Do you think online shopping will completely replace physical stores?","qZh":"你觉得网购会完全取代实体店吗？","ans6":"I don't think it will completely replace them. Online shopping is fast and often cheaper, but many people still like to touch products and try clothes on before buying. Shopping is also a social activity for some families.","upgrades":["try before you buy（先试后买）","the in-store experience（店内体验）","a social outing（社交外出）"]},{"part":3,"topic":"Environment","q":"What can ordinary people do to protect the environment?","qZh":"普通人能为保护环境做些什么？","ans6":"There are many small things we can do. For example, we can take buses or ride bikes instead of driving, bring our own bags when shopping, and save electricity at home. If millions of people do these small things, the effect will be big.","upgrades":["reduce one's carbon footprint（减少碳足迹）","small everyday actions（日常小事）","make a real difference（带来真正的改变）"]},{"part":3,"topic":"Environment","q":"Is it the government's job to solve environmental problems, or everyone's?","qZh":"解决环境问题是政府的责任还是每个人的责任？","ans6":"I believe both sides have a role to play. The government can make laws and build green systems, like recycling stations and clean buses. But laws only work when people follow them, so every citizen should take responsibility too.","upgrades":["play a part（发挥作用）","introduce green policies（推出环保政策）","a shared responsibility（共同的责任）"]},{"part":3,"topic":"Environment","q":"Why is air pollution still a serious problem in some big cities?","qZh":"为什么一些大城市空气污染仍然严重？","ans6":"Mainly because there are too many cars and factories in those cities. Population is growing fast, so people use more energy every day. Some cities are improving by using electric buses and planting more trees, but it takes time.","upgrades":["vehicle emissions（汽车尾气排放）","energy consumption（能源消耗）","see a marked improvement（看到明显改善）"]},{"part":3,"topic":"Work","q":"What makes a job a 'good job' for most people?","qZh":"对大多数人来说，什么样的工作算是好工作？","ans6":"I think a good job has three things: fair pay, a friendly team and room to grow. Money is important because everyone has bills to pay, but people also want to feel their work is respected and they can learn new skills.","upgrades":["a decent salary（体面的工资）","a supportive team（互相支持的团队）","career development（职业发展）"]},{"part":3,"topic":"Work","q":"Why do many young people want to start their own business?","qZh":"为什么很多年轻人想自己创业？","ans6":"Young people like freedom, and running their own business means they can make their own decisions. The internet also makes it cheaper to start a small online shop or a service. But starting a business is risky, so they should learn from others first.","upgrades":["be your own boss（自己当老板）","lower the entry barrier（降低门槛）","take calculated risks（承担可控的风险）"]},{"part":3,"topic":"Work","q":"How will work change in the next twenty years?","qZh":"未来二十年工作会有什么变化？","ans6":"I think more people will work from home and use computers for meetings. Simple and repetitive jobs may be done by machines, so people will focus on creative work and jobs that need human contact, like teaching and nursing.","upgrades":["remote work（远程办公）","repetitive tasks（重复性工作）","human interaction（人与人的交流）"]},{"part":3,"topic":"Media","q":"Where do most people get their news now, and has it changed?","qZh":"现在人们主要从哪里获取新闻？这有变化吗？","ans6":"Yes, it has changed a lot. Twenty years ago most people watched TV or read newspapers. Now most news comes from phones, especially short videos and social media. It is fast, but sometimes the information is not checked carefully.","upgrades":["news consumption habits（新闻消费习惯）","social media feeds（社交媒体信息流）","verify the facts（核实事实）"]},{"part":3,"topic":"Media","q":"Do you think advertisements have too much influence on people?","qZh":"你认为广告对人的影响太大了吗？","ans6":"In some ways, yes. Ads follow us everywhere now, from short videos to street screens. They make people, especially children, want things they don't really need. But clear rules can protect consumers from false claims.","upgrades":["targeted ads（精准投放的广告）","create false needs（制造虚假需求）","misleading claims（误导性宣传）"]},{"part":3,"topic":"Media","q":"Are famous people good role models for young people?","qZh":"名人是年轻人的好榜样吗？","ans6":"It depends. Some famous people work hard and help others, and young fans can learn good things from them. But some stars only show their rich lifestyle, which is not helpful. Parents and teachers should teach children to look at the whole picture.","upgrades":["a positive influence（积极影响）","a lavish lifestyle（奢华的生活方式）","follow blindly（盲目跟风）"]},{"part":3,"topic":"Health","q":"Why do many people find it hard to exercise regularly?","qZh":"为什么很多人难以坚持规律锻炼？","ans6":"The main reason is that work takes up most of their time and energy. After a long day, people just want to rest. Also, exercise can be boring if you do it alone, so joining a club or going with friends helps people stick to it.","upgrades":["lead a sedentary life（久坐不动的生活）","stick to a routine（坚持一种习惯）","work out with friends（和朋友一起锻炼）"]},{"part":3,"topic":"Health","q":"Should the government spend more money on public sports facilities?","qZh":"政府应该在公共体育设施上花更多钱吗？","ans6":"Yes, I support it. Free parks and gyms give everyone a chance to exercise, not just people who can pay for clubs. In the long run, this saves medical costs because healthier people get sick less often.","upgrades":["accessible to all（人人可用）","in the long run（长远来看）","lower healthcare costs（降低医疗开支）"]},{"part":3,"topic":"Cities","q":"What are the biggest problems for people living in big cities?","qZh":"住在大城市的人面临的最大问题是什么？","ans6":"I think the biggest ones are high house prices and traffic. A small flat can cost a family many years of savings. Rush hours are also stressful, so many people spend two or more hours a day on the road.","upgrades":["the cost of housing（住房成本）","rush-hour congestion（高峰期拥堵）","a long commute（长途通勤）"]},{"part":3,"topic":"Cities","q":"How can cities make public transport more attractive?","qZh":"城市怎样才能让公共交通更有吸引力？","ans6":"Buses and trains should be frequent, clean and cheap. If a bus comes every five minutes and the app shows exact arrival times, people will happily leave their cars at home. Good bike lanes also help people do the last part of the trip.","upgrades":["reliable and punctual（可靠准点）","leave the car at home（不开车出门）","the last-mile problem（最后一公里问题）"]},{"part":3,"topic":"Cities","q":"Do you prefer the pace of life in big cities or small towns?","qZh":"你更喜欢大城市还是小城镇的生活节奏？","ans6":"I prefer big cities for now because there are more job chances and interesting things to do at night. But the pace is fast and stressful. When I get older, a quiet small town might be better for family life.","upgrades":["a fast-paced lifestyle（快节奏的生活方式）","job opportunities（工作机会）","slow down a bit（慢下来）"]},{"part":3,"topic":"Family","q":"How are families today different from families in the past?","qZh":"现在的家庭和过去有什么不同？","ans6":"In the past, three generations often lived under one roof. Now young people usually move out and live alone or with their own small family. Family members also talk more on the phone than face to face, especially when they live in different cities.","upgrades":["an extended family（大家庭）","a nuclear family（小家庭）","under one roof（同一屋檐下）"]},{"part":3,"topic":"Family","q":"Should old parents live with their adult children?","qZh":"年迈的父母应该和成年子女住在一起吗？","ans6":"Both ways have good points. Living together makes daily care easier and the house feels lively. But older people may prefer their own space and habits. I think the best choice depends on the family's real situation and everyone's wishes.","upgrades":["respect their independence（尊重他们的独立）","mutual understanding（相互理解）","a nursing home（养老院）"]},{"part":3,"topic":"Family","q":"What important lessons should parents teach their children?","qZh":"父母应该教给孩子哪些重要的东西？","ans6":"Besides knowledge, parents should teach children to be honest and to take responsibility for their mistakes. Good habits like keeping promises and helping others are learned at home first. These lessons stay with a person for life.","upgrades":["lead by example（以身作则）","own up to mistakes（承认错误）","lifelong values（一生的价值观）"]},{"part":3,"topic":"Culture","q":"Why do young people sometimes find traditional culture boring?","qZh":"为什么年轻人有时觉得传统文化无聊？","ans6":"Because traditional culture is often presented in an old-fashioned way, like long lectures and museums with only text. Young people like short videos and interactive things. If museums use games and technology, more young visitors will come.","upgrades":["a fresh way of presenting（新鲜的呈现方式）","interactive exhibits（互动展览）","connect with the past（与历史产生联结）"]},{"part":3,"topic":"Culture","q":"What can people learn from travelling to other countries?","qZh":"去别的国家旅行能学到什么？","ans6":"Travelling shows you how differently people live. You taste new food, hear another language and see new customs. After such trips, people usually become more open-minded and less quick to judge others.","upgrades":["step out of your comfort zone（走出舒适区）","broaden the mind（开阔思维）","appreciate cultural differences（理解文化差异）"]},{"part":3,"topic":"Culture","q":"Is it important to learn a foreign language?","qZh":"学一门外语重要吗？","ans6":"Yes, very important. A foreign language is a key to more information, better jobs and new friends. Even simple English helps a lot when you travel or read online. Learning a language also trains your brain to see things from another angle.","upgrades":["a gateway to opportunities（通往机会的大门）","attractive to employers（受雇主青睐）","train your brain（锻炼大脑）"]},{"part":3,"topic":"Money","q":"Why do some people enjoy shopping even when they don't need anything?","qZh":"为什么有些人不需要买东西也喜欢逛？","ans6":"For many people, shopping is a way to relax after a stressful week. Walking around shops with friends feels like a small trip. Also, buying something new gives a short feeling of happiness, even if the item is not really needed.","upgrades":["retail therapy（购物解压）","a stress reliever（减压方式）","impulse buying（冲动消费）"]},{"part":3,"topic":"Money","q":"Should children be given pocket money, and should they be taught how to use it?","qZh":"应该给孩子零花钱吗？应该教他们怎么用吗？","ans6":"Yes to both. Pocket money teaches children to make choices: if they spend it all today, there is nothing left this week. Parents can guide them to save part of it and think twice before buying. It is their first lesson in money management.","upgrades":["learn to budget（学会做预算）","think twice before buying（三思而后买）","a first lesson in finance（理财第一课）"]},{"part":3,"topic":"Sports","q":"Why do some countries do better than others in certain sports?","qZh":"为什么有些国家在某些运动项目上特别强？","ans6":"I think it is a mix of tradition, money and training systems. A country with a long history in a sport will have more coaches and young players. Richer countries can build better training centres, so talent gets developed faster.","upgrades":["a strong sporting tradition（深厚的体育传统）","training facilities（训练设施）","develop young talent（培养年轻人才）"]},{"part":3,"topic":"Sports","q":"Do professional athletes earn too much money?","qZh":"职业运动员挣的钱是不是太多了？","ans6":"It looks that way, but their careers are short and their bodies take a lot of damage. Top athletes also bring huge income to clubs and cities. I do think some of that money should support young players and local sports.","upgrades":["a short career span（职业生涯短）","physical toll（身体损耗）","give back to the community（回馈社区）"]}];window.IELTS_DATA=window.IELTS_DATA||{};window.IELTS_DATA.SPEAKING=S;})();

/* 写作题库：Task1 小作文×8（本项目补写，图表数据文字化）+ Task2 大作文×20（任务16 快照）*/
(function(){"use strict";var W=[{"no":1,"type":"Task 1","q":"The line graph below shows the number of daily trips (in millions) made by three types of transport in one country between 1980 and 2020. Summarise the information by selecting and reporting the main features, and make comparisons where relevant. Write at least 150 words.","data":"线图数据——Car（私家车）：1980年 3 百万次 → 1990年 4.5 → 2000年 6 → 2010年 7.5 → 2020年 8；Bus（公交）：1980年 2 → 1990年 2.2 → 2000年 2 → 2010年 1.5 → 2020年 1；Bicycle（自行车）：1980年 1 → 1990年 0.8 → 2000年 0.6 → 2010年 0.9 → 2020年 1.4。","qZh":"下图显示 1980 至 2020 年间某国三种交通方式的每日出行次数（单位：百万）。选取并汇报主要特征，并进行比较。至少写 150 词。","outline":"开头：改写题目（某国三种交通方式 40 年的每日出行次数）。\n总览：私家车持续大幅增长并始终最高；公交缓慢下滑；自行车先降后升。\n主体段1：私家车 3→8 百万（约2.7倍），公交 2→1 百万几乎减半。\n主体段2：自行车 1980-2000 跌至 0.6，之后回升到 1.4，2010 年前后超过公交。","essay":"The line graph illustrates how many daily trips, measured in millions, people made by car, bus and bicycle in one country over a forty-year period from 1980 to 2020. Overall, travelling by car became increasingly dominant, while bus use declined steadily; cycling initially fell but recovered in the second half of the period. In 1980, cars accounted for 3 million daily trips, and this figure rose sharply over the following decades, reaching 6 million by 2000 and eventually 8 million in 2020. Bus travel started at 2 million trips and remained relatively stable until 2000, after which it dropped to just 1 million by the end of the period. Bicycle use followed a different pattern: it declined gradually from 1 million to 0.6 million trips between 1980 and 2000, before recovering to 0.9 million in 2010 and 1.4 million in 2020. As a result, by the final year cycling was more popular than buses, despite having been the least used option at the beginning.","bandNote":"亮点：总览句一句话概括三条线的走势对比；数据引用完整且单位正确（million trips）；over the following decades / followed a different pattern / despite having been... 等衔接自然；结尾用 despite 结构收束对比，符合 7 分句式。"},{"no":2,"type":"Task 1","q":"The chart below shows the annual number of library visits (in thousands) in four cities in 2010 and 2020. Summarise the information by selecting and reporting the main features, and make comparisons where relevant. Write at least 150 words.","data":"柱图数据（千次/年）——City A：2010年 520 → 2020年 610；City B：2010年 480 → 2020年 350；City C：2010年 260 → 2020年 270；City D：2010年 190 → 2020年 205。","qZh":"下图显示四个城市 2010 年和 2020 年图书馆年访问量（单位：千次）。选取并汇报主要特征，并进行比较。至少写 150 词。","outline":"开头：改写题目（四城图书馆年访问量，两轮数据）。\n总览：A 始终最高且增长；B 明显下降；C、D 规模小但微增。\n主体段1：A 520→610（+90千），B 480→350（-130千），两者 2010 年接近、2020 年拉开差距。\n主体段2：C、D 远小于前两者，变化温和（+10千、+15千）。","essay":"The bar chart compares how many visits, in thousands, four cities received at their public libraries in 2010 and 2020. Overall, City A recorded the highest figures in both years and continued to grow, whereas City B experienced a sharp fall; the remaining two cities remained on a much smaller scale but rose slightly. In 2010, City A and City B were at similar levels, with 520 thousand and 480 thousand visits respectively. However, by 2020 the picture had changed considerably: visits to City A climbed to 610 thousand, while those to City B dropped to just 350 thousand, less than half of City A's total. City C and City D attracted far fewer visitors throughout the decade. City C received 260 thousand visits in 2010 and edged up to 270 thousand ten years later, and City D showed a comparable trend, growing from 190 thousand to 205 thousand. Despite these modest increases, neither small city came close to the leaders.","bandNote":"亮点：总览句点出 A 增长、B 大跌、C/D 小幅上升的整体格局；were at similar levels / the picture had changed considerably / edged up 等表达地道；用 less than half of City A's total 做跨组比较，是 Task1 加分点。"},{"no":3,"type":"Task 1","q":"The two pie charts below show how a household's monthly spending was distributed in 2000 and 2020. Summarise the information by selecting and reporting the main features, and make comparisons where relevant. Write at least 150 words.","data":"饼图数据（月支出占比）——2000年：Housing（住房）30%，Food（食物）25%，Transport（交通）15%，Education（教育）10%，Entertainment（娱乐）8%，Other（其他）12%。2020年：Housing 40%，Food 18%，Transport 12%，Education 15%，Entertainment 10%，Other 5%。","qZh":"下面两张饼图显示某家庭 2000 年和 2020 年的月支出结构。选取并汇报主要特征，并进行比较。至少写 150 词。","outline":"开头：改写题目（一个家庭两个年份的月支出占比）。\n总览：住房占比最大且进一步上升；食物和其他明显缩水；教育、娱乐上升。\n主体段1：住房 30%→40%（+10 个百分点），食物 25%→18%，其他 12%→5%。\n主体段2：教育 10%→15%，娱乐 8%→10%，交通 15%→12%。","essay":"The two pie charts illustrate the proportions of a household's monthly budget that were spent on six categories in 2000 and 2020. Overall, housing represented the largest share in both years and expanded further over the period, while spending on food and other items shrank noticeably; education and entertainment, by contrast, took up more of the budget in 2020. In 2000, housing accounted for 30% of monthly spending, and this figure rose by ten percentage points two decades later. Food showed the opposite trend, falling from 25% to 18%, and the 'other' category dropped from 12% to just 5%, becoming the smallest segment. Meanwhile, expenditure on education grew from 10% to 15%, and entertainment rose slightly from 8% to 10%. Transport was the only category apart from food and 'other' to decline, slipping from 15% to 12%. Taken together, the charts suggest that this family devoted an increasing part of its income to housing and education.","bandNote":"亮点：饼图常用比例表达准确（accounted for / rose by ten percentage points / took up）；总览句覆盖两升两降；Taken together 结尾句升华为\"钱花向住房和教育\"，避免简单罗列；smallest segment 细节到位。"},{"no":4,"type":"Task 1","q":"The table below shows the percentage of households with internet access in five countries in 2010 and 2020. Summarise the information by selecting and reporting the main features, and make comparisons where relevant. Write at least 150 words.","data":"表格数据（家庭联网比例）——Country A：2010年 65% → 2020年 92%；Country B：2010年 50% → 2020年 85%；Country C：2010年 40% → 2020年 78%；Country D：2010年 30% → 2020年 70%；Country E：2010年 18% → 2020年 55%。","qZh":"下表显示五个国家 2010 年和 2020 年拥有互联网接入的家庭比例。选取并汇报主要特征，并进行比较。至少写 150 词。","outline":"开头：改写题目（五国联网家庭比例，两个年份）。\n总览：所有国家都大幅上升；A 两年都最高；E 起点最低但涨幅最大。\n主体段1：A 65%→92%，B 50%→85%，C 40%→78%。\n主体段2：D 30%→70%（+40 点），E 18%→55%（+37 点），但 E 仍垫底；差距在缩小。","essay":"The table gives information about the proportion of households that had access to the internet in five different countries in 2010 and 2020. Overall, online access expanded rapidly everywhere during the decade, with Country A leading in both years and Country E starting from the lowest base yet still making remarkable progress. In 2010, two-thirds of households in Country A were connected, the highest figure among the five, and by 2020 this had reached 92%, meaning almost universal coverage. Country B and Country C followed similar upward paths, rising from 50% to 85% and from 40% to 78% respectively. The most dramatic changes, however, occurred in the two least connected countries. In Country D the figure more than doubled, jumping from 30% to 70%, while Country E climbed from just 18% to 55%. Although Country E remained at the bottom of the table, the gap between the richest and poorest performers narrowed considerably over the ten years.","bandNote":"亮点：more than doubled / jumping from...to... / narrowed considerably 表达多样；总览句兼顾\"都在涨 + 领头羊 + 追赶者\"三个角度；meaning almost universal coverage 用分词补充解读数据，体现高分意识。"},{"no":5,"type":"Task 1","q":"The graph below shows the percentage of people aged 65 and over in two countries between 2000 and 2050 (actual figures up to 2020, predicted figures after). Summarise the information by selecting and reporting the main features, and make comparisons where relevant. Write at least 150 words.","data":"线图数据（65岁以上人口占比）——Country A：2000年 12% → 2010年 15% → 2020年 18%（实际）→ 2030年 23%（预测）→ 2040年 27% → 2050年 30%；Country B：2000年 9% → 2010年 11% → 2020年 13%（实际）→ 2030年 16%（预测）→ 2040年 19% → 2050年 22%。","qZh":"下图显示两国 65 岁及以上人口比例在 2000 至 2050 年间的变化（2020 年前为实际数据，之后为预测）。选取并汇报主要特征，并进行比较。至少写 150 词。","outline":"开头：改写题目（两国老龄人口比例，含实际与预测）。\n总览：两国比例都持续上升且预计继续；A 始终高于 B 且差距扩大。\n主体段1：实际数据期 A 12%→18%，B 9%→13%。\n主体段2：预测期 A 到 2050 年达 30%（近三分之一），B 达 22%；两者 2050 年差 8 个百分点。","essay":"The line graph tracks the share of the population aged 65 and above in two countries from 2000 to 2050, with the figures after 2020 being predictions. Overall, both countries are expected to see continuous growth in their elderly populations, and the gap between them is projected to widen over the period. Between 2000 and 2020, the proportion in Country A rose steadily from 12% to 18%, while Country B grew more slowly, from 9% to 13%. From 2020 onwards, the graph shows forecast figures. Country A's share is predicted to climb to 23% by 2030, 27% by 2040 and 30% by 2050, which means nearly one in three citizens will be a pensioner. Country B is forecast to follow the same upward direction but at a gentler pace, reaching 22% by the middle of the century. In 2000 the difference between the two countries was only three percentage points, yet by 2050 it is expected to stand at eight.","bandNote":"亮点：预测类题目用 is predicted to / is forecast to / is projected to 三种表达轮换；nearly one in three citizens 把百分比翻译成通俗说法，是高分技巧；首尾呼应点出差距从 3 点扩到 8 点。"},{"no":6,"type":"Task 1","q":"The chart below shows the number of male and female students enrolled in five subjects at a university in 2020. Summarise the information by selecting and reporting the main features, and make comparisons where relevant. Write at least 150 words.","data":"柱图数据（学生人数）——Computer Science：男 1800，女 600；Engineering：男 1600，女 500；Business：男 1100，女 1150；Medicine：男 700，女 1200；Education：男 400，女 1000。","qZh":"下图显示某大学 2020 年五个专业的男女生入学人数。选取并汇报主要特征，并进行比较。至少写 150 词。","outline":"开头：改写题目（某校五个专业的男女学生数）。\n总览：理工科男生远多于女生；教育、医学女生占优；商科基本均衡。\n主体段1：计算机 1800 vs 600，工程 1600 vs 500（约三倍）。\n主体段2：医学 1200 vs 700，教育 1000 vs 400（女生2.5倍）；商科 1150 vs 1100 几乎持平。","essay":"The bar chart gives the enrolment figures for male and female students across five subjects at one university in 2020. Overall, technical subjects attracted far more men than women, while women dominated medicine and education; business studies was the only subject where the numbers were almost equal. Computer Science had the largest gender gap. It enrolled 1,800 male students compared with just 600 females, and Engineering showed a similar imbalance, with 1,600 men and 500 women, meaning men outnumbered women by roughly three to one in both fields. The opposite pattern appeared in Medicine and Education. Female medical students (1,200) considerably exceeded male ones (700), and Education had two and a half times as many women as men (1,000 versus 400). Business, by contrast, drew a balanced intake, with 1,100 male and 1,150 female students. It is also worth noting that Computer Science and Engineering were the two most popular subjects overall, despite their low female enrolment.","bandNote":"亮点：dominated / outnumbered by roughly three to one / a balanced intake 表达准确；对比结构清晰（理工男多、文医女多、商科均衡）；结尾补充\"整体最热门专业\"观察，展示数据敏感度。"},{"no":7,"type":"Task 1","q":"The diagram below shows the process of recycling used paper. Summarise the information by selecting and reporting the main features, and make comparisons where relevant. Write at least 150 words.","data":"流程图步骤——①收集：使用过的纸张被收集并运往回收中心；②分拣：按质量和类型人工分拣，去除塑料等杂物；③清洗：热水和化学剂洗涤去墨；④打浆：搅碎成纸浆；⑤成型：纸浆压平烘干，卷成大卷；⑥成品：大卷纸被切割包装，重新进入市场。","qZh":"下图展示废旧纸张回收的流程。选取并汇报主要特征。至少写 150 词。","outline":"开头：改写题目（废纸回收六个主要阶段）。\n总览：流程分两大块——前期人工处理（收集、分拣）与后期机械处理（清洗到成品）；共 6 步。\n主体段1：收集→分拣（人工、去杂物）→清洗（热水+化学剂去墨）。\n主体段2：打浆→压平烘干成型→切割包装重回市场；首尾衔接形成循环。","essay":"The diagram illustrates the various stages involved in recycling used paper, from initial collection to the finished product. Overall, the process consists of six main steps, which can be divided into two broad phases: manual sorting at the beginning and mechanical processing for the remainder. First of all, used paper is gathered from homes, offices and schools and transported to a recycling centre. There, workers sort the paper by type and quality, and any non-paper items such as plastic or staples are removed by hand. In the next stage, the sorted paper is washed in hot water together with chemicals, a step that removes ink and other impurities. It is then shredded and mixed into a pulp, which is pressed flat, dried and wound into large rolls. Finally, these rolls are cut and packed before being sent back to shops and offices, and the recycled paper is ready to be used again.","bandNote":"亮点：流程图必备被动语态（is gathered / is washed / is shredded）使用熟练；divided into two broad phases 把 6 步归成 2 块，避免流水账；In the next stage / Finally 顺序连接词完整；首句点明 from collection to finished product。"},{"no":8,"type":"Task 1","q":"The maps below show the changes that took place in a small town between 1990 and 2020. Summarise the information by selecting and reporting the main features, and make comparisons where relevant. Write at least 150 words.","data":"地图对比（1990 vs 2020）——1990年：镇中心一个市场广场；北边农田；南边一条铁路和火车站；河边三个小工厂；居民区集中在西部。2020年：市场广场改造成步行街+中心喷泉；农田变成住宅区（New Park 旁）；火车站扩建为高铁站，铁路仍在；工厂全部拆除，河边改建滨河公园（Riverside Park）和咖啡馆。","qZh":"下图展示某小镇 1990 至 2020 年间发生的变化。选取并汇报主要特征，并进行比较。至少写 150 词。","outline":"开头：改写题目（小镇三十年间的主要变化）。\n总览：城镇明显现代化——工业消失、绿地与交通升级、住宅扩张。\n主体段1：市场广场→步行街+喷泉；农田→住宅区。\n主体段2：工厂拆除→滨河公园与咖啡馆；火车站扩建成高铁站；居民区扩大。","essay":"The two maps compare the layout of a small town in 1990 and 2020, revealing several significant developments over the thirty years. Overall, the town became noticeably more modern and greener: industrial areas disappeared, green spaces were introduced, and transport facilities were upgraded. The most striking change took place in the town centre, where the old market square was converted into a pedestrian street with a fountain in the middle. The farmland that used to occupy the northern part of the town was replaced by a new residential area next to a public park. Along the river, the three small factories that stood there in 1990 were completely demolished, and the area was transformed into Riverside Park with cafés along the bank. Transport also saw improvements: the original railway station in the south was expanded into a high-speed station, although the railway line itself remained in its original position. Finally, the residential district in the west grew considerably larger by 2020.","bandNote":"亮点：地图题核心句式到位（was converted into / was replaced by / was demolished / was transformed into）；总览句概括\"更现代更绿\"两大方向；although 让步从句保留\"铁路未变\"的不变项，符合\"变化题也要写没变的部分\"的高分要求。"},{"no":1,"type":"Task 2","q":"Some people believe that university education should be free for all students, regardless of their family background. To what extent do you agree or disagree?","qZh":"有人认为，不论家庭背景如何，大学教育都应当对所有学生免费。你在多大程度上同意或不同意这一观点？","essay":"It is often argued that universities should not charge tuition fees, so that every young person can access higher education. While I fully support free education for students from low-income families, I believe that making it free for everyone is neither fair nor financially realistic. Universities are expensive institutions to run, and somebody must ultimately pay for lecturers, laboratories and libraries. The main reason for my view is that free tuition would place an enormous burden on public budgets. Governments have many competing priorities, such as healthcare, pensions and infrastructure, and universities still need substantial income to attract good lecturers and maintain modern facilities. Independent estimates in several countries suggest that abolishing fees would cost billions every year — money that would almost certainly be taken from schools or hospitals instead. For example, England briefly abolished fees before 1998 and later reintroduced them because the system became unsustainable. Furthermore, free education for all can be unfair to those who never attend university. A plumber or shop assistant would effectively pay taxes to fund degrees that mainly benefit graduates, who typically earn much higher salaries later in life. Some of those graduates will even move abroad, contributing their taxes to another country, which makes the subsidy harder to justify. Admittedly, free tuition does widen access for talented students from poor backgrounds, and no society should lose its best minds for financial reasons. However, this goal can be achieved more efficiently through generous scholarships and income-contingent loans rather than universal free places, because targeted support reaches exactly the students who need it. In conclusion, I disagree that university should be free for all; targeted financial support is a fairer and more realistic solution.","outline":"开头：改写题目并亮明立场——支持贫困生免费，反对全员免费；点出大学成本高昂，真正的问题是钱由谁出。\n主体段1：财政不可持续——政府预算有限，医疗、基建优先；独立估算显示取消学费每年耗资数十亿；废除学费的国家后来恢复收费。\n主体段2：对不上大学的人不公平——蓝领缴税资助未来高薪毕业生；毕业生还可能移居海外。\n让步段：免费确实帮助贫困生，但奖学金和生活补助同样有效且更精准。\n结论：反对全员免费，主张针对性资助。","bandNote":"亮点：立场清晰带让步段；新增成本论证（资金来源）与税收公平论证（毕业生移居海外）；例证具体；词汇地道：tuition fees / income-contingent loans / bear the cost / financially realistic。"},{"no":2,"type":"Task 2","q":"Some people believe that secondary schools should focus mainly on academic subjects, while others argue that practical skills such as cooking and car maintenance are equally important. Discuss both views and give your own opinion.","qZh":"有人认为中学应主要教授学术性科目，也有人认为烹饪、汽车保养等实用技能同样重要。讨论双方观点并给出你自己的看法。","essay":"People have different opinions about what secondary schools should teach. Some insist that academic knowledge must remain the priority, whereas others believe that practical skills deserve an equal place in the timetable. In my view, a balanced curriculum serves teenagers best, because very few fifteen-year-olds already know exactly which path their life will take. Those who favour academic subjects point out that they open the door to university and professional careers. Subjects like mathematics, history and science train students to think critically and analyse evidence, abilities that almost every modern job requires. A student who masters algebra, for instance, will find it much easier to move on to economics or engineering later. Employers themselves repeatedly rank analytical thinking and clear writing above narrow technical knowledge, and these habits are built in academic classrooms. On the other hand, supporters of practical lessons argue that life does not only happen in offices. Skills such as budgeting, basic repairs and healthy cooking prepare young people for independent living and can also lead to respected careers in trades, where demand often exceeds supply. In Germany, students who follow vocational pathways often find stable jobs faster than many graduates. Practical classes also give teenagers who struggle with written exams a chance to succeed and rebuild their confidence, which can keep them engaged with school altogether. The wisest schools therefore combine the two: academic core subjects in the morning, and workshops or cookery lessons in the afternoon, so that students experience both worlds before making choices. In conclusion, while academic study remains essential for intellectual growth, I believe schools should teach both types of subject, because teenagers will eventually need their heads and their hands.","outline":"开头：改写题目，立场=均衡课程；理由：青少年未来方向未定。\n主体段1：学术派——打开大学与职业之门，训练批判性思维；雇主更看重分析与写作能力。\n主体段2：实用派——生活不只在办公室；理财、维修、烹饪培养独立，职业教育需求大；德国例。\n补充段：实践课给考试失利的学生重建自信的机会。\n结论：两类都教，头和手都要用。","bandNote":"亮点：让步+折中结构；新增「未来方向未定」论证与雇主视角；新增实践课建立自信的段落；德国职业教育例证保留；词汇：balanced curriculum / vocational pathways / critical thinking。"},{"no":3,"type":"Task 2","q":"Nowadays a growing number of students choose to complete their university studies in a foreign country. Do the advantages of this trend outweigh the disadvantages?","qZh":"如今越来越多的学生选择到国外完成大学学业。这一趋势的利是否大于弊？","essay":"Studying abroad has become increasingly popular among university students, and some education consultants even treat it as the default choice. Although this experience brings real difficulties, I believe the benefits clearly outweigh the drawbacks. The years spent overseas tend to shape a young person far more deeply than the degree itself. The main advantage is personal growth. Living alone in a foreign country forces students to manage money, cook, and solve everyday problems without their parents, which builds independence quickly. In addition, graduates with overseas experience are often more attractive to employers, because international companies value people who can work with colleagues from different cultures. A Chinese student who has studied in Australia, for example, may find it much easier to join a multinational firm. Equally important is language immersion. A language learned in the classroom fades quickly, but one used daily in shops, lectures and friendships becomes a permanent skill, and the friendships themselves often turn into an international network that benefits graduates for decades. However, there are disadvantages that cannot be ignored. Tuition fees and living costs abroad are far higher than at home, so many families take on heavy debt. Homesickness and language barriers can also affect students' mental health, especially in the first year, when everything from food to teaching styles feels unfamiliar. Nevertheless, most of these problems are temporary and can be reduced with preparation and scholarships. Students who research costs honestly, apply for funding early and build a social circle through clubs usually settle in within a semester. In conclusion, although studying overseas demands money and courage, the independence, language skills and career opportunities it provides make it a worthwhile investment.","outline":"开头：改写题目，立场=利大于弊；点明海外岁月的影响超过文凭本身。\n主体段1：个人成长——独立生活能力；海外经历受雇主青睐；跨文化协作。\n主体段2：语言沉浸——外语在真实环境进步最快；结识国际人脉。\n主体段3：弊端——费用高、思乡、语言障碍影响心理健康。\n让步：问题多为短期，奖学金与提前准备可化解。\n结论：值得的投资。","bandNote":"亮点：三段式布局（两利一弊）；新增语言沉浸与人际网络论证；开头的「影响超过文凭」是高分表达；澳洲中国学生例证保留；词汇：language immersion / multinational firm / worthwhile investment。"},{"no":4,"type":"Task 2","q":"In many countries, a significant number of students leave school with a negative attitude towards learning. What are the main causes of this problem, and what can be done to encourage young people to study?","qZh":"在许多国家，相当一部分学生离开学校时对学习抱着消极态度。造成这一问题的主要原因是什么？可以采取哪些措施鼓励年轻人学习？","essay":"Many teachers complain that their students graduate without any love of learning, seeing education merely as a series of exams to survive. This essay will examine the main reasons for this attitude and suggest realistic ways to change it. One key cause is an exam-oriented system. When lessons are dominated by memorising answers and repeating past papers, students quickly lose curiosity, because they are rewarded for correct responses rather than genuine understanding. Another reason is that content often feels disconnected from real life; a teenager who cannot see how chemistry or grammar will help their future naturally stops paying attention. A third factor is digital distraction. Short videos and games deliver instant entertainment, so the slower rewards of reading a book or solving a difficult problem feel unbearable by comparison. To tackle this, schools should put more emphasis on understanding and creativity instead of endless testing. For example, project-based lessons, where students research a topic and present their findings, can restore a sense of discovery that no multiple-choice paper provides. Inviting professionals into classrooms to show how algebra runs bank systems or how physics designs phones also connects lessons to real careers. Parents also have a role to play: rather than punishing low marks, they should praise effort and link learning to their children's actual interests, such as football statistics or video game design. A boy who calculates batting averages is, after all, doing mathematics. In conclusion, exam-driven teaching, irrelevant content and instant digital entertainment are to blame, so schools and families should make learning meaningful, connected and rewarding again.","outline":"开头：改写题目，预告原因+对策结构。\n原因1：应试系统——死记硬背与刷题奖励正确答案而非真正理解。\n原因2：内容脱离生活——看不到化学、语法与未来的关联。\n原因3：数字干扰——短视频提供即时快感，挤压深度思考。\n对策1：项目式学习让学生研究并展示，恢复发现的乐趣；请从业者展示知识的真实用途。\n对策2：把学习与兴趣连接，如足球数据、游戏设计；家长表扬努力而非惩罚分数。\n结论：让学习重新变得有意义、有连接、有回报。","bandNote":"亮点：原因三选三覆盖系统、内容与注意力；对策具体可操作；新增数字干扰原因是贴近时代的高分视角；「算棒球平均分也是数学」的例子生动；词汇：project-based lessons / genuine understanding / instant digital entertainment。"},{"no":5,"type":"Task 2","q":"Some people think that modern communication technology, such as smartphones and social media, has brought people closer together, while others believe it has made us more isolated. Discuss both views and give your own opinion.","qZh":"有人认为智能手机、社交媒体等现代通讯技术拉近了人与人之间的距离，也有人认为它使我们更加孤立。讨论双方观点并给出你自己的看法。","essay":"Communication technology has changed how we maintain relationships, and opinions differ about whether smartphones and social media connect or divide us. This essay will look at both sides before giving my own view. On the one hand, digital tools clearly make communication easier than ever. Families separated by thousands of kilometres can video-call each other every evening, and old friends can stay in touch after moving abroad. During the pandemic, for example, millions of people relied on group chats and video meetings to maintain friendships while locked down at home. Immigrants whose parents still live overseas often say the same technology keeps family life alive across continents. Technology also opens doors for people who once struggled to connect: deaf users sign over video calls, grandparents in remote villages read their grandchildren's school reports on screens, and shy teenagers find communities built around shared hobbies rather than geography. On the other hand, critics argue that online contact is replacing face-to-face interaction. It is common to see a group of friends sitting in the same restaurant, each staring at a phone instead of talking. Research also suggests that heavy social media use is linked to loneliness, because shallow likes and comments cannot provide the emotional depth of a real conversation, and sleep researchers warn that late-night scrolling damages the rest we need to socialise well. In my opinion, technology itself is neutral: it strengthens bonds when it supports real relationships, but weakens them when it becomes a substitute for them. Digital detoxes, phone-free dinners and turning off notifications are small habits that keep the bridge a bridge.","outline":"开头：改写题目，预告双方讨论+个人观点。\n一方：通讯更易——跨国视频、老友维系；疫情例。\n补充：对弱势群体的价值——聋人视频手语、远程祖辈、兴趣社群。\n另一方：线上替代面对面——同桌各自刷机；浅互动与孤独相关；熬夜刷屏伤睡眠。\n观点：技术中性——是桥还是墙取决于用法；数字排毒、无手机晚餐等小习惯。","bandNote":"亮点：讨论类双方均衡；新增弱势群体受益的角度是高分视角；「keep the bridge a bridge」呼应开头；词汇：face-to-face interaction / digital detox / emotional depth。"},{"no":6,"type":"Task 2","q":"Young children today spend many hours a day using smartphones, tablets and other electronic devices. Do the advantages of this development outweigh the disadvantages?","qZh":"如今幼儿每天花数小时使用手机、平板等电子设备。这一发展的利是否大于弊？","essay":"Children are growing up surrounded by screens, and many of them spend several hours a day on electronic devices. While these gadgets do offer some educational value, I believe the disadvantages are far more serious. There are two main benefits worth mentioning. Educational apps and videos can teach letters, numbers and even foreign languages in an entertaining way, and devices also allow children to video-chat with relatives who live far away. For busy parents, a tablet can additionally provide a quiet moment to cook dinner or finish work. The danger depends less on the screen itself than on what it replaces: ten minutes of a counting app is harmless, while three hours of autoplay cartoons crowd out the play that builds social skills. However, the costs are considerable. Long screen time damages children's eyesight and reduces physical activity, which is one reason why childhood obesity has risen sharply in many countries. Screens before bedtime also damage sleep quality, and tired children learn less the next day, creating a quiet cycle of falling behind. More worryingly, hours spent scrolling or gaming replace the face-to-face play through which children learn to share, negotiate and make friends. A child who always plays alone on a tablet, for instance, may struggle to join group activities at school. Children also copy adults: a parent glued to a phone cannot reasonably forbid the same habit in a five-year-old. In conclusion, although screens can support learning in small doses, excessive use harms children's health and social development. Therefore, the drawbacks clearly outweigh the benefits, and parents should set firm time limits.","outline":"开头：改写题目，立场=弊大于利。\n好处：教育应用有趣有效、远程亲情、家长喘息。\n关键区分：危害取决于屏幕替代了什么——10 分钟数数 vs 3 小时自动播放。\n弊端1：视力与肥胖。\n弊端2：睡前屏幕伤睡眠，恶性循环。\n弊端3：挤占面对面游戏，社交能力受损。\n补充：家长榜样。\n结论：设定严格时限。","bandNote":"亮点：利弊类带让步；「危害取决于屏幕替代了什么」的区分是高分思辨；新增睡眠与家长榜样论证；词汇：face-to-face play / time limits / autoplay。"},{"no":7,"type":"Task 2","q":"Online shopping is gradually replacing shopping in physical stores in many countries. Why is this happening, and do you think it is a positive or negative development?","qZh":"在许多国家，网购正逐渐取代实体店购物。出现这一现象的原因是什么？你认为这是积极还是消极的发展？","essay":"In recent years, online shopping has become the first choice for millions of consumers, and many high-street shops are struggling to survive. This essay will explore the reasons behind this shift and argue that it is, on balance, a positive development. The main reason for the popularity of online shopping is convenience. Customers can compare prices across dozens of websites, read reviews from other buyers and have anything from groceries to furniture delivered to their door, usually at a lower price than in physical stores. Busy workers, in particular, appreciate that a purchase takes five minutes instead of an entire afternoon. Two supporting factors deserve mention: secure mobile payments have removed the fear of fraud, and fast delivery networks have turned waiting from a week into a day. Whether this is positive or not, I believe it largely is, because the money and time saved can fund more valuable activities. People no longer waste weekends queuing in crowded malls, and small businesses can now reach national or even global customers without renting expensive premises. Even the lost jobs in shops are partly offset by courier, warehouse and tech vacancies for people willing to retrain. Admittedly, online retail harms some local shops and adds emissions from delivery vans, while counterfeit goods and data leaks remain risks that regulation must chase; elderly shoppers who cannot adapt may also feel left behind, so offline options must survive for them. In conclusion, convenience and lower prices are driving this shift, and I consider it a welcome trend overall, provided governments keep pace with its risks.","outline":"开头：改写题目，预告原因+立场（总体积极）。\n原因1：便利——比价、评价、送货上门、更便宜。\n原因2：移动支付安全 + 物流提速。\n积极面：省时省钱、小商家触达全国、快递仓储岗位弥补失业。\n让步：本地店受冲击、排放、假货与隐私、老年人掉队——需要监管与线下并存。\n结论：总体欢迎，政府需跟上风险。","bandNote":"亮点：原因+立场结构；新增支付安全与物流提速两个支撑因素；让步段覆盖假货、隐私与老年群体显全面；词汇：high-street shops / counterfeit goods / courier。"},{"no":8,"type":"Task 2","q":"Some people believe that the rapid development of artificial intelligence will do more harm than good to society. To what extent do you agree or disagree?","qZh":"有人认为人工智能的快速发展给社会带来的害处大于益处。你在多大程度上同意或不同意？","essay":"Artificial intelligence is advancing at an unprecedented speed, and some commentators warn that it will ultimately damage society. While I accept that AI carries real risks, I disagree with this view, because its benefits to ordinary people are greater and more certain. The clearest advantage of AI is productivity. Machines can now analyse medical scans, translate languages and handle repetitive office work far faster than humans, which frees workers for creative and interpersonal tasks. In hospitals, for instance, AI systems already detect certain cancers earlier than doctors can, directly saving lives. Doctors who delegate paperwork to AI also report having more time for patients, which improves care at no extra cost. AI also improves daily convenience, from navigation apps to voice assistants that help disabled users live more independently. In schools, adaptive software now gives slower students extra practice and faster ones harder challenges, something one teacher alone cannot do for thirty pupils. Admittedly, the concerns are legitimate. Millions of clerical and driving jobs may disappear, and algorithmic bias or privacy abuse could deepen social inequality. Deepfake videos erode public trust in what we see, a danger earlier technologies never posed. However, history shows that new technologies tend to create new occupations even as they destroy old ones, just as the internet created entirely new industries. The real solution is retraining workers and regulating the technology, not slowing it down. With sensible laws, the balance can tip even further towards good. In conclusion, although AI brings challenges, its contribution to health, efficiency and accessibility means it will do more good than harm.","outline":"开头：改写题目，立场=不同意（利大于弊）。\n主体1：生产力——医疗扫描、翻译、重复工作；AI 早诊癌症；医生文书负担减轻。\n主体2：日常便利——导航、语音助手帮助残障；教育个性化因材施教。\n让步段：岗位消失、算法偏见、隐私、深度伪造。\n反驳：历史规律创造新职业；解决之道是再培训+监管。\n结论：利大于弊。","bandNote":"亮点：不同意立场带让步；新增教育个性化与医生文书减轻的例子；深度伪造的危险显时代感；词汇：algorithmic bias / deepfake / unprecedented speed。"},{"no":9,"type":"Task 2","q":"Some people believe that elderly parents are best looked after in nursing homes, while others think they should be cared for by their adult children. Discuss both views and give your own opinion.","qZh":"有人认为年迈的父母最好送进养老院照料，也有人认为应由成年子女亲自照顾。讨论双方观点并给出你自己的看法。","essay":"Who should take care of people when they grow old is a question every family eventually faces. Some argue that professional nursing homes offer the best care, while others insist that adult children should look after their elderly parents themselves. This essay will discuss both views before presenting my position. Supporters of nursing homes point to their professional facilities. Nurses are trained to manage illnesses such as dementia, and emergency help is available around the clock, which a busy family simply cannot guarantee. Homes also provide companionship, because residents live among peers of a similar age. Nevertheless, many people believe family care is emotionally superior. Parents who move in with their children continue to feel loved and needed, rather than being 'left' in an institution, and this sense of belonging protects their mental health. It is also usually cheaper, since nursing fees can consume most of a pension. In many Asian societies, living with children is still the default, which shows that family care is possible when housing and work schedules allow it. A practical compromise already exists in many cities as well: day-care centres, where professional nurses look after elderly people during working hours while the family hosts them at night, and simple measures such as grab bars, nearby clinics and flexible working hours can tip the balance towards home care. In my opinion, the best arrangement depends on the family's circumstances, but whenever possible elderly parents should live with or near their children, with professional support arranged at home. Care is ultimately about love, not just medical attention.","outline":"开头：改写题目，预告双方讨论+个人立场。\n支持养老院：专业设施、痴呆护理、全天候急救、同龄陪伴。\n支持家庭：情感 superior、归属感护心理健康、省钱；亚洲社会默认居家。\n折中：日间照料中心、扶手/诊所/弹性工时、跌倒传感器等。\n立场：尽量与子女同住或就近+居家专业支持。","bandNote":"亮点：讨论类立场明确；新增亚洲文化视角与日间照料中心折中方案；「Care is ultimately about love」收尾有力；词汇：dementia / day-care centres / companionship。"},{"no":10,"type":"Task 2","q":"The world's population is increasingly concentrated in large cities. What problems does this cause, and what measures can governments take to deal with them?","qZh":"世界人口正日益向大城市集中。这带来了哪些问题？政府可以采取哪些措施来应对？","essay":"In the twenty-first century, more people than ever are leaving villages and small towns to seek opportunities in major cities. This migration creates serious pressures on housing, services and the countryside, and several measures are needed to manage them. The most obvious problem is overcrowded housing and transport. When millions of newcomers arrive, property prices rise beyond what ordinary workers can afford, and rush-hour trains become dangerously packed. This overpopulation also widens regional inequality: villages lose their young workforce, while cities struggle with pollution, traffic congestion and overloaded public services such as hospitals and schools. Overcrowding also raises crime and strains mental health, as crowded living leaves people little private space. Governments can ease these pressures in several ways. First, investing in smaller cities and rural areas — for example, by building universities, hospitals and industrial parks outside the capital — would give people good reasons to stay. Cheap high-speed rail connecting provinces also spreads growth along its route, and France's TGV network, for instance, lets workers live an hour from Paris while keeping salaries high. Second, expanding affordable housing and public transport within megacities would reduce the daily stress on existing residents; housing policies that prioritise renting over owning may further calm price bubbles, and digitising public services means a growing population does not automatically mean longer queues. South Korea's effort to develop secondary cities around Seoul demonstrates that such decentralisation is possible. In conclusion, uncontrolled urbanisation strains housing, transport and public services while draining the countryside, but a combination of regional investment and urban planning can make growth more balanced and liveable.","outline":"开头：改写题目，预告问题+措施结构。\n问题1：住房与交通拥挤——房价、通勤。\n问题2：区域不平等——乡村失去劳动力、城市公共服务超载；犯罪与心理健康。\n措施1：投资中小城市与乡村（大学、医院、产业园）；高铁沿线扩散，法国 TGV 例。\n措施2：大城市保障房、公交、租购并举、服务数字化。\n结论：区域投资+城市规划实现均衡。","bandNote":"亮点：问题+措施结构；新增犯罪与心理健康问题、高铁扩散与数字化服务措施；韩国与法国双例证；词汇：decentralisation / rush-hour / affordable housing。"},{"no":11,"type":"Task 2","q":"Some people think the best way to reduce crime is to give longer prison sentences. To what extent do you agree or disagree?","qZh":"有人认为减少犯罪的最佳方法是判处更长的监禁刑期。你在多大程度上同意或不同意？","essay":"Crime is a constant concern in every society, and some people argue that the most effective response is to lock offenders up for longer. I partly disagree: although imprisonment is necessary for serious criminals, longer sentences alone will not make our streets safer, and the money spent on extra prison years could achieve far more elsewhere. It is true that keeping dangerous offenders behind bars protects the public. A violent criminal cannot attack anyone while in prison, and the certainty of punishment may discourage some potential offenders. Victims also feel safer knowing that the person who harmed them has received a serious sentence. However, there is little evidence that sentence length deters crime; otherwise the countries with the harshest prisons would be the safest in the world, which is clearly not the case. The real causes of crime lie elsewhere. Poverty, unemployment, poor education and drug addiction push many people towards illegal activity, so investing in schools, job creation and rehabilitation programmes is far more effective than simply building more prisons. Numbers alone, however, say little about the quality of justice delivered inside each prison. Norway, for example, focuses on rehabilitating prisoners through education and counselling, and its reoffending rate is among the lowest in the world. Longer sentences can even backfire: inmates who spend a decade behind bars lose work skills and family ties, which makes it harder for them to go straight when they are finally released. In conclusion, while prison is essential for protecting society from dangerous individuals, I believe longer sentences are a blunt instrument. Tackling the social roots of crime and reforming offenders will achieve far more.","outline":"开头：改写题目，立场=部分反对。\n让步段：监禁必要——保护公众、威慑、受害者安心。\n反驳：刑期长度与犯罪率无必然关系。\n主体：真正的根源——贫困、失业、教育、毒瘾；挪威改造模式再犯率最低。\n补充：长刑期反效果——技能与家庭纽带流失。\n结论：治本优于重刑。","bandNote":"亮点：部分反对立场带让步；新增受害者视角与长刑期反效果论证；挪威例证保留；词汇：rehabilitation programmes / reoffending rate / a blunt instrument / go straight。"},{"no":12,"type":"Task 2","q":"Some people believe that every criminal should receive a fixed standard punishment for their offence, while others think that judges should consider the circumstances of each crime. Discuss both views and give your own opinion.","qZh":"有人认为每种罪行都应受到固定的标准刑罚，也有人认为法官应考虑每起犯罪的具体情节。讨论双方观点并给出你自己的看法。","essay":"How courts should punish criminals is a long-standing debate. Some people support fixed penalties for every offence, whereas others believe each case deserves individual consideration. Both positions have reasonable arguments, and this essay will examine them before giving my view. Those who favour fixed punishment argue that it guarantees fairness and consistency. If stealing always leads to the same sentence, judges cannot be influenced by wealth, politics or personal sympathy, and the law sends a clear warning to society: whatever your excuse, this is the price of the crime. Fixed rules also protect the courts themselves from corruption and from public pressure after shocking cases make headlines. Critics of rigid rules also point out that most judges apply discretion responsibly, and that published sentencing guidelines already prevent wild differences between courts. The public, moreover, tends to trust a sentence it can understand. On the other hand, rigid penalties ignore human complexity. A starving mother who steals bread and a professional thief who steals from a pensioner have committed technically identical acts, but their motives and moral guilt are completely different. Judges therefore need the flexibility to distinguish between premeditated crimes and desperate ones, or justice will feel cruel and arbitrary. They also need room to consider aggravating factors such as repeated offending, and mitigating ones such as genuine remorse. In my opinion, a middle path is sensible: laws should set a clear range of punishment for each offence, while allowing judges limited discretion within it, guided by published sentencing rules. This preserves consistency without sacrificing the common sense that true justice requires.","outline":"开头：改写题目，预告双方讨论+个人立场。\n支持固定刑罚：公平一致、不受财富政治同情影响、明确警示；还能防司法腐败与舆论压力。\n反对：忽视人的复杂性——偷面包的母亲 vs 职业窃贼；需区分预谋与 desperate、加重与减轻情节。\n立场：法定量刑范围+法官有限裁量+公开量刑规则。\n结论：一致性与常识兼得。","bandNote":"亮点：讨论类结构完整；新增防司法腐败、加重/减轻情节论证；两例对比保留；词汇：fixed penalties / discretion / aggravating factors / sentencing rules。"},{"no":13,"type":"Task 2","q":"Plastic waste has become one of the most serious environmental problems in the world. What are the main causes of this problem, and what can be done to solve it?","qZh":"塑料垃圾已成为世界上最严重的环境问题之一。造成这一问题的主要原因是什么？可以采取哪些措施加以解决？","essay":"Plastic pollution has spread from city dumps to oceans, rivers and even mountain tops, threatening wildlife and human health alike. This essay will examine the main causes of the problem and propose some realistic solutions. The first cause is our dependence on single-use plastic. Carrier bags, food packaging and disposable cups are convenient and cheap, so billions of items are produced, used once and thrown away every day. Manufacturers have little incentive to change, because the true environmental cost never appears on the price tag. A second cause is poor waste management: in many countries, recycling systems are limited or absent, which means most plastic ends up in landfill or is washed into the sea. Microplastics have now been found in drinking water and even in human blood, which turns a recycling debate into a public-health priority. However, the problem is not impossible to solve. Governments should ban or tax the most wasteful products, as many places have already done with plastic bags, and invest in recycling facilities so that waste becomes a resource rather than a burden. They can also make producers responsible for the entire life of their packaging, which quickly encourages smarter design. Individuals also have a role: carrying reusable bags and bottles, and choosing products with less packaging, can significantly reduce demand. Schools can also teach children these habits early, so that a whole generation grows up treating reuse as normal. In conclusion, plastic pollution results mainly from throwaway culture and weak recycling systems, but it can be greatly reduced if governments regulate firmly, companies redesign their products and consumers change their daily habits.","outline":"开头：改写题目，预告原因+对策。\n原因1：一次性塑料依赖——便宜方便，环境成本未计入价格。\n原因2：垃圾管理薄弱——回收系统缺失。\n对策1：政府禁令/征税+建设回收设施。\n对策2：生产者对包装全生命周期负责，倒逼设计改进。\n对策3：个人自备袋瓶、少选过度包装。\n结论：三方合力可大幅缓解。","bandNote":"亮点：原因+对策结构；新增「环境成本未计入价格」与「生产者责任」是高分经济视角；词汇：single-use plastic / landfill / producer responsibility / throwaway culture。"},{"no":14,"type":"Task 2","q":"Increasing the price of petrol is the best way to solve the growing problems of traffic congestion and pollution. To what extent do you agree or disagree?","qZh":"提高汽油价格是解决日益严重的交通拥堵和污染问题的最佳办法。你在多大程度上同意或不同意？","essay":"Traffic jams and air pollution plague many big cities, and some claim that making petrol more expensive is the best remedy. I disagree: although higher fuel prices can help, it is neither the most effective nor the fairest solution. It is understandable why some support this idea. When driving becomes costly, people have a financial incentive to use buses and trains, share cars or cycle to work, and several European countries have reduced fuel use through heavy petrol taxes. In the long run, expensive petrol also pushes manufacturers to develop cleaner vehicles, which benefits everyone. However, this measure alone cannot solve the problem, and it hits low-income drivers hardest, since they may have no realistic alternative to driving to work. Nurses, cleaners and builders often start shifts before buses run, so for them the extra cost is simply a pay cut, while wealthier commuters barely notice it. For such a policy to succeed, governments must first offer affordable, reliable public transport; otherwise people simply pay more and keep driving, as they do in many oil-rich cities. Congestion charging in city centres raises money for transport while discouraging the shortest, most wasteful car journeys, and electric buses and shared e-bikes can then fill the gaps that private cars leave behind. Subsidised bus networks, cycle lanes and park-and-ride schemes achieve more per dollar than price rises alone. In conclusion, I accept that petrol prices have a role to play, but calling them the best solution overstates their power. Only a combination of better public transport, greener technology and sensible pricing can truly cut congestion and pollution.","outline":"开头：改写题目，立场=不同意「最佳办法」。\n让步段：价格激励有效——欧洲重税降油耗、倒逼清洁车辆。\n反驳1：对低收入司机最不公平——早班无公交替代。\n反驳2：没有可靠公交时只加价无效（产油城市例）。\n对策：补贴公交、自行车道、换乘停车场性价比更高。\n结论：组合拳才是正解。","bandNote":"亮点：不同意立场+让步；新增低收入司机不公平论证（护士、清洁工早班细节）；「每美元效果」的比较是高分表达；词汇：petrol taxes / park-and-ride / congestion。"},{"no":15,"type":"Task 2","q":"Some people think that environmental problems are too big for individuals to solve, and that only governments and large companies can make a difference. Others believe individuals can also help. Discuss both views and give your own opinion.","qZh":"有人认为环境问题太大，个人无力解决，只有政府和大公司才能带来改变；也有人认为个人同样能出力。讨论双方观点并给出你自己的看法。","essay":"With climate change and plastic pollution in the news every day, many people feel powerless as individuals, while others insist that small personal actions still matter. This essay will examine both views before presenting my own. Those who dismiss individual efforts argue that the damage is caused by industries and must be stopped at that level. A single household switching off its lights is meaningless compared with a coal plant, and only governments can pass environmental laws, fund renewable energy and force companies to reduce emissions through taxation and regulation. On the other hand, ordinary people are not powerless. Consumer choices send powerful signals: when millions of shoppers buy electric cars, reusable bags or plant-based meals, companies change their products to keep those customers. Individual behaviour also creates political pressure — voters who care about the environment support greener parties and policies, which is how major laws are eventually passed. The scale argument also ignores cooperation: community projects such as tree planting, neighbourhood recycling and shared gardens remove far more waste than any single household, yet they are still made of individual decisions multiplied many times. Even voting, arguably the simplest individual act, shapes which environmental policies survive. Personal actions are also contagious within communities: a family that installs solar panels or cycles to work influences neighbours far more effectively than advertisements do, and boycotts of polluting brands have changed corporate behaviour within months. In my view, the two sides are complementary rather than contradictory. Governments and corporations must lead the fight, but their decisions follow public demand, so individual action is the foundation on which real change is built.","outline":"开头：改写题目，预告双方讨论+个人立场。\n一方：个人无力——工业才是污染源，只有政府能立法、投资、监管。\n另一方：个人不无力——消费信号改变企业；环保选票促成立法；社区示范效应比广告有效。\n立场：双方互补——政府企业引领，但决策跟随公众需求。","bandNote":"亮点：讨论类双方论证均衡；新增社区示范效应（太阳能家庭影响邻居）比广告有效的角度；「complementary rather than contradictory」是高分句式；词汇：renewable energy / consumer choices / political pressure。"},{"no":16,"type":"Task 2","q":"Many countries are replacing coal and oil with renewable energy sources such as solar and wind power. Do the advantages of this development outweigh the disadvantages?","qZh":"许多国家正用太阳能、风能等可再生能源取代煤炭和石油。这一发展的利是否大于弊？","essay":"Around the world, governments are investing heavily in solar panels and wind farms to replace coal, oil and gas. Despite some practical difficulties, I am convinced that the advantages of renewable energy outweigh its disadvantages. The benefits are clear. First, renewables produce little or no greenhouse gas, so they directly reduce the air pollution and carbon emissions responsible for climate change. Cities that switch to clean electricity see measurable improvements in public health within a few years, as respiratory diseases decline. Second, they improve energy security: sunlight and wind are free and available everywhere, which means countries no longer depend on imported fuel whose price can rise unpredictably. Solar and wind industries have also created millions of new jobs in manufacturing and installation, often in regions that lost old industrial employment, and coastal cities now gain harbour jobs from offshore wind projects that traditional energy could never offer. Admittedly, there are disadvantages. Building wind farms and solar plants requires large investments, and because the sun does not always shine, backup power or expensive batteries are still needed. Some residents also complain that wind turbines spoil the landscape, and mining the minerals for batteries raises its own environmental questions. Nevertheless, these problems are technical and temporary, and costs have already fallen dramatically as technology improves; a decade ago solar power was the most expensive option, and today it is frequently the cheapest electricity ever built. In conclusion, although the transition to renewable energy brings expense and engineering challenges, the environmental, health and economic gains it offers are far more important, so the advantages clearly outweigh the drawbacks.","outline":"开头：改写题目，立场=利大于弊。\n主体段1：减排——直接降低空气污染与碳排放；城市健康改善。\n主体段2：能源安全——阳光风免费遍布；创造数百万新岗位。\n让步段：投资大、需储能、景观与采矿问题。\n反驳：技术性暂时问题，成本已大降，太阳能现常为最廉价电力。\n结论：利明显大于弊。","bandNote":"亮点：利弊类带让步；新增公共健康改善与成本曲线论证（十年最贵→今最廉）；让步段补采矿问题显全面；词汇：energy security / greenhouse gas / backup power。"},{"no":17,"type":"Task 2","q":"Some people believe that job satisfaction is more important than job security, while others feel that a stable and well-paid job matters more. Discuss both views and give your own opinion.","qZh":"有人认为工作满意度比工作稳定更重要，也有人认为稳定且薪水可观的工作更重要。讨论双方观点并给出你自己的看法。","essay":"Career choices often involve a dilemma: should people chase work they love, or choose a secure job with a steady salary? Both views are understandable, and this essay will discuss them before offering my own opinion. Those who prioritise satisfaction point out that we spend around a third of our adult lives at work. A meaningful job keeps people motivated and productive, while a well-paid but hated one can slowly damage both physical and mental health, leading to burnout that eventually costs more than any salary. An artist or teacher, for example, may earn little but feel far happier than a banker counting the days to retirement. Colleagues trapped in unloved jobs often pay for their choices with insomnia, headaches and lost evenings. Passionate employees also learn faster, because genuine interest turns training into pleasure rather than duty. On the other hand, supporters of security argue that bills do not care about passion. A stable income allows people to support a family, buy a home and face economic downturns without panic. Especially for those with children or mortgages, choosing an enjoyable but unstable career can look like an irresponsible luxury. Poverty, moreover, is a poor environment for happiness: financial anxiety can poison even the most beloved job. In my view, satisfaction should come first, but only once basic financial needs are met. The wisest strategy is often to build skills and savings in a secure job while gradually moving towards work one truly enjoys, turning passion into a plan rather than a gamble. The order matters: security first, satisfaction second, and balance last.","outline":"开头：改写题目，预告双方讨论+个人立场。\n一方：满意度优先——人生三分之一在工作；讨厌的高薪工作损害身心健康；热情让学习更快。\n另一方：稳定优先——账单不管热情；养家、房贷、抗风险；贫困毁掉幸福感。\n立场：基本经济需求满足后满意度优先；先在稳定岗位积累，再逐步转向热爱的工作。","bandNote":"亮点：讨论

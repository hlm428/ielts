ater pipes often burst in extremely cold weather.","exZh":"极寒天气里水管常会爆裂。","memo":"「不死」：压力山大不死也爆，突然炸开。"},{"en":"backup","ipa":"/ˈbækʌp/","zh":"n. 备份；支持","ex":"Always keep a backup of your important files.","exZh":"重要文件一定要留备份。","memo":"back（后面）+up：留一手在后面，备份。"},{"en":"barrel","ipa":"/ˈbærəl/","zh":"n. 桶；圆筒","ex":"Oil prices rose to eighty dollars a barrel.","exZh":"油价涨到每桶八十美元。","memo":"「白肉」：白肉腌好装进大桶，桶装储存。"},{"en":"beneath","ipa":"/bɪˈniːθ/","zh":"prep. 在…下方","ex":"The village lies beneath a steep granite cliff.","exZh":"村庄坐落在陡峭的花岗岩悬崖下方。","memo":"be+neath（下面）：在底下，下方。"},{"en":"beware","ipa":"/bɪˈweə/","zh":"v. 当心；提防","ex":"Drivers should beware of black ice on country roads.","exZh":"司机要当心乡村道路上的暗冰。","memo":"be+ware（留意）：处处留神，当心。"},{"en":"bitter","ipa":"/ˈbɪtə/","zh":"adj. 苦的；痛苦的；激烈的","ex":"The two brothers fought a bitter battle over the inheritance.","exZh":"兄弟俩为遗产展开了激烈的争夺。","memo":"「逼他」：逼他喝苦药，又苦又怨。"},{"en":"blossom","ipa":"/ˈblɒsəm/","zh":"n. 花朵 v. 开花；发展","ex":"Her confidence blossomed during her first year at university.","exZh":"大学第一年她的自信心蓬勃发展。","memo":"bloom 的表妹：先结花苞再盛放，绽放成长。"},{"en":"blueprint","ipa":"/ˈbruːprɪnt/","zh":"n. 蓝图；方案","ex":"The architect presented a blueprint for the new library.","exZh":"建筑师展示了新图书馆的设计蓝图。","memo":"blue（蓝）+print（印）：蓝底图纸，规划方案。"},{"en":"bond","ipa":"/bɒnd/","zh":"n. 纽带；债券；结合","ex":"The experience created a strong bond between the teammates.","exZh":"这段经历在队友之间结下了深厚情谊。","memo":"「绑的」：绑在一起是纽带，绑住的借据是债券。"},{"en":"bound","ipa":"/baʊnd/","zh":"adj. 必定的；开往…的 v. 跳跃","ex":"With such talent, she is bound to succeed.","exZh":"有这样的天赋，她必定成功。","memo":"「绑的」：被绑定的结果，必然注定。"},{"en":"brand","ipa":"/brænd/","zh":"n. 品牌 v. 打烙印","ex":"The company spent millions building its brand image.","exZh":"该公司斥巨资打造品牌形象。","memo":"「不难的」：牌子响亮生意不难做，品牌。"},{"en":"brochure","ipa":"/ˈbrəʊʃə/","zh":"n. 小册子；宣传册","ex":"Pick up a free brochure at the tourist office.","exZh":"在旅游办事处可领取免费宣传册。","memo":"bro（兄弟）+chure：兄弟发的宣传单，小册子。"},{"en":"calculate","ipa":"/ˈkælkjuleɪt/","zh":"v. 计算；估计","ex":"Engineers calculated the maximum load for the bridge.","exZh":"工程师计算了大桥的最大承载量。","memo":"calcul（石子）：罗马人摆石子算账，计算。"},{"en":"caption","ipa":"/ˈkæpʃn/","zh":"n. 说明文字；字幕","ex":"The photo caption listed the names of all the winners.","exZh":"照片说明列出了所有获胜者的名字。","memo":"capt（抓）+ion：抓住图片要点的字，说明文字。"},{"en":"captive","ipa":"/ˈkæptɪv/","zh":"n. 俘虏 adj. 被囚的","ex":"The soldiers held two captives in the village.","exZh":"士兵们在村里关押了两名俘虏。","memo":"capt（抓）+ive：被抓的人，俘虏。"},{"en":"capture","ipa":"/ˈkæptʃə/","zh":"v. 捕获；夺得；捕捉","ex":"The camera captured the exact moment the comet appeared.","exZh":"相机捕捉到彗星出现的精确瞬间。","memo":"capt（抓）+ure：一把抓住，捕获。"},{"en":"carbon","ipa":"/ˈkɑːbən/","zh":"n. 碳","ex":"The government aims to cut carbon emissions by half.","exZh":"政府力争将碳排放减半。","memo":"「卡本」：加油站刷卡（卡本）就走——汽车烧油排碳，碳是燃料的根本。"},{"en":"cargo","ipa":"/ˈkɑːɡəʊ/","zh":"n. 货物","ex":"The ship was carrying cargo worth ten million dollars.","exZh":"这艘船装载着价值一千万美元的货物。","memo":"「卡车够」：卡车装够了才算一船货，货物。"},{"en":"carve","ipa":"/kɑːv/","zh":"v. 雕刻；切","ex":"Local artists carve small statues from white marble for the tourist market.","exZh":"当地艺术家用白色大理石雕刻小雕像供应旅游市场。","memo":"「卡屋」：一刀刀卡进木头，雕刻成型。"},{"en":"casual","ipa":"/ˈkæʒuəl/","zh":"adj. 随便的；临时的；偶然的","ex":"She wore casual clothes to the informal dinner.","exZh":"她穿便装参加非正式晚宴。","memo":"cas（落下）+ual：随意放下心防，随随便便。"},{"en":"category","ipa":"/ˈkætəɡəri/","zh":"n. 类别；范畴","ex":"The books are arranged by category on the shelves.","exZh":"书架上的图书按类别排列。","memo":"cate（完全）+gory：说清全貌要分类，类别。"},{"en":"cater","ipa":"/ˈkeɪtə/","zh":"v. 满足需要；提供餐饮","ex":"The hotel caters for both business and family guests.","exZh":"这家酒店同时满足商务和家庭客人的需求。","memo":"「kitchen 亲戚」：办席做饭，满足各方口味。"},{"en":"caution","ipa":"/ˈkɔːʃn/","zh":"n. 谨慎；警告 v. 告诫","ex":"Handle the glassware with caution to avoid breakage.","exZh":"小心轻放玻璃器皿以免打碎。","memo":"「看神」：看神色不对就收手，谨慎为上。"},{"en":"census","ipa":"/ˈsensəs/","zh":"n. 人口普查","ex":"The national census takes place every ten years.","exZh":"全国人口普查每十年进行一次。","memo":"cens（评估）+us：挨家评估人数，人口普查。"},{"en":"circumstance","ipa":"/ˈsɜːkəmstəns/","zh":"n. 情况；环境","ex":"Under no circumstances should you share your password.","exZh":"任何情况下都不要分享你的密码。","memo":"circum（周围）+stance（站）：四周的形势，境况。"},{"en":"cite","ipa":"/saɪt/","zh":"v. 引用；举例","ex":"The essay cites over thirty academic sources from the past decade.","exZh":"这篇论文引用了三十多个近十年的学术文献。","memo":"「晒它」：把原文晒出来给大家看，引用。"},{"en":"civilian","ipa":"/səˈvɪliən/","zh":"n. 平民；百姓","ex":"The army provided shelter for civilians after the flood.","exZh":"洪水过后军队为平民提供住所。","memo":"civil（公民）+ian：不当兵的公民，平民。"},{"en":"civilize","ipa":"/ˈsɪvəlaɪz/","zh":"v. 使开化；使文明","ex":"Public libraries helped civilize the growing industrial cities.","exZh":"公共图书馆帮助工业新城走向文明。","memo":"civil（公民的）+ize：教人守规矩，开化文明。"},{"en":"claim","ipa":"/kleɪm/","zh":"v. 声称；索取 n. 主张；索赔","ex":"The company claims its product is completely safe.","exZh":"该公司声称其产品绝对安全。","memo":"「克雷母」：一开口雷声轰鸣，声称个不停。"},{"en":"classic","ipa":"/ˈklæsɪk/","zh":"adj. 经典的 n. 名著","ex":"Pride and Prejudice is a classic of English literature.","exZh":"《傲慢与偏见》是英国文学经典。","memo":"class（等级）+ic：顶级那一等，经典。"},{"en":"clause","ipa":"/klɔːz/","zh":"n. 条款；从句","ex":"Read the penalty clause before signing the contract.","exZh":"签约前先读一下违约条款。","memo":"「克劳斯」：克劳斯律师逐条抠条款。"},{"en":"client","ipa":"/ˈklaɪənt/","zh":"n. 客户；委托人","ex":"The firm provides legal advice to corporate clients.","exZh":"该公司为企业客户提供法律咨询。","memo":"「可来恩特」：客户有恩必来照顾生意。"},{"en":"climax","ipa":"/ˈklaɪmæks/","zh":"n. 高潮；顶点","ex":"The film reaches its climax in the final ten minutes.","exZh":"影片在最后十分钟达到高潮。","memo":"climb（攀登）表亲：爬到最高点，高潮。"},{"en":"cling","ipa":"/klɪŋ/","zh":"v. 紧抓；依恋","ex":"Wet clothes cling to the body after swimming.","exZh":"游泳后湿衣服紧贴在身上。","memo":"「可拎」：可拎着不放，紧抓不放。"},{"en":"cluster","ipa":"/ˈklʌstə/","zh":"n. 群；簇 v. 聚集","ex":"Restaurants and cafes cluster around the old town square in summer.","exZh":"夏天餐馆和咖啡馆聚集在老城广场四周。","memo":"「克拉斯特」：一堆克拉（钻石）挤成簇。"},{"en":"coincide","ipa":"/ˌkəʊɪnˈsaɪd/","zh":"v. 同时发生；一致","ex":"The harvest festival coincides with the end of the school term.","exZh":"丰收节恰逢学期结束。","memo":"co（共同）+incide（落）：同时落下，巧合一致。"},{"en":"collective","ipa":"/kəˈlektɪv/","zh":"adj. 集体的 n. 集体","ex":"The villagers made a collective decision to protect the forest.","exZh":"村民们集体决定保护森林。","memo":"collect（收集）+ive：收集到一起，集体。"},{"en":"collide","ipa":"/kəˈlaɪd/","zh":"v. 碰撞；冲突","ex":"The two trains nearly collided at the crossing.","exZh":"两列火车在道口险些相撞。","memo":"col+lide（滑）：两车对滑相撞，冲突。"},{"en":"colonial","ipa":"/kəˈləʊniəl/","zh":"adj. 殖民地的","ex":"The museum preserves colonial architecture from the eighteenth century.","exZh":"博物馆保存着十八世纪的殖民时期建筑。","memo":"colony（殖民地）+ial：殖民地的风格。"},{"en":"colony","ipa":"/ˈkɒləni/","zh":"n. 殖民地；聚居地","ex":"The small island was once a British colony before gaining independence.","exZh":"这座小岛独立前曾是英国殖民地。","memo":"「靠了您」：靠宗主国罩着的地盘，殖民地。"},{"en":"column","ipa":"/ˈkɒləm/","zh":"n. 柱；专栏；列","ex":"She writes a weekly column for the local newspaper.","exZh":"她为当地报纸撰写每周专栏。","memo":"「烤炉们」：一排柱子像烤炉，专栏一列列。"},{"en":"combat","ipa":"/ˈkɒmbæt/","zh":"n./v. 战斗；对抗","ex":"New drugs help combat drug resistant bacteria in hospitals.","exZh":"新药有助于对抗医院里的耐药菌。","memo":"com+bat（打）：一起打，战斗。"},{"en":"command","ipa":"/kəˈmɑːnd/","zh":"v. 命令；指挥 n. 掌握","ex":"She has a good command of both written and spoken English.","exZh":"她的英语读写和口语都很娴熟。","memo":"com+mand（手令）：一道手令，指挥命令。"},{"en":"commerce","ipa":"/ˈkɒmɜːs/","zh":"n. 商业；贸易","ex":"The river was once the main route of inland commerce.","exZh":"这条河曾是内陆贸易的主通道。","memo":"com+merce（买卖）：一起做买卖，商业。"},{"en":"commission","ipa":"/kəˈmɪʃn/","zh":"n. 委员会；佣金；委托","ex":"The salesperson earns a ten percent commission on each sale.","exZh":"销售员每笔交易可获百分之十的佣金。","memo":"com+mission（任务）：领任务办事抽佣金。"},{"en":"commit","ipa":"/kəˈmɪt/","zh":"v. 犯（错）；承诺；投入","ex":"The government committed two billion yuan to flood defences.","exZh":"政府投入二十亿元用于防洪建设。","memo":"com+mit（送）：把自己送进去，投入或犯下。"},{"en":"communal","ipa":"/ˈkɒmjunl/","zh":"adj. 公共的；共用的","ex":"The flat has a communal kitchen for all tenants.","exZh":"公寓设有供全体租户使用的公共厨房。","memo":"commune（公社）+al：公社大家用，公共的。"},{"en":"compact","ipa":"/kəmˈpækt/","zh":"adj. 紧凑的 n. 协议","ex":"The city flat is compact but cleverly designed for a small family.","exZh":"这套市内公寓面积紧凑，但为小家庭做了巧妙设计。","memo":"com+pack（打包）：打包塞紧，紧凑。"},{"en":"companion","ipa":"/kəmˈpæniən/","zh":"n. 同伴；伴侣","ex":"The guide dog is a loyal companion for the blind man.","exZh":"导盲犬是这位盲人的忠诚伙伴。","memo":"com+pan（面包）：分面包吃的人，同伴。"},{"en":"comparative","ipa":"/kəmˈpærətɪv/","zh":"adj. 比较的；相对的","ex":"She is an expert in comparative literature at the university.","exZh":"她是这所大学的比较文学专家。","memo":"compare（比较）+ative：拿来比一比，比较的。"},{"en":"compassion","ipa":"/kəmˈpæʃn/","zh":"n. 同情；怜悯","ex":"Nurses need compassion as well as professional skill.","exZh":"护士需要同情心，也需要专业技能。","memo":"com+passion（感情）：感情相通，同情。"},{"en":"complacent","ipa":"/kəmˈpleɪsnt/","zh":"adj. 自满的；漫不经心的","ex":"The team became complacent after winning the first two games.","exZh":"连胜两场后，队伍变得自满起来。","memo":"com+plac（平静）+ent：心太平静，自满松懈。"},{"en":"compliment","ipa":"/ˈkɒmplɪmənt/","zh":"n. 赞美；问候 v. 称赞","ex":"The chef received many compliments on the dessert.","exZh":"甜点赢得众人称赞。","memo":"com+plement（补足）：好话补足面子，赞美。"},{"en":"compose","ipa":"/kəmˈpəʊz/","zh":"v. 组成；创作；使平静","ex":"The steering committee is composed of ten senior experts and officials.","exZh":"指导委员会由十位资深专家和官员组成。","memo":"com+pose（放）：放到一起组成，创作乐曲。"},{"en":"compound","ipa":"/ˈkɒmpaʊnd/","zh":"n. 化合物；大院 adj. 复合的","ex":"Water is a compound of hydrogen and oxygen.","exZh":"水是氢和氧的化合物。","memo":"com+pound（放）：放在一起化合，复合的。"},{"en":"comprehend","ipa":"/ˌkɒmprɪˈhend/","zh":"v. 理解；领会","ex":"It is hard to comprehend the scale of the universe.","exZh":"宇宙之大令人难以理解。","memo":"com+prehend（抓）：把意思全抓住，理解。"},{"en":"compromise","ipa":"/ˈkɒmprəmaɪz/","zh":"n./v. 妥协；折中","ex":"After hours of talks, both sides reached a compromise.","exZh":"经过数小时谈判，双方达成妥协。","memo":"com+promise（保证）：互相保证各让一步，妥协。"},{"en":"compulsory","ipa":"/kəmˈpʌlsəri/","zh":"adj. 强制的；义务的","ex":"Education is compulsory for children aged six to fifteen.","exZh":"六至十五岁儿童必须接受义务教育。","memo":"com+puls（推）+ory：被人推着走，强制。"},{"en":"conceal","ipa":"/kənˈsiːl/","zh":"v. 隐藏；隐瞒","ex":"He tried to conceal his disappointment at the result.","exZh":"他试图掩饰对结果的失望。","memo":"con+ceal（藏）：全藏起来，隐瞒。"},{"en":"concede","ipa":"/kənˈsiːd/","zh":"v. 承认；让步","ex":"The champion conceded that his rival played better.","exZh":"卫冕冠军承认对手打得更好。","memo":"con+cede（让）：认输让步，承认。"},{"en":"conceive","ipa":"/kənˈsiːv/","zh":"v. 构想；怀孕","ex":"The idea was conceived during a long train journey.","exZh":"这个构想诞生于一次漫长的火车旅行。","memo":"con+ceive（拿）：心里拿定主意，构想。"},{"en":"concise","ipa":"/kənˈsaɪs/","zh":"adj. 简明的；简洁的","ex":"Keep your summary concise and to the point.","exZh":"总结要简明扼要。","memo":"con+cise（切）：把废话切掉，简洁。"},{"en":"concrete","ipa":"/ˈkɒŋkriːt/","zh":"adj. 具体的 n. 混凝土","ex":"The plan needs concrete details rather than vague promises.","exZh":"计划需要具体细节而非空洞承诺。","memo":"con+crete（长）：长成一块实心，具体如混凝土。"},{"en":"conduct","ipa":"/kənˈdʌkt/","zh":"v. 进行；指挥 n. 行为","ex":"The lab conducts tests on water quality every month.","exZh":"实验室每月进行水质检测。","memo":"con+duct（引导）：引导事情进行，行为举止。"},{"en":"confer","ipa":"/kənˈfɜː/","zh":"v. 商讨；授予","ex":"The committee will confer before announcing the winner.","exZh":"委员会将商议后再宣布获胜者。","memo":"con+fer（带来）：把想法带来碰头，商议。"},{"en":"confine","ipa":"/kənˈfaɪn/","zh":"v. 限制；禁闭","ex":"Please confine your comments to the topic under discussion.","exZh":"发言请限于讨论的主题。","memo":"con+fine（界限）：圈进界限内，限制。"},{"en":"confront","ipa":"/kənˈfrʌnt/","zh":"v. 面对；对抗","ex":"The government must confront the housing crisis directly.","exZh":"政府必须直面住房危机。","memo":"con+front（前面）：迎面而上，直面。"},{"en":"congestion","ipa":"/kənˈdʒestʃə/","zh":"n. 拥堵；充血","ex":"Traffic congestion costs the city millions every year.","exZh":"交通拥堵每年让该市损失数百万。","memo":"con+gest（运）+ion：全堵在路上，拥堵。"},{"en":"consecutive","ipa":"/kənˈsekjətɪv/","zh":"adj. 连续的","ex":"It rained for five consecutive days last week.","exZh":"上周连续下了五天雨。","memo":"con+secut（跟随）+ive：一个跟一个，连续。"},{"en":"consensus","ipa":"/kənˈsensəs/","zh":"n. 共识；一致意见","ex":"Experts have yet to reach a consensus on the issue.","exZh":"专家们在此问题上尚未达成共识。","memo":"con+sens（感觉）：感觉相同，共识。"},{"en":"consent","ipa":"/kənˈsent/","zh":"n./v. 同意；准许","ex":"Patients must give written consent before doctors perform the operation.","exZh":"病人手术前必须签署书面同意书。","memo":"con+sent（感觉）：感觉合意，同意。"},{"en":"conserve","ipa":"/kənˈsɜːv/","zh":"v. 保护；节约","ex":"Simple habits at home can conserve water and energy.","exZh":"家里的简单习惯就能节约水电。","memo":"con+serve（保存）：全存好不浪费，节约保护。"},{"en":"considerable","ipa":"/kənˈsɪdərəbl/","zh":"adj. 相当大的；可观的","ex":"The project requires a considerable amount of time and money.","exZh":"该项目需要相当多的时间和资金。","memo":"consider（考虑）+able：大得必须认真考虑，可观。"},{"en":"consistent","ipa":"/kənˈsɪstənt/","zh":"adj. 一致的；始终如一的","ex":"Her story is consistent with the security footage.","exZh":"她的说法与监控录像一致。","memo":"con+sist（站）：站同一个立场，前后一致。"},{"en":"constitute","ipa":"/ˈkɒnstɪtjuːt/","zh":"v. 构成；组成","ex":"Women constitute sixty percent of the university's students.","exZh":"女性占该校学生的六成。","memo":"con+stitute（立）：立起来构成整体，构成。"},{"en":"consume","ipa":"/kənˈsjuːm/","zh":"v. 消耗；消费","ex":"Old refrigerators consume far more electricity than new models.","exZh":"旧冰箱比新机型耗电多得多。","memo":"con+sume（拿）：全拿走用掉，消耗。"},{"en":"contemporary","ipa":"/kənˈtemprəri/","zh":"adj. 当代的；同时代的","ex":"The new gallery specializes in contemporary Asian art and design.","exZh":"新美术馆专营当代亚洲艺术与设计。","memo":"con+tempor（时代）+ary：同一个时代的，当代。"},{"en":"contend","ipa":"/kənˈtend/","zh":"v. 主张；争夺","ex":"The lawyer contended that the evidence was unreliable.","exZh":"律师辩称证据不可靠。","memo":"con+tend（伸）：伸手抢夺，伸理力争，主张。"},{"en":"context","ipa":"/ˈkɒntekst/","zh":"n. 语境；背景","ex":"You should understand the word in its historical context.","exZh":"应在历史背景中理解这个词。","memo":"con+text（编织）：上下文织在一起，语境。"},{"en":"continual","ipa":"/kənˈtɪnjuəl/","zh":"adj. 持续的；频繁的","ex":"Continual interruptions made it hard to finish the report.","exZh":"接连不断的打扰让报告难以完成。","memo":"continue（继续）+al：继续个不停，持续。"},{"en":"contradict","ipa":"/ˌkɒntrəˈdɪkt/","zh":"v. 反驳；与…矛盾","ex":"The two witness statements contradict each other on every key detail.","exZh":"两份证人陈述在每个关键细节上都相互矛盾。","memo":"contra（反）+dict（说）：反着说，反驳矛盾。"},{"en":"controversial","ipa":"/ˌkɒntrəˈvɜːʃl/","zh":"adj. 有争议的","ex":"The new dam remains a controversial project among local environmental groups.","exZh":"新水坝在当地环保组织中仍是备受争议的工程。","memo":"contro（反向）+vers（转）：众人争着转向，有争议。"},{"en":"convene","ipa":"/kənˈviːn/","zh":"v. 召集；开会","ex":"The board will convene next Monday to discuss the budget.","exZh":"董事会下周一开会讨论预算。","memo":"con+vene（来）：召来一起开会，召集。"},{"en":"conventional","ipa":"/kənˈvenʃənl/","zh":"adj. 传统的；常规的","ex":"Conventional farming relies heavily on chemical fertilizers and pesticides.","exZh":"传统农业严重依赖化肥和农药。","memo":"convention（惯例）+al：按惯例来，常规的。"},{"en":"convert","ipa":"/kənˈvɜːt/","zh":"v. 转换；改建","ex":"They converted the old barn into a guest house.","exZh":"他们把旧谷仓改建成客房。","memo":"con+vert（转）：整个转过来，转换。"},{"en":"convey","ipa":"/kənˈveɪ/","zh":"v. 传达；运送","ex":"Pictures often convey emotions more powerfully than words can.","exZh":"图片传达情感往往比文字更有力。","memo":"con+vey（路）：在路上运过去，传送传达。"},{"en":"convince","ipa":"/kənˈvɪns/","zh":"v. 使信服；说服","ex":"The evidence finally convinced the jury of his innocence.","exZh":"证据终于让陪审团相信他无罪。","memo":"con+vince（征服）：把心征服，说服。"},{"en":"coordinate","ipa":"/kəʊˈɔːdɪneɪt/","zh":"v. 协调 n. 坐标","ex":"A special office coordinates relief efforts after the earthquake.","exZh":"震后由专门办公室协调救援工作。","memo":"co+ordinate（顺序）：排好顺序，协调。"},{"en":"correspond","ipa":"/ˌkɒrɪˈspɒnd/","zh":"v. 符合；通信","ex":"The written records correspond closely with the archaeological finds.","exZh":"文字记载与考古发现高度吻合。","memo":"cor+respond（回应）：一一回应，符合通信。"},{"en":"corrupt","ipa":"/kəˈrʌpt/","zh":"adj. 腐败的 v. 使腐化","ex":"Corrupt officials diverted public funds meant for rural schools.","exZh":"腐败官员挪用了拨给农村学校的公共资金。","memo":"cor+rupt（破）：从里烂破，腐败。"},{"en":"counsel","ipa":"/ˈkaʊnsl/","zh":"n. 忠告；律师 v. 建议","ex":"The clinic offers free counsel to young parents.","exZh":"诊所为年轻父母提供免费咨询。 ":"n. 课程；课程体系","ex":"The school updated its science curriculum last year.","exZh":"学校去年更新了科学课程体系。","memo":"curr（跑）+iculum：课程像跑道，一路跑完。"},{"en":"dairy","ipa":"/ˈdeəri/","zh":"n. 乳制品；奶场","ex":"The region is famous for its dairy products.","exZh":"该地区以乳制品闻名。","memo":"「day儿日」：天天挤奶的日子，乳品奶场。"},{"en":"damp","ipa":"/dæmp/","zh":"adj. 潮湿的 n. 潮气","ex":"The basement is cold and damp in winter.","exZh":"冬天地下室又冷又潮。","memo":"「垫铺」：垫铺受潮，湿气上返。"},{"en":"deadline","ipa":"/ˈdedlaɪn/","zh":"n. 截止期限","ex":"The deadline for submitting applications is next Friday.","exZh":"提交申请的截止日期是下周五。","memo":"dead（死）+line（线）：越线就死，死线截止。"},{"en":"deadly","ipa":"/ˈdedli/","zh":"adj. 致命的；极度的","ex":"The virus can be deadly for elderly patients.","exZh":"这种病毒对老年患者可能是致命的。","memo":"dead（死）+ly：能致死的，致命。"},{"en":"debris","ipa":"/ˈdebriː/","zh":"n. 残骸；碎片","ex":"Rescue teams searched through the debris for survivors.","exZh":"救援队在废墟中搜寻幸存者。","memo":"「呆布利」：碎布乱堆呆在那，废墟残骸。"},{"en":"debt","ipa":"/det/","zh":"n. 债务；欠款","ex":"Many graduates start their careers deep in debt.","exZh":"许多毕业生一工作就背负巨额债务。","memo":"「贷他」：钱是贷他的，欠债要还。"},{"en":"decent","ipa":"/ˈdiːsnt/","zh":"adj. 体面的；正派的；不错的","ex":"He earns a decent salary and supports his family.","exZh":"他收入体面，足以养家。","memo":"dec（合宜）+ent：合乎体统，得体。"},{"en":"declare","ipa":"/dɪˈkleə/","zh":"v. 宣布；申报","ex":"The government declared a state of emergency after the quake.","exZh":"地震后政府宣布进入紧急状态。","memo":"de+clare（说清）：说清楚给大家听，宣布。"},{"en":"deduce","ipa":"/dɪˈdjuːs/","zh":"v. 推断；演绎","ex":"From the footprints, police deduced the thief's height.","exZh":"警方从脚印推断出小偷的身高。","memo":"de+duce（引导）：顺线索往下引，推断。"},{"en":"deem","ipa":"/diːm/","zh":"v. 认为；视为","ex":"The plan was deemed too costly by the council.","exZh":"委员会认为该计划成本过高。","memo":"「低目」：眼光放低打量一番，认定为。"},{"en":"defer","ipa":"/dɪˈfɜː/","zh":"v. 推迟；服从","ex":"The final decision was deferred until next month.","exZh":"最终决定推迟到下个月。","memo":"de+fer（带）：把事往后带，推迟。"},{"en":"defy","ipa":"/dɪˈfaɪ/","zh":"v. 违抗；使不可能","ex":"The protesters defied the ban and marched on.","exZh":"抗议者无视禁令继续游行。","memo":"de+fy（信）：不信那一套，公然违抗。"},{"en":"delegate","ipa":"/ˈdelɪɡət/","zh":"n. 代表 v. 委派","ex":"The manager delegates routine tasks to her assistant.","exZh":"经理把日常事务委派给助理。","memo":"de+legate（派）：派出去办事的人是代表，把活派出去。"},{"en":"delicate","ipa":"/ˈdelɪkət/","zh":"adj. 精致的；脆弱的；微妙的","ex":"The negotiation requires delicate handling by experienced diplomats.","exZh":"这场谈判需要资深外交官的巧妙处理。","memo":"de+lic（诱惑）：诱人易碎，精致娇嫩。"},{"en":"demolish","ipa":"/dɪˈmɒlɪʃ/","zh":"v. 拆除；推翻","ex":"The old cinema was demolished to build a car park.","exZh":"老电影院被拆除以修建停车场。","memo":"demo（民众）+lish：民众齐动手，拆掉推倒。"},{"en":"denial","ipa":"/dɪˈnaɪəl/","zh":"n. 否认；拒绝","ex":"The company issued a swift denial of the report.","exZh":"该公司迅速否认了这一报道。","memo":"deny 的名词：摇头说不，否认。"},{"en":"deny","ipa":"/dɪˈnaɪ/","zh":"v. 否认；拒绝给予","ex":"The minister denied any knowledge of the deal.","exZh":"部长声称对此交易毫不知情。","memo":"「抵耐」：抵死不认，耐着不说，否认。"},{"en":"depict","ipa":"/dɪˈpɪkt/","zh":"v. 描绘；描述","ex":"The mural depicts daily life in ancient Rome.","exZh":"壁画描绘了古罗马的日常生活。","memo":"de+pict（画）：画出来给你看，描绘。"},{"en":"deplete","ipa":"/dɪˈpliːt/","zh":"v. 耗尽；使枯竭","ex":"Overfishing has depleted fish stocks in the region.","exZh":"过度捕捞使该地区鱼类资源枯竭。","memo":"de+plete（填满）：把满的掏空，耗尽。"},{"en":"deploy","ipa":"/dɪˈplɔɪ/","zh":"v. 部署；调动","ex":"The company deployed extra staff during the holiday season.","exZh":"假日季公司增派人手。","memo":"de+ploy（叠放）：把兵力摆开，部署。"},{"en":"deposit","ipa":"/dɪˈpɒzɪt/","zh":"n. 押金；存款；沉积物 v. 存放","ex":"Tenants pay a deposit before moving into the flat.","exZh":"租客入住前需支付押金。","memo":"de+posit（放）：放到下面存好，存款押金。"},{"en":"depress","ipa":"/dɪˈpres/","zh":"v. 使沮丧；使萧条；按下","ex":"The economic crisis depressed housing prices for years.","exZh":"经济危机多年来压制着房价。","memo":"de+press（压）：往下压，情绪被压低。"},{"en":"descend","ipa":"/dɪˈsend/","zh":"v. 下降；下来；是…的后裔","ex":"The plane descended rapidly through the storm clouds.","exZh":"飞机穿过风暴云层迅速下降。","memo":"de+scend（爬）：往下爬，下降。"},{"en":"despair","ipa":"/dɪˈspeə/","zh":"n./v. 绝望","ex":"After losing everything in the fire, he sank into deep despair.","exZh":"大火中失去一切后，他陷入深深的绝望。","memo":"de+spair（希望）：希望全没了，绝望。"},{"en":"desperate","ipa":"/ˈdespərət/","zh":"adj. 不顾一切的；绝望的","ex":"The refugees made a desperate attempt to cross the border.","exZh":"难民不顾一切试图越境。","memo":"despair 亲戚：绝望到豁出去，孤注一掷。"},{"en":"despise","ipa":"/dɪˈspaɪz/","zh":"v. 鄙视；看不起","ex":"She despises colleagues who take credit for others' work.","exZh":"她鄙视把他人功劳据为己有的同事。","memo":"de+spise（看）：往下看人，轻蔑。"},{"en":"detach","ipa":"/dɪˈtætʃ/","zh":"v. 拆下；分离","ex":"Detach the bottom part of the form and keep it.","exZh":"撕下表格底联留存。","memo":"de+tach（钉）：把钉住的拆开，分离。"},{"en":"detect","ipa":"/dɪˈtekt/","zh":"v. 发现；探测","ex":"The sensor can detect even tiny changes in temperature.","exZh":"传感器能探测到极微小的温度变化。","memo":"de+tect（盖）：揭开盖子看见，察觉。"},{"en":"deter","ipa":"/dɪˈtɜː/","zh":"v. 威慑；阻止","ex":"Heavy fines deter many drivers from speeding on country roads.","exZh":"高额罚款让许多司机不敢在乡间公路超速。","memo":"de+ter（吓）：吓住不敢动，威慑。"},{"en":"devote","ipa":"/dɪˈvəʊt/","zh":"v. 奉献；致力于","ex":"She devotes her weekends to voluntary work at the animal shelter.","exZh":"她把周末用于动物收容所的志愿工作。","memo":"de+vote（投票）：把票投给它，一心奉献。"},{"en":"dialect","ipa":"/ˈdaɪəlekt/","zh":"n. 方言","ex":"The grandmother speaks a dialect that few young people understand.","exZh":"祖母讲的方言很少有年轻人听得懂。","memo":"dia（对着）+lect（说）：对着小圈子说话，方言。"},{"en":"dictate","ipa":"/dɪkˈteɪt/","zh":"v. 口述；支配","ex":"Market forces often dictate what farmers choose to grow.","exZh":"市场力量常常支配农民的种植选择。","memo":"dict（说）+ate：他说了算，口述支配。"},{"en":"digest","ipa":"/daɪˈdʒest/","zh":"v. 消化；领会 n. 摘要","ex":"It takes time to digest such a large amount of information.","exZh":"消化如此大量的信息需要时间。","memo":"di+gest（运）：把食物运进身体化掉，消化吸收。"},{"en":"dim","ipa":"/dɪm/","zh":"adj. 昏暗的；模糊的 v. 变暗","ex":"The lamp gave only a dim light in the corner.","exZh":"角落里的灯只发出昏暗的光。","memo":"「地墓」：地墓里光线昏暗，看啥都模糊。"},{"en":"disable","ipa":"/dɪsˈeɪbl/","zh":"v. 使丧失能力；使无效","ex":"The virus disabled the security system for hours.","exZh":"病毒使安全系统瘫痪了数小时。","memo":"dis（去掉）+able（能力）：去掉能力，失灵。"},{"en":"discharge","ipa":"/dɪsˈtʃɑːdʒ/","zh":"v. 释放；排出；出院 n. 排放","ex":"The factory was fined for discharging waste into the river.","exZh":"工厂因向河流排污被罚款。","memo":"dis+charge（装）：把装满的卸掉，释放排放。"},{"en":"discipline","ipa":"/ˈdɪsəplɪn/","zh":"n. 纪律；学科；自律 v. 惩戒","ex":"Learning a language requires patience and self discipline.","exZh":"学语言需要耐心和自律。","memo":"disciple（门徒）亲戚：门徒守师训，纪律学科。"},{"en":"discourse","ipa":"/ˈdɪskɔːs/","zh":"n. 论述；话语","ex":"The book examines political discourse in the digital age.","exZh":"该书探讨数字时代的政治话语。","memo":"dis+course（跑）：思想来回跑，论述交流。"},{"en":"discriminate","ipa":"/dɪˈskrɪmɪneɪt/","zh":"v. 歧视；区分","ex":"It is illegal to discriminate against applicants by age.","exZh":"因年龄歧视求职者是违法的。","memo":"dis+crimin（分辨）：分得太偏就是歧视，区分对待。"},{"en":"disguise","ipa":"/dɪsˈɡaɪz/","zh":"v./n. 伪装","ex":"The spy travelled in disguise as a businessman.","exZh":"间谍乔装成商人出行。","memo":"dis+guise（外观）：换掉外观，伪装。"},{"en":"disgust","ipa":"/dɪsˈɡʌst/","zh":"n./v. 厌恶","ex":"The footage of animal cruelty aroused public disgust.","exZh":"虐待动物的画面引起公愤厌恶。","memo":"dis+gust（口味）：倒了胃口，厌恶。"},{"en":"disorder","ipa":"/dɪsˈɔːdə/","zh":"n. 混乱；失调；骚乱","ex":"The protest ended in disorder after midnight when police arrived.","exZh":"抗议活动在午夜警方到场后陷入混乱。","memo":"dis（无）+order（秩序）：没了秩序，混乱。"},{"en":"dispatch","ipa":"/dɪsˈpætʃ/","zh":"v. 派遣；发送 n. 急件","ex":"The company dispatched a repair team within the hour.","exZh":"公司一小时内派出维修队。","memo":"dis+patch（牌）：把令牌发出去，派遣。"},{"en":"displace","ipa":"/dɪsˈpleɪs/","zh":"v. 使离开原位；取代","ex":"Thousands of families were displaced by the severe flooding last summer.","exZh":"去年夏天数万家庭因严重洪灾流离失所。","memo":"dis+place（位置）：被挪出位置，取代流离。"},{"en":"dissolve","ipa":"/dɪˈzɒlv/","zh":"v. 溶解；解散","ex":"Stir the mixture gently until the sugar dissolves completely.","exZh":"轻轻搅拌混合物，直到糖完全溶解。","memo":"dis+solve（松开）：松开化开，溶解解散。"},{"en":"distract","ipa":"/dɪsˈtrækt/","zh":"v. 分散注意力","ex":"Constant phone notifications easily distract students during evening revision sessions.","exZh":"不停的手机通知很容易在晚自习时分散学生注意力。","memo":"dis+tract（拉）：把心拉走，分神。"},{"en":"distress","ipa":"/dɪsˈtres/","zh":"n. 痛苦；危难 v. 使痛苦","ex":"The distress call was picked up by a fishing boat.","exZh":"渔船收到了遇险呼救信号。","memo":"dis+stress（压力）：压得受不了，痛苦危难。"},{"en":"divert","ipa":"/daɪˈvɜːt/","zh":"v. 使转向；转移","ex":"Traffic was diverted after the bridge closed for repairs.","exZh":"大桥封闭维修后交通改道。","memo":"di+vert（转）：转个方向，改道转移。"},{"en":"domestic","ipa":"/dəˈmestɪk/","zh":"adj. 国内的；家庭的；驯养的","ex":"Domestic flights are usually cheaper than international ones here.","exZh":"这里国内航班通常比国际航班便宜。","memo":"dom（家）+estic：家门口的，家里的国内的。"},{"en":"donate","ipa":"/dəʊˈneɪt/","zh":"v. 捐赠","ex":"The company donated one million yuan to flood relief.","exZh":"公司向抗洪救灾捐赠一百万元。","memo":"don（给）+ate：白白给出，捐赠。"},{"en":"doom","ipa":"/duːm/","zh":"n. 厄运；毁灭 v. 注定","ex":"Without more funding, the research project seemed doomed from the start.","exZh":"缺乏更多资金，这个研究项目从一开始就注定失败。","memo":"「堵门」：厄运堵门，跑也跑不掉。"},{"en":"downgrade","ipa":"/ˈdaʊnɡreɪd/","zh":"v. 降级；调低","ex":"Economists downgraded the country's growth forecast after the trade dispute.","exZh":"贸易争端后经济学家调低了该国增长预期。","memo":"down（下）+grade（等级）：等级往下调，降级。"},{"en":"draft","ipa":"/drɑːft/","zh":"n. 草稿；汇票 v. 起草","ex":"Please send me the first draft of the report before Friday.","exZh":"请在周五前把报告初稿发给我。","memo":"draft=draw 变体：先画出草稿，再慢慢改。"},{"en":"dread","ipa":"/dred/","zh":"v./n. 惧怕；担忧","ex":"She dreads speaking in front of large audiences.","exZh":"她害怕在大庭广众前讲话。","memo":"「拽的」：心里被死死拽住，恐惧不安。"},{"en":"drift","ipa":"/drɪft/","zh":"v. 漂流；漂移 n. 趋势","ex":"The boat drifted slowly towards the open sea.","exZh":"小船慢慢漂向大海深处。","memo":"「追浮他」：随风追着浮着走，漂流。"},{"en":"drought","ipa":"/draʊt/","zh":"n. 旱灾","ex":"The drought destroyed over half of the maize crop.","exZh":"旱灾毁掉了超过一半的玉米收成。","memo":"「抓烙铁」：天干得像抓烙铁，滴雨不下。"},{"en":"drown","ipa":"/draʊn/","zh":"v. 溺水；淹没","ex":"Do not swim alone; you could easily drown.","exZh":"别独自游泳，很容易溺水。","memo":"掉（d）进 own 自己的水里，溺水没顶。"},{"en":"dull","ipa":"/dʌl/","zh":"adj. 枯燥的；暗淡的；迟钝的","ex":"The lecture was so dull that half the audience fell asleep.","exZh":"讲座枯燥得让一半听众睡着了。","memo":"「达」不到：反应达不到，又闷又钝。"},{"en":"dump","ipa":"/dʌmp/","zh":"v. 倾倒；抛弃 n. 垃圾场","ex":"Factories are banned from dumping waste into the lake.","exZh":"禁止工厂向湖中倾倒垃圾。","memo":"「当铺」：不当的货全往当铺外一倒，倾倒抛弃。"},{"en":"durable","ipa":"/ˈdjʊərəbl/","zh":"adj. 耐用的；持久的","ex":"These boots are durable enough for mountain hiking.","exZh":"这靴子结实耐用，适合登山。","memo":"dur（持续）+able：能一直扛，耐用。"},{"en":"dynamic","ipa":"/daɪˈnæmɪk/","zh":"adj. 动态的；有活力的","ex":"She is a dynamic leader full of new ideas.","exZh":"她是一位充满新想法、精力充沛的领导。","memo":"dyn（力）+amic：浑身是劲，活力四射。"},{"en":"duplicate","ipa":"/ˈdjuːplɪkət/","zh":"n. 复制品 v. 复制 adj. 重复的","ex":"Keep a duplicate set of keys with a neighbour.","exZh":"把一套备用钥匙放在邻居那里。","memo":"dup（双）+licate：一变二，复制一份。"},{"en":"duration","ipa":"/djuˈreɪʃn/","zh":"n. 持续时间","ex":"The duration of the flight is about eleven hours.","exZh":"飞行时间约十一小时。","memo":"dur（持续）+ation：一直持续的时长。"},{"en":"decisive","ipa":"/dɪˈsaɪsɪv/","zh":"adj. 决定性的；果断的","ex":"The goal was the decisive moment of the match.","exZh":"这粒进球是全场的决定性时刻。","memo":"decide（决定）+ive：一锤定音，果断。"},{"en":"diffuse","ipa":"/dɪˈfjuːz/","zh":"v. 扩散；传播 adj. 弥漫的","ex":"The scent of fresh coffee diffused through the whole office.","exZh":"新煮咖啡的香味弥漫了整个办公室。","memo":"dif（散开）+fuse（流）：四处流淌，扩散。"},{"en":"dilute","ipa":"/daɪˈluːt/","zh":"v. 稀释；削弱","ex":"Adding water dilutes the juice and reduces its sweetness.","exZh":"加水稀释果汁，甜度随之降低。","memo":"di+lute（洗）：一盆水洗淡它，稀释。"},{"en":"dire","ipa":"/ˈdaɪə/","zh":"adj. 严重的；危急的","ex":"The refugees are in dire need of clean water.","exZh":"难民急需干净的饮用水。","memo":"「大概饿」：大概要饿死了，情况危急。"},{"en":"dismal","ipa":"/ˈdɪzməl/","zh":"adj. 阴郁的；差劲的","ex":"The team's dismal performance in the first half disappointed the fans.","exZh":"球队上半场糟糕的表现令球迷失望。","memo":"「低么丧」：情绪低么丧，阴郁又差劲。"},{"en":"dismay","ipa":"/dɪsˈmeɪ/","zh":"n./v. 惊愕；沮丧","ex":"To her dismay, the flight had already left.","exZh":"令她沮丧的是，航班已经起飞。","memo":"dis+may（可能）：好事全不可能，灰心 ssure on teachers.","exZh":"新的时间表减轻了教师的压力。","memo":"easy 的根：轻轻松松，舒缓容易。"},{"en":"ecology","ipa":"/iːˈkɒlədʒi/","zh":"n. 生态学；生态","ex":"The course covers forest ecology and wildlife protection.","exZh":"课程涵盖森林生态与野生动物保护。","memo":"eco（家园）+logy（学）：研究万物家园的学问，生态。"},{"en":"efficient","ipa":"/ɪˈfɪʃnt/","zh":"adj. 高效的","ex":"The new heating system is far more efficient.","exZh":"新供暖系统效率高得多。","memo":"ef（出）+fic（做）+ient：出活快，高效。"},{"en":"elegant","ipa":"/ˈelɪɡənt/","zh":"adj. 优雅的；简洁优美的","ex":"She wore an elegant black dress to the gala.","exZh":"她穿一条优雅的黑裙出席晚会。","memo":"e+leg（挑）+ant：精挑细选，优雅出众。"},{"en":"elevate","ipa":"/ˈelɪveɪt/","zh":"v. 提升；抬高","ex":"Reading serious literature regularly elevates your writing style over time.","exZh":"经常阅读严肃文学能逐步提升你的写作水平。","memo":"e+lev（升）+ate：往上升，提升。"},{"en":"elite","ipa":"/eɪˈliːt/","zh":"n. 精英 adj. 精英的","ex":"Only the elite troops were chosen for the mission.","exZh":"只有精锐部队被选中执行任务。","memo":"e+lite（选）：被选出的少数，精英。"},{"en":"eminent","ipa":"/ˈemɪnənt/","zh":"adj. 杰出的；著名的","ex":"An eminent scientist will judge the competition this year.","exZh":"一位著名科学家将担任今年比赛的评委。","memo":"e+min（突出）+ent：冒尖出来的，卓越。"},{"en":"emphasize","ipa":"/ˈemfəsaɪz/","zh":"v. 强调；着重","ex":"The report emphasizes the need for early intervention.","exZh":"报告强调早期干预的必要性。","memo":"em+phas（显示）+ize：显示出来让人看，强调。"},{"en":"empower","ipa":"/ɪmˈpaʊə/","zh":"v. 授权；使有能力","ex":"The program empowers rural women to start small businesses.","exZh":"该项目帮助农村妇女有能力创办小企业。","memo":"em+power（力量）：把力量给你，赋能。"},{"en":"encounter","ipa":"/ɪnˈkaʊntə/","zh":"v./n. 遭遇；邂逅","ex":"I encountered an old classmate at the airport.","exZh":"我在机场偶遇了一位老同学。","memo":"en+counter（对面）：撞个对面，遭遇。"},{"en":"endanger","ipa":"/ɪnˈdeɪndʒə/","zh":"v. 危及；使遭受危险","ex":"Cutting down the forest endangers countless rare species.","exZh":"砍伐森林危及无数珍稀物种。","memo":"en+danger（危险）：放进危险里，危及。"},{"en":"enforce","ipa":"/ɪnˈfɔːs/","zh":"v. 执行；强制实施","ex":"Local police enforce the new traffic rules strictly at school gates.","exZh":"地方警方在校门口严格执行新交通规则。","memo":"en+force（力量）：用力量推行，强制执行。"},{"en":"engage","ipa":"/ɪnˈɡeɪdʒ/","zh":"v. 从事；吸引；雇用","ex":"The lecture engaged students from start to finish.","exZh":"讲座从头到尾吸引着学生。","memo":"en+gage（保证）：保证投入其中，从事吸引。"},{"en":"enormous","ipa":"/ɪˈnɔːməs/","zh":"adj. 巨大的","ex":"The dam cost an enormous sum of money.","exZh":"大坝耗资巨大。","memo":"e（超出）+norm（标准）+ous：超出标准一大截，巨大。"},{"en":"ensure","ipa":"/ɪnˈʃʊə/","zh":"v. 确保；保证","ex":"Please ensure all windows are locked before leaving.","exZh":"离开前请确保所有窗户锁好。","memo":"en+sure（确定）：弄到确定为止，确保。"},{"en":"enthusiastic","ipa":"/ɪnˌθjuːziˈæstɪk/","zh":"adj. 热情的；热心的","ex":"The volunteers were enthusiastic despite the heavy rain.","exZh":"尽管大雨倾盆，志愿者们依然热情高涨。","memo":"en+thus（神）+iastic：满心是神，热情似火。"},{"en":"entitle","ipa":"/ɪnˈtaɪtl/","zh":"v. 使有权；给…题名","ex":"The ticket entitles you to one free drink.","exZh":"凭此票可免费获得一杯饮品。","memo":"en+title（头衔）：给上头衔，就有权了。"},{"en":"envy","ipa":"/ˈenvi/","zh":"n./v. 羡慕；嫉妒","ex":"I envy her ability to speak four languages.","exZh":"我羡慕她会讲四种语言。","memo":"「俺围」：俺围着她看，羡慕又眼红。"},{"en":"equation","ipa":"/ɪˈkweɪʃn/","zh":"n. 方程式；等同","ex":"The simple equation balances cost, quality and delivery time.","exZh":"这个简单的等式平衡了成本、质量与交付时间。","memo":"equ（相等）+ation：两边相等，方程。"},{"en":"equip","ipa":"/ɪˈkwɪp/","zh":"v. 装备；使具备","ex":"The lab is equipped with the latest microscopes.","exZh":"实验室配备了最先进的显微镜。","memo":"「一kit」：一个 kit（套装）装上，配备齐全。"},{"en":"equity","ipa":"/ˈekwəti/","zh":"n. 公平；股本","ex":"The new policy promotes equity in funding between urban and rural schools.","exZh":"新政策促进城乡学校经费的公平分配。","memo":"equ（相等）+ity：大家一样多，公平。"},{"en":"eradicate","ipa":"/ɪˈrædɪkeɪt/","zh":"v. 根除；消灭","ex":"A global vaccination campaign finally eradicated smallpox in 1980.","exZh":"全球疫苗接种运动终于在1980年根除了天花。","memo":"e+radic（根）+ate：连根拔起，根除。"},{"en":"erupt","ipa":"/ɪˈrʌpt/","zh":"v. 爆发；喷发","ex":"The volcano erupted without warning, covering nearby villages in ash.","exZh":"火山毫无预警地喷发，附近村庄被火山灰覆盖。","memo":"e（出）+rupt（破）：破口而出，喷发。"},{"en":"escort","ipa":"/ˈeskɔːt/","zh":"n. 护卫者 v. 护送","ex":"Security guards escorted the visitors to the exit.","exZh":"保安护送来访者到出口。","memo":"e+scort（护）：一路护着走，护卫。"},{"en":"esteem","ipa":"/ɪˈstiːm/","zh":"v./n. 尊重；敬重","ex":"She is held in high esteem by her colleagues.","exZh":"她深受同事敬重。","memo":"e+steem（价值）：看重其价值，敬重。"},{"en":"estimate","ipa":"/ˈestɪmeɪt/","zh":"v./n. 估计；估算","ex":"Engineers estimate the repair will take two weeks.","exZh":"工程师估计维修需两周。","memo":"est（最）+imate：先估个最可能的数，估算。"},{"en":"ethical","ipa":"/ˈeθɪkl/","zh":"adj. 伦理的；合乎道德的","ex":"Animal testing raises serious ethical questions in modern medical research.","exZh":"动物实验在现代医学研究中引发严肃的伦理问题。","memo":"ethic（道德）+al：讲道德的，合乎伦理。"},{"en":"evaporate","ipa":"/ɪˈvæpəreɪt/","zh":"v. 蒸发；消失","ex":"Morning puddles evaporate quickly in the strong summer heat.","exZh":"夏日酷热下清晨的水洼很快蒸发。","memo":"e（出）+vapor（蒸汽）+ate：化汽而出，蒸发。"},{"en":"excerpt","ipa":"/ˈeksɜːpt/","zh":"n. 摘录；节选","ex":"She read an excerpt from her new novel.","exZh":"她朗读了新小说的一个片段。","memo":"ex（出）+cerpt（挑）：挑出来的一段，节选。"},{"en":"exemplify","ipa":"/ɪɡˈzemplɪfaɪ/","zh":"v. 是…的典范；例证","ex":"This award winning building exemplifies modern green architecture in Asia.","exZh":"这座获奖建筑是亚洲现代绿色建筑的典范。","memo":"example（例子）+ify：拿来当例子，例证。"},{"en":"expedition","ipa":"/ˌekspəˈdɪʃn/","zh":"n. 远征；探险","ex":"The expedition reached the pole after sixty days.","exZh":"探险队六十天后抵达极点。","memo":"ex（出）+ped（脚）+ition：迈脚出门远行，探险。"},{"en":"expel","ipa":"/ɪkˈspel/","zh":"v. 开除；驱逐","ex":"The student was expelled for cheating in the exam.","exZh":"该学生因考试作弊被开除。","memo":"ex（出）+pel（推）：推出去，驱逐。"},{"en":"expenditure","ipa":"/ɪkˈspendɪtʃə/","zh":"n. 支出；花费","ex":"The government cut public expenditure on transport to reduce the deficit.","exZh":"政府削减交通公共支出以减少赤字。","memo":"ex+pend（花钱）+iture：花出去的钱，支出。"},{"en":"expose","ipa":"/ɪkˈspəʊz/","zh":"v. 暴露；揭露","ex":"The documentary exposed corruption in the fishing industry.","exZh":"纪录片揭露了渔业腐败。","memo":"ex（出）+pose（放）：摆到外面，曝光。"},{"en":"extensive","ipa":"/ɪkˈstensɪv/","zh":"adj. 广泛的；大量的","ex":"The storm caused extensive damage to the coast.","exZh":"风暴对海岸造成大面积破坏。","memo":"ex+tend（伸）：伸得老远，广泛。"},{"en":"external","ipa":"/ɪkˈstɜːnl/","zh":"adj. 外部的；外来的","ex":"The paint protects the walls from external weather damage.","exZh":"涂料保护墙壁免受外部气候侵害。","memo":"exter（外）+nal：在外头的，外部。"},{"en":"embrace","ipa":"/ɪmˈbreɪs/","zh":"v. 拥抱；欣然接受","ex":"The city embraced the idea of car free streets.","exZh":"这座城市欣然接受了无车街道的理念。","memo":"em+brace（臂）：张开双臂，拥抱接纳。"},{"en":"emergency","ipa":"/ɪˈmɜːdʒənsi/","zh":"n. 紧急情况","ex":"In an emergency, dial one one nine immediately.","exZh":"紧急情况请立即拨打一一九。","memo":"emerge（浮现）+ency：险情突然冒出，紧急。"},{"en":"emigrate","ipa":"/ˈemɪɡreɪt/","zh":"v. 移居国外","ex":"Her grandparents emigrated from Italy in the 1950s.","exZh":"她的祖父母上世纪五十年代从意大利移居国外。","memo":"e（出）+migr（迁）+ate：迁出国门，移居海外。"},{"en":"emission","ipa":"/ɪˈmɪʃn/","zh":"n. 排放；排放物","ex":"The city aims to halve carbon emissions by 2035.","exZh":"该市力争到2035年将碳排放减半。","memo":"emit 的名词：排放出来的东西。"},{"en":"empathy","ipa":"/ˈempəθi/","zh":"n. 同理心；共情","ex":"A good counsellor shows real empathy for clients.","exZh":"优秀的咨询师对来访者有真切的同理心。","memo":"em+pathy（感情）：感情入进去，感同身受。"},{"en":"enact","ipa":"/ɪˈnækt/","zh":"v. 制定；颁布","ex":"Parliament enacted a new law to protect coastal wetlands last year.","exZh":"议会去年颁布了保护沿海湿地的新法律。","memo":"en+act（行动）：让法条行动起来，颁布实施。"},{"en":"encompass","ipa":"/ɪnˈkʌmpəs/","zh":"v. 包含；围绕","ex":"The course encompasses both theory and practical training.","exZh":"课程涵盖理论与实践训练。","memo":"en+compass（罗盘）：罗盘范围全圈进来，包含。"},{"en":"enlighten","ipa":"/ɪnˈlaɪtn/","zh":"v. 启发；开导","ex":"The documentary enlightened viewers about the true scale of ocean pollution.","exZh":"纪录片让观众了解并深思海洋污染的真实规模。","memo":"en+light（光）：心中点亮灯，启发开导。"},{"en":"entity","ipa":"/ˈentəti/","zh":"n. 实体；独立存在物","ex":"The two companies will merge into a single entity.","exZh":"两家公司将合并为一个实体。","memo":"ent（存在）+ity：实打实存在的东西，实体。"},{"en":"entrepreneur","ipa":"/ˌɒntrəprəˈnɜː/","zh":"n. 企业家；创业者","ex":"The young entrepreneur opened her third cafe this year.","exZh":"这位年轻创业者今年开了第三家咖啡馆。","memo":"entre（进）+preneur：进商场接活单干，创业者。"},{"en":"envisage","ipa":"/ɪnˈvɪzɪdʒ/","zh":"v. 设想；展望","ex":"The plan envisages ten thousand new homes by 2030.","exZh":"该规划设想到2030年建成一万套新住宅。","memo":"en+vis（看）+age：往前看，设想。"},{"en":"estate","ipa":"/ɪˈsteɪt/","zh":"n. 房地产；庄园；遗产","ex":"Prices in the real estate market keep rising.","exZh":"房地产市场价格持续上涨。","memo":"e+state（状态）：名下产业的静态清单，地产财产。"},{"en":"evaluate","ipa":"/ɪˈvæljueɪt/","zh":"v. 评估；评价","ex":"Teachers evaluate each project against clear criteria before awarding grades.","exZh":"教师按照明确标准评估每个项目后再评分。","memo":"e+valu（价值）+ate：算出价值，评估。"},{"en":"exotic","ipa":"/ɪɡˈzɒtɪk/","zh":"adj. 异国的；奇异的","ex":"The market sells exotic fruits from Southeast Asia.","exZh":"市场出售来自东南亚的异国水果。","memo":"exo（外面）+tic：外面的稀罕物，异国风情。"},{"en":"expertise","ipa":"/ˌekspɜːˈtiːz/","zh":"n. 专业知识；专长","ex":"We need someone with expertise in renewable energy.","exZh":"我们需要可再生能源方面的专业人才。","memo":"expert（专家）+ise：专家的本事，专长。"},{"en":"expire","ipa":"/ɪkˈspaɪə/","zh":"v. 到期；失效","ex":"My passport expires next March, so I must renew it.","exZh":"我的护照明年三月到期，必须续签。","memo":"ex（出）+pire（呼吸）：气吐完就到期，失效。"},{"en":"ecosystem","ipa":"/ˈiːkəʊsɪstəm/","zh":"n. 生态系统","ex":"Wetlands form a vital ecosystem for countless birds.","exZh":"湿地是无数鸟类的重要生态系统。","memo":"eco（家园）+system（系统）：家园运转系统，生态。"},{"en":"edible","ipa":"/ˈedəbl/","zh":"adj. 可食用的","ex":"The course teaches students to identify edible wild plants.","exZh":"课程教学生辨别可食用野生植物。","memo":"ed（吃）+ible：能吃的，可食用。"},{"en":"efficiency","ipa":"/ɪˈfɪʃnsi/","zh":"n. 效率；效能","ex":"Modern engines improve fuel efficiency by thirty percent.","exZh":"现代发动机将燃油效率提高三成。","memo":"efficient 的名词：出活的程度，效率。"},{"en":"ensue","ipa":"/ɪnˈsjuː/","zh":"v. 接着发生","ex":"A heated debate ensued among the students after the announcement.","exZh":"公告之后学生中随即展开了激烈争论。","memo":"en+sue（跟随）：跟着就来了，随之发生。"},{"en":"entail","ipa":"/ɪnˈteɪl/","zh":"v. 需要；牵涉","ex":"The job entails frequent travel between the two offices.","exZh":"这份工作需要在两个办公室之间频繁出差。","memo":"en+tail（尾巴）：尾巴都得跟着，牵涉必然。"},{"en":"episode","ipa":"/ˈepɪsəʊd/","zh":"n. 一段经历；一集","ex":"The final episode attracted over ten million viewers.","exZh":"大结局吸引了超过千万观众。","memo":"epi（旁）+sode（进）：插进来的一段，插曲剧集。"},{"en":"era","ipa":"/ˈɪərə/","zh":"n. 时代；年代","ex":"The internet has opened a new era of communication.","exZh":"互联网开启了通信的新时代。","memo":"「一拉」：历史一拉就拉开一个新时代。"},{"en":"essence","ipa":"/ˈesns/","zh":"n. 本质；精髓","ex":"Time is of the essence in emergency rescue.","exZh":"紧急救援分秒必争。","memo":"ess（存在）+ence：存在里最核心的，本质。"},{"en":"ethnic","ipa":"/ˈeθnɪk/","zh":"adj. 民族的；种族的","ex":"The city celebrates its ethnic diversity every summer.","exZh":"这座城市每年夏天庆祝其民族多样性。","memo":"ethn（民族）+ic：民族的，族裔的。"},{"en":"evacuate","ipa":"/ɪˈvækjueɪt/","zh":"v. 撤离；疏散","ex":"Residents were evacuated before the volcano erupted early on Tuesday.","exZh":"周二凌晨火山喷发前居民已撤离。","memo":"e（出）+vacu（空）+ate：腾空撤出，疏散。"},{"en":"excursion","ipa":"/ɪkˈskɜːʃn/","zh":"n. 短途旅行；远足","ex":"The school organized an excursion to the science museum.","exZh":"学校组织了科学博物馆一日游。","memo":"ex（出）+curs（跑）+ion：跑出去转一圈，短途游。"},{"en":"exposure","ipa":"/ɪkˈspəʊʒə/","zh":"n. 暴露；接触；曝光","ex":"Prolonged exposure to strong sunlight can damage the skin badly.","exZh":"长时间暴露在强烈阳光下会严重损伤皮肤。","memo":"expose 的名词：被摆在外面的状态。"},{"en":"extent","ipa":"/ɪkˈstent/","zh":"n. 程度；范围","ex":"To some extent, technology has widened the gap.","exZh":"在某种程度上，技术拉大了差距。","memo":"ex+tent（伸）：伸出去多远，程度范围。"},{"en":"extinct","ipa":"/ɪkˈstɪŋkt/","zh":"adj. 灭绝的；废弃的","ex":"Dinosaurs became extinct about sixty five million years ago.","exZh":"恐龙大约在六千五百万年前灭绝。","memo":"ex（出）+stinct（刺）：火苗被掐灭，灭绝。"},{"en":"faculty","ipa":"/ˈfæklti/","zh":"n. 全体教员；能力；系","ex":"The science faculty moved into the new building.","exZh":"理学院搬进了新楼。","memo":"fac（做）+ulty：能干事的人聚一起，教员学系。"},{"en":"fade","ipa":"/feɪd/","zh":"v. 褪色；逐渐消失","ex":"The painted signs have faded in the strong sunlight.","exZh":"在强烈日照下，彩绘招牌逐渐褪色。","memo":"「费的」：颜色费掉变淡，声音费掉消失。"},{"en":"faint","ipa":"/feɪnt/","zh":"adj. 微弱的 v. 昏倒","ex":"She felt faint after standing in the hot sun.","exZh":"在烈日下站了太久，她感到快要晕倒 全力撕打，凶猛激烈。"},{"en":"finite","ipa":"/ˈfaɪnaɪt/","zh":"adj. 有限的","ex":"Fossil fuels are finite resources that will run out.","exZh":"化石燃料是终将枯竭的有限资源。","memo":"fin（终点）+ite：有终点的，有限。"},{"en":"fiscal","ipa":"/ˈfɪskl/","zh":"adj. 财政的","ex":"The fiscal year ends in March for most companies.","exZh":"多数公司的财政年度三月结束。","memo":"fisc（钱袋）+al：管钱袋的事，财政。"},{"en":"flee","ipa":"/fliː/","zh":"v. 逃跑；逃离","ex":"Thousands fled the coastal towns before the hurricane.","exZh":"飓风来临前数千人逃离沿海城镇。","memo":"「飞离」：飞快离开，逃命要紧。"},{"en":"flexible","ipa":"/ˈfleksəbl/","zh":"adj. 灵活的；柔韧的","ex":"The company offers flexible working hours for parents.","exZh":"公司为有孩子的员工提供弹性工作时间。","memo":"flex（弯）+ible：能弯能曲，灵活。"},{"en":"flock","ipa":"/flɒk/","zh":"n. 群 v. 聚集","ex":"Birds gather in huge flocks before flying south.","exZh":"南飞之前，鸟儿聚成大群。","memo":"「弗洛克」：弗（不）单独行动，成群结队。"},{"en":"flourish","ipa":"/ˈflʌrɪʃ/","zh":"v. 繁荣；茂盛","ex":"Small cafes flourish in the old town's narrow streets.","exZh":"老城窄巷里小咖啡馆生意兴隆。","memo":"flor（花）+ish：花开得旺，繁荣茂盛。"},{"en":"fluid","ipa":"/ˈfluːɪd/","zh":"n. 液体 adj. 流动的","ex":"Drink plenty of fluids when you have a fever.","exZh":"发烧时要多补充液体。","memo":"flu（流）+id：能流动的，流体。"},{"en":"forbid","ipa":"/fəˈbɪd/","zh":"v. 禁止","ex":"The regulations forbid parking near the school gate.","exZh":"规定禁止在校门附近停车。","memo":"for（对着）+bid（命令）：对着你下禁令，禁止。"},{"en":"foresee","ipa":"/fɔːˈsiː/","zh":"v. 预见；预知","ex":"Analysts did not foresee the sudden drop in oil prices.","exZh":"分析师未能预见油价骤跌。","memo":"fore（前）+see（看）：提前看到，预见。"},{"en":"formula","ipa":"/ˈfɔːmjələ/","zh":"n. 公式；配方","ex":"Students learn the chemical formula for water early on.","exZh":"学生很早就学到水的化学式。","memo":"form（形式）+ula：定好的形式，公式配方。"},{"en":"forum","ipa":"/ˈfɔːrəm/","zh":"n. 论坛；讨论会","ex":"The city hosted an international forum on climate policy.","exZh":"该市举办了气候政策国际论坛。","memo":"「抛任」：广场上抛出任题大家议，论坛。"},{"en":"fossil","ipa":"/ˈfɒsl/","zh":"n. 化石；守旧的人","ex":"The chalk cliffs are rich in marine fossils from prehistoric seas.","exZh":"白垩悬崖富含史前海洋的化石。","memo":"「刨搜」：石头里刨出来搜出来的老古董，化石。"},{"en":"foul","ipa":"/faʊl/","zh":"adj. 恶臭的；犯规的 n. 犯规","ex":"The referee gave a foul against the home team.","exZh":"裁判判主队犯规。","memo":"「馊」：味道馊掉发臭，球场犯规也遭嫌。"},{"en":"franchise","ipa":"/ˈfræntʃaɪz/","zh":"n. 特许经营权；加盟店","ex":"She bought a fast food franchise in her hometown.","exZh":"她在老家买下一家快餐加盟店。","memo":"fran（自由）+chise：花钱买自由经营权，加盟。"},{"en":"frantic","ipa":"/ˈfræntɪk/","zh":"adj. 疯狂的；慌乱的","ex":"Parents made frantic calls after the school trip was delayed.","exZh":"学校行程延误后家长疯狂致电。","memo":"「法兰体克」：法兰西舞跳到发疯，慌乱至极。"},{"en":"fringe","ipa":"/frɪndʒ/","zh":"n. 边缘；刘海","ex":"The village lies on the fringe of the desert.","exZh":"这个村庄地处沙漠边缘。","memo":"「分界」：站在分界上，边缘一撮刘海。"},{"en":"fruitful","ipa":"/ˈfruːtfl/","zh":"adj. 富有成效的","ex":"The meeting was fruitful and produced three new ideas.","exZh":"会议富有成效，产生三个新点子。","memo":"fruit（果实）+ful：结满果实，卓有成效。"},{"en":"frustrate","ipa":"/frʌˈstreɪt/","zh":"v. 使沮丧；挫败","ex":"Repeated delays frustrated the passengers waiting for take off.","exZh":"一再延误让等待起飞的乘客不胜烦躁。","memo":"「弗兰追他」：弗兰苦追不得，挫败沮丧。"},{"en":"fulfil","ipa":"/fʊlˈfɪl/","zh":"v. 履行；实现","ex":"The company failed to fulfil its promise to cut packaging.","exZh":"公司未能兑现减少包装的承诺。","memo":"full（满）+fill（装）：装到满，兑现实现。"},{"en":"furious","ipa":"/ˈfjʊəriəs/","zh":"adj. 狂怒的；激烈的","ex":"Residents were furious about the overnight construction noise.","exZh":"居民对通宵施工噪音怒不可遏。","memo":"fury（暴怒）+ous：怒火全开，狂怒。"},{"en":"furnace","ipa":"/ˈfɜːnɪs/","zh":"n. 火炉；熔炉","ex":"The metal was heated in a giant furnace.","exZh":"金属在巨大的熔炉中加热。","memo":"「沸呢」：炉火正旺水沸腾呢，火炉熔炉。"},{"en":"fabric","ipa":"/ˈfæbrɪk/","zh":"n. 织物；结构","ex":"The tent is made from a lightweight waterproof fabric.","exZh":"帐篷采用轻质防水织物制成。","memo":"fabr（工坊）+ic：工坊织出的布，社会如布是结构。"},{"en":"fraction","ipa":"/ˈfrækʃn/","zh":"n. 分数；小部分","ex":"Only a small fraction of applicants receive interview offers each year.","exZh":"每年只有一小部分申请者能获得面试机会。","memo":"fract（破）+ion：把整体打破，一小块。"},{"en":"frontier","ipa":"/ˈfrʌntɪə/","zh":"n. 边境；前沿","ex":"Space remains the final frontier 示；意味着","ex":"The survey results imply that attitudes are slowly changing.","exZh":"调查结果表明人们的态度正在慢慢改变。","memo":"im进+ply折叠：话折着说，暗示。"},{"en":"impress","ipa":"/ɪmˈpres/","zh":"v. 留下深刻印象","ex":"Her fluent presentation impressed the entire interview panel.","exZh":"她流利的演讲给全体面试官留下深刻印象。","memo":"im进+press压：压进心里的印象，难忘。"},{"en":"impetus","ipa":"/ˈɪmpɪtəs/","zh":"n. 推动；动力","ex":"The new funding gave fresh impetus to cancer research.","exZh":"新资金为癌症研究注入了新动力。","memo":"im进+petus追：追着你往前推，动力。"},{"en":"impulse","ipa":"/ˈɪmpʌls/","zh":"n. 冲动；突发欲望","ex":"She bought the dress on impulse and regretted it later.","exZh":"她一时冲动买了那条裙子，事后后悔。","memo":"im进+pulse脉搏：脉搏一冲就买，纯冲动。"},{"en":"incident","ipa":"/ˈɪnsɪdənt/","zh":"n. 事件；事故","ex":"The border incident was quickly resolved through diplomatic talks.","exZh":"边境事件通过外交会谈迅速解决。","memo":"in内+cid掉：掉进眼里的大事，事件事故。"},{"en":"incline","ipa":"/ɪnˈklaɪn/","zh":"v. 使倾向于；倾斜 n. 斜坡","ex":"Rising costs incline many families to cut holiday spending.","exZh":"成本上升促使许多家庭倾向削减度假开支。","memo":"in+cline斜：心里往一边斜，倾向。"},{"en":"inclusive","ipa":"/ɪnˈkluːsɪv/","zh":"adj. 包容的；包含的","ex":"The school promotes an inclusive culture for all students.","exZh":"这所学校倡导对所有学生包容的文化。","memo":"include包含+ive：把人都包进来，包容。"},{"en":"incredible","ipa":"/ɪnˈkredəbl/","zh":"adj. 难以置信的；惊人的","ex":"The athlete made an incredible recovery after the injury.","exZh":"这位运动员受伤后恢复得令人难以置信。","memo":"in不+credible可信：不可信到惊掉下巴。"},{"en":"incur","ipa":"/ɪnˈkɜː/","zh":"v. 招致；遭受","ex":"Late payments incur extra charges on most utility bills.","exZh":"大多数公用事业账单逾期付款会产生额外费用。","memo":"in进+cur跑：祸事跑进门，招致损失。"},{"en":"indicate","ipa":"/ˈɪndɪkeɪt/","zh":"v. 表明；指出","ex":"The data indicates a clear link between diet and mood.","exZh":"数据表明饮食与情绪之间有明显联系。","memo":"dic说+ate：把话说出来，表明指出。"},{"en":"indigenous","ipa":"/ɪnˈdɪdʒənəs/","zh":"adj. 本土的；土著的","ex":"The museum preserves the culture of indigenous communities.","exZh":"博物馆保护着土著社区的文化。","memo":"ind内+gen出生：生在本土的，土生土长。"},{"en":"infection","ipa":"/ɪnˈfekʃn/","zh":"n. 感染；传染","ex":"Doctors washed the wound carefully to prevent infection.","exZh":"医生仔细清洗伤口以防感染。","memo":"infect传染+ion：病菌钻进来作乱，感染。"},{"en":"infect","ipa":"/ɪnˈfekt/","zh":"v. 感染；传染","ex":"One sick pupil infected half the class with flu.","exZh":"一名生病的学生把流感传染给了半班同学。","memo":"in进+fect做：病菌进来搞事，感染。"},{"en":"infer","ipa":"/ɪnˈfɜː/","zh":"v. 推断；推论","ex":"From the data, we can infer that demand is rising.","exZh":"从数据中我们可以推断需求正在上升。","memo":"in内+fer带：把藏着的结论带出来，推断。"},{"en":"inequality","ipa":"/ˌɪnɪˈkwɒləti/","zh":"n. 不平等；不均等","ex":"The report examines income inequality across the region.","exZh":"报告审视了该地区的收入不平等。","memo":"in不+equal平等+ity：不平等，差距大。"},{"en":"infant","ipa":"/ˈɪnfənt/","zh":"n. 婴儿 adj. 婴儿的","ex":"The clinic provides free health checks for infants.","exZh":"诊所为婴儿提供免费健康检查。","memo":"in不能+fant说话：还不会说话的小家伙，婴儿。"},{"en":"inflation","ipa":"/ɪnˈfleɪʃn/","zh":"n. 通货膨胀","ex":"Rising inflation is steadily eroding people's purchasing power.","exZh":"不断上升的通货膨胀正在侵蚀人们的购买力。","memo":"inflate膨胀+ion：钱袋子胀了不值钱，通胀。"},{"en":"infrastructure","ipa":"/ˈɪnfrəstrʌktʃə/","zh":"n. 基础设施","ex":"The government plans to invest heavily in transport infrastructure.","exZh":"政府计划大力投资交通基础设施。","memo":"infra在下+structure结构：底下撑着的结构，基础设施。"},{"en":"ingredient","ipa":"/ɪnˈɡriːdiənt/","zh":"n. 原料；要素","ex":"Fresh ingredients are the secret of this famous dish.","exZh":"新鲜食材是这道名菜的秘诀。","memo":"in进+greed贪：贪心全塞进去，配料要素。"},{"en":"inhabit","ipa":"/ɪnˈhæbɪt/","zh":"v. 栖息；居住于","ex":"Polar bears inhabit the frozen regions of the Arctic.","exZh":"北极熊栖息在冰冻的北极地区。","memo":"in进+habit住：住进里面，栖息定居。"},{"en":"inhabitant","ipa":"/ɪnˈhæbɪtənt/","zh":"n. 居民；栖息的动物","ex":"Most inhabitants of the island live by fishing.","exZh":"岛上大多数居民以捕鱼为生。","memo":"inhabit居住+ant人：住在里面的人，居民。"},{"en":"inherent","ipa":"/ɪnˈhɪərənt/","zh":"adj. 固有的；内在的","ex":"Some degree of risk is inherent in every investment.","exZh":"每项投资都固有一定程度的风险。","memo":"in内+here在这+ent：长在这里面的，固有。"},{"en":"inherit","ipa":"/ɪnˈherɪt/","zh":"v. 继承；经遗传获得","ex":"She inherited the family farm from her grandfather.","exZh":"她从祖父那里继承了家族农场。","memo":"in进+her她：东西进她名下，继承。"},{"en":"initial","ipa":"/ɪˈnɪʃl/","zh":"adj. 最初的 n. 首字母","ex":"The initial results of the survey look promising.","exZh":"调查的初步结果看起来很有希望。","memo":"in进+it走：刚迈进去第一步，最初的。"},{"en":"initiate","ipa":"/ɪˈnɪʃieɪt/","zh":"v. 开始；发起","ex":"The government initiated a programme to reduce youth unemployment.","exZh":"政府发起了一项降低青年失业率的计划。","memo":"initial的动词：走出第一步，发起开始。"},{"en":"initiative","ipa":"/ɪˈnɪʃətɪv/","zh":"n. 倡议；主动性","ex":"The city launched a green initiative to plant more trees.","exZh":"该市发起了种植更多树木的绿色倡议。","memo":"initiate的名词：主动迈第一步，倡议主动性。"},{"en":"inject","ipa":"/ɪnˈdʒekt/","zh":"v. 注射；注入","ex":"Doctors injected the vaccine into the patient's arm.","exZh":"医生把疫苗注射进病人手臂。","memo":"in进+ject扔：药水扔进去，注射注入。"},{"en":"innocent","ipa":"/ˈɪnəsnt/","zh":"adj. 无辜的；天真的","ex":"The court proved that the suspect was innocent.","exZh":"法庭证明嫌疑人无罪。","memo":"in不+noc伤害：没伤害过人，无辜清白。"},{"en":"innovation","ipa":"/ˌɪnəˈveɪʃn/","zh":"n. 创新；革新","ex":"Technological innovation has transformed the way we work.","exZh":"技术创新改变了我们的工作方式。","memo":"innovate的名词：弄出新东西，创新。"},{"en":"input","ipa":"/ˈɪnpʊt/","zh":"n. 投入；输入；意见","ex":"Employee input helped shape the new company policy.","exZh":"员工的意见投入帮助制定了新公司政策。","memo":"in进+put放：放进来的东西，投入输入。"},{"en":"inquire","ipa":"/ɪnˈkwaɪə/","zh":"v. 询问；查询","ex":"She inquired about the price of the annual membership.","exZh":"她询问了年度会员的价格。","memo":"in+quire求问：凑进去细问，询问查询。"},{"en":"insect","ipa":"/ˈɪnsekt/","zh":"n. 昆虫","ex":"The garden attracts insects such as bees and butterflies.","exZh":"花园吸引来蜜蜂蝴蝶等昆虫。","memo":"in进+sect切：身体切成三节的，昆虫。"},{"en":"insert","ipa":"/ɪnˈsɜːt/","zh":"v. 插入；嵌入","ex":"Insert the card into the machine to start payment.","exZh":"把卡插入机器开始付款。","memo":"in进+sert放：放进里面，插入。"},{"en":"inspect","ipa":"/ɪnˈspekt/","zh":"v. 检查；视察","ex":"Officials inspected the factory before renewing its licence.","exZh":"官员们在续发执照前检查了工厂。","memo":"in+spect看：进去看个遍，检查视察。"},{"en":"inspiration","ipa":"/ˌɪspəˈreɪʃn/","zh":"n. 灵感 ors advise reducing the daily intake of sugar.","exZh":"医生建议减少每日糖分摄入量。","memo":"in进+take拿：拿进身体里的量，摄入。"},{"en":"integral","ipa":"/ˈɪntɪɡrəl/","zh":"adj. 不可或缺的；作为组成部分的","ex":"Music is an integral part of the school curriculum.","exZh":"音乐是学校课程不可或缺的一部分。","memo":"integer整数+al：像整数一样完整不可缺。"},{"en":"integrity","ipa":"/ɪnˈteɡrəti/","zh":"n. 正直；完整","ex":"The young judge was widely respected for her integrity.","exZh":"这位年轻法官因正直而广受尊敬。","memo":"整个+ity：人格完整不缺角，正直诚实。"},{"en":"intellect","ipa":"/ˈɪntəlekt/","zh":"n. 智力；才智","ex":"Her sharp intellect and quick wit impressed the professors.","exZh":"她敏锐的才智和机敏的风趣给教授们留下深刻印象。","memo":"intel在+lect选：会在心里选最优，才智。"},{"en":"intellectual","ipa":"/ˌɪntəˈlektʃuəl/","zh":"adj. 智力的 n. 知识分子","ex":"The conference attracted intellectuals from around the world.","exZh":"会议吸引了来自世界各地的知识分子。","memo":"intellect智力+ual：动脑子的，知识分子。"},{"en":"intelligence","ipa":"/ɪnˈtelɪdʒəns/","zh":"n. 智力；情报","ex":"Artificial intelligence is rapidly changing many traditional industries.","exZh":"人工智能正在迅速改变许多传统行业。","memo":"intellect才智+gence：脑子灵加消息灵，智力情报。"},{"en":"intend","ipa":"/ɪnˈtend/","zh":"v. 打算；意图","ex":"The council intends to build a new library downtown.","exZh":"市政会打算在市中心建一座新图书馆。","memo":"in+tend伸：心往那伸，打算。"},{"en":"intense","ipa":"/ɪnˈtens/","zh":"adj. 强烈的；激烈的","ex":"The final exam period is the most intense time of term.","exZh":"期末考试周是学期中最紧张的时段。","memo":"in+tense绷紧：弦绷到最紧，强烈激烈。"},{"en":"intensify","ipa":"/ɪnˈtensɪfaɪ/","zh":"v. 加剧；增强","ex":"The storm intensified as it moved towards the coast.","exZh":"风暴在向海岸移动过程中不断增强。","memo":"intense+ify：越绷越紧，加剧增强。"},{"en":"intention","ipa":"/ɪnˈtenʃn/","zh":"n. 意图；打算","ex":"She had no intention of leaving her hometown.","exZh":"她根本没有离开家乡的打算。","memo":"intend的名词：心里伸出去的钩子，意图。"},{"en":"intentional","ipa":"/ɪnˈtenʃənl/","zh":"adj. 故意的；有意的","ex":"The referee judged that the foul was intentional.","exZh":"裁判判定那次犯规是故意的。","memo":"intention+al：揣着意图干的，故意。"},{"en":"interact","ipa":"/ˌɪntərˈækt/","zh":"v. 互动；交流","ex":"Students interact with the s a monopoly on water supply.","exZh":"这家公用事业公司垄断了供水业务。","memo":"mono独+poly卖：独家买卖，垄断。"},{"en":"monument","ipa":"/ˈmɒnjumənt/","zh":"n. 纪念碑；纪念物","ex":"A stone monument marks the site of the ancient battle.","exZh":"一座石碑标记着古战场的遗址。","memo":"铭刻门：刻字立门警醒后人，纪念碑。"},{"en":"moral","ipa":"/ˈmɒrəl/","zh":"adj. 道德的 n. 寓意","ex":"The story carries a simple moral about honesty.","exZh":"这个故事蕴含一个关于诚实的道理。","memo":"莫若：莫作恶若行善，道德寓意。"},{"en":"mortgage","ipa":"/ˈmɔːɡɪdʒ/","zh":"n. 抵押贷款 v. 抵押","ex":"They took out a mortgage to buy their first flat.","exZh":"他们办理抵押贷款买了第一套公寓。","memo":"莫硬给：钱莫硬掏给银行几十年，房奴抵押。"},{"en":"motion","ipa":"/ˈməʊʃn/","zh":"n. 运动；动议","ex":"The committee approved the motion with a clear majority.","exZh":"委员会以明显多数通过了该动议。","memo":"摸身：摸着身子动起来，运动动议。"},{"en":"motivation","ipa":"/ˌməʊtɪˈveɪʃn/","zh":"n. 动力；动机","ex":"Praise can be a powerful motivation for young learners.","exZh":"表扬对年轻学习者是强大的动力。","memo":"motivate的名词：让人迈腿的劲儿，动力。"},{"en":"motive","ipa":"/ˈməʊtɪv/","zh":"n. 动机；目的","ex":"The police questioned the suspect about his motive.","exZh":"警方就作案动机讯问嫌疑人。","memo":"摸提福：摸清他图什么福，动机目的。"},{"en":"mould","ipa":"/məʊld/","zh":"n. 模具；霉 v. 塑造","ex":"Teachers mould students' habits in the early years.","exZh":"教师在学生早期阶段塑造其习惯。","memo":"模的：照模子塑形，塑造；受潮长霉即霉。"},{"en":"mount","ipa":"/maʊnt/","zh":"v. 攀登；增加 n. 山","ex":"Costs are mounting as the project runs behind schedule.","exZh":"项目进度落后，成本不断攀升。","memo":"猛踏：猛地往山上踏，攀登；数字猛踏上升。"},{"en":"microscopic","ipa":"/ˌmaɪkrəˈskɒpɪk/","zh":"adj. 极小的；显微镜下的","ex":"The pond water contains microscopic creatures invisible to us.","exZh":"池塘水中含有我们看不见的微小生物。","memo":"microscope显微镜+ic：显微镜才看得见，极小。"},{"en":"multinational","ipa":"/ˌmʌltiˈnæʃnəl/","zh":"adj. 跨国的 n. 跨国公司","ex":"The multinational company opened new factories in three countries.","exZh":"这家跨国公司在三个国家开设了新工厂。","memo":"multi多+nation国：多国经营的，跨国。"},{"en":"muscle","ipa":"/ˈmʌsl/","zh":"n. 肌肉","ex":"Swimming builds strength in almost every major muscle group.","exZh":"游泳几乎锻炼每一处主要肌肉群。","memo":"马瘦：练完马都壮实了，肌肉饱满。"}, ected for decades.","exZh":"这座老桥已被忽视了几十年。","memo":"ne不+lect选：不被选中理会，忽视。"},{"en":"neighbourhood","ipa":"/ˈneɪbəhʊd/","zh":"n. 街区；邻近地区","ex":"The new riverside park transformed the whole neighbourhood.","exZh":"新的河滨公园改变了整个街区。","memo":"neighbour邻居+hood：邻居扎堆的地方，街区。"},{"en":"nerve","ipa":"/nɜːv/","zh":"n. 神经；勇气","ex":"It took a lot of nerve to admit the mistake.","exZh":"承认错误需要很大的勇气。","memo":"奶丝：神经像奶丝细又敏感，还得有胆。"},{"en":"network","ipa":"/ˈnetwɜːk/","zh":"n. 网络；关系网","ex":"The high-speed railway network connects all major cities.","exZh":"高速铁路网连接所有大城市。","memo":"net网+work运作：网状运作的系统，网络。"},{"en":"neutral","ipa":"/ˈnjuːtrəl/","zh":"adj. 中立的；中性的","ex":"Switzerland remained officially neutral during both world wars.","exZh":"瑞士在两次世界大战期间都保持官方中立。","memo":"new tyre：不偏不磨的新胎，中立。"},{"en":"nevertheless","ipa":"/ˌnevəðəˈles/","zh":"adv. 然而；尽管如此","ex":"The task was hard; nevertheless, she finished it on time.","exZh":"任务艰巨，然而她按时完成了。","memo":"never the less：再难也不少干，然而照样完成。"},{"en":"newsletter","ipa":"/ˈnjuːzletə/","zh":"n. 时事通讯；简报","ex":"The school newsletter is sent to parents every month.","exZh":"学校简报每月发送给家长。","memo":"news新闻+letter信：装新闻的信，简报。"},{"en":"niche","ipa":"/niːʃ/","zh":"n. 细分市场；生态位","ex":"The shop found a profitable niche in handmade soap.","exZh":"这家店在手工皂领域找到了盈利的细分市场。","memo":"捏拾：捏住小角落拾金，利基市场。"},{"en":"noble","ipa":"/ˈnəʊbl/","zh":"adj. 高尚的；贵族的","ex":"She made a noble sacrifice for the community.","exZh":"她为社区做出了高尚的牺牲。","memo":"诺宝：一诺千金的人是宝，高尚贵族。"},{"en":"nominate","ipa":"/ˈnɒmɪneɪt/","zh":"v. 提名；任命","ex":"The teacher nominated her best student for the award.","exZh":"老师提名她最优秀的学生参加评奖。","memo":"nomin名+ate：把名字报上去，提名。"},{"en":"norm","ipa":"/nɔːm/","zh":"n. 准则；常态","ex":"Working from home has become the new norm.","exZh":"居家办公已成为新常态。","memo":"normal的爹：normal由它生出，规范常态。"},{"en":"notorious","ipa":"/nəʊˈtɔːriəs/","zh":"adj. 臭名昭著的；声名狼藉的","ex":"The area is notorious for heavy traffic jams.","exZh":"该地区因严重堵车而出了名的糟糕。","memo":"no淘睿死：不淘气谁骂你？出名没好事，臭名远扬。"},{"en":"notion","ipa":"/ˈnəʊʃn/","zh":"n

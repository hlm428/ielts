类双方均衡；新增 burnout 代价与「贫困毁掉幸福感」的反向论证；结尾把热情变成 plan rather than gamble 是高分表达；词汇：a steady salary / burnout / financial anxiety。"},{"no":18,"type":"Task 2","q":"Working from home is beneficial for both employees and employers. To what extent do you agree or disagree?","qZh":"在家办公对员工和雇主都有好处。你在多大程度上同意或不同意？","essay":"Since the pandemic, remote working has become a permanent feature of many industries, and some claim that it benefits both staff and companies. I largely agree, though the arrangement works better for some jobs than others. For employees, the advantages are obvious. Working from home removes long and exhausting commutes, saves transport costs and gives people flexible hours to care for children or exercise. Many workers also concentrate better away from noisy offices, so they finish more tasks in less time. A parent who no longer spends two hours on a crowded train, for instance, can use that time for family or professional development. Health often improves too, as people eat proper meals and sleep longer instead of commuting in the dark. Employers gain as well. Companies can rent smaller offices, cut electricity bills and recruit talented people from anywhere in the world instead of limiting themselves to their local area. Lower commuting and greater flexibility also reduce staff turnover, which saves recruitment costs, and several large firms report that remote teams are just as productive as office ones. Modern tools have meanwhile closed most of the gap: video calls, shared documents and project software now support cooperation that once required a shared room. However, remote work does have limits. New employees learn slower without colleagues nearby, and some creative teamwork suffers online; loneliness is a real risk for people who live alone, which is why hybrid patterns of two office days a week now dominate the debate. In conclusion, I agree that home working benefits both sides in most white-collar jobs, provided companies combine it with regular office contact and clear communication.","outline":"开头：改写题目，立场=基本同意（区分岗位）。\n员工侧：省通勤省钱、灵活顾家、专注度更高；健康改善。\n雇主侧：省租金电费、全球招聘、降低离职率。\n限制：新人成长慢、创意协作受损、孤独感。\n结论：白领岗位双赢，前提是混合办公与清晰沟通。","bandNote":"亮点：同意类立场带限定条件；新增健康改善与招聘范围全球化论证；不回避孤独与新人成长问题显客观；词汇：remote working / staff turnover / white-collar jobs。"},{"no":19,"type":"Task 2","q":"Nowadays many people change their careers several times during their working lives. Do the advantages of this trend outweigh the disadvantages?","qZh":"如今许多人在职业生涯中会数次更换职业。这一趋势的利是否大于弊？","essay":"It is increasingly common for people to abandon one profession and start another, sometimes two or three times before they retire. Although career changes involve real risks, I believe their advantages outweigh the disadvantages. The main benefit is personal growth. Moving into a new field forces people to learn fresh skills, meet new circles of colleagues and question their old assumptions, which keeps their minds active. It also protects them economically: in a fast-changing economy, workers who have reinvented themselves once adapt far more easily than those who have done one job for thirty years, because industries now rise and disappear within a single decade. Moreover, many people only discover what truly suits them through trial and error, and a mid-career switch can turn years of quiet dissatisfaction into renewed motivation. The disadvantages, however, are serious. Starting again usually means a pay cut and lower status, since employers may prefer younger candidates with relevant experience. Frequent changes can also look unstable on a CV, and pension savings may suffer when contributions pause during retraining. Family life can be strained by the uncertainty as well, although governments now fund retraining programmes precisely because they expect workers to move several times, and age is no longer the barrier it once was. On balance, I would still argue that the gains are greater, especially for people who plan the move carefully — saving first, retraining part-time and targeting growing industries. Skills are increasingly transferable, and the risk of staying in a dying industry is itself enormous. In short, a well-planned career change is an investment rather than a setback.","outline":"开头：改写题目，立场=利大于弊。\n主体段1：个人成长——新技能新圈子；适应力即经济保障；试错发现真正适合的职业。\n主体段2：弊端——降薪降职、简历显不稳定、养老金中断、家庭压力。\n结论：精心规划的转行是投资——先储蓄、在职培训、瞄准增长行业。","bandNote":"亮点：利弊类立场明确；新增「适应力即经济保障」与规划三步（储蓄/在职培训/瞄准增长行业）；词汇：transferable skills / mid-career switch / reinvent oneself。"},{"no":20,"type":"Task 2","q":"In many countries, workers suffer from stress caused by their jobs. What are the main causes of this problem, and what can employees and employers do to reduce it?","qZh":"在许多国家，劳动者承受着工作带来的压力。造成这一问题的主要原因是什么？员工和雇主可以怎样减轻压力？","essay":"Stress has become such a common part of working life that many people consider exhaustion normal. This essay will discuss why workplace stress is increasing and suggest what both employers and employees can do about it. There are two main causes. The first is excessive workload: many companies expect constant availability after office hours, so employees never truly switch off, and emails arriving at midnight keep their minds in work mode. Technology, which was supposed to save time, has instead extended the office into the living room. The second is job insecurity; in a competitive economy, workers fear redundancy and therefore accept unpaid overtime, which gradually destroys their health and family life. Stress-related illnesses such as insomnia, anxiety and heart disease are rising exactly where these pressures are strongest; burnout, once rare, is now formally recognised by the World Health Organization as an occupational phenomenon, and the human cost shows up in hospitals and divorce statistics as much as in office surveys. Fortunately, this problem can be reduced. Employers should set reasonable workloads, respect workers' free time and encourage staff to take holidays; some firms now ban after-hours emails, which has noticeably improved morale. Flexible schedules and honest annual reviews also help people feel valued rather than exploited. Employees, for their part, can protect themselves by exercising regularly, separating work from leisure and communicating honestly with managers when demands become unrealistic. In conclusion, heavy workloads and fear of losing one's job are the main sources of workplace stress, and only a joint effort — fair company policies combined with healthy personal habits — can bring it under control.","outline":"开头：改写题目，预告原因+双方对策。\n原因1：过载——下班后仍需在线，技术把办公室延伸进客厅。\n原因2：岗位不安全感——怕裁员而接受无偿加班，损害健康与家庭。\n对策（雇主）：合理工作量、尊重休息时间、禁深夜邮件、弹性排班。\n对策（员工）：规律锻炼、工作与生活分离、坦诚沟通。\n结论：公司政策+个人习惯共同努力。","bandNote":"亮点：原因+对策结构；新增「技术把办公室延伸进客厅」的时代观察与压力疾病列举；词汇：job insecurity / unpaid overtime / morale。"}];window.IELTS_DATA=window.IELTS_DATA||{};window.IELTS_DATA.WRITING=W;})();

</script>
<script>
/* 工具函数：日期、洗牌、转义等。不依赖页面，可单独测试。 */
(function () {
  "use strict";
  var U = {};

  /* 日期 → "YYYY-MM-DD"（按本地时区） */
  U.todayKey = function (d) {
    var t = d ? new Date(d) : new Date();
    if (isNaN(t.getTime())) t = new Date();
    var m = t.getMonth() + 1, day = t.getDate();
    return t.getFullYear() + "-" + (m < 10 ? "0" + m : m) + "-" + (day < 10 ? "0" + day : day);
  };

  /* "YYYY-MM-DD" + n 天 → "YYYY-MM-DD" */
  U.addDays = function (dateKey, n) {
    var p = String(dateKey).split("-");
    var t = new Date(+p[0], (+p[1]) - 1, +p[2]);
    t.setDate(t.getDate() + n);
    return U.todayKey(t);
  };

  /* b 比 a 晚几天（可为负） */
  U.diffDays = function (a, b) {
    var pa = String(a).split("-"), pb = String(b).split("-");
    var ta = new Date(+pa[0], (+pa[1]) - 1, +pa[2]);
    var tb = new Date(+pb[0], (+pb[1]) - 1, +pb[2]);
    return Math.round((tb - ta) / 86400000);
  };

  /* 洗牌（返回新数组，不改原数组） */
  U.shuffle = function (arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  };

  /* 随机取 n 个 */
  U.pick = function (arr, n) { return U.shuffle(arr).slice(0, Math.max(0, n)); };

  /* HTML 转义，防止内容里的 < > 破坏页面 */
  U.esc = function (s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  };

  U.clamp = function (x, lo, hi) { return Math.min(hi, Math.max(lo, x)); };

  /* 秒数 → 中文时长，如 3分20秒 / 1小时5分 */
  U.fmtSec = function (sec) {
    sec = Math.max(0, Math.round(sec || 0));
    var m = Math.floor(sec / 60), s = sec % 60;
    if (m >= 60) return Math.floor(m / 60) + "小时" + (m % 60 ? (m % 60) + "分" : "");
    if (m > 0) return m + "分" + (s ? s + "秒" : "");
    return s + "秒";
  };

  /* 日期 → 人话：明天 / 3 天后 / 2 周后（P3-10） */
  U.fmtRelDays = function (target, today) {
    if (!target || !today) return String(target || "");
    var d = U.diffDays(today, target);
    if (d <= 0) return "今天";
    if (d === 1) return "明天";
    if (d === 2) return "后天";
    if (d <= 7) return d + " 天后";
    if (d <= 30) return Math.round(d / 7) + " 周后";
    return d + " 天后";
  };

  /* 单词比较前先统一：去空格、转小写 */
  U.normWord = function (s) { return String(s == null ? "" : s).trim().toLowerCase(); };

  window.IELTS = window.IELTS || {};
  window.IELTS.u = U;
  /* 模块和 app 共用的命名空间提前建好（app.js 不在时模块也不会报错） */
  window.IELTS.app = window.IELTS.app || {};
  window.IELTS.app.pages = window.IELTS.app.pages || {};
})();

</script>
<script>
/* 本地存储：学习记录全存浏览器 localStorage；支持导出/导入备份、清空、词库去重合并。 */
(function () {
  "use strict";
  /* 主存储 key（v2）。老版本数据在 LEGACY_KEYS 里，启动时自动迁移过来。 */
  var KEY = window.IELTS_TEST ? "ielts_app_test_v2" : "ielts_app_v2";
  var LEGACY_KEYS = window.IELTS_TEST ? ["ielts_app_test_v1"] : ["ielts_app_v1"];
  var MIG_MARK = KEY + "_migrated_at"; /* 迁移完成时间，满 7 天后清理旧 key 用 */
  var RETAIN_DAYS = 7;
  var S = {};
  var state = null;
  var memoryOnly = false;

  function rawGet(k) {
    try { return localStorage.getItem(k); } catch (e) { memoryOnly = true; return null; }
  }
  function rawSet(k, v) {
    try { localStorage.setItem(k, v); return true; } catch (e) { memoryOnly = true; return false; }
  }
  function rawDel(k) {
    try { localStorage.removeItem(k); } catch (e) { /* 忽略 */ }
  }

  function defaults() {
    return {
      version: 1,
      settings: { dark: false, fontSize: "m", dailyNew: 10, voice: "gb" },
      words: {},            /* 已学/在学单词的 SM-2 记录，key 是小写单词 */
      wrong: {},            /* 错词本：{ 单词: { count, lastWrong, cleared } } */
      stats: { days: {} },  /* 每天学习情况：{ sec, newN, revN, right, wrong } */
      speaking: { done: {} },  /* 口语每题练过的次数 */
      writing: { essays: [], drafts: {} }, /* 写作历史与草稿 */
      plan: { examDate: "", target: "", days: {} }
    };
  }

  /* 把 src 里的值并进 dst（对象递归合并，其余直接覆盖） */
  function deepMerge(dst, src) {
    for (var k in src) {
      if (!Object.prototype.hasOwnProperty.call(src, k)) continue;
      if (src[k] && typeof src[k] === "object" && !Array.isArray(src[k]) &&
          dst[k] && typeof dst[k] === "object" && !Array.isArray(dst[k])) {
        deepMerge(dst[k], src[k]);
      } else {
        dst[k] = src[k];
      }
    }
    return dst;
  }

  /* 启动读取：
     1) 优先读新 key；解析失败（损坏）→ 回落默认值，保证一定能启动；
     2) 新 key 为空 → 依次回退读旧 key，字段补齐（deepMerge 默认结构）后
        写回新 key，并记录迁移时间；旧 key 原样保留，满 RETAIN_DAYS 天再清理。 */
  S.load = function () {
    state = defaults();
    var migAt = Number(rawGet(MIG_MARK) || 0);
    if (migAt && Date.now() - migAt > RETAIN_DAYS * 86400000) {
      LEGACY_KEYS.forEach(rawDel);
      rawDel(MIG_MARK);
    }

    var raw = rawGet(KEY);
    if (raw) {
      try {
        var parsed = JSON.parse(raw);
        if (parsed && typeof parsed === "object") deepMerge(state, parsed);
      } catch (e) {
        state = defaults(); /* 数据损坏：回落默认值，正常启动 */
      }
      return state;
    }

    for (var i = 0; i < LEGACY_KEYS.length; i++) {
      var old = rawGet(LEGACY_KEYS[i]);
      if (!old) continue;
      try {
        var parsedOld = JSON.parse(old);
        if (parsedOld && typeof parsedOld === "object") {
          deepMerge(state, parsedOld);
          if (rawSet(KEY, JSON.stringify(state))) rawSet(MIG_MARK, String(Date.now()));
          break; /* 迁移成功，停止尝试 */
        }
      } catch (e) {
        state = defaults(); /* 旧数据损坏：丢弃这份，继续尝试更旧的 */
        continue;
      }
    }
    return state;
  };

  /* localStorage 真实可用性探测（无痕/预览模式可能不可用） */
  S.probe = function () {
    var probeKey = KEY + "_probe";
    if (!rawSet(probeKey, "1")) return false;
    var ok = rawGet(probeKey) === "1";
    rawDel(probeKey);
    return ok;
  };
  S.isMemoryOnly = function () { return memoryOnly; };

  function persist() {
    if (memoryOnly) return;
    rawSet(KEY, JSON.stringify(state)); /* 写不进时 rawSet 会置 memoryOnly */
  }

  S.get = function () { return state; };
  S.save = persist;

  /* 导出备份：一段 JSON 文本，可存成 .json 文件 */
  S.exportJson = function () {
    return JSON.stringify({
      app: "ielts-app",
      version: 1,
      exportedAt: window.IELTS.u.todayKey(),
      state: state
    }, null, 1);
  };

  /* 导入备份：校验通过后整体替换。
     成功返回 {ok:true, counts:{words,wrong,speaking,essays}}（恢复报告）；
     失败返回 {ok:false, error:"指明具体字段的原因"}。 */
  S.importJson = function (text) {
    var data;
    try { data = JSON.parse(text); }
    catch (e) { return { ok: false, error: "文件内容读不出来：不是有效的 JSON 文本，可能复制时缺了开头或结尾" }; }
    if (!data || typeof data !== "object" || Array.isArray(data)) {
      return { ok: false, error: "备份根结构不对：应该是一个对象（{...}），读到的却是别的" };
    }
    var st = (data.state && typeof data.state === "object") ? data.state : data;
    if (!st || typeof st !== "object") return { ok: false, error: "缺少 state 字段：备份里找不到数据本体" };
    if (!st.words || typeof st.words !== "object" || Array.isArray(st.words)) {
      return { ok: false, error: "缺少单词学习记录（字段 words）：这不像本应用导出的备份" };
    }
    if (!st.stats || typeof st.stats !== "object") {
      return { ok: false, error: "缺少学习统计（字段 stats）：这不像本应用导出的备份" };
    }
    if (st.settings && typeof st.settings !== "object") {
      return { ok: false, error: "设置字段（settings）不是对象：文件可能被改坏过" };
    }
    if (st.writing && (!Array.isArray(st.writing.essays))) {
      return { ok: false, error: "写作历史（writing.essays）不是列表：文件可能被改坏过" };
    }
    var fresh = defaults();
    deepMerge(fresh, st);
    state = fresh;
    persist();
    var wrongN = 0, k;
    for (k in state.wrong) if (state.wrong[k] && !state.wrong[k].cleared) wrongN++;
    return {
      ok: true,
      counts: {
        words: Object.keys(state.words).length,
        wrong: wrongN,
        speaking: Object.keys(state.speaking.done).length,
        essays: state.writing.essays.length
      }
    };
  };

  /* 清空所有数据（含旧版本残留与迁移标记） */
  S.clearAll = function () {
    rawDel(KEY);
    LEGACY_KEYS.forEach(rawDel);
    rawDel(MIG_MARK);
    state = defaults();
    persist();
  };

  /* 词库合并去重：同一个小写单词只留先出现的那个。
     返回 { list: 去重后的完整列表, added: 新增几个, dup: 重复几个 } */
  S.mergeVocab = function (existing, incoming) {
    var seen = {}, out = [], dup = 0;
    (existing || []).forEach(function (w) {
      var k = String(w && w.en || "").trim().toLowerCase();
      if (!k) return;
      if (seen[k]) { dup++; return; }
      seen[k] = 1; out.push(w);
    });
    var added = 0;
    (incoming || []).forEach(function (w) {
      var k = String(w && w.en || "").trim().toLowerCase();
      if (!k) return;
      if (seen[k]) { dup++; return; }
      seen[k] = 1; out.push(w); added++;
    });
    return { list: out, added: added, dup: dup };
  };

  window.IELTS = window.IELTS || {};
  window.IELTS.store = S;
})();

</script>
<script>
/* 间隔重复算法（SM-2 简化版）：答得好隔得久，答错明天再来。
   日期统一用 "YYYY-MM-DD" 字符串，可直接比大小。 */
(function () {
  "use strict";
  var u = function () { return window.IELTS.u; };
  var R = {};

  /* 一张新卡的初始状态 */
  R.newCard = function (todayKey) {
    return { ef: 2.5, ivl: 0, rep: 0, due: todayKey, right: 0, wrong: 0, added: todayKey, last: "" };
  };

  /* 打分 q：0~5。5=轻松答对 4=答对 3=答对但很勉强 0~2=答错/想不起来。
     返回新的记录（不改原卡）。 */
  R.schedule = function (card, q, todayKey) {
    var c = {}, k;
    for (k in card) c[k] = card[k];
    q = Math.round(Math.max(0, Math.min(5, q)));

    /* 难易度调整（标准 SM-2 公式） */
    c.ef = Math.max(1.3, c.ef + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02)));

    if (q < 3) {
      /* 没记住：明天重来，间隔清零 */
      c.rep = 0;
      c.ivl = 1;
      c.wrong = (c.wrong || 0) + 1;
    } else {
      c.rep = (c.rep || 0) + 1;
      c.right = (c.right || 0) + 1;
      if (c.rep === 1) c.ivl = 1;
      else if (c.rep === 2) c.ivl = 6;
      else c.ivl = Math.round((c.ivl || 1) * c.ef);
    }
    c.ivl = Math.max(1, Math.round(c.ivl));
    c.due = u().addDays(todayKey, c.ivl);
    c.last = todayKey;
    return c;
  };

  /* 是否今天该复习。"YYYY-MM-DD" 字符串可直接比较。
     两种情况到期：正常答对进入复习节奏的（rep>0）；
     答错回炉的（rep=0 但 wrong>0）——留在复习轮里直到答对。 */
  R.isDue = function (card, todayKey) {
    if (!card || !card.due || card.due > todayKey) return false;
    return !!(card.rep > 0 || card.wrong > 0);
  };

  /* 统一统计口径（P1-4）：全站所有"已学/在学/掌握"数字必须出自这一个函数。
     learned  已学   = rep>=1，至少答对过一次（进入正常复习节奏）
     learning 在学   = 接触过但 rep=0（如答错的词，还没答对过）
     mastered 掌握   = rep>=3（learned 的子集）
     touched        = 接触过的词总数（learned+learning） */
  R.wordCounts = function (recMap) {
    var learned = 0, learning = 0, mastered = 0, k, r;
    for (k in recMap) {
      r = recMap[k];
      if (!r) continue;
      var rep = r.rep || 0;
      if (rep >= 3) { learned++; mastered++; }
      else if (rep >= 1) learned++;
      else learning++;
    }
    return { learned: learned, learning: learning, mastered: mastered, touched: learned + learning };
  };

  /* 从词库里挑今天到期的复习词（到期早的先来） */
  R.pickReview = function (wordList, recMap, todayKey, n) {
    var out = [];
    for (var i = 0; i < wordList.length; i++) {
      var w = wordList[i], rec = recMap[w.en.toLowerCase()];
      if (R.isDue(rec, todayKey)) out.push(w);
    }
    out.sort(function (a, b) {
      var da = recMap[a.en.toLowerCase()].due, db = recMap[b.en.toLowerCase()].due;
      if (da !== db) return da < db ? -1 : 1;
      return 0;
    });
    return n == null ? out : out.slice(0, n);
  };

  /* 按词库顺序挑 n 个没学过的新词 */
  R.pickNew = function (wordList, recMap, n) {
    var out = [];
    for (var i = 0; i < wordList.length && out.length < n; i++) {
      if (!recMap[wordList[i].en.toLowerCase()]) out.push(wordList[i]);
    }
    return out;
  };

  window.IELTS = window.IELTS || {};
  window.IELTS.srs = R;
})();

</script>
<script>
/* 学习统计：每天学了多久、连续打卡天数、最近 7 天柱状图数据。 */
(function () {
  "use strict";
  var T = {};

  /* 累加某天的学习秒数和次数（counts 可带 newN/revN/right/wrong） */
  T.addStudy = function (state, dateKey, sec, counts) {
    var d = state.stats.days[dateKey];
    if (!d) d = state.stats.days[dateKey] = { sec: 0, newN: 0, revN: 0, right: 0, wrong: 0 };
    d.sec = (d.sec || 0) + Math.max(0, Math.round(sec || 0));
    if (counts) {
      ["newN", "revN", "right", "wrong"].forEach(function (k) {
        if (counts[k]) d[k] = (d[k] || 0) + counts[k];
      });
    }
  };

  /* 这天算不算"学了"：有学习时长，或当天的学习计划全部打勾 */
  T.isActiveDay = function (state, dateKey) {
    var d = state.stats.days[dateKey];
    if (d && (d.sec > 0 || d.right > 0)) return true;
    var p = state.plan.days[dateKey];
    if (p && p.tasks && p.tasks.length > 0) {
      for (var i = 0; i < p.tasks.length; i++) if (!p.tasks[i].done) return false;
      return true;
    }
    return false;
  };

  /* 连续打卡天数：从今天（或昨天，若今天还没学）往前数连续活跃天 */
  T.streak = function (state, todayKey) {
    var n = 0, cur = todayKey;
    if (!T.isActiveDay(state, cur)) cur = window.IELTS.u.addDays(cur, -1);
    while (T.isActiveDay(state, cur)) {
      n++;
      cur = window.IELTS.u.addDays(cur, -1);
    }
    return n;
  };

  /* 最近 7 天（含今天）的学习秒数，柱状图用（按秒，不足 1 分钟也能画） */
  T.weekBars = function (state, todayKey) {
    var out = [], i, k, d;
    for (i = 6; i >= 0; i--) {
      k = window.IELTS.u.addDays(todayKey, -i);
      d = state.stats.days[k];
      out.push({ date: k, sec: d ? (d.sec || 0) : 0 });
    }
    return out;
  };

  /* 是否该提醒备份（P1-2）：有学习记录且从未备份，或距上次备份超过 7 天 */
  T.backupDue = function (state, todayKey) {
    if (!state.words || Object.keys(state.words).length === 0) return false;
    var last = state.settings.lastBackupAt;
    if (!last) return true;
    return window.IELTS.u.diffDays(last, todayKey) > 7;
  };

  window.IELTS = window.IELTS || {};
  window.IELTS.stats = T;
})();

</script>
<script>
/* 朗读：用浏览器自带的英文朗读，英音优先。 */
(function () {
  "use strict";
  var T = { voice: null, ok: false };

  function pickVoice() {
    try {
      var vs = window.speechSynthesis.getVoices() || [];
      if (!vs.length) return;
      /* 口音偏好：settings.voice（gb=英音 默认 / us=美音），设置页可切换 */
      var pref = "gb";
      try {
        var st = window.IELTS.store.get();
        if (st && st.settings && st.settings.voice) pref = st.settings.voice;
      } catch (e) { /* storage 未就绪时用默认 */ }
      var re = pref === "us" ? /^en[-_]US/i : /en[-_]GB/i;
      var v = null, i;
      for (i = 0; i < vs.length; i++) if (re.test(vs[i].lang)) { v = vs[i]; break; }
      if (!v) for (i = 0; i < vs.length; i++) if (/^en/i.test(vs[i].lang)) { v = vs[i]; break; }
      if (!v) v = vs[0];
      T.voice = v;
      T.ok = true;
    } catch (e) { T.ok = false; }
  }

  T.pickVoice = pickVoice;

  T.speak = function (text, slow) {
    try {
      if (!window.speechSynthesis) return false;
      if (!T.voice) pickVoice();
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(String(text || ""));
      u.lang = (T.voice && T.voice.lang) || "en-GB";
      if (T.voice) u.voice = T.voice;
      u.rate = slow ? 0.6 : 0.95;
      window.speechSynthesis.speak(u);
      return true;
    } catch (e) { return false; }
  };

  T.hasTTS = function () { return !!window.speechSynthesis; };

  if (window.speechSynthesis) {
    pickVoice();
    window.speechSynthesis.onvoiceschanged = pickVoice;
  }

  window.IELTS = window.IELTS || {};
  window.IELTS.tts = T;
})();

</script>
<script>
/* 写作本地检查：字数、重复用词、句子长度、连接词。纯函数，可自动测试。 */
(function () {
  "use strict";
  var W = {};

  /* 常见功能词（不算"用词"），重复检查时忽略 */
  var STOP = {};
  ("the,a,an,and,or,but,if,then,so,than,too,also,just,very,more,most,some,any,no," +
   "of,to,in,on,at,by,for,with,from,about,as,into,over,after,before,between,out,up,down,off," +
   "is,are,was,were,be,been,being,am,do,does,did,doing,have,has,had,having," +
   "will,would,shall,should,can,could,may,might,must," +
   "i,you,he,she,it,we,they,me,him,her,us,them,my,your,his,its,our,their," +
   "this,that,these,those,there,here,what,which,who,whom,when,where,why,how," +
   "not,nor,both,each,such,own,same,other,another,all,one,two,three,first,second," +
   "people,person,thing,things,way,ways,lot,lots").split(",").forEach(function (w) { STOP[w] = 1; });

  /* 常见连接词（分组） */
  var CONNECTORS = {
    递进: ["furthermore", "moreover", "in addition", "besides", "what is more", "additionally"],
    转折: ["however", "although", "while", "whereas", "nevertheless", "on the other hand", "in contrast", "despite", "in spite of"],
    因果: ["because", "since", "as a result", "therefore", "consequently", "thus", "due to", "owing to", "hence", "lead to"],
    举例: ["for example", "for instance", "such as", "namely", "a good illustration"],
    顺序: ["firstly", "secondly", "thirdly", "finally", "first of all", "lastly", "to begin with"],
    总结: ["in conclusion", "to sum up", "in summary", "overall", "all in all"],
    让步: ["admittedly", "even though", "granted that", "granted", "it is true that"]
  };

  W.STOPWORDS = STOP;
  W.CONNECTORS = CONNECTORS;

  /* 英文词数：按空白切分，含字母或数字的才算词 */
  W.wordCount = function (text) {
    var m = String(text || "").match(/[A-Za-z0-9'’-]+/g);
    return m ? m.length : 0;
  };

  /* 切句：按 . ! ? 结尾切（连续标点算一句；不用正则前瞻，兼容老手机浏览器） */
  W.sentences = function (text) {
    var s = String(text || "").replace(/\s+/g, " ");
    var out = [], cur = "", i, ch;
    for (i = 0; i < s.length; i++) {
      ch = s.charAt(i);
      cur += ch;
      if (".!?".indexOf(ch) >= 0) {
        while (i + 1 < s.length && ".!?".indexOf(s.charAt(i + 1)) >= 0) {
          cur += s.charAt(++i);
        }
        out.push(cur.trim());
        cur = "";
      }
    }
    if (cur.trim()) out.push(cur.trim());
    return out.filter(function (x) { return W.wordCount(x) >= 2; });
  };

  /* 句子统计：句数、平均/最长/最短句长（词数）、超长句（>40词）下标 */
  W.sentenceStats = function (text) {
    var ss = W.sentences(text);
    var lens = ss.map(function (s) { return W.wordCount(s); });
    var sum = lens.reduce(function (a, b) { return a + b; }, 0);
    var stats = {
      count: ss.length,
      avg: ss.length ? Math.round((sum / ss.length) * 10) / 10 : 0,
      max: lens.length ? Math.max.apply(null, lens) : 0,
      min: lens.length ? Math.min.apply(null, lens) : 0,
      longOnes: []
    };
    ss.forEach(function (s, i) {
      if (lens[i] > 40) stats.longOnes.push({ idx: i + 1, words: lens[i], text: s.slice(0, 60) + "…" });
    });
    return stats;
  };

  /* 重复用词：非停用词中出现次数最多的 topN 个 */
  W.repeatCheck = function (text, topN) {
    topN = topN || 5;
    var words = String(text || "").toLowerCase().match(/[a-z'’-]+/g) || [];
    var freq = {};
    words.forEach(function (w) {
      if (!STOP[w] && w.length >= 4) freq[w] = (freq[w] || 0) + 1;
    });
    var list = [];
    for (var k in freq) list.push({ word: k, count: freq[k] });
    list.sort(function (a, b) { return b.count - a.count; });
    /* 只报出现 3 次及以上的 */
    return list.filter(function (x) { return x.count >= 3; }).slice(0, topN);
  };

  /* 连接词扫描：found 是文中出现的（含分组），missing 是没用到但推荐的 */
  W.connectorScan = function (text) {
    var low = String(text || "").toLowerCase();
    var found = {}, missing = {}, foundCount = 0, missingCount = 0;
    for (var g in CONNECTORS) {
      found[g] = [];
      missing[g] = [];
      CONNECTORS[g].forEach(function (c) {
        if (low.indexOf(c) >= 0) found[g].push(c);
        else missing[g].push(c);
      });
      if (found[g].length) foundCount++;
      if (found[g].length === 0) missingCount++;
      if (!missing[g].length) delete missing[g];
      if (!found[g].length) delete found[g];
    }
    return { found: found, missing: missing, foundGroups: foundCount, missingGroups: missingCount };
  };

  /* 综合报告 type: "Task 1"(目标150) | "Task 2"(目标250) */
  W.check = function (text, type) {
    var target = type === "Task 2" ? 250 : 150;
    var words = W.wordCount(text);
    var sent = W.sentenceStats(text);
    var conn = W.connectorScan(text);
    var repeats = W.repeatCheck(text, 5);

    var tips = [];
    if (words < target) tips.push("字数还差 " + (target - words) + " 词，至少写满 " + target + " 词。");
    else if (words > target * 1.8) tips.push("写得太长啦（" + words + " 词），考场时间可能不够，练练精炼。");
    else tips.push("字数达标（" + words + " 词 ≥ " + target + " 词），棒！");

    if (sent.count >= 3) {
      if (sent.avg < 8) tips.push("平均每句只有 " + sent.avg + " 个词，句子有点碎，试着用连接词把两句合成一句。");
      else if (sent.avg > 28) tips.push("平均每句 " + sent.avg + " 个词，句子太长容易出错，试着拆开。");
      else tips.push("句子长短适中（平均 " + sent.avg + " 词/句）。");
      if (sent.longOnes.length) {
        tips.push("有 " + sent.longOnes.length + " 个句子超过 40 词，建议拆分（第 " +
          sent.longOnes.map(function (x) { return x.idx; }).join("、") + " 句）。");
      }
    } else {
      tips.push("句子太少，一篇文章一般要有 10 句以上。");
    }

    if (repeats.length) {
      tips.push("这些词用得太频繁：" + repeats.map(function (x) {
        return x.word + "×" + x.count;
      }).join("、") + "。查查同义替换，比如 important → crucial / vital。");
    } else {
      tips.push("没有明显重复用词，词汇丰富度不错。");
    }

    if (conn.foundGroups === 0) {
      tips.push("一个连接词都没用到！写作要有 however、for example、therefore 这类词，逻辑才清楚。");
    } else if (conn.missingGroups >= 4) {
      tips.push("用到了 " + conn.foundGroups + " 类连接词，建议再补上这些类型的：" +
        Object.keys(conn.missing).slice(0, 3).join("、") + "。");
    } else {
      tips.push("连接词用了 " + conn.foundGroups + " 类，类型覆盖不错。");
    }

    return {
      type: type, target: target, words: words,
      wordsOk: words >= target,
      sentences: sent,
      repeats: repeats,
      connectors: conn,
      tips: tips
    };
  };

  window.IELTS = window.IELTS || {};
  window.IELTS.wcheck = W;
})();

</script>
<script>
/* 模块1：首页仪表盘 —— 今天要背/要复习的词、连续打卡、每周学习时长柱状图。
   纯数据部分放在 IELTS.dash 里方便自动测试，页面只管把数据画出来。 */
(function () {
  "use strict";
  var P = window.IELTS.app.pages = window.IELTS.app.pages || {};
  var core = function () { return window.IELTS; };
  var D = {};

  /* 今日概览数据（纯函数，可测试） */
  D.overview = function (state, todayKey) {
    var c = core();
    var vocab = window.IELTS_DATA.VOCAB;
    var recs = state.words;
    var quota = Math.max(0, state.settings.dailyNew || 0);
    var doneNew = (state.stats.days[todayKey] && state.stats.days[todayKey].newN) || 0;
    var newLeft = Math.max(0, quota - doneNew);
    /* 词库学完了就没新词可挑 */
    var unlearned = 0, k;
    for (k = 0; k < vocab.length; k++) if (!recs[vocab[k].en.toLowerCase()]) unlearned++;
    var newTodo = Math.min(newLeft, unlearned);
    var review = c.srs.pickReview(vocab, recs, todayKey).length;
    var day = state.stats.days[todayKey];
    var wc = c.srs.wordCounts(recs); /* 统一口径（P1-4）：三处数字同源 */
    return {
      quota: quota,
      newDone: doneNew,
      newTodo: newTodo,
      review: review,
      streak: c.stats.streak(state, todayKey),
      secToday: day ? (day.sec || 0) : 0, /* 按秒记录（反馈七-2） */
      learned: wc.learned,
      learning: wc.learning,
      mastered: wc.mastered,
      touched: wc.touched,
      totalWords: vocab.length,
      backupDue: c.stats.backupDue(state, todayKey),
      daysToExam: state.plan.examDate ? c.u.diffDays(todayKey, state.plan.examDate) : null
    };
  };

  window.IELTS = window.IELTS || {};
  window.IELTS.dash = D;

  P.home = {
    render: function (el) {
      var c = core(), st = c.store.get(), today = c.u.todayKey();
      var o = D.overview(st, today);
      var bars = c.stats.weekBars(st, today);
      var maxSec = Math.max.apply(null, bars.map(function (b) { return b.sec; }).concat([1]));

      var greeting = (function () {
        var h = new Date().getHours();
        if (h < 5) return "夜深了，早点休息 🌙";
        if (h < 11) return "早上好，开始今天的学习吧 ☀️";
        if (h < 14) return "中午好，背几个词提提神 🍀";
        if (h < 18) return "下午好，练练口语和写作 💪";
        return "晚上好，今天学完了吗？🌆";
      })();

      var examHtml = "";
      if (o.daysToExam !== null && o.daysToExam >= 0) {
        examHtml = '<div class="card"><div style="display:flex;align-items:center;gap:.7rem">' +
          '<span style="font-size:1.6rem">🎯</span><div class="grow">' +
          '<div class="t">距离考试还有 <b style="color:var(--brand);font-size:1.3rem">' + o.daysToExam + '</b> 天</div>' +
          '<div class="sub muted small">考试日期：' + c.u.esc(st.plan.examDate) +
          (st.plan.target ? ' · 目标分 ' + c.u.esc(st.plan.target) : '') + '</div></div></div></div>';
      } else if (o.daysToExam !== null) {
        examHtml = '<div class="card"><b>🎉 考试日期已过（' + c.u.esc(st.plan.examDate) + '）。</b>' +
          '<div class="muted small">想重新规划，去「学习计划」里改日期。</div></div>';
      } else {
        examHtml = '<div class="card"><b>还没有制定学习计划。</b>' +
          '<div class="muted small">到「学习计划」里填上考试日期和目标分，每天该学多少就自动帮你排好。</div>' +
          '<div style="margin-top:.6rem"><button class="btn ghost small" id="goPlan1">去制定计划</button></div></div>';
      }

      var barHtml = bars.map(function (b, i) {
        var h = Math.round((b.sec / maxSec) * 100);
        var isToday = i === bars.length - 1;
        var label = b.date.slice(5).replace("-", "/");
        return '<div class="bar-wrap">' +
          '<div class="bar-val">' + (b.sec ? c.u.fmtSec(b.sec) : "") + '</div>' +
          '<div class="bar' + (isToday ? " today" : "") + '" style="height:' + Math.max(3, h) + '%"></div>' +
          '<div class="bar-lbl">' + label + '</div></div>';
      }).join("");

      el.innerHTML =
        (o.backupDue
          ? '<div class="card" style="border:2px solid var(--warn);display:flex;align-items:center;gap:.7rem">' +
            '<span style="font-size:1.4rem">⏰</span><div class="grow"><b style="color:var(--warn)">学习数据超过 7 天没备份了</b>' +
            '<div class="muted small">浏览器清缓存或换设备就全没了，花 10 秒导出一份保险。</div></div>' +
            '<button class="btn small" id="backupNow">去备份</button></div>'
          : '') +
        '<div class="card"><b>' + greeting + '</b>' +
        '<div class="muted small" style="margin-top:.2rem">已学 ' + o.learned + ' · 在学 ' + o.learning +
        ' · 掌握 ' + o.mastered + '（共 ' + o.totalWords + ' 词）' +
        (o.secToday ? ' · 今天已学 ' + c.u.fmtSec(o.secToday) : '') + '</div>' +
        '<div class="muted small" style="font-size:.75rem;margin-top:.15rem">已学＝答对过至少 1 次；在学＝接触过但还没答对；掌握＝连续答对 3 轮进入长间隔复习</div>' +
        '<div class="progress" style="margin-top:.6rem"><div style="width:' +
        Math.round((o.touched / o.totalWords) * 100) + '%"></div></div></div>' +

        examHtml +

        '<div class="grid3">' +
        '<div class="stat' + (o.newTodo ? "" : " ok") + '"><div class="num">' + o.newTodo + '</div><div class="lbl">今天还要背新词</div></div>' +
        '<div class="stat' + (o.review ? " warn" : " ok") + '"><div class="num">' + o.review + '</div><div class="lbl">今天要复习的词</div></div>' +
        '<div class="stat ok"><div class="num">' + o.streak + '</div><div class="lbl">连续打卡（天）</div></div>' +
        '</div>' +

        '<div style="height:.7rem"></div>' +
        '<button class="btn block" id="goVocab1" style="font-size:1.15rem;padding:1rem;box-shadow:var(--shadow)">📇 开始背单词</button>' +
        '<div style="display:flex;gap:.6rem;margin-top:.7rem">' +
        '<button class="btn ghost" style="flex:1;padding:.95rem;font-size:1.02rem" id="goSpeak1">🎙️ 练口语</button>' +
        '<button class="btn ghost" style="flex:1;padding:.95rem;font-size:1.02rem" id="goWrite1">✍️ 练写作</button></div>' +

        '<div class="card" style="margin-top:.9rem"><h2>最近 7 天学习时长</h2>' +
        '<div class="bars">' + barHtml + '</div>' +
        (bars.some(function (b) { return b.sec; })
          ? ''
          : (o.secToday
            ? '<div class="empty">今天已学习 ' + o.secToday + ' 秒——再学 ' + (60 - o.secToday) + ' 秒，图上就会亮起第一根柱子 🌱</div>'
            : '<div class="empty">🌱 这里还是空的——背几个词，这张图就有内容啦</div>')) +
        '</div>' +

        '<div class="muted small" style="text-align:center;padding:.2rem 0 1rem">🔒 数据只保存在这台设备的浏览器里，不会上传到任何地方；换设备前请先在「设置」里导出备份' +
        (o.backupDue ? ' · <b style="color:var(--warn)">超过 7 天未备份</b>' : '') + '</div>';

      var bn = el.querySelector("#backupNow");
      if (bn) bn.onclick = function () { location.hash = "set"; };

      el.querySelector("#goVocab1").onclick = function () { location.hash = "vocab"; };
      el.querySelector("#goSpeak1").onclick = function () { location.hash = "speak"; };
      el.querySelector("#goWrite1").onclick = function () { location.hash = "write"; };
      var g = el.querySelector("#goPlan1");
      if (g) g.onclick = function () { location.hash = "plan"; };
    }
  };
})();

</script>
<script>
/* 模块2：背单词 —— SM-2 安排复习；三种模式；错词本。
   纯逻辑（出题/判定/记分）放在 IELTS.vocab 里方便自动测试，页面只管画。 */
(function () {
  "use strict";
  var P = window.IELTS.app.pages;
  var V = {};

  var MODES = {
    card: "翻卡学习 → 自测认识",
    zh2en: "看中文 → 选英文",
    en2zh: "看英文 → 选中文",
    spell: "听发音 → 拼写"
  };

  function core() { return window.IELTS; }
  function vocabAll() { return window.IELTS_DATA.VOCAB; }

  /* ---------- 纯逻辑 ---------- */

  /* 生成选择题选项：正确答案 + n-1 个不重复的干扰项（随机抽样，不做全池洗牌） */
  V.makeOptions = function (word, vocab, field, n) {
    n = n || 4;
    var correct = word[field];
    var opts = [correct];
    var guard = 0;
    while (opts.length < n && guard++ < 200) {
      var cand = vocab[(Math.random() * vocab.length) | 0][field];
      if (cand && opts.indexOf(cand) < 0) opts.push(cand);
    }
    /* 小词库兜底：顺序补齐 */
    if (opts.length < n) {
      for (var i = 0; i < vocab.length && opts.length < n; i++) {
        var f2 = vocab[i][field];
        if (f2 && opts.indexOf(f2) < 0) opts.push(f2);
      }
    }
    return core().u.shuffle(opts);
  };

  /* 听写检查：忽略大小写和首尾空格 */
  V.checkSpell = function (input, answer) {
    return core().u.normWord(input) === core().u.normWord(answer);
  };

  /* 听写提示：首字母 + 字母数，如 a _ _ _ _ _ _（7 个字母） */
  V.spellHint = function (word) {
    var w = word.en;
    return w.charAt(0).toUpperCase() + " " + "_ ".repeat(w.length - 1) + "（共 " + w.length + " 个字母）";
  };

  /* 构造一场学习：
     pool="normal"：今天到期的复习词 + 每日额度内的新词；
     pool="wrong"：错词本里还没清掉的词。
     mode：card / zh2en / en2zh / spell / mix（每题随机四选一）
     card：翻卡学习——正面只有单词和音标，用户自测后点"认识/不认识"记分；
     zh2en：题干=中文释义，选项=英文单词，answer=英文；
     en2zh：题干=英文单词（带音标/发音），选项=中文释义，answer=中文。 */
  V.buildSession = function (state, todayKey, mode, pool) {
    mode = mode || "mix";
    pool = pool || "normal";
    var srs = core().srs, u = core().u;
    var all = vocabAll();
    var words = [], kindList = [];

    if (pool === "wrong") {
      var k;
      for (k in state.wrong) {
        if (state.wrong[k] && !state.wrong[k].cleared) {
          var w = V.findWord(k);
          if (w) { words.push(w); kindList.push("wrong"); }
        }
      }
      /* 词和类型必须同步打乱，用同一组索引 */
      var order = u.shuffle(words.map(function (_, idx) { return idx; }));
      words = order.map(function (idx) { return words[idx]; });
      kindList = order.map(function (idx) { return kindList[idx]; });
    } else {
      var reviews = srs.pickReview(all, state.words, todayKey);
      var doneNew = (state.stats.days[todayKey] && state.stats.days[todayKey].newN) || 0;
      var quota = Math.max(0, (state.settings.dailyNew || 0) - doneNew);
      var fresh = srs.pickNew(all, state.words, quota);
      var i;
      for (i = 0; i < reviews.length; i++) { words.push(reviews[i]); kindList.push("review"); }
      for (i = 0; i < fresh.length; i++) { words.push(fresh[i]); kindList.push("new"); }
      /* 复习在前、新词在后，各自内部随机 */
      var revIdx = [], newIdx = [];
      for (i = 0; i < words.length; i++) (kindList[i] === "review" ? revIdx : newIdx).push(i);
      var order = u.shuffle(revIdx).concat(u.shuffle(newIdx));
      words = order.map(function (idx) { return words[idx]; });
      kindList = order.map(function (idx) { return kindList[idx]; });
    }

    var items = words.map(function (w, i) {
      var m = (mode === "mix") ? u.pick(["card", "zh2en", "en2zh", "spell"], 1)[0] : mode;
      /* 不支持朗读时，听写题自动换成看中文选英文 */
      if (m === "spell" && !core().tts.hasTTS()) m = "zh2en";
      var item = { word: w, kind: kindList[i], mode: m, hintUsed: false, options: null, answer: null };
      if (m === "card") {
        item.answer = w.en; /* 卡片模式由用户自测判定，answer 仅用于发音 */
      } else if (m === "zh2en") {
        item.options = V.makeOptions(w, all, "en", 4);
        item.answer = w.en;
      } else if (m === "en2zh") {
        item.options = V.makeOptions(w, all, "zh", 4);
        item.answer = w.zh;
      } else {
        item.answer = w.en;
      }
      return item;
    });
    return { items: items, mode: mode, pool: pool };
  };

  V.findWord = function (enKey) {
    var key = core().u.normWord(enKey);
    var all = vocabAll();
    for (var i = 0; i < all.length; i++) {
      if (all[i].en.toLowerCase() === key) return all[i];
    }
    return null;
  };

  /* 记一题：更新单词记录、错词本、统计。返回新的单词记录。 */
  V.applyAnswer = function (state, todayKey, item, correct, itemSec) {
    var key = item.word.en.toLowerCase();
    var srs = core().srs, st = core().stats;
    var rec = state.words[key] || srs.newCard(todayKey);
    var q = correct ? (item.hintUsed ? 3 : 5) : 1;
    rec = srs.schedule(rec, q, todayKey);
    state.words[key] = rec;

    var counts = {};
    /* 只有答对才算"学完一个"：答错的词留在复习轮里，不消耗当日新词额度 */
    if (correct && item.kind === "new") counts.newN = 1;
    if (correct && item.kind === "review") counts.revN = 1;
    counts[correct ? "right" : "wrong"] = 1;
    st.addStudy(state, todayKey, itemSec || 0, counts);

    if (!correct) {
      var w = state.wrong[key];
      if (!w) w = state.wrong[key] = { count: 0, lastWrong: "", cleared: false };
      w.count++;
      w.lastWrong = todayKey;
      w.cleared = false;
    } else if (rec.rep >= 3 && state.wrong[key] && !state.wrong[key].cleared) {
      state.wrong[key].cleared = true; /* 连对三次自动清出错词本 */
    }
    core().store.save();
    return rec;
  };

  V.wrongList = function (state) {
    var out = [], k;
    for (k in state.wrong) {
      if (state.wrong[k] && !state.wrong[k].cleared) {
        var w = V.findWord(k);
        if (w) out.push({ word: w, info: state.wrong[k] });
      }
    }
    out.sort(function (a, b) { return b.info.count - a.info.count; });
    return out;
  };

  window.IELTS.vocab = V;

  /* ---------- 页面 ---------- */
  var sess = null;   /* 当前会话 */
  var tab = "learn"; /* learn / wrong / prog */

  function $(sel, el) { return el.querySelector(sel); }

  P.vocab = {
    render: function (el) {
      sess = null;
      tab = "learn";
      drawMenu(el);
    }
  };

  function drawMenu(el) {
    var c = core(), st = c.store.get(), today = c.u.todayKey();
    var plan = V.buildSession(st, today, "mix", "normal");
    var reviewN = 0, newN = 0;
    plan.items.forEach(function (it) {
      if (it.kind === "new") newN++;
      else if (it.kind === "review") reviewN++;
    });
    var wrongN = V.wrongList(st).length;
    var wc = core().srs.wordCounts(st.words); /* 统一口径（P1-4） */
    var learned = wc.learned;
    var total = vocabAll().length;
    var ttsOk = core().tts.hasTTS();

    el.innerHTML =
      '<div class="card">' +
      '<div class="row" style="border:0;padding-top:0"><div class="grow">' +
      '<h2 style="margin:0">今天学什么？</h2>' +
      '<div class="sub muted">要复习 ' + reviewN + ' 个 · 要背新词 ' + newN + ' 个 · 错词本攒了 ' + wrongN + ' 个</div>' +
      '</div><span class="pill">' + learned + "/" + total + '</span></div>' +
      '<div style="margin:.7rem 0 .3rem;color:var(--muted);font-size:.88rem">选一种练法：</div>' +
      '<div class="opts" id="modeBox">' +
      '<button data-m="card">🃏 翻卡学习<span class="muted small">（先学后考，新词入门首选）</span></button>' +
      '<button data-m="en2zh">🔍 看英文 → 选中文<span class="muted small">（最轻松，先混个脸熟）</span></button>' +
      '<button data-m="zh2en">🧠 看中文 → 选英文<span class="muted small">（换个方向，记得更牢）</span></button>' +
      '<button data-m="spell">✏️ 听发音 → 拼写<span class="muted small">' +
      (ttsOk ? "（最难，但效果最好）" : "（这台浏览器不支持朗读，会自动换成「看中文选英文」）") + '</span></button>' +
      '<button data-m="mix">🎲 混合三种<span class="muted small">（不知道下一题是什么，推荐）</span></button>' +
      '</div>' +
      '<button class="btn block" id="startLearn" style="margin-top:.8rem">开始学习</button>' +
      '</div>' +
      '<div class="card"><div class="row" style="border:0"><div class="grow"><b>❌ 错词本</b>' +
      '<div class="sub muted">答错的词会自动收进来；连对 3 次自动清出</div></div>' +
      '<button class="btn small" id="goWrong">看' + wrongN + '个错词</button></div></div>' +
      '<div class="card"><b>📊 学习进度</b>' +
      '<div class="progress" style="margin:.5rem 0"><div style="width:' +
      Math.round((wc.touched / total) * 100) + '%"></div></div>' +
      '<div class="muted small">已学 ' + learned + ' · 在学 ' + wc.learning + ' · 掌握 ' + wc.mastered +
      '（共 ' + total + ' 词）</div></div>';

      var mode = "card"; /* 默认：先学后考 */
      var modeBox = $("#modeBox", el);
      function mark() {
        var bs = modeBox.querySelectorAll("button");
        for (var i = 0; i < bs.length; i++) {
          bs[i].style.borderColor = bs[i].getAttribute("data-m") === mode ? "var(--brand)" : "";
          bs[i].style.background = bs[i].getAttribute("data-m") === mode ? "var(--brand-weak)" : "";
        }
      }
      mark();
      modeBox.addEventListener("click", function (ev) {
        var b = ev.target.closest("button");
        if (b) { mode = b.getAttribute("data-m"); mark(); }
      });
      $("#startLearn", el).onclick = function () { start(el, mode, "normal"); };
      $("#goWrong", el).onclick = function () { tab = "wrong"; drawWrong(el); };
  }

  function drawWrong(el) {
    var c = core(), st = c.store.get();
    var list = V.wrongList(st);
    var rows = list.map(function (x) {
      return '<div class="row"><div class="grow"><div class="t">' + c.u.esc(x.word.en) +
        ' <span class="muted small">' + c.u.esc(x.word.zh) + '</span></div>' +
        '<div class="sub">错过 ' + x.info.count + ' 次 · 上次 ' + c.u.esc(x.info.lastWrong) + '</div></div>' +
        '<button class="btn small ghost" data-clear="' + c.u.esc(x.word.en) + '">移出</button></div>';
    }).join("");
    el.innerHTML =
      '<div class="card"><h2>❌ 错词本（' + list.length + ' 个）</h2>' +
      (list.length
        ? '<div class="muted small" style="margin-bottom:.4rem">练一遍，连对 3 次自动清出；也可以手动移出。</div>' +
          '<button class="btn block ok" id="practiceWrong">开始练错词</button>'
        : '<div class="empty">🌱 这里空空的——答错的词会自动住进来；一个都没错，太棒了！</div>') +
      '</div>' +
      (list.length ? '<div class="card">' + rows + '</div>' : "") +
      '<button class="btn ghost block" id="backMenu">← 返回</button>';

    $("#backMenu", el).onclick = function () { drawMenu(el); };
    var pw = $("#practiceWrong", el);
    if (pw) pw.onclick = function () { start(el, "mix", "wrong"); };
    el.querySelectorAll("[data-clear]").forEach(function (b) {
      b.onclick = function () {
        var rec = st.wrong[b.getAttribute("data-clear")];
        if (rec) rec.cleared = true;
        c.store.save();
        c.app.toast("已移出错词本");
        drawWrong(el);
      };
    });
  }

  function start(el, mode, pool) {
    var c = core(), st = c.store.get(), today = c.u.todayKey();
    var s = V.buildSession(st, today, mode, pool);
    if (!s.items.length) {
      c.app.toast(pool === "wrong" ? "错词本里没有要练的词" : "今天没有要学的词啦，休息一下 🍵");
      return;
    }
    sess = { s: s, idx: 0, right: 0, wrong: 0, itemStart: Date.now(), done: false };
    drawItem(el);
  }

  function drawItem(el) {
    var c = core(), u = c.u;
    var it = sess.s.items[sess.idx];
    var total = sess.s.items.length;
    sess.itemStart = Date.now();

    var head =
      '<div class="card"><div class="row" style="border:0;padding-top:0">' +
      '<span class="pill">' + (sess.idx + 1) + " / " + total + '</span>' +
      '<span class="pill ' + (it.kind === "new" ? "ok" : it.kind === "wrong" ? "bad" : "warn") + '">' +
      (it.kind === "new" ? "新词" : it.kind === "review" ? "复习" : "错词") + '</span>' +
      '<div class="grow"></div>' +
      '<button class="btn small ghost" id="quit">退出</button></div>' +
      '<div class="progress"><div style="width:' + Math.round((sess.idx / total) * 100) + '%"></div></div></div>';

    var body = "";
    if (it.mode === "card") {
      /* 翻卡学习（新词先学后考）：正面只给单词和音标 */
      body = '<div class="card" id="flashcard" role="button" tabindex="0" style="text-align:center;min-height:9rem;cursor:pointer">' +
        '<div id="cardFace">' +
        '<div class="muted small">先想一想这个词是什么意思，再翻面对答案</div>' +
        '<div style="font-size:2.2rem;font-weight:800;margin:.5rem 0">' + u.esc(it.word.en) + '</div>' +
        '<div class="muted">' + u.esc(it.word.ipa) + '</div>' +
        '<button class="btn small ghost" id="say" aria-label="播放单词发音" style="margin-top:.4rem">🔊 播放发音</button>' +
        '</div>' +
        '<div id="cardBack" class="hide">' +
        '<div style="font-size:1.2rem;font-weight:700;color:var(--ok)">' + u.esc(it.word.zh) + '</div>' +
        '<div class="small" style="margin-top:.5rem">' + u.esc(it.word.ex) + '</div>' +
        '<div class="small muted">' + u.esc(it.word.exZh) + '</div>' +
        (it.word.memo ? '<div class="small" style="margin-top:.5rem;background:var(--warn-weak);border-radius:10px;padding:.5rem .7rem">💡 ' + u.esc(it.word.memo) + '</div>' : '') +
        '</div>' +
        '<div class="muted small" style="margin-top:.6rem" id="cardTip">👆 点卡片翻面</div>' +
        '</div>' +
        '<div class="grid2" style="margin-top:.7rem">' +
        '<button class="btn ok" id="know" disabled aria-label="我认识这个词">😊 认识</button>' +
        '<button class="btn danger" id="dontknow" disabled aria-label="我不认识这个词">🤔 不认识</button>' +
        '</div>';
    } else if (it.mode === "en2zh") {
      /* 看英文 → 选中文：题干必须只有英文（+音标），选项是中文释义 */
      body = '<div class="card" style="text-align:center"><div style="font-size:1.9rem;font-weight:800">' +
        u.esc(it.word.en) + '</div><div class="muted">' + u.esc(it.word.ipa) +
        '</div><div style="margin-top:.4rem"><button class="btn small ghost" id="say">🔊 再听一遍</button></div>' +
        '<div class="muted small" style="margin-top:.6rem">选出对应的中文意思</div></div>' +
        '<div class="card"><div class="opts" id="opts">' +
        it.options.map(function (o) { return '<button data-a="' + u.esc(o) + '">' + u.esc(o) + '</button>'; }).join("") +
        '</div></div>';
    } else if (it.mode === "zh2en") {
      /* 看中文 → 选英文：题干只有中文释义，选项是英文单词 */
      body = '<div class="card" style="text-align:center"><div style="font-size:1.3rem;font-weight:700;margin:.4rem 0">' +
        u.esc(it.word.zh) + '</div><div class="muted small">选出对应的英文单词</div></div>' +
        '<div class="card"><div class="opts" id="opts">' +
        it.options.map(function (o) { return '<button data-a="' + u.esc(o) + '">' + u.esc(o) + '</button>'; }).join("") +
        '</div></div>';
    } else {
      body = '<div class="card" style="text-align:center">' +
        '<div class="muted small">听发音，把单词拼出来（' + ((c.store.get().settings.voice || "gb") === "us" ? "美音" : "英音") + '）</div>' +
        '<button class="btn ghost" id="say" aria-label="播放单词发音" style="margin:.6rem auto;font-size:1.4rem">🔊 播放发音</button>' +
        '<input type="text" id="spellIn" aria-label="输入听到的单词" placeholder="在这里输入你听到的单词" autocomplete="off" autocapitalize="off" spellcheck="false">' +
        '<div style="display:flex;gap:.6rem;margin-top:.6rem">' +
        '<button class="btn" style="flex:1" id="spellGo">检查</button>' +
        '<button class="btn ghost" id="hint" aria-label="查看拼写提示">看提示</button></div>' +
        '<div id="hintBox" class="muted small" style="margin-top:.5rem"></div></div>';
    }

    el.innerHTML = head + body + '<div id="fb"></div>';
    $("#quit", el).onclick = function () { sess = null; drawMenu(el); };
    c.tts.pickVoice();

    var say = $("#say", el);
    if (say) {
      say.onclick = function () { c.tts.speak(it.word.en, false); };
      c.tts.speak(it.word.en, false);
    }

    var opts = $("#opts", el);
    if (opts) {
      opts.addEventListener("click", function (ev) {
        var b = ev.target.closest("button");
        if (!b || sess.done) return;
        var correct = b.getAttribute("data-a") === it.answer;
        if (correct) b.classList.add("right"); else b.classList.add("wrong");
        finishItem(el, it, correct);
      });
    } else if ($("#spellIn", el)) {
      var go = $("#spellGo", el), inp = $("#spellIn", el);
      go.onclick = function () {
        if (sess.done) return;
        finishItem(el, it, V.checkSpell(inp.value, it.answer));
      };
      inp.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter") go.onclick();
      });
      inp.focus();
      $("#hint", el).onclick = function () {
        it.hintUsed = true;
        $("#hintBox", el).textContent = "提示：" + V.spellHint(it.word);
        c.tts.speak(it.word.en, true);
      };
    } else {
      /* 翻卡模式 */
      var know = $("#know", el), dk = $("#dontknow", el);
      var flipped = false;
      function flip() {
        if (flipped || sess.done) return;
        flipped = true;
        $("#cardFace", el).classList.add("hide");
        $("#cardBack", el).classList.remove("hide");
        $("#cardTip", el).textContent = "👉 根据刚才想的意思，诚实点一个";
        know.disabled = false;
        dk.disabled = false;
        c.tts.speak(it.word.en, false);
      }
      var fc = $("#flashcard", el);
      fc.onclick = flip;
      fc.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); flip(); }
      });
      know.onclick = function () { if (flipped && !sess.done) finishItem(el, it, true); };
      dk.onclick = function () { if (flipped && !sess.done) finishItem(el, it, false); };
    }
  }

  function finishItem(el, it, correct) {
    sess.done = true;
    var c = core(), u = c.u;
    var sec = Math.min(120, Math.round((Date.now() - sess.itemStart) / 1000));
    V.applyAnswer(c.store.get(), c.u.todayKey(), it, correct, sec);
    if (correct) sess.right++; else sess.wrong++;
    if (!correct && it.mode === "spell") { /* 听写错了顺便报一遍正确发音 */ }

    var card =
      '<div class="card" style="text-align:center">' +
      '<div style="font-size:1.8rem;font-weight:800;color:var(--' + (correct ? "ok" : "bad") + ')">' +
      (correct ? "✓ 答对了" : "✗ 答错了") + '</div>' +
      '<div style="font-size:1.6rem;font-weight:800;margin-top:.4rem">' + u.esc(it.word.en) + '</div>' +
      '<div class="muted">' + u.esc(it.word.ipa) + '</div>' +
      '<div style="margin:.3rem 0"><button class="btn small ghost" id="say2" aria-label="播放单词发音">🔊 听发音</button></div>' +
      '<div style="font-weight:600">' + u.esc(it.word.zh) + '</div>' +
      '<div class="small" style="margin-top:.5rem">' + u.esc(it.word.ex) + '</div>' +
      '<div class="small muted">' + u.esc(it.word.exZh) + '</div>' +
      (it.word.memo ? '<div class="small" style="margin-top:.5rem;background:var(--warn-weak);border-radius:10px;padding:.5rem .7rem">💡 ' + u.esc(it.word.memo) + '</div>' : '') +
      '<div class="muted small" style="margin-top:.5rem">下次复习：' +
      u.esc(u.fmtRelDays(c.store.get().words[it.word.en.toLowerCase()].due, c.u.todayKey())) +
      '（' + u.esc(c.store.get().words[it.word.en.toLowerCase()].due) + '）</div>' +
      '</div>';

    var last = sess.idx === sess.s.items.length - 1;
    var fb = $("#fb", el);
    fb.innerHTML = card +
      '<button class="btn block" id="next">' + (last ? "看结果 🎉" : "下一个 →") + '</button>';
    fb.querySelector("#say2").onclick = function () { c.tts.speak(it.word.en, false); };
    fb.querySelector("#next").onclick = function () {
      sess.idx++;
      if (sess.idx >= sess.s.items.length) drawDone(el);
      else { sess.done = false; drawItem(el); }
    };
    fb.querySelector("#next").focus();
  }

  function drawDone(el) {
    var c = core(), u = c.u;
    var total = sess.s.items.length;
    var rate = total ? Math.round((sess.right / total) * 100) : 0;
    var msg = rate >= 90 ? "太棒了，基本全对！" : rate >= 70 ? "不错不错，继续保持！" : "多错多练，明天这些词还会来找你 💪";
    var pool = sess.s.pool;
    var wc = c.srs.wordCounts(c.store.get().words); /* 结算页与首页/进度卡同一口径（P1-4） */
    el.innerHTML =
      '<div class="card" style="text-align:center">' +
      '<div style="font-size:2.6rem">🎉</div>' +
      '<h2>' + (pool === "wrong" ? "错词练完了！" : "这一轮学完了！") + '</h2>' +
      '<div class="muted">' + msg + '</div>' +
      '<div class="grid3" style="margin-top:.9rem">' +
      '<div class="stat"><div class="num">' + total + '</div><div class="lbl">一共刷了</div></div>' +
      '<div class="stat ok"><div class="num">' + sess.right + '</div><div class="lbl">答对</div></div>' +
      '<div class="stat bad"><div class="num">' + sess.wrong + '</div><div class="lbl">答错</div></div>' +
      '</div><div class="muted small" style="margin-top:.6rem">正确率 ' + rate + '%</div>' +
      '<div class="muted small" style="margin-top:.2rem">总进度：已学 ' + wc.learned + ' · 在学 ' + wc.learning +
      ' · 掌握 ' + wc.mastered + '（共 ' + vocabAll().length + ' 词）</div>' +
      '<div style="display:flex;gap:.6rem;margin-top:.9rem">' +
      '<button class="btn ghost" style="flex:1" id="again">再来一轮</button>' +
      '<button class="btn" style="flex:1" id="backHome">完成</button></div></div>';
    $("#again", el).onclick = function () { drawMenu(el); };
    $("#backHome", el).onclick = function () { location.hash = "home"; };
    sess = null;
  }
})();

</script>
<script>
/* 模块3：口语练习 —— Part1/2/3 题库、倒计时（P2 备考1分钟+作答2分钟）、
   浏览器录音回放、参考答案与高分表达。
   计时方案等纯逻辑放 IELTS.speak 里方便测试。 */
(function () {
  "use strict";
  var P = window.IELTS.app.pages;
  var S = {};

  function core() { return window.IELTS; }
  function data() { return window.IELTS_DATA.SPEAKING; }

  /* ---------- 纯逻辑 ---------- */

  /* 各 Part 的计时阶段（秒）。P2 是 备考60 + 作答120，其余单阶段。 */
  S.plan = function (part) {
    if (part === 1) return [{ phase: "answer", label: "回答", sec: 30 }];
    if (part === 2) return [
      { phase: "prep", label: "准备（可以看题打腹稿，不用说出声）", sec: 60 },
      { phase: "answer", label: "作答（说出声，尽量说满 2 分钟）", sec: 120 }
    ];
    return [{ phase: "answer", label: "作答", sec: 60 }];
  };

  /* 每题稳定 id：按题库下标 */
  S.itemId = function (idx) { return "s" + idx; };

  /* 记一次练习 */
  S.applyPractice = function (state, idx, today, sec) {
    var id = S.itemId(idx);
    var d = state.speaking.done[id];
    if (!d) d = state.speaking.done[id] = { count: 0, last: "", sec: 0 };
    d.count++;
    d.last = today;
    d.sec = (d.sec || 0) + (sec || 0);
    core().stats.addStudy(state, today, sec || 0, {});
    core().store.save();
    return d;
  };

  S.groupByTopic = function (part) {
    var groups = {}, order = [];
    data().forEach(function (q, idx) {
      if (q.part !== part) return;
      if (!groups[q.topic]) { groups[q.topic] = []; order.push(q.topic); }
      groups[q.topic].push({ q: q, idx: idx });
    });
    return { order: order, groups: groups };
  };

  window.IELTS.speak = S;

  /* ---------- 页面 ---------- */
  var cur = { part: 1, open: -1 };
  var timer = { handle: null, left: 0, phaseIdx: 0, spokenSec: 0 };

  function $(sel, el) { return el.querySelector(sel); }
  function fmt(sec) {
    sec = Math.max(0, sec);
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
  }

  function beep() {
    try {
      var u = new AudioContext(), o = u.createOscillator(), g = u.createGain();
      o.frequency.value = 880; g.gain.value = 0.12;
      o.connect(g); g.connect(u.destination);
      o.start(); o.stop(u.currentTime + 0.25);
    } catch (e) { /* 无声环境忽略 */ }
  }

  function clearTimer() {
    if (timer.handle) { clearInterval(timer.handle); timer.handle = null; }
  }

  P.speak = {
    render: function (el) {
      clearTimer();
      cur.part = 1; cur.open = -1;
      drawTabs(el);
    }
  };

  function drawTabs(el) {
    clearTimer(); /* 切 Part 时必须停掉可能还在跑的倒计时和录音 */
    var rc = core().rec;
    if (rc && rc.active()) rc.stop(function () { });
    var names = { 1: "Part 1 快问快答", 2: "Part 2 独白", 3: "Part 3 讨论" };
    var tabs = [1, 2, 3].map(function (p) {
      return '<button class="btn ' + (cur.part === p ? "" : "ghost") + '" data-p="' + p + '">' +
        names[p] + '</button>';
    }).join("");
    el.innerHTML =
      '<div class="card"><div style="display:flex;gap:.5rem;flex-wrap:wrap">' + tabs + '</div>' +
      '<div class="muted small" style="margin-top:.6rem">' +
      (cur.part === 1 ? "日常话题小问题，考官问一句答 3~4 句。计时 30 秒。"
        : cur.part === 2 ? "拿到话题卡，先看 1 分钟准备，然后自己说满 2 分钟。"
        : "对 Part 2 话题的深入讨论，观点 + 理由 + 例子。计时 60 秒。") +
      '</div></div><div id="speakBody"></div>';
    var body = $("#speakBody", el);
    drawList(body);
    el.querySelectorAll("[data-p]").forEach(function (b) {
      b.onclick = function () {
        cur.part = +b.getAttribute("data-p");
        cur.open = -1;
        drawTabs(el);
      };
    });
  }

  function drawList(el) {
    var c = core(), st = c.store.get();
    var g = S.groupByTopic(cur.part);
    var html = "";
    g.order.forEach(function (topic) {
      var items = g.groups[topic];
      html += '<div class="card"><h3>' + c.u.esc(topic) +
        ' <span class="muted small">(' + items.length + ' 题)</span></h3>';
      items.forEach(function (x) {
        var done = st.speaking.done[S.itemId(x.idx)];
        var pill = done ? '<span class="pill ok">练过 ' + done.count + ' 次</span>' : '<span class="pill">没练过</span>';
        html += '<div class="row"><div class="grow"><div class="t">' + c.u.esc(x.q.q) + '</div>' +
          '<div class="sub">' + c.u.esc(x.q.qZh) + '</div></div>' +
          pill + '<button class="btn small" data-idx="' + x.idx + '">练习</button></div>';
      });
      html += '</div>';
    });
    el.innerHTML = html;
    el.querySelectorAll("[data-idx]").forEach(function (b) {
      b.onclick = function () {
        cur.open = +b.getAttribute("data-idx");
        drawDetail(el, cur.open);
      };
    });
  }

  function drawDetail(el, idx) {
    clearTimer();
    var c = core(), u = c.u;
    var q = data()[idx];
    var plans = S.plan(q.part);

    var stageHtml = plans.map(function (p, i) {
      return '<div id="phase' + i + '" class="hide">' +
        '<div class="timer-tip">' + u.esc(p.label) + '</div>' +
        '<div class="timer-big" id="clock' + i + '">' + fmt(p.sec) + '</div>' +
        '</div>';
    }).join("");

    var recHtml = c.rec.supported()
      ? '<button class="btn danger" id="recBtn" aria-label="开始或停止录音">● 开始录音</button><div id="recBox"></div>'
      : '<div class="muted small">这个浏览器不支持录音（或没给麦克风权限）。也可以用手机自带录音机录完再回放对照。</div>';

    el.innerHTML =
      '<button class="btn ghost small" id="backList">← 返回题目列表</button>' +
      '<div class="card" style="margin-top:.6rem">' +
      '<span class="pill">' + (q.part === 1 ? "Part 1 · 30 秒" : q.part === 2 ? "Part 2 · 1+2 分钟" : "Part 3 · 60 秒") + '</span>' +
      '<span class="pill">' + u.esc(q.topic) + '</span>' +
      '<div style="font-size:1.15rem;font-weight:700;margin:.6rem 0 .3rem">' + u.esc(q.q) + '</div>' +
      '<div class="muted small">' + u.esc(q.qZh) + '</div>' +
      '<div style="margin-top:.8rem">' + stageHtml +
      '<div id="phaseCtrl"><button class="btn block" id="goPhase">▶ 开始计时（' + u.esc(plans[0].label.split("（")[0]) + ' ' + plans[0].sec + ' 秒）</button></div>' +
      '<div class="muted small" id="spokenNote" style="margin-top:.4rem"></div>' +
      '</div>' +
      '<div style="margin-top:.9rem">' + recHtml + '</div>' +
      '</div>' +
      '<div class="card"><button class="btn ghost block" id="showAns">先自己说，再看参考答案 ▾</button>' +
      '<div id="ansBox" class="hide" style="margin-top:.7rem">' +
      '<div class="small" style="background:var(--brand-weak);border-radius:10px;padding:.7rem">' + u.esc(q.ans6) + '</div>' +
      '<div class="muted small" style="margin:.6rem 0 .3rem">✨ 高分表达（说完再回来升级用词）：</div>' +
      '<div>' + q.upgrades.map(function (x) { return '<span class="pill ok">' + u.esc(x) + '</span>'; }).join("") + '</div>' +
      '<button class="btn small ghost" id="sayAns" style="margin-top:.5rem">🔊 听一遍参考答案</button>' +
      '</div></div>' +
      '<button class="btn ghost block" id="finishBtn">完成本次练习（记 1 次）</button>';

    $("#backList", el).onclick = function () { clearTimer(); stopRec(true); cur.open = -1; drawList(el); };

    /* 完成练习按钮：点击才计次，一次练习只记一次（反馈要求） */
    var finishBtn = $("#finishBtn", el);
    if (finishBtn) {
      finishBtn.onclick = function () {
        if (finishBtn.disabled) return;
        savePractice();
        finishBtn.disabled = true;
        finishBtn.textContent = "✓ 已记录 1 次练习";
        c.app.toast("已记录 1 次口语练习");
      };
    }
    $("#showAns", el).onclick = function () {
      var box = $("#ansBox", el);
      box.classList.toggle("hide");
      this.textContent = box.classList.contains("hide") ? "先自己说，再看参考答案 ▾" : "收起参考答案 ▴";
    };
    $("#sayAns", el).onclick = function () { c.tts.speak(q.ans6, false); };

    /* 计时：按阶段依次走 */
    var phaseIdx = -1;
    $("#goPhase", el).onclick = function () { nextPhase(); };

    function nextPhase() {
      phaseIdx++;
      if (phaseIdx >= plans.length) { onAllDone(); return; }
      /* 重新计时的一轮：恢复「完成本次练习」按钮 */
      var fb = $("#finishBtn", el);
      if (fb && fb.disabled) { fb.disabled = false; fb.textContent = "完成本次练习（记 1 次）"; }
      for (var i = 0; i < plans.length; i++) {
        $("#phase" + i, el).classList.toggle("hide", i !== phaseIdx);
      }
      timer.left = plans[phaseIdx].sec;
      timer.spokenSec = 0;
      if (plans[phaseIdx].phase === "answer") startRecIfNeeded();
      tickPaint();
      clearTimer();
      timer.handle = setInterval(function () {
        timer.left--;
        if (plans[phaseIdx].phase === "answer") timer.spokenSec++;
        tickPaint();
        if (timer.left <= 0) {
          beep();
          nextPhase();
        }
      }, 1000);
      var btn = $("#goPhase", el);
      if (btn) {
        var next = plans[phaseIdx + 1];
        btn.textContent = next ? "跳过本阶段 →" : "提前结束";
        btn.onclick = function () { nextPhase(); };
      }
    }

    function tickPaint() {
      var clock = $("#clock" + phaseIdx, el);
      if (!clock) return;
      clock.textContent = fmt(timer.left);
      clock.classList.toggle("warn", timer.left <= 10 && timer.left > 0);
      clock.classList.toggle("over", timer.left <= 0);
      var note = $("#spokenNote", el);
      if (note && plans[phaseIdx].phase === "answer") {
        note.textContent = "已作答 " + timer.spokenSec + " 秒";
      }
    }

    function onAllDone() {
      clearTimer();
      beep();
      /* 计时器结束后归零（防残留） */
      for (var i = 0; i < plans.length; i++) {
        var ck = $("#clock" + i, el);
        if (ck) { ck.textContent = "00:00"; ck.classList.remove("warn"); ck.classList.add("over"); }
      }
      var note = $("#spokenNote", el);
      if (note) note.textContent = "⏰ 全部阶段结束！回放录音对照参考答案，然后点下方「完成本次练习」记录 1 次。";
      var btn = $("#goPhase", el);
      if (btn) { btn.textContent = "再练一轮（重新计时）"; btn.onclick = function () { phaseIdx = -1; nextPhase(); }; }
    }

    /* 只有点「完成本次练习」才计次（反馈要求） */
    function savePractice() {
      var sec = timer.spokenSec || plans[0].sec;
      S.applyPractice(core().store.get(), idx, core().u.todayKey(), sec);
    }

    /* ---------- 录音 ---------- */
    function startRecIfNeeded() { if (c.rec.supported() && !c.rec.active()) startRec(); }

    var recBtn = $("#recBtn", el);
    if (recBtn) {
      recBtn.onclick = function () {
        if (c.rec.active()) { stopRec(false); } else { startRec(); }
      };
    }

    function startRec() {
      c.rec.start(function (ok) {
        if (!recBtn) return;
        recBtn.textContent = ok ? "■ 停止录音" : "● 开始录音";
        if (!ok) c.app.toast("录音启动失败，检查麦克风权限");
      });
    }
    function stopRec(silent) {
      c.rec.stop(function (url) {
        if (recBtn) recBtn.textContent = "● 开始录音";
        var box = $("#recBox", el);
        if (box && url) {
          box.innerHTML =
            '<div class="small" style="margin-top:.5rem">刚才的录音（刷新后消失，可先下载保存）：</div>' +
            '<audio controls src="' + url + '" style="width:100%;margin-top:.3rem"></audio>' +
            '<a class="btn small ghost" style="margin-top:.4rem;display:inline-block;text-decoration:none" href="' + url + '" download="ielts-speaking.wav">下载录音</a>';
        } else if (!silent && box) {
          box.innerHTML = "";
        }
      });
    }
  }

  /* ---------- 录音小助手（页面级单例） ---------- */
  var rec = { mr: null, chunks: [], activeFlag: false, stopCb: null };
  rec.supported = function () {
    return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  };
  rec.active = function () { return rec.activeFlag; };
  rec.start = function (cb) {
    if (!rec.supported()) { cb && cb(false); return; }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      rec.chunks = [];
      rec.stream = stream;
      try {
        rec.mr = new MediaRecorder(stream);
      } catch (e) { cb && cb(false); return; }
      rec.mr.ondataavailable = function (ev) { if (ev.data.size) rec.chunks.push(ev.data); };
      rec.mr.onstop = function () {
        rec.stream.getTracks().forEach(function (t) { t.stop(); });
        var blob = new Blob(rec.chunks, { type: (rec.chunks.length && rec.chunks[0].type) || "audio/webm" });
        if (rec.url) URL.revokeObjectURL(rec.url);
        rec.url = URL.createObjectURL(blob);
        rec.activeFlag = false;
        var f = rec.stopCb; rec.stopCb = null;
        f && f(rec.url);
      };
      rec.mr.start();
      rec.activeFlag = true;
      cb && cb(true);
    }).catch(function () { cb && cb(false); });
  };
  rec.stop = function (cb) {
    if (rec.mr && rec.activeFlag) {
      rec.stopCb = cb || null;
      rec.mr.stop();  /* onstop 里会回调并清理 */
    } else {
      cb && cb(null);
    }
  };
  window.IELTS.rec = rec;
})();

</script>
<script>
/* 模块4：写作练习 —— 大小作文题库、计时（小作文20分钟/大作文40分钟）、
   实时字数、提交后本地规则检查、草稿自动保存、历史作文。
   检查逻辑在 core/writing-check.js（纯函数，有专门测试）。 */
(function () {
  "use strict";
  var P = window.IELTS.app.pages;
  var WT = {};

  function core() { return window.IELTS; }
  function data() { return window.IELTS_DATA.WRITING; }

  /* 各 Task 的建议时长（秒） */
  WT.plan = function (type) { return type === "Task 2" ? 2400 : 1200; };
  WT.target = function (type) { return type === "Task 2" ? 250 : 150; };

  window.IELTS.writ = WT;

  /* ---------- 页面 ---------- */
  var cur = { tab: "Task 1", no: 1 };

  function $(sel, el) { return el.querySelector(sel); }
  function fmt(sec) {
    sec = Math.max(0, sec);
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
  }
  function byNo(no) {
    var list = data();
    for (var i = 0; i < list.length; i++) if (list[i].no === no && list[i].type === cur.tab) return list[i];
    return null;
  }
  function draftKey() { return "draft_" + cur.tab; }
  function beep() {
    try {
      var u = new AudioContext(), o = u.createOscillator(), g = u.createGain();
      o.frequency.value = 880; g.gain.value = 0.12;
      o.connect(g); g.connect(u.destination);
      o.start(); o.stop(u.currentTime + 0.25);
    } catch (e) { }
  }

  var timer = { handle: null, left: 0, running: false, used: 0 };

  function clearTimer() { if (timer.handle) { clearInterval(timer.handle); timer.handle = null; } timer.running = false; }

  P.write = {
    render: function (el) {
      clearTimer();
      var st = core().store.get();
      if (!data().some(function (x) { return x.type === cur.tab && x.no === cur.no; })) {
        var first = data().filter(function (x) { return x.type === cur.tab; })[0];
        cur.no = first ? first.no : 1;
      }
      drawTabs(el);
    }
  };

  /* 同义替换速查表（反馈四-3）：雅思写作最高频的换词组合 */
  var SYN = [
    ["important", "crucial / vital / essential / significant"],
    ["think / believe", "argue / maintain / contend / be convinced that"],
    ["good", "beneficial / advantageous / rewarding"],
    ["bad", "detrimental / adverse / harmful"],
    ["many / a lot of", "numerous / a wealth of / an array of"],
    ["more and more", "an increasing number of（只接可数名词，如 people/companies） / a growing proportion of"],
    ["show", "demonstrate / reveal / indicate / illustrate"],
    ["because", "owing to / due to / given that"],
    ["but / however", "nevertheless / nonetheless / by contrast"],
    ["so / therefore", "consequently / as a result / hence"],
    ["people", "individuals / citizens / the public"],
    ["children", "youngsters / young people / the young generation"],
    ["old people", "the elderly / senior citizens"],
    ["problem", "issue / challenge / concern"],
    ["solution", "remedy / approach / measure"],
    ["improve", "enhance / boost / elevate / refine"],
    ["reduce", "curb / mitigate / alleviate / cut down"],
    ["get / obtain", "acquire / gain / secure"],
    ["use", "utilise / employ / adopt / harness"],
    ["famous", "renowned / celebrated / prominent"]
  ];

  function drawSyn(el) {
    var rows = SYN.map(function (pair) {
      return '<div class="row"><div class="grow"><div class="t">' + pair[0] + '</div>' +
        '<div class="sub">' + pair[1] + '</div></div>' +
        '<button class="btn small ghost" aria-label="朗读同义替换示例">🔊</button></div>';
    }).join("");
    el.innerHTML =
      '<div class="card"><h2>🔁 同义替换速查表</h2>' +
      '<div class="muted small" style="margin:.2rem 0 .5rem">写作和口语换词就靠这个：写完检查一遍，把出现 3 次以上的词换掉。🔊 可点击朗读。</div>' +
      rows + '</div>' +
      '<button class="btn ghost block" id="backWrite">← 返回写作</button>';
    $("#backWrite", el).onclick = function () { cur.tab = "Task 2"; drawTabs(el); };
    el.querySelectorAll(".row button").forEach(function (b) {
      b.onclick = function () {
        var row = b.closest(".row");
        core().tts.pickVoice();
        core().tts.speak(row.querySelector(".t").textContent + ", " + row.querySelector(".sub").textContent);
      };
    });
  }

  function drawTabs(el) {
    var st = core().store.get();
    var histN = st.writing.essays.length;
    /* 按钮行只在这里渲染一次；之后切换只更新高亮与内容区（反馈：按钮只渲染一次） */
    el.innerHTML =
      '<div class="card"><div style="display:flex;gap:.5rem;flex-wrap:wrap">' +
      '<button class="btn ' + (cur.tab === "Task 1" ? "" : "ghost") + '" data-t="Task 1">📊 小作文 Task 1（20分钟·150词）</button>' +
      '<button class="btn ' + (cur.tab === "Task 2" ? "" : "ghost") + '" data-t="Task 2">📝 大作文 Task 2（40分钟·250词）</button>' +
      '<button class="btn ' + (cur.tab === "hist" ? "" : "ghost") + '" data-t="hist">🗂️ 我的作文历史（' + histN + '）</button>' +
      '<button class="btn ' + (cur.tab === "syn" ? "" : "ghost") + '" data-t="syn">🔁 同义替换速查</button>' +
      '</div></div><div id="writeBody"></div>';
    var body = $("#writeBody", el);
    if (cur.tab === "hist") drawHist(body);
    else if (cur.tab === "syn") drawSyn(body);
    else drawEditor(body);
    el.querySelectorAll("[data-t]").forEach(function (b) {
      b.onclick = function () {
        var t = b.getAttribute("data-t");
        if (t === cur.tab) return;
        cur.tab = t;
        if (cur.tab === "Task 1" || cur.tab === "Task 2") {
          var first = data().filter(function (x) { return x.type === cur.tab; })[0];
          if (first) cur.no = first.no;
        }
        clearTimer();
        /* 同一个状态驱动：高亮与内容一起切，不重建按钮行 */
        el.querySelectorAll("[data-t]").forEach(function (x) {
          x.classList.toggle("ghost", x.getAttribute("data-t") !== cur.tab);
        });
        var body2 = $("#writeBody", el);
        if (cur.tab === "hist") drawHist(body2);
        else if (cur.tab === "syn") drawSyn(body2);
        else drawEditor(body2);
      };
    });
  }

  /* ---------- 练习页 ---------- */
  function drawEditor(el) {
    var c = core(), u = c.u;
    var ex = byNo(cur.no);
    var typeLabel = cur.tab === "Task 1" ? "图表描述（小作文）" : "议论文（大作文）";
    var opts = data().filter(function (x) { return x.type === cur.tab; }).map(function (x) {
      return '<option value="' + x.no + '"' + (x.no === cur.no ? " selected" : "") + '>' +
        "第 " + x.no + " 题 · " + u.esc(x.qZh.slice(0, 22)) + "…</option>";
    }).join("");

    var draft = "";
    try { draft = c.store.get().writing.drafts ? (c.store.get().writing.drafts[draftKey()] || "") : ""; } catch (e) { }

    el.innerHTML =
      '<div class="card"><h2>' + typeLabel + ' · 第 ' + ex.no + ' 题</h2>' +
      '<label class="fld"><span>换一题（写作中途换会清空输入框，请先复制保存）</span>' +
      '<select id="pick">' + opts + '</select></label>' +
      '<div style="font-size:1.05rem;font-weight:600;margin:.4rem 0">' + u.esc(ex.q) + '</div>' +
      (ex.data ? '<div class="small" style="background:var(--warn-weak);border-radius:10px;padding:.6rem .7rem;margin:.5rem 0">' +
        '<b>📋 图表数据（考场里是图，离线版用文字给你，照着写就行）：</b><br>' + u.esc(ex.data) + '</div>' : '') +
      '<div class="muted small">' + u.esc(ex.qZh) + '</div>' +
      '<div style="display:flex;gap:.5rem;margin-top:.7rem;flex-wrap:wrap">' +
      '<button class="btn small ghost" id="showOutline">💡 看提纲思路</button>' +
      '<button class="btn small ghost" id="showEssay">📖 写完再看范文</button>' +
      '<button class="btn small ghost" id="showNote">⭐ 这篇范文的亮点</button></div>' +
      '<div id="outlineBox" class="hide small" style="background:var(--brand-weak);border-radius:10px;padding:.7rem;margin-top:.6rem;white-space:pre-wrap">' + u.esc(ex.outline) + '</div>' +
      '<div id="essayBox" class="hide small" style="background:var(--ok-weak);border-radius:10px;padding:.7rem;margin-top:.6rem">' + u.esc(ex.essay) +
      '<div class="muted" style="margin-top:.4rem">范文 ' + c.wcheck.wordCount(ex.essay) + ' 词。不要背，学结构和好词。</div></div>' +
      '<div id="noteBox" class="hide small" style="background:var(--warn-weak);border-radius:10px;padding:.7rem;margin-top:.6rem">' + u.esc(ex.bandNote) + '</div>' +
      '</div>' +

      '<div class="card"><h2>✍️ 开写</h2>' +
      '<div style="display:flex;align-items:center;gap:.8rem;margin-bottom:.6rem">' +
      '<div><div class="timer-tip">建议用时 ' + Math.round(WT.plan(cur.tab) / 60) + ' 分钟</div>' +
      '<div class="timer-big" id="wClock" style="font-size:2rem">' + fmt(WT.plan(cur.tab)) + '</div></div>' +
      '<div style="display:flex;flex-direction:column;gap:.4rem">' +
      '<button class="btn small" id="wStart">开始计时</button>' +
      '<button class="btn small ghost" id="wPause">暂停</button>' +
      '<button class="btn small ghost" id="wReset">重置</button></div></div>' +
      '<div class="muted small" id="wNote"></div>' +
      '<textarea id="wText" placeholder="把你的作文写在这里。写完点下面的「提交检查」，不用联网，本机就能给你挑毛病。" style="min-height:14rem">' + u.esc(draft) + '</textarea>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:.4rem">' +
      '<span id="wCount" class="small">已写 0 词 · 目标 ' + WT.target(cur.tab) + ' 词</span>' +
      '<button class="btn" id="wSubmit">提交检查 ✓</button></div>' +
      '</div>' +
      '<div id="report"></div>';

    $("#pick", el).onchange = function () {
      cur.no = +this.value;
      clearTimer();
      drawEditor(el);
    };
    $("#showOutline", el).onclick = function () { $("#outlineBox", el).classList.toggle("hide"); };
    $("#showEssay", el).onclick = function () { $("#essayBox", el).classList.toggle("hide"); };
    $("#showNote", el).onclick = function () { $("#noteBox", el).classList.toggle("hide"); };

    var ta = $("#wText", el);
    var countEl = $("#wCount", el);
    function paintCount() {
      var n = c.wcheck.wordCount(ta.value);
      var target = WT.target(cur.tab);
      countEl.innerHTML = "已写 <b>" + n + "</b> 词 · 目标 " + target + " 词" +
        (n >= target ? ' <span class="pill ok">已达标</span>' : n > 0 ? ' <span class="pill">还差 ' + (target - n) + ' 词</span>' : "");
    }

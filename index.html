    ta.addEventListener("input", function () {
      paintCount();
      var st = core().store.get();
      if (!st.writing.drafts) st.writing.drafts = {};
      st.writing.drafts[draftKey()] = ta.value;
      core().store.save();
    });
    paintCount();

    /* 计时 */
    function paintClock() {
      $("#wClock", el).textContent = fmt(timer.left);
      $("#wClock", el).classList.toggle("warn", timer.left <= 300 && timer.left > 0);
      $("#wClock", el).classList.toggle("over", timer.left <= 0);
    }
    $("#wStart", el).onclick = function () {
      clearTimer();
      timer.left = WT.plan(cur.tab);
      timer.used = 0;
      timer.running = true;
      paintClock();
      timer.handle = setInterval(function () {
        timer.left--; timer.used++;
        paintClock();
        if (timer.left === 300) c.app.toast("还有 5 分钟，注意收尾！");
        if (timer.left <= 0) { beep(); clearTimer(); $("#wNote", el).textContent = "⏰ 时间到！考场里这时候必须停笔了，快提交检查吧。"; }
      }, 1000);
      $("#wNote", el).textContent = "计时中……写作的时候尽量别看表，考试也不让看 😄";
    };
    $("#wPause", el).onclick = function () {
      if (timer.running) { clearTimer(); $("#wNote", el).textContent = "已暂停（剩 " + fmt(timer.left) + "）"; }
      else if (timer.left > 0) {
        timer.running = true;
        timer.handle = setInterval(function () {
          timer.left--; timer.used++;
          paintClock();
          if (timer.left <= 0) { beep(); clearTimer(); $("#wNote", el).textContent = "⏰ 时间到！"; }
        }, 1000);
        $("#wNote", el).textContent = "继续计时……";
      }
    };
    $("#wReset", el).onclick = function () {
      clearTimer();
      timer.left = WT.plan(cur.tab); timer.used = 0;
      paintClock();
      $("#wNote", el).textContent = "";
    };

    $("#wSubmit", el).onclick = function () {
      submit(el, ta.value);
    };
  }

  function submit(el, text) {
    var c = core(), u = c.u;
    var rep = c.wcheck.check(text, cur.tab);
    var sec = timer.used;
    if (sec > 0) c.stats.addStudy(c.store.get(), c.u.todayKey(), sec, {});
    /* 存历史 */
    var st = c.store.get();
    var id = "e" + Date.now();
    st.writing.essays.push({
      id: id, no: cur.no, type: cur.tab, date: c.u.todayKey(),
      words: rep.words, ok: rep.wordsOk, sec: sec,
      text: text, report: rep
    });
    /* 清草稿 */
    if (st.writing.drafts) st.writing.drafts[draftKey()] = "";
    c.store.save();
    c.app.toast(sec > 0 ? "已保存到历史，本次写作 " + Math.round(sec / 60) + " 分钟" : "已保存到历史");
    drawReport(el, rep);
  }

  function drawReport(el, rep) {
    var c = core(), u = c.u;
    var box = $("#report", el) || el;
    var connFound = [];
    for (var g in rep.connectors.found) {
      connFound.push('<span class="pill ok">' + g + '：' + rep.connectors.found[g].join("、") + '</span>');
    }
    var repRows = rep.repeats.map(function (x) {
      return '<span class="pill bad">' + u.esc(x.word) + ' ×' + x.count + '</span>';
    }).join("");
    var longs = rep.sentences.longOnes.map(function (x) {
      return '<div class="small muted">第 ' + x.idx + ' 句（' + x.words + ' 词）' + u.esc(x.text) + '</div>';
    }).join("");

    box.innerHTML =
      '<div class="card"><h2>📋 检查报告</h2>' +
      '<div class="grid2">' +
      '<div class="stat ' + (rep.wordsOk ? "ok" : "bad") + '"><div class="num">' + rep.words + '</div><div class="lbl">词数（目标 ' + rep.target + '）</div></div>' +
      '<div class="stat"><div class="num">' + rep.sentences.count + '</div><div class="lbl">句子数（平均 ' + rep.sentences.avg + ' 词/句）</div></div>' +
      '</div>' +
      (repRows ? '<div style="margin:.6rem 0"><b class="small">重复最多的词：</b><div style="margin-top:.3rem">' + repRows + '</div></div>'
        : '<div class="small ok" style="margin:.6rem 0">✓ 没有明显重复用词</div>') +
      (longs ? '<div><b class="small">超长句（超过 40 词）：</b>' + longs + '</div>' : '<div class="small ok">✓ 没有超长句</div>') +
      '<div style="margin:.6rem 0"><b class="small">用到的连接词：</b>' +
      (connFound.length ? '<div style="margin-top:.3rem">' + connFound.join("") + '</div>'
        : '<div class="small bad">一个都没用上！这是提分最快的点。</div>') + '</div>' +
      '<h3 style="margin-top:.8rem">🗣️ 给你的建议</h3>' +
      '<ul class="small" style="margin:.3rem 0 0;padding-left:1.2rem">' +
      rep.tips.map(function (t) { return '<li style="margin-bottom:.3rem">' + u.esc(t) + '</li>'; }).join("") +
      '</ul>' +
      '<div class="muted small" style="margin-top:.6rem">说明：这是本机规则检查（字数/用词/句子/连接词），不能替代批改，但能帮你改掉大部分低级问题。</div>' +
      '</div>';
  }

  /* ---------- 历史页 ---------- */
  function drawHist(el) {
    var c = core(), u = c.u;
    var list = c.store.get().writing.essays.slice().reverse();
    if (!list.length) {
      el.innerHTML = '<div class="card"><div class="empty"><div class="big">🗂️</div>还没有保存的作文。<br>去写第一篇吧！</div></div>' +
        '<button class="btn ghost block" id="goWrite1">去写作</button>';
      $("#goWrite1", el).onclick = function () { cur.tab = "Task 2"; drawTabs(el); };
      return;
    }
    var rows = list.map(function (e) {
      return '<div class="row"><div class="grow"><div class="t">' + (e.type === "Task 1" ? "📊 小作文" : "📝 大作文") +
        ' 第' + e.no + '题 <span class="pill ' + (e.ok ? "ok" : "bad") + '">' + e.words + ' 词</span></div>' +
        '<div class="sub">' + e.date + (e.sec ? ' · 用时 ' + Math.round(e.sec / 60) + ' 分钟' : '') + '</div></div>' +
        '<button class="btn small" data-view="' + e.id + '">查看</button>' +
        '<button class="btn small ghost" data-del="' + e.id + '">删除</button></div>';
    }).join("");
    el.innerHTML = '<div class="card"><h2>🗂️ 我的作文历史（' + list.length + ' 篇）</h2>' + rows + '</div>';

    el.querySelectorAll("[data-view]").forEach(function (b) {
      b.onclick = function () {
        var e = c.store.get().writing.essays.filter(function (x) { return x.id === b.getAttribute("data-view"); })[0];
        if (!e) return;
        el.innerHTML =
          '<button class="btn ghost small" id="backHist">← 返回列表</button>' +
          '<div class="card" style="margin-top:.6rem"><h2>' + (e.type === "Task 1" ? "📊 小作文" : "📝 大作文") +
          ' 第' + e.no + '题 · ' + e.date + ' · ' + e.words + ' 词</h2>' +
          '<div class="small" style="white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:.7rem">' + u.esc(e.text) + '</div></div>' +
          '<div id="report"></div>';
        drawReport(el, e.report);
        $("#backHist", el).onclick = function () { drawHist(el); };
      };
    });
    el.querySelectorAll("[data-del]").forEach(function (b) {
      b.onclick = function () {
        var id = b.getAttribute("data-del");
        c.app.ask("删除这篇作文？", "删除后找不回来了（导出的备份里也一并没了）。", "删除", true).then(function (ok) {
          if (!ok) return;
          var st = c.store.get();
          st.writing.essays = st.writing.essays.filter(function (x) { return x.id !== id; });
          c.store.save();
          c.app.toast("已删除");
          drawHist(el);
        });
      };
    });
  }
})();

</script>
<script>
/* 模块5：学习计划 —— 填考试日期和目标分，自动排每天任务，完成打勾。
   任务生成等纯逻辑放 IELTS.plan 里方便测试。 */
(function () {
  "use strict";
  var P = window.IELTS.app.pages;
  var PL = {};

  function core() { return window.IELTS; }
  function $(sel, el) { return el.querySelector(sel); }

  /* ---------- 纯逻辑 ---------- */

  /* 第 i 天的任务列表（i 从 0 起）。作文节奏：4 天一循环，第 2 天小作文、第 4 天大作文。 */
  PL.dayTasks = function (i, dailyNew) {
    var tasks = [
      { name: "背新词 " + dailyNew + " 个", done: false, kind: "vocab" },
      { name: "复习今天到期的单词", done: false, kind: "review" },
      { name: "口语练 1 题（Part " + [1, 3, 2][i % 3] + "）", done: false, kind: "speak" }
    ];
    if (i % 4 === 1) tasks.push({ name: "写 1 篇小作文（Task 1）", done: false, kind: "write" });
    if (i % 4 === 3) tasks.push({ name: "写 1 篇大作文（Task 2）", done: false, kind: "write" });
    return tasks;
  };

  /* 生成计划：从 from（含）到 examDate（不含）每天一组。
     重排时保留同名任务的打勾状态。返回 {days, count}。 */
  PL.generate = function (state, from, examDate, dailyNew) {
    var u = core().u;
    if (!examDate || u.diffDays(from, examDate) <= 0) return { days: {}, count: 0 };
    var n = u.diffDays(from, examDate);
    if (n > 370) n = 370; /* 一年封顶，防止误填日期撑爆存储 */
    var days = {}, count = 0;
    for (var i = 0; i < n; i++) {
      var key = u.addDays(from, i);
      var fresh = PL.dayTasks(i, dailyNew);
      var old = state.plan.days[key];
      if (old && old.tasks) {
        old.tasks.forEach(function (t) {
          fresh.forEach(function (f) {
            if (f.name === t.name && t.done) f.done = true;
          });
        });
      }
      days[key] = { tasks: fresh };
      count++;
    }
    return { days: days, count: count };
  };

  /* 某天完成度：勾了几个/共几个 */
  PL.dayProgress = function (day) {
    var total = day.tasks.length, done = 0;
    day.tasks.forEach(function (t) { if (t.done) done++; });
    return { done: done, total: total, all: done === total && total > 0 };
  };

  window.IELTS.plan = PL;

  /* ---------- 页面 ---------- */
  var showAll = false;

  P.plan = {
    render: function (el) {
      var c = core(), st = c.store.get(), today = c.u.todayKey();

      if (!st.plan.examDate) { drawForm(el); return; }

      var left = c.u.diffDays(today, st.plan.examDate);
      if (left <= 0) {
        el.innerHTML =
          '<div class="card" style="text-align:center"><div style="font-size:2.4rem">🎉</div>' +
          '<h2>考试日期（' + c.u.esc(st.plan.examDate) + '）已经过了！</h2>' +
          '<div class="muted">考得怎么样？要继续备考就填一个新的日期。</div>' +
          '<button class="btn block" id="replan" style="margin-top:.8rem">重新排计划</button></div>';
        $("#replan", el).onclick = function () { drawForm(el); };
        return;
      }

      /* 保证计划覆盖到考试日（重开 App 时自动补齐） */
      var gen = PL.generate(st, today, st.plan.examDate, st.settings.dailyNew);
      st.plan.days = gen.days;
      c.store.save();

      /* 完成统计 */
      var doneDays = 0, totalTasks = 0, doneTasks = 0, k;
      for (k in st.plan.days) {
        var pr = PL.dayProgress(st.plan.days[k]);
        totalTasks += pr.total;
        doneTasks += pr.done;
        if (pr.all) doneDays++;
      }

      /* 列出今天起最多 7 天（可展开全部） */
      var list = [];
      for (var i = 0; i < Math.min(left, showAll ? 370 : 7); i++) {
        var key = c.u.addDays(today, i);
        if (st.plan.days[key]) list.push({ key: key, day: st.plan.days[key], i: i });
      }

      var cards = list.map(function (x) {
        var pr = PL.dayProgress(x.day);
        var isToday = x.i === 0;
        var rows = x.day.tasks.map(function (t, ti) {
          return '<label class="row" style="cursor:pointer">' +
            '<input type="checkbox" data-d="' + x.key + '" data-i="' + ti + '"' + (t.done ? " checked" : "") + ' style="width:22px;height:22px;flex:none">' +
            '<div class="grow' + (t.done ? '" style="text-decoration:line-through;color:var(--muted)' : '') + '">' + c.u.esc(t.name) + '</div>' +
            '<span class="pill">' + (t.kind === "vocab" ? "词汇" : t.kind === "review" ? "复习" : t.kind === "speak" ? "口语" : "写作") + '</span></label>';
        }).join("");
        return '<div class="card" style="' + (isToday ? "border:2px solid var(--brand)" : "") + '">' +
          '<div class="row" style="border:0;padding-top:0">' +
          '<div class="grow"><h3 style="margin:0">' + (isToday ? "📌 今天 " : "") + x.key + '</h3></div>' +
          '<span class="pill ' + (pr.all ? "ok" : "") + '">' + pr.done + "/" + pr.total + '</span></div>' +
          rows + '</div>';
      }).join("");

      el.innerHTML =
        '<div class="card"><div class="row" style="border:0;padding-top:0">' +
        '<div class="grow"><b>🎯 目标分 ' + c.u.esc(String(st.plan.target || "未填")) + '</b>' +
        '<div class="sub muted">考试 ' + c.u.esc(st.plan.examDate) + ' · 还有 ' + left + ' 天</div></div>' +
        '<button class="btn small ghost" id="editPlan">修改</button></div>' +
        '<div class="grid3">' +
        '<div class="stat ok"><div class="num">' + doneDays + '</div><div class="lbl">全部完成天数</div></div>' +
        '<div class="stat"><div class="num">' + gen.count + '</div><div class="lbl">计划总天数</div></div>' +
        '<div class="stat"><div class="num">' + (totalTasks ? Math.round((doneTasks / totalTasks) * 100) : 0) + '%</div><div class="lbl">任务完成率</div></div>' +
        '</div>' +
        '<div class="muted small" style="margin-top:.5rem">每天的任务是根据你的每日新词额度自动排的；当天的任务全部打勾，就算打卡一天。</div>' +
        '</div>' + cards +
        (left > 7 && !showAll ? '<button class="btn ghost block" id="more">显示后面全部 ' + (left - 7) + ' 天</button>' : '') +
        (showAll ? '<button class="btn ghost block" id="less">只看最近 7 天</button>' : '');

      $("#editPlan", el).onclick = function () { drawForm(el); };
      var more = $("#more", el);
      if (more) more.onclick = function () { showAll = true; P.plan.render(el); };
      var less = $("#less", el);
      if (less) less.onclick = function () { showAll = false; P.plan.render(el); };

      /* 用属性赋值覆盖旧监听，避免反复渲染时累积绑定 */
      el.onchange = function (ev) {
        var cb = ev.target;
        if (cb.tagName !== "INPUT" || !cb.getAttribute("data-d")) return;
        var day = st.plan.days[cb.getAttribute("data-d")];
        if (!day) return;
        var t = day.tasks[+cb.getAttribute("data-i")];
        if (t) t.done = cb.checked;
        c.store.save();
        var done = PL.dayProgress(day);
        if (done.all) c.app.toast("🎉 这天的任务全部完成，算打卡一天！");
        P.plan.render(el);
      };
    }
  };

  function drawForm(el) {
    var c = core(), st = c.store.get();
    el.innerHTML =
      '<div class="card"><h2>🗓️ 做一份学习计划</h2>' +
      '<div class="muted small" style="margin-bottom:.7rem">填两样东西，就能自动排好每天要做什么。</div>' +
      '<label class="fld"><span>📅 考试日期</span>' +
      '<input type="date" id="examDate" value="' + c.u.esc(st.plan.examDate) + '" min="' + c.u.todayKey() + '"></label>' +
      '<label class="fld"><span>🎯 目标分（选一个）</span>' +
      '<select id="target">' +
      [4.5, 5, 5.5, 6, 6.5, 7, 7.5, 8].map(function (v) {
        return '<option value="' + v + '"' + (String(st.plan.target) === String(v) ? " selected" : "") + '>' + v + ' 分</option>';
      }).join("") +
      '</select></label>' +
      '<div class="muted small" style="margin-bottom:.6rem">每天的新词量用「设置」里的数字（现在是 ' + st.settings.dailyNew + ' 个）。</div>' +
      '<button class="btn block" id="genBtn">生成计划 ✓</button></div>' +
      (st.plan.examDate ? '<button class="btn ghost block" id="cancelBtn">先不改了，看现在的计划</button>' : '');

    $("#genBtn", el).onclick = function () {
      var d = $("#examDate", el).value;
      var t = $("#target", el).value;
      if (!d) { c.app.toast("先选一个考试日期"); return; }
      if (c.u.diffDays(c.u.todayKey(), d) <= 0) { c.app.toast("考试日期要选在今天之后"); return; }
      st.plan.examDate = d;
      st.plan.target = t;
      var gen = PL.generate(st, c.u.todayKey(), d, st.settings.dailyNew);
      st.plan.days = gen.days;
      c.store.save();
      c.app.toast("计划排好了，一共 " + gen.count + " 天 💪");
      P.plan.render(el);
    };
    var cc = $("#cancelBtn", el);
    if (cc) cc.onclick = function () { P.plan.render(el); };
  }
})();

</script>
<script>
/* 模块6：设置 —— 深色模式、字号、每日新词数、导出/导入备份、清空数据（两次确认）。
   主题应用逻辑在 IELTS.set 里方便测试，页面只管画。 */
(function () {
  "use strict";
  var P = window.IELTS.app.pages;
  var SE = {};

  function core() { return window.IELTS; }

  /* 把设置真正应用到页面上 */
  SE.applyTheme = function () {
    var st = core().store.get().settings;
    document.body.classList.toggle("dark", !!st.dark);
    var fs = st.fontSize === "s" ? "fs-s" : (st.fontSize === "l" ? "fs-l" : "fs-m");
    document.documentElement.classList.remove("fs-s", "fs-m", "fs-l");
    document.documentElement.classList.add(fs);
  };

  /* 改每日新词数（1~50，非法输入兜底 10） */
  SE.setDailyNew = function (n) {
    var st = core().store.get();
    n = Math.round(Number(n));
    if (isNaN(n)) n = 10;
    st.settings.dailyNew = Math.max(1, Math.min(50, n));
    core().store.save();
    return st.settings.dailyNew;
  };

  SE.setDark = function (on) {
    core().store.get().settings.dark = !!on;
    core().store.save();
    SE.applyTheme();
  };

  SE.setFontSize = function (f) {
    if (["s", "m", "l"].indexOf(f) < 0) f = "m";
    core().store.get().settings.fontSize = f;
    core().store.save();
    SE.applyTheme();
  };

  /* 触发浏览器下载一份备份文件 */
  SE.downloadBackup = function () {
    try {
      var text = core().store.exportJson();
      var blob = new Blob([text], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "ielts-backup-" + core().u.todayKey() + ".json";
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        URL.revokeObjectURL(a.href);
        a.remove();
      }, 500);
      return true;
    } catch (e) { return false; }
  };

  /* 读取备份文件文本并导入。cb(ok, msg, counts) */
  SE.importBackupFile = function (file, cb) {
    if (!file) { cb && cb(false, "没有选中文件"); return; }
    if (file.size > 10 * 1024 * 1024) { cb && cb(false, "文件太大（超过 10MB），不像本应用的备份"); return; }
    var reader = new FileReader();
    reader.onload = function () {
      var r = core().store.importJson(String(reader.result));
      if (r.ok) SE.applyTheme();
      cb && cb(r.ok, r.ok ? "导入成功，全部数据已恢复" : r.error, r.counts);
    };
    reader.onerror = function () { cb && cb(false, "文件读不出来：可能不是文本文件或已损坏"); };
    reader.readAsText(file);
  };

  window.IELTS.set = SE;

  /* ---------- 页面 ---------- */
  P.set = {
    render: function (el) { draw(el); }
  };

  function $(sel, el) { return el.querySelector(sel); }

  function draw(el) {
    var c = core(), st = c.store.get();
    var learned = Object.keys(st.words).length;
    var wrongN = Object.keys(st.wrong).filter(function (k) { return !st.wrong[k].cleared; }).length;
    var essays = st.writing.essays.length;
    var speakN = 0, k;
    for (k in st.speaking.done) speakN += st.speaking.done[k].count;
    var bytes = 0;
    try { bytes = (localStorage.getItem("ielts_app_v1") || "").length; } catch (e) { }

    el.innerHTML =
      '<div class="card"><h2>🎨 外观</h2>' +
      '<div class="row" style="border:0"><div class="grow"><b>深色模式</b>' +
      '<div class="sub muted">晚上看不刺眼</div></div>' +
      '<label style="cursor:pointer"><input type="checkbox" id="darkSw" style="width:26px;height:26px"' + (st.settings.dark ? " checked" : "") + '></label></div>' +
      '<div class="row"><div class="grow"><b>字体大小</b>' +
      '<div class="sub muted">手机上看不清就调大</div></div></div>' +
      '<div style="display:flex;gap:.5rem">' +
      '<button class="btn small ' + (st.settings.fontSize === "s" ? "" : "ghost") + '" data-fs="s">小</button>' +
      '<button class="btn small ' + (st.settings.fontSize === "m" ? "" : "ghost") + '" data-fs="m">标准</button>' +
      '<button class="btn small ' + (st.settings.fontSize === "l" ? "" : "ghost") + '" data-fs="l">大</button>' +
      '</div>' +
      '<div class="row" style="margin-top:.3rem"><div class="grow"><b>朗读口音</b>' +
      '<div class="sub muted">考试以英音为主，美音也可练耳朵</div></div></div>' +
      '<div style="display:flex;gap:.5rem;margin-bottom:.4rem">' +
      '<button class="btn small ' + ((st.settings.voice || "gb") === "gb" ? "" : "ghost") + '" data-voice="gb">🇬🇧 英音</button>' +
      '<button class="btn small ' + (st.settings.voice === "us" ? "" : "ghost") + '" data-voice="us">🇺🇸 美音</button>' +
      '<button class="btn small ghost" id="voiceTest">🔊 试听</button>' +
      '</div></div>' +

      '<div class="card"><h2>📇 背单词</h2>' +
      '<div class="row" style="border:0"><div class="grow"><b>每天背几个新词</b>' +
      '<div class="sub muted">建议 10~20 个，贪多容易忘</div></div></div>' +
      '<div style="display:flex;align-items:center;gap:.6rem;max-width:200px">' +
      '<button class="btn small ghost" id="dnMinus">−</button>' +
      '<input type="number" id="dailyNew" value="' + st.settings.dailyNew + '" min="1" max="50" style="text-align:center">' +
      '<button class="btn small ghost" id="dnPlus">＋</button></div>' +
      '<div class="muted small" style="margin-top:.4rem">已学 ' + learned + ' 个词，错词本里 ' + wrongN + ' 个词等着清。</div>' +
      '</div>' +

      '<div class="card"><h2>💾 备份（换电脑、换手机前一定要看）</h2>' +
      '<div class="muted small" style="margin:.3rem 0 .5rem">🔒 数据只保存在这台设备的浏览器里，不会上传到任何地方。</div>' +
      (st.stats && core().stats.backupDue(st, core().u.todayKey())
        ? '<div class="small" style="background:var(--warn-weak);color:var(--warn);border-radius:10px;padding:.5rem .7rem;margin-bottom:.6rem">⏰ 超过 7 天未备份——现在花 10 秒导出一份吧。</div>'
        : '') +
      '<div class="muted small" style="margin:.3rem 0 .7rem">备份文件是一个 .json 文件，收好它，换设备时导入就能恢复。</div>' +
      '<button class="btn block" id="btnExport" aria-label="导出备份文件">⬇️ 导出备份文件</button>' +
      '<div style="height:.5rem"></div>' +
      '<label class="btn ghost block" style="cursor:pointer">⬆️ 导入备份文件' +
      '<input type="file" id="fileIn" accept=".json,application/json" style="display:none"></label>' +
      '<div class="small muted" style="margin-top:.6rem">当前数据量：约 ' + Math.max(1, Math.round(bytes / 1024)) + ' KB · 作文 ' + essays + ' 篇 · 口语练过 ' + speakN + ' 次</div>' +
      '</div>' +

      '<div class="card"><h2>🗑️ 危险操作</h2>' +
      '<div class="muted small" style="margin:.3rem 0 .7rem">清空会删掉所有学习记录、作文、错词本和计划（不会删你电脑上的其他东西）。</div>' +
      '<button class="btn danger block" id="btnClear">清空全部数据</button></div>' +

      '<div class="card"><h2>ℹ️ 关于</h2>' +
      '<div class="small muted">雅思随身背 · 离线版 v1.0<br>' +
      '全部功能都在本机运行：不需要联网、不需要注册、不上传任何数据。<br>' +
      '词库来自任务 12《雅思闪卡》（1596 词），口语题库来自任务 16《口语写作练习页》（120 题），写作大作文题库来自任务 16（20 题），小作文为本项目补写。</div></div>';

    /* 外观 */
    $("#darkSw", el).onchange = function () {
      SE.setDark(this.checked);
      c.app.toast(this.checked ? "深色模式已开 🌙" : "已切回浅色 ☀️");
    };
    el.querySelectorAll("[data-fs]").forEach(function (b) {
      b.onclick = function () {
        SE.setFontSize(b.getAttribute("data-fs"));
        draw(el);
      };
    });
    el.querySelectorAll("[data-voice]").forEach(function (b) {
      b.onclick = function () {
        var st2 = core().store.get();
        st2.settings.voice = b.getAttribute("data-voice");
        core().store.save();
        core().tts.pickVoice();
        core().tts.speak("Do you think teachers will be replaced by computers?");
        draw(el);
      };
    });
    $("#voiceTest", el).onclick = function () {
      core().tts.pickVoice();
      core().tts.speak("Do you think teachers will be replaced by computers?");
    };

    /* 新词数 */
    $("#dnMinus", el).onclick = function () {
      var v = SE.setDailyNew(+$("#dailyNew", el).value - 1);
      $("#dailyNew", el).value = v;
      c.app.toast("每天新词改为 " + v + " 个");
    };
    $("#dnPlus", el).onclick = function () {
      var v = SE.setDailyNew(+$("#dailyNew", el).value + 1);
      $("#dailyNew", el).value = v;
      c.app.toast("每天新词改为 " + v + " 个");
    };
    $("#dailyNew", el).onchange = function () {
      var v = SE.setDailyNew(this.value);
      this.value = v;
      c.app.toast("每天新词改为 " + v + " 个");
    };

    /* 备份：先触发下载并记录备份时间，同时弹文本兜底框（手机上下载不可用时可以长按复制） */
    $("#btnExport", el).onclick = function () {
      var ok = SE.downloadBackup();
      if (ok) {
        var st2 = c.store.get();
        st2.settings.lastBackupAt = c.u.todayKey();
        c.store.save();
      }
      showBackupBox(el, ok);
    };
    $("#fileIn", el).onchange = function () {
      var f = this.files[0];
      this.value = ""; /* 允许重复选同一个文件 */
      var hasData = Object.keys(c.store.get().words).length > 0 ||
        c.store.get().writing.essays.length > 0;
      var go = function () {
        SE.importBackupFile(f, function (ok, msg, counts) {
          if (ok) {
            c.app.applyTheme();
            draw(el);
            showImportReport(el, counts); /* 恢复报告（P2-6） */
          } else {
            c.app.toast(msg, 4000);
          }
        });
      };
      if (hasData) {
        c.app.ask("要导入备份了", "导入会覆盖当前全部数据。建议先取消，去「导出备份」留一份现在的记录再回来。", "我知道了，直接导入", true).then(function (ok) {
          if (ok) go();
        });
      } else {
        go();
      }
    };

    /* 清空：警告确认 + 输入“确认清空”+ 3 秒倒计时 + 勾选「我已导出备份」，四重防误删 */
    $("#btnClear", el).onclick = function () {
      c.app.ask("清空全部数据？", "所有学习记录会被删掉，且无法恢复。建议先导出备份。", "我已了解，继续", true).then(function (ok1) {
        if (!ok1) return;
        c.app.askInput("最后确认一次", "这步之后没有反悔的机会。请先勾选备份确认，再输入这四个字：", "确认清空", "确定清空", "我已导出备份（或确认无需备份）").then(function (ok2) {
          if (!ok2) { c.app.toast("已取消，数据安然无恙"); return; }
          c.store.clearAll();
          c.app.applyTheme();
          c.app.toast("已全部清空");
          draw(el);
        });
      });
    };
  }

  /* 导入成功后的恢复报告（P2-6）：词数/错词数/口语/写作四项计数 */
  function showImportReport(el, counts) {
    var mask = document.getElementById("mask"), box = document.getElementById("maskBox");
    if (!mask) return;
    box.innerHTML =
      '<h3 style="margin:0 0 .5rem">✅ 恢复完成</h3>' +
      '<div class="grid2">' +
      '<div class="stat"><div class="num">' + counts.words + '</div><div class="lbl">单词记录</div></div>' +
      '<div class="stat bad"><div class="num">' + counts.wrong + '</div><div class="lbl">错词本</div></div>' +
      '<div class="stat"><div class="num">' + counts.speaking + '</div><div class="lbl">口语已练题</div></div>' +
      '<div class="stat ok"><div class="num">' + counts.essays + '</div><div class="lbl">历史作文</div></div>' +
      '</div>' +
      '<div class="muted small" style="margin-top:.6rem">设置（深色模式、字号、每日新词）也一并恢复。</div>' +
      '<div class="btns"><button class="btn block" id="repOk">好的</button></div>';
    mask.classList.add("show");
    box.querySelector("#repOk").onclick = function () { mask.classList.remove("show"); };
  }

  /* 备份文本兜底框：下载失败（或手机没弹出保存）时，长按复制全文 */
  function showBackupBox(el, downloaded) {
    var c = core();
    var text = c.store.exportJson();
    var box = document.getElementById("maskBox");
    var mask = document.getElementById("mask");
    box.innerHTML =
      '<h3 style="margin:0 0 .4rem">💾 备份内容</h3>' +
      '<div class="muted small">' + (downloaded
        ? '备份文件已开始下载。如果手机上没弹出保存提示，用下面的方法：'
        : '这台设备下载不了文件，用下面的方法：') + '</div>' +
      '<textarea readonly id="bakText" style="margin-top:.5rem;min-height:7rem;font-size:.75rem">' + c.u.esc(text) + '</textarea>' +
      '<div class="muted small" style="margin-top:.4rem">长按文本框 → 全选 → 复制，把内容用记事本保存为 ielts-backup.json。</div>' +
      '<div class="btns">' +
      '<button class="btn ghost" id="bakClose">关闭</button>' +
      '<button class="btn" id="bakAgain">再试一次下载</button></div>';
    mask.classList.add("show");
    box.querySelector("#bakClose").onclick = function () { mask.classList.remove("show"); };
    box.querySelector("#bakAgain").onclick = function () {
      var ok = SE.downloadBackup();
      c.app.toast(ok ? "已再次尝试下载" : "还是不行，就用长按复制的方法");
    };
    box.querySelector("#bakText").onclick = function () { this.select(); };
  }
})();

</script>
<script>
/* 应用入口：页面切换、深色模式/字号应用、全局提示与确认框。 */
(function () {
  "use strict";
  /* 复用 utils.js 预建的命名空间：各模块已注册的页面不能丢 */
  var A = window.IELTS.app = window.IELTS.app || {};
  A.pages = A.pages || {};
  var u = function () { return window.IELTS.u; };

  var TABS = ["home", "vocab", "speak", "write", "plan", "set"];
  var NAMES = { home: "首页", vocab: "背单词", speak: "口语", write: "写作", plan: "学习计划", set: "设置" };

  function $(id) { return document.getElementById(id); }

  /* 深色模式和字号（html 根元素上加类） */
  A.applyTheme = function () {
    var st = window.IELTS.store.get().settings;
    document.body.classList.toggle("dark", !!st.dark);
    var fs = st.fontSize === "s" ? "fs-s" : (st.fontSize === "l" ? "fs-l" : "fs-m");
    document.documentElement.classList.remove("fs-s", "fs-m", "fs-l");
    document.documentElement.classList.add(fs);
  };

  /* 底部小提示 */
  A.toast = function (msg, ms) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(A._toastT);
    A._toastT = setTimeout(function () { t.classList.remove("show"); }, ms || 2200);
  };

  /* 确认框：Ask("标题", "内容", "确定按钮文字", 是否危险) → 返回 true/false（异步） */
  A.ask = function (title, text, okText, danger) {
    return new Promise(function (resolve) {
      var box = $("maskBox"), mask = $("mask");
      box.innerHTML =
        '<h3 style="margin:0 0 .4rem">' + u().esc(title) + '</h3>' +
        '<div class="muted small">' + u().esc(text) + '</div>' +
        '<div class="btns">' +
        '<button class="btn ghost" id="maskNo">取消</button>' +
        '<button class="btn ' + (danger ? "danger" : "") + '" id="maskYes">' + u().esc(okText || "确定") + '</button>' +
        '</div>';
      mask.classList.add("show");
      box.querySelector("#maskNo").onclick = function () { mask.classList.remove("show"); resolve(false); };
      box.querySelector("#maskYes").onclick = function () { mask.classList.remove("show"); resolve(true); };
    });
  };

  /* 强确认框：必须输入指定文字 +（可选）勾选确认 + 3 秒倒计时。用于危险操作。 */
  A.askInput = function (title, text, mustType, okText, checkboxText) {
    return new Promise(function (resolve) {
      var box = $("maskBox"), mask = $("mask");
      var chkHtml = checkboxText
        ? '<label style="display:flex;align-items:center;gap:.5rem;margin-top:.7rem;cursor:pointer;font-size:.9rem">' +
          '<input type="checkbox" id="maskChk" style="width:22px;height:22px;flex:none">' +
          u().esc(checkboxText) + '</label>'
        : "";
      box.innerHTML =
        '<h3 style="margin:0 0 .4rem">' + u().esc(title) + '</h3>' +
        '<div class="muted small">' + u().esc(text) + '</div>' +
        chkHtml +
        '<input type="text" id="maskIn" placeholder="请输入：' + u().esc(mustType) + '" autocomplete="off" style="margin-top:.7rem">' +
        '<div class="btns">' +
        '<button class="btn ghost" id="maskNo">取消</button>' +
        '<button class="btn danger" id="maskYes" disabled>' + u().esc(okText || "确定") + '</button>' +
        '</div>';
      mask.classList.add("show");
      var inp = box.querySelector("#maskIn");
      var yes = box.querySelector("#maskYes");
      var chk = box.querySelector("#maskChk");
      var timerId = null, left = 3;
      function typedOk() { return inp.value === mustType && (!chk || chk.checked); }
      function done(ok) {
        clearInterval(timerId);
        timerId = null;
        mask.classList.remove("show");
        resolve(ok);
      }
      box.querySelector("#maskNo").onclick = function () { done(false); };
      yes.onclick = function () { if (!yes.disabled) done(true); };
      function evaluate() {
        if (typedOk()) {
          if (timerId) return; /* 倒计时只启动一次 */
          left = 3;
          yes.disabled = true;
          yes.textContent = left + " 秒后可点";
          timerId = setInterval(function () {
            left--;
            if (left > 0) { yes.textContent = left + " 秒后可点"; return; }
            clearInterval(timerId);
            timerId = null;
            yes.disabled = false;
            yes.textContent = okText || "确定";
          }, 1000);
        } else if (timerId) {
          /* 条件被撤销（改了输入或取消勾选）：停掉倒计时并禁用 */
          clearInterval(timerId);
          timerId = null;
          yes.disabled = true;
          yes.textContent = okText || "确定";
        } else {
          yes.disabled = true;
          yes.textContent = okText || "确定";
        }
      }
      inp.addEventListener("input", evaluate);
      if (chk) chk.addEventListener("change", evaluate);
      inp.focus();
    });
  };

  A.go = function (tab) {
    if (TABS.indexOf(tab) < 0) tab = "home";
    if (location.hash === "#" + tab) show(); else location.hash = tab;
  };

  A.show = show;
  A.tabName = function (t) { return NAMES[t] || t; };

  function show() {
    var tab = (location.hash || "#home").replace("#", "");
    if (TABS.indexOf(tab) < 0) tab = "home";
    TABS.forEach(function (t) {
      $("page-" + t).style.display = (t === tab) ? "block" : "none";
    });
    var links = document.querySelectorAll("#tabbar a");
    for (var i = 0; i < links.length; i++) {
      links[i].classList.toggle("on", links[i].getAttribute("data-tab") === tab);
    }
    var pg = A.pages[tab];
    if (pg && pg.render) {
      try { pg.render($("page-" + tab)); }
      catch (e) {
        $("page-" + tab).innerHTML =
          '<div class="card">这个页面出了点问题：' + u().esc(e.message) + '</div>';
      }
    }
    window.scrollTo(0, 0);
  }

  function boot() {
    window.IELTS.store.load();
    A.applyTheme();
    /* 存储不可用（无痕/预览模式）→ 顶部红条提醒（P2-7） */
    if (!window.IELTS.store.probe()) {
      var bar = document.createElement("div");
      bar.id = "storageWarn";
      bar.style.cssText = "background:var(--bad);color:#fff;text-align:center;padding:.55rem 1rem;font-size:.88rem;line-height:1.5";
      bar.textContent = "⚠️ 这个浏览器现在存不了数据（可能是无痕模式或文件预览）。学习记录关闭页面就会丢——请用普通模式打开，或把整个文件夹放到手机本地后用浏览器打开。";
      document.body.insertBefore(bar, document.body.firstChild);
    }
    $("todayLabel").textContent = "今天是 " + u().todayKey();
    var links = document.querySelectorAll("#tabbar a");
    for (var i = 0; i < links.length; i++) {
      (function (a) {
        a.addEventListener("click", function (ev) {
          ev.preventDefault();
          location.hash = a.getAttribute("data-tab");
        });
      })(links[i]);
    }
    window.addEventListener("hashchange", show);
    show();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

</script>
</body>
</html>
